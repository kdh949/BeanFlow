        환불, 픽업 예약 해제, 재고 복구, 쿠폰·포인트 반환, 고객 알림의 단계별 상태와 시도 횟수를 확인할 수 있습니다. `ORDER_COMPENSATION_READ` 권한과 조회 사유를 담은 `X-Access-Reason` 헤더가 필요하며, 조회 사실은 감사 기록에 남습니다.

        주요 오류:
