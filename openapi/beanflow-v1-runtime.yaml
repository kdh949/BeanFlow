openapi: 3.1.0
info:
  title: BeanFlow API — Runtime Contract
  version: 0.3.0
  x-beanflow-contract-status: runtime
  x-beanflow-contract-date: 2026-08-14
  description: |
    Current public controller contract represented by this repository source.
    It contains only implemented mappings backed by source contract tests. It is
    not evidence of a non-local deployment. Components shared with the target
    contract are referenced explicitly; runtime-only legacy shapes are local.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Discovery
  - name: Ordering
  - name: Payment
  - name: Payment Methods
  - name: Store Orders
  - name: Operations
  - name: Loyalty
  - name: Settlement
  - name: Dispute
  - name: Support
paths:
  /auth/customer/csrf:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1customer~1csrf"
  /auth/customer/registrations:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1customer~1registrations"
  /auth/customer/sessions:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1customer~1sessions"
  /auth/customer/sessions/current:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1customer~1sessions~1current"
  /auth/merchant/csrf:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1merchant~1csrf"
  /auth/merchant/sessions:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1merchant~1sessions"
  /auth/merchant/password-changes:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1merchant~1password-changes"
  /auth/merchant/sessions/current:
    $ref: "./beanflow-v1.yaml#/paths/~1auth~1merchant~1sessions~1current"
  /operations/me:
    $ref: "./beanflow-v1.yaml#/paths/~1operations~1me"
  /me:
    $ref: "./beanflow-v1.yaml#/paths/~1me"
  /merchant/me:
    $ref: "./beanflow-v1.yaml#/paths/~1merchant~1me"
  /merchant/me/stores:
    $ref: "./beanflow-v1.yaml#/paths/~1merchant~1me~1stores"
  /stores/nearby:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1nearby"
  /stores/{storeId}/menus:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1{storeId}~1menus"
  /stores/{storeId}/pickup-slots:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1{storeId}~1pickup-slots"
  /orders:
    post:
      tags: [Ordering]
      operationId: createOrder
      summary: Create an order and reserve required resources
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order creation committed
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/CreateOrderResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/OrderCreationConflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{sourceOrderId}/reorders:
    $ref: "./beanflow-v1.yaml#/paths/~1orders~1{sourceOrderId}~1reorders"
  /orders/{orderId}:
    get:
      tags: [Ordering]
      operationId: getOrder
      summary: Get an order and materialize a due reservation expiry
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
      responses:
        "200":
          description: Order visible to the authenticated owner
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Order"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /orders/{orderId}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelOrder
      summary: Cancel an order in a customer-allowed state
      description: |
        The owning customer may cancel PENDING_PAYMENT or pre-acceptance PAID
        orders. Same-key/same-payload replay returns the first 200 or 202 body.
        A PAID cancellation durably starts compensation; it does not claim that
        refund or owner restoration has completed.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CancellationRequest"
      responses:
        "200":
          description: PENDING_PAYMENT cancellation completed synchronously
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Cancellation"
        "202":
          description: PAID cancellation committed with durable compensation work
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Cancellation"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /me/orders:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1orders"
  /me/orders/{orderReference}:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1orders~1{orderReference}"
  /me/orders/{orderReference}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelCurrentCustomerOrderByReferenceRuntime
      summary: Cancel an owned order through its canonical public reference
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderReference"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CancellationRequest"
      responses:
        "200":
          description: PENDING_PAYMENT cancellation committed synchronously
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/CustomerCancellationResult"
        "202":
          description: PAID cancellation committed while recovery continues independently
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/CustomerCancellationResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /payment-config:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-config"
  /orders/{orderId}/payment-attempts:
    $ref: "./beanflow-v1.yaml#/paths/~1orders~1{orderId}~1payment-attempts"
  /payments/{paymentId}:
    $ref: "./beanflow-v1.yaml#/paths/~1payments~1{paymentId}"
  /payments/{paymentId}/confirmations:
    $ref: "./beanflow-v1.yaml#/paths/~1payments~1{paymentId}~1confirmations"
  /payment-methods:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-methods"
  /payment-methods/{paymentMethodId}:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-methods~1{paymentMethodId}"
  /payment-methods/{paymentMethodId}/default:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-methods~1{paymentMethodId}~1default"
  /payments/{paymentId}/refunds:
    post:
      tags: [Payment]
      operationId: createPaymentRefund
      summary: Create a merchant full/item partial refund
      security: [{ merchantSession: [] }]
      description: |
        STORE_OWNER and STORE_STAFF require a Merchant Session and active membership
        in the Order store. Omitted lineItems consumes every remaining unit. Explicit
        quantities consume the lowest unrefunded conceptual unit positions. Coupon
        values are attribution only and are never restored.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/PaymentId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
        - $ref: "./beanflow-v1.yaml#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Synchronous cash result confirmed; Loyalty may still be processing
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Refund"
        "202":
          description: Provider result unknown or retry/reconciliation remains durable
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Refund"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/payments/{paymentId}/refunds:
    $ref: "./beanflow-v1.yaml#/paths/~1operations~1payments~1{paymentId}~1refunds"
  /store-orders/{orderId}:
    get:
      tags: [Store Orders]
      operationId: getStoreOrder
      summary: Get an order and its abbreviated compensation status
      description: |
        Returns the store projection plus trigger, case state and updatedAt only.
        Step detail, attempts, internal errors, case identifier and policy versions
        are available only through the audited platform-operator endpoint.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
      responses:
        "200":
          description: Store order visible to an authorized active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStoreOrderResult"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}/status:
    patch:
      tags: [Store Orders]
      operationId: transitionStoreOrderStatus
      summary: Transition an order from the store operational view
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeStoreOrderTransitionRequest"
      responses:
        "200":
          description: Synchronous store transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStoreOrderTransitionResult"
        "202":
          description: REJECTED committed while order compensation continues separately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStoreOrderTransitionResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /stores/{storeId}/orders:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1{storeId}~1orders"
  /stores/{storeId}/orders/overflow:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1{storeId}~1orders~1overflow"
  /stores/{storeId}/orders/{orderReference}:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1{storeId}~1orders~1{orderReference}"
  /stores/{storeId}/orders/{orderReference}/transitions:
    $ref: "./beanflow-v1.yaml#/paths/~1stores~1{storeId}~1orders~1{orderReference}~1transitions"
  /operations/orders/{orderId}/compensation:
    get:
      tags: [Operations]
      operationId: getOrderCompensation
      summary: Read owner compensation progress for a rejected order
      description: |
        Requires an active PLATFORM_OPERATOR with ORDER_COMPENSATION_READ and a
        non-blank X-Access-Reason. The access is audited before the response returns.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/AccessReason"
      responses:
        "200":
          description: Compensation case for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeOperatorCompensationView"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/merchant-accounts:
    $ref: "./beanflow-v1.yaml#/paths/~1operations~1merchant-accounts"
  /operations/merchant-accounts/{merchantAccountId}/temporary-password-resets:
    $ref: "./beanflow-v1.yaml#/paths/~1operations~1merchant-accounts~1{merchantAccountId}~1temporary-password-resets"
  /operations/merchant-accounts/{merchantAccountId}/lock-releases:
    $ref: "./beanflow-v1.yaml#/paths/~1operations~1merchant-accounts~1{merchantAccountId}~1lock-releases"
  /operations/orders/{orderId}/customer-cancellation-refund-reconciliations:
    post:
      tags: [Operations]
      operationId: scheduleCustomerCancellationRefundReconciliation
      summary: Schedule one operator-authorized LOOKUP for a terminal customer-cancellation Refund
      description: |
        Requires PLATFORM_OPERATOR and an active
        CUSTOMER_CANCELLATION_REFUND_RECONCILE grant. It schedules one LOOKUP
        with existing server-owned financial identifiers and never sends a new
        Provider REQUEST. A 202 response is not proof of refund success.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CustomerCancellationRefundReconciliationRequest"
      responses:
        "202":
          description: LOOKUP scheduled or replayed from the first identical command
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/CustomerCancellationRefundReconciliation"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/reprocessing-cases/{caseId}/repair-proposals:
    post:
      tags: [Operations]
      operationId: proposeCustomerCancellationSetupRepair
      summary: Propose safe recreation of a missing customer-cancellation Refund
      description: |
        Requires PLATFORM_OPERATOR and an active
        PAYMENT_CANCELLATION_SETUP_REPAIR grant. Financial values and identifiers
        are derived from the complete recovery snapshot; unknown request fields
        are rejected.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
        - name: caseId
          in: path
          required: true
          schema:
            $ref: "./beanflow-v1.yaml#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CreateRepairProposalRequest"
      responses:
        "201":
          description: Pending proposal or replayed first response
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/RepairProposal"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/reprocessing-repair-proposals/{proposalId}/decisions:
    post:
      tags: [Operations]
      operationId: decideCustomerCancellationSetupRepair
      summary: Approve or reject a missing-Refund repair proposal
      description: |
        Requires a different PLATFORM_OPERATOR with an active
        PAYMENT_CANCELLATION_SETUP_REPAIR grant. Approval revalidates under
        Order then Payment locks and creates LOOKUP-only recovery without an
        in-transaction Provider call.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
        - name: proposalId
          in: path
          required: true
          schema:
            $ref: "./beanflow-v1.yaml#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/RepairProposalDecisionRequest"
      responses:
        "200":
          description: Terminal proposal or replayed first response
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/RepairProposal"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration:
    get:
      tags: [Operations]
      operationId: listExpiredBenefitRestorationPolicies
      summary: List the five current trigger and benefit policy heads
      description: |
        Requires an active PLATFORM_OPERATOR with the explicit
        EXPIRED_BENEFIT_POLICY_READ grant and a non-blank X-Access-Reason.
        The server records the read access before returning the current heads.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/AccessReason"
      responses:
        "200":
          description: Current policy heads ordered by trigger and benefit type
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "./beanflow-v1.yaml#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration/{trigger}/{benefitType}:
    patch:
      tags: [Operations]
      operationId: updateExpiredBenefitRestorationPolicy
      summary: Create a new version for one trigger and benefit policy
      description: Requires an active PLATFORM_OPERATOR with the explicit EXPIRED_BENEFIT_POLICY_WRITE grant.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
        - name: trigger
          in: path
          required: true
          schema:
            type: string
            enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        - name: benefitType
          in: path
          required: true
          schema:
            type: string
            enum: [COUPON, POINTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/UpdateExpiredBenefitRestorationPolicyRequest"
      responses:
        "200":
          description: New policy head or the replayed first response
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/point-accounts/{accountId}/adjustments:
    post:
      tags: [Operations, Loyalty]
      operationId: createAuditedPointAdjustment
      summary: Apply an audited signed point adjustment
      description: |
        Requires the PLATFORM_OPERATOR role and an active persistent
        POINT_ADJUSTMENT grant. Same actor, operation, Idempotency-Key, account,
        and canonical payload replay the first committed 201 response. Positive
        amounts require an explicit issuer snapshot and future expiry; negative
        amounts forbid those fields and consume only unexpired available lots.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/PointAccountId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/PointAdjustmentRequest"
      responses:
        "201":
          description: Applied adjustment or the replayed first response
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/PointAdjustmentResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /point-accounts/{accountId}:
    $ref: "./beanflow-v1.yaml#/paths/~1point-accounts~1{accountId}"
  /point-accounts/{accountId}/transactions:
    $ref: "./beanflow-v1.yaml#/paths/~1point-accounts~1{accountId}~1transactions"
  /operations/point-accounts/{accountId}:
    $ref: "./beanflow-v1.yaml#/paths/~1operations~1point-accounts~1{accountId}"
  /operations/point-accounts/{accountId}/transactions:
