  /store-orders/{orderId}/status:
    patch:
      tags:
        - Store Orders
      operationId: transitionStoreOrderStatus
      summary: (스토어) 주문 상태 변경
      description: |
        스토어 구성원이 내부 주문 ID로 주문 상태를 변경하는 API입니다.
        허용된 순서에 따라 수락, 제조 시작, 준비 완료, 픽업 완료 또는 거절로 변경합니다. 이미 수락한 주문은 거절 상태로 되돌릴 수 없습니다. 같은 Idempotency-Key를 다른 주문이나 다른 상태 변경에 재사용하면 409를 반환하며, 정확히 같은 요청은 최초 결과를 반환합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 해당 매장의 활성 구성원 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 허용되지 않은 상태 변경이거나 `Idempotency-Key`·현재 주문 상태가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/OrderId
        - $ref: ./beanflow-v1.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeStoreOrderTransitionRequest'
      responses:
        '200':
          description: 주문 상태 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStoreOrderTransitionResult'
        '202':
          description: '요청은 반영되었고 후속 확인·복구 작업은 계속 진행 중'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeStoreOrderTransitionResult'
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '409':
          $ref: ./beanflow-v1.yaml#/components/responses/Conflict
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
