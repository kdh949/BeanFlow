    RuntimeStoreCompensationSummary:
      type: object
      additionalProperties: false
      required:
        - trigger
        - state
        - updatedAt
      description: |
        주문 취소나 거절 뒤 진행되는 환불·혜택·재고 복구를 스토어에 간단히 보여 주는 정보입니다. 발생 원인, 전체 진행 상태, 마지막 갱신 시각만 포함하며 내부 오류·재시도 횟수·정책 버전은 제외합니다.
      example:
        trigger: STORE_REJECTION
        state: PROCESSING
        updatedAt: '2026-08-15T09:40:00+09:00'
      properties:
        trigger:
          type: string
          enum:
            - STORE_REJECTION
            - CUSTOMER_CANCELLATION
          description: 보상을 시작하게 한 주문 종료 원인입니다.
        state:
          type: string
          enum:
            - PROCESSING
            - RETRY_SCHEDULED
            - UNKNOWN
            - SUCCEEDED
            - MANUAL_REVIEW
          description: 매장에 허용된 범위로 축약한 후속 처리 건 상태입니다.
        updatedAt:
          type: string
          format: date-time
          description: 후속 처리 요약이 마지막으로 변경된 시각입니다.
