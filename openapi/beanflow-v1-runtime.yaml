  /orders:
    post:
      tags: [Ordering]
      operationId: createOrder
      summary: (고객) 주문 생성
      description: |
        고객이 확인한 견적 fingerprint와 매장, 픽업 시간, 메뉴 목록을 보내 새 주문을 생성하는 API입니다.
        서버 소유 장바구니가 없으므로 주문 항목 전체를 한 번에 보내며, 메뉴 가격·재고·
        픽업 슬롯·쿠폰·포인트를 이 요청 하나의 트랜잭션에서 다시 계산하며, fingerprint가
        정확히 일치한 뒤에만 모두 예약합니다. 불일치는 ORDER_QUOTE_STALE과 currentQuote를 반환합니다.
        같은 Idempotency-Key와 같은 요청 내용을 다시 보내면 최초 결과를 그대로 재생합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 매장·쿠폰 등 접근 권한이 없는 경우
        - 409: 메뉴 판매 불가, 재고·슬롯 부족, 쿠폰·포인트 사용 불가 또는 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: 주문 생성 결과
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/CreateOrderResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/OrderCreationConflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{sourceOrderId}/reorders:
    $ref: "./beanflow-v1.yaml#/paths/~1orders~1{sourceOrderId}~1reorders"
  /orders/{orderId}:
    get:
      tags:
        - Ordering
      operationId: getOrder
      summary: (고객) 주문 조회
      description: |
        고객이 본인 주문의 현재 상태, 주문 금액, 메뉴, 픽업 정보를 조회하는 API입니다.
        결제 대기 예약의 만료 시간이 지났다면 서버가 주문을 만료 상태로 정리한 뒤 최신 내용을 반환합니다.

        주요 오류:
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 본인 소유 주문이 아닌 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 503: 주문 저장소를 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/OrderId
      responses:
        '200':
          description: 주문 조회 결과
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/Order
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
  /orders/{orderId}/cancellations:
    post:
      tags:
        - Ordering
      operationId: cancelOrder
      summary: (고객) 주문 취소
      description: |
        고객이 내부 주문 ID로 본인 주문을 취소하는 API입니다.
        결제 전 주문(PENDING_PAYMENT)과 매장 수락 전 결제 완료 주문(PAID)만 취소할 수 있습니다. 같은 Idempotency-Key와 같은 요청 내용을 다시 보내면 최초 결과를 반환합니다. 결제 전 취소는 즉시 완료되어 200을 반환하고, 결제 완료 주문은 취소를 확정한 뒤 환불·쿠폰·포인트·재고 복구를 별도로 시작하므로 202를 반환할 수 있습니다. 202는 후속 복구가 모두 끝났다는 뜻이 아닙니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 본인 소유 주문이 아닌 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 주문이 이미 수락됐거나 취소할 수 없는 상태이거나 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/OrderId
        - $ref: ./beanflow-v1.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./beanflow-v1.yaml#/components/schemas/CancellationRequest
      responses:
        '200':
          description: 주문 취소 결과
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/Cancellation
        '202':
          description: 요청은 반영되었고 후속 확인·복구 작업은 계속 진행 중
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/Cancellation
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '409':
          $ref: ./beanflow-v1.yaml#/components/responses/Conflict
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
  /me/orders:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1orders"
  /me/coupons:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1coupons"
  /me/orders/{orderReference}:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1orders~1{orderReference}"
  /me/orders/{orderReference}/cancellations:
    post:
      tags:
        - Ordering
      operationId: cancelCurrentCustomerOrderByReferenceRuntime
      summary: (고객) 공개 주문번호로 주문 취소
      description: |
        고객이 `BF-XXXX-XXXX` 형식의 공개 주문번호로 본인 주문을 찾아 취소하는 API입니다.
        결제 전 주문(PENDING_PAYMENT)과 매장 수락 전 결제 완료 주문(PAID)만 취소할 수 있습니다. 같은 Idempotency-Key와 같은 요청 내용을 다시 보내면 최초 결과를 반환합니다. 결제 완료 주문은 취소 후 환불·혜택·재고 복구가 별도로 이어질 수 있습니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 해당 공개 주문번호가 본인 주문이 아닌 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 주문이 이미 수락됐거나 취소할 수 없는 상태이거나 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/OrderReference
        - $ref: ./beanflow-v1.yaml#/components/parameters/IdempotencyKey
        - $ref: ./beanflow-v1.yaml#/components/parameters/CustomerCsrfToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./beanflow-v1.yaml#/components/schemas/CancellationRequest
      responses:
        '200':
          description: 공개 주문번호 주문 취소 결과
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/CustomerCancellationResult
        '202':
          description: 요청은 반영되었고 후속 확인·복구 작업은 계속 진행 중
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/CustomerCancellationResult
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '409':
          $ref: ./beanflow-v1.yaml#/components/responses/Conflict
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
  /me/orders/{orderReference}/reorders:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1orders~1{orderReference}~1reorders"
  /me/points:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1points"
  /me/point-transactions:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1point-transactions"
  /me/notification-summary:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1notification-summary"
  /me/notifications:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1notifications"
  /me/notifications/{notificationId}:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1notifications~1{notificationId}"
  /me/notification-preferences:
    $ref: "./beanflow-v1.yaml#/paths/~1me~1notification-preferences"
  /payment-config:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-config"
  /orders/{orderId}/payment-attempts:
    $ref: "./beanflow-v1.yaml#/paths/~1orders~1{orderId}~1payment-attempts"
  /payments/{paymentId}:
    $ref: "./beanflow-v1.yaml#/paths/~1payments~1{paymentId}"
  /payments/{paymentId}/confirmations:
    $ref: "./beanflow-v1.yaml#/paths/~1payments~1{paymentId}~1confirmations"
  /payment-methods:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-methods"
  /payment-methods/{paymentMethodId}:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-methods~1{paymentMethodId}"
  /payment-methods/{paymentMethodId}/default:
    $ref: "./beanflow-v1.yaml#/paths/~1payment-methods~1{paymentMethodId}~1default"
  /payments/{paymentId}/refunds:
    post:
      tags:
        - Payment
      operationId: createPaymentRefund
      summary: (스토어) 결제 환불 접수
      security:
        - merchantSession: []
      description: |
        스토어 소유자 또는 직원이 결제의 전액 환불이나 주문 항목 단위 부분 환불을 접수하는 API입니다.
        요청자는 해당 주문 매장의 활성 멤버여야 합니다. `lineItems`를 생략하면 아직 환불할 수 있는 모든 수량을 대상으로 하며, 항목과 수량을 보내면 지정한 수량만 환불합니다. 같은 항목을 여러 번 부분 환불할 때는 아직 환불되지 않은 수량부터 순서대로 처리합니다. 쿠폰 할인액은 비용 계산에만 사용하며 쿠폰 자체를 다시 발급하지 않습니다. 현금 환불 결과가 확인되면 201, 결제사 결과를 아직 확정할 수 없거나 재시도·상태 확인이 남으면 202를 반환합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 주문 매장의 활성 소유자·직원 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 이미 환불한 수량을 다시 요청했거나 환불 가능 금액·상태가 충돌한 경우
        - 503: 결제사 또는 필수 저장소를 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/PaymentId
        - $ref: ./beanflow-v1.yaml#/components/parameters/IdempotencyKey
        - $ref: ./beanflow-v1.yaml#/components/parameters/MerchantCsrfToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./beanflow-v1.yaml#/components/schemas/CreateRefundRequest
      responses:
        '201':
          description: 결제 전액·부분 환불 생성 결과
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/Refund
        '202':
          description: 요청은 반영되었고 후속 확인·복구 작업은 계속 진행 중
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/Refund
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '409':
          $ref: ./beanflow-v1.yaml#/components/responses/Conflict
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
