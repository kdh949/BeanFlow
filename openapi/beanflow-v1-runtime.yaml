components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_CUSTOMER_SESSION
    merchantSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_MERCHANT_SESSION
  schemas:
    RuntimeStoreOrderTransitionRequest:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState:
          type: string
          enum: [ACCEPTED, PREPARING, READY, COMPLETED, REJECTED]
        reason:
          oneOf:
            - type: string
              maxLength: 500
            - type: "null"
    RuntimeStoreOrderResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "./beanflow-v1.yaml#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/RuntimeStoreCompensationSummary"
    RuntimeStoreOrderTransitionResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "./beanflow-v1.yaml#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/RuntimeStoreCompensationSummary"
    RuntimeStoreCompensationSummary:
      type: object
      additionalProperties: false
      required: [trigger, state, updatedAt]
      properties:
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        updatedAt:
          type: string
          format: date-time
    RuntimeOperatorCompensationView:
      type: object
      additionalProperties: false
      required: [compensation]
      properties:
        compensation:
          $ref: "./beanflow-v1.yaml#/components/schemas/CompensationSummary"
