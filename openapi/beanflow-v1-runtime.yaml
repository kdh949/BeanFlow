components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_CUSTOMER_SESSION
    merchantSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_MERCHANT_SESSION
  schemas:
    RuntimeStoreOrderTransitionRequest:
      type: object
      additionalProperties: false
      required:
        - targetState
      description: '스토어가 주문을 다음 처리 단계로 변경하는 요청입니다. 목표 상태와 선택 사유를 보내며, 이미 수락한 주문을 다시 거절할 수는 없습니다.'
      example:
        targetState: PREPARING
        reason: null
      properties:
        targetState:
          type: string
          enum:
            - ACCEPTED
            - PREPARING
            - READY
            - COMPLETED
            - REJECTED
          description: 매장이 요청하는 다음 주문 상태입니다.
        reason:
          oneOf:
            - type: string
              maxLength: 500
            - type: 'null'
