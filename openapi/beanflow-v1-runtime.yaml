openapi: 3.1.0
info:
  title: BeanFlow API — Runtime Contract
  version: 0.3.0
  x-beanflow-contract-status: runtime
  x-beanflow-contract-date: 2026-08-14
  description: |
    BeanFlow는 다점포 카페의 선주문부터 결제, 픽업, 포인트, 정산, 환불 조정과
    이의제기까지 이어지는 거래 생명주기를 다루는 플랫폼입니다. 이 문서는 Controller
    구현과 계약 테스트가 함께 존재하는 오퍼레이션만 포함하는 **현재 실제 계약**이며,
    로컬 이외의 환경에 배포됐다는 근거는 아닙니다.

    ## 인증
    | 대상 | 방식 |
    |---|---|
    | 고객(Customer) | 브라우저 세션 쿠키 + `X-BEANFLOW-CSRF` 헤더 |
    | 점주(Merchant) | 브라우저 세션 쿠키 + `X-BEANFLOW-CSRF` 헤더 |
    | 운영자(Operations) | Bearer JWT |
    | 외부 파트너(Partner) | 매장 범위 API Key(`X-BEANFLOW-PARTNER-KEY`, 준비 중) |

    인증이 필요 없는 Public 경로(health check, 결제 설정 조회 등)도 일부 있습니다.

    ## 통화와 시각
    모든 금액은 정수 원(KRW)이며, 모든 시각은 오프셋 또는 UTC를 포함한 ISO-8601입니다.

    ## 상태 코드
    `202 Accepted`는 비동기 처리가 접수됐다는 뜻이며 성공을 보장하지 않습니다. 정확한
    의미는 각 오퍼레이션 설명을 참고하세요.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: |
      고객·점주 계정, 인증 세션(로그인/CSRF), 매장 소속(membership)과 행정구역 어휘를
      다루는 API입니다.
  - name: Discovery
    description: |
      고객이 로그인 없이 주변 매장과 메뉴, 픽업 가능 시간을 탐색하는 공개 조회 API입니다.
  - name: Ordering
    description: |
      서버 소유 장바구니 없이 즉시 주문을 생성하고, 조회·취소·빠른 재주문까지 처리하는
      고객용 주문 API입니다.
  - name: Promotion
    description: |
      고객이 자신의 활성 쿠폰과 현재 매장 적용 가능성을 확인하는 읽기 API입니다.
  - name: Payment
    description: |
      Toss Payments 연동을 통한 결제 승인·확인과 결제 결과 조회를 다루는 API입니다.
  - name: Payment Methods
    description: |
      고객이 저장한 결제수단을 등록·조회·기본값 지정·폐기하는 API입니다. 카드번호,
      CVC 등 민감 정보는 어떤 응답에도 포함하지 않습니다.
  - name: Merchant
    description: |
      점주 본인이 속한 매장 목록과 행정구역(지역) 어휘를 조회·지정하는 API입니다.
  - name: Store Orders
    description: |
      점주가 자신의 매장에 들어온 주문을 조회하고 접수/제조/준비완료/거절 등으로 상태를
      전이시키는 API입니다.
  - name: Operations
    description: |
      플랫폼 운영자가 정책 조회·변경, 포인트 감사 조정, 장애 복구 등을 수행하는 내부
      전용 API입니다. Bearer JWT와 명시적 권한(grant)이 필요합니다.
  - name: Loyalty
    description: |
      고객의 적립 포인트 계좌 잔액과 적립/사용 거래 내역을 조회하는 API입니다.
  - name: Notification
    description: |
      고객 알림함, unread summary와 마케팅 수신 설정을 다루는 API입니다.
  - name: Settlement
    description: |
      매장별 정산 배치와 정산 항목을 조회하는 API입니다.
  - name: Dispute
    description: |
      매장이 정산 항목에 대해 이의를 제기하고 처리 상태를 확인하는 API입니다.
  - name: Support
    description: |
      고객센터 상담원이 신원 확인, 계정 조사, 주문 변경 승인 등을 수행하는 API입니다.
x-tagGroups:
  - name: 고객용 API
    tags: [Identity, Discovery, Ordering, Promotion, Payment, Payment Methods, Loyalty, Notification]
  - name: 가맹점(점주)용 API
    tags: [Merchant, Store Orders, Settlement, Dispute]
  - name: 운영자·내부 API
    tags: [Operations, Support]
