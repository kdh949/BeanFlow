      responses:
        '200':
          description: 만료 혜택 복원 정책 조회 결과
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: ./beanflow-v1.yaml#/components/schemas/ExpiredBenefitRestorationPolicy
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
  /operations/policies/expired-benefit-restoration/{trigger}/{benefitType}:
    patch:
      tags:
        - Operations
      operationId: updateExpiredBenefitRestorationPolicy
      summary: (운영팀) 만료 혜택 복원 정책 변경
      description: |
        운영팀이 특정 주문 종료 원인과 혜택 유형의 복원 정책을 새 버전으로 변경하는 API입니다.
        부분 환불(PARTIAL_REFUND)에는 포인트(POINTS) 정책만 설정할 수 있습니다. 존재하지 않는 정책 조합은 404로 처리하고, 현재 버전과 다른 상태에서 변경하려 하면 409를 반환합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 정책 변경 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 현재 정책 버전이 바뀌었거나 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/IdempotencyKey
        - name: trigger
          in: path
          required: true
          schema:
            type: string
            enum:
              - STORE_REJECTION
              - CUSTOMER_CANCELLATION
              - PARTIAL_REFUND
        - name: benefitType
          in: path
          required: true
          schema:
            type: string
            enum:
              - COUPON
              - POINTS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./beanflow-v1.yaml#/components/schemas/UpdateExpiredBenefitRestorationPolicyRequest
      responses:
        '200':
          description: 만료 혜택 복원 정책 변경 결과
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/ExpiredBenefitRestorationPolicy
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '409':
          $ref: ./beanflow-v1.yaml#/components/responses/Conflict
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
  /operations/point-accounts/{accountId}/adjustments:
    post:
      tags:
        - Operations
        - Loyalty
      operationId: createAuditedPointAdjustment
      summary: (운영팀) 포인트 수동 조정
      description: |
        운영팀이 고객 포인트를 수동으로 추가하거나 차감하는 API입니다.
        양수 금액은 포인트를 추가하며 발행 주체와 미래 만료 시각이 필요합니다. 음수 금액은 포인트를 차감하며 발행 주체와 만료 시각을 보내면 안 되고, 아직 만료되지 않은 사용 가능 적립분에서만 차감합니다. 같은 운영자, 계정, Idempotency-Key, 요청 내용은 최초 201 결과를 반환하며 모든 변경은 감사 기록에 남습니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 포인트 수동 조정 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 잔액이 부족하거나 계정 상태·`Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: ./beanflow-v1.yaml#/components/parameters/PointAccountId
        - $ref: ./beanflow-v1.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./beanflow-v1.yaml#/components/schemas/PointAdjustmentRequest
      responses:
        '201':
          description: 포인트 수동 조정 생성 결과
          content:
            application/json:
              schema:
                $ref: ./beanflow-v1.yaml#/components/schemas/PointAdjustmentResult
        '400':
          $ref: ./beanflow-v1.yaml#/components/responses/BadRequest
        '401':
          $ref: ./beanflow-v1.yaml#/components/responses/Unauthorized
        '403':
          $ref: ./beanflow-v1.yaml#/components/responses/Forbidden
        '404':
          $ref: ./beanflow-v1.yaml#/components/responses/NotFound
        '409':
          $ref: ./beanflow-v1.yaml#/components/responses/Conflict
        '503':
          $ref: ./beanflow-v1.yaml#/components/responses/DependencyUnavailable
