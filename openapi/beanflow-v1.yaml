  /point-accounts/{accountId}:
    get:
      tags: [Loyalty]
      operationId: getPointAccount
      summary: Get a point account summary
      description: |
        The customer who owns the account may read without a reason. A PLATFORM_OPERATOR
        support read requires an active POINT_ACCOUNT_READ grant and X-Access-Reason;
        the server records the target access audit before returning 200.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/OptionalAccessReason"
      responses:
        "200":
          description: Point account visible to its owner or an authorized operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /point-accounts/{accountId}/transactions:
    get:
      tags: [Loyalty]
      operationId: listPointTransactions
      summary: List point ledger transactions
      description: |
        The customer who owns the account may read without a reason. A PLATFORM_OPERATOR
        support read requires an active POINT_ACCOUNT_READ grant and X-Access-Reason.
        Results use the stable (occurredAt DESC, transactionId DESC) tuple; the cursor is
        bound to this account and endpoint.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/OptionalAccessReason"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Point transactions in stable ledger order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/point-accounts/{accountId}/adjustments:
    post:
      tags: [Operations, Loyalty]
      operationId: createAuditedPointAdjustment
      summary: Apply an audited signed point adjustment
      description: |
        Requires an active PLATFORM_OPERATOR with an explicit POINT_ADJUSTMENT
        grant, a non-blank reason, and evidence references. The command is
        idempotent by actor, operation, Idempotency-Key, account ID and canonical
        request payload. Positive adjustments require a caller-selected issuer
        snapshot and future expiry; negative adjustments may consume only available
        point lots. No provider is called and no partial debit, negative balance,
        or recovery pending fallback is allowed.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointAdjustmentRequest"
      responses:
        "201":
          description: Applied adjustment or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAdjustmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/settlements:
    get:
      tags: [Settlement]
      operationId: listStoreSettlements
      summary: List settlement batches for an owned store
      description: |
        Returns only CALCULATED and CONFIRMED batch summaries. OPEN batches are
        internal ingestion state and are not represented with fabricated zero
        summaries. Results are ordered by settlementDate and settlementBatchId
        descending, and the cursor is scoped to this store.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Settlement batches ordered by settlement date and ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/settlements/{settlementBatchId}/items:
    get:
      tags: [Settlement]
      operationId: listStoreSettlementItems
      summary: List settlement items in an owned store batch
      description: |
        Returns the item identifiers and immutable amount snapshots needed to
        inspect a settlement batch and file an item dispute. Items are ordered by
        completedAt and settlementItemId ascending. The cursor is scoped to this
        store and batch and cannot be reused for another batch.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/SettlementBatchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Settlement items in stable ledger order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /settlement-items/{itemId}/disputes:
    post:
      tags: [Dispute]
      operationId: createSettlementDispute
      summary: File a dispute for a confirmed settlement item
      description: |
        Requires the STORE_OWNER role and an active OWNER membership for the
        item's store. Filing is allowed during [D+1 00:00, D+15 00:00) in
        Asia/Seoul, where D is the batch confirmation date. The same actor,
        operation, Idempotency-Key, and canonical payload replay the original
        201 response. An active dispute, a refile without a new evidence
        reference, or a second refile is a stable conflict.
      parameters:
        - $ref: "#/components/parameters/SettlementItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisputeRequest"
      responses:
        "201":
          description: Dispute filed and its expected adjustment amount held internally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Unique within actor ID and API operation
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StoreId:
      in: path
      name: storeId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SourceOrderId:
      in: path
      name: sourceOrderId
      required: true
      description: Terminal Order whose immutable menu and option selections are reused
      schema:
        $ref: "#/components/schemas/Identifier"
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PaymentMethodId:
      in: path
      name: paymentMethodId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PointAccountId:
      in: path
      name: accountId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettlementItemId:
      in: path
      name: itemId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettlementBatchId:
      in: path
      name: settlementBatchId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Latitude:
      in: query
      name: latitude
      required: true
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Longitude:
      in: query
      name: longitude
      required: true
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RadiusMeters:
      in: query
      name: radiusMeters
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Search radius in meters. Maximum 10000.
    Cursor:
      in: query
      name: cursor
      required: false
      description: |
        Opaque versioned HMAC-signed cursor returned by the previous page. It is
        bound to this endpoint, its filters and stable sort tuple, expires within
        24 hours, and cannot be reused for another scope. Malformed, expired or
        scope-mismatched cursors return 400 INVALID_REQUEST. Maximum length is 2048
        characters.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      in: query
      name: limit
      required: false
      description: Maximum items to return. Defaults to 20 and may not exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccessReason:
      in: header
      name: X-Access-Reason
      required: true
      description: |
        Purpose for an audited privileged policy read. The server trims the value,
        requires 1 to 200 characters after trimming, and rejects control characters.
      schema:
        type: string
        pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    OptionalAccessReason:
      in: header
      name: X-Access-Reason
      required: false
      description: |
        Required when a PLATFORM_OPERATOR uses a point-account support read; not
        required for the customer who owns the account. The server trims the value,
        requires 1 to 200 characters after trimming, and rejects control characters.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request syntax or field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role, ownership, or store membership check failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is not visible in the authenticated actor scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State, capacity, duplicate resource, or idempotency payload conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderCreationConflict:
      description: |
        Order resource conflict, idempotency payload reuse, or an identical
        idempotent request that is still processing or requires manual review.
        PROCESSING returns IDEMPOTENCY_REQUEST_IN_PROGRESS and Retry-After.
        MANUAL_REVIEW returns IDEMPOTENCY_MANUAL_REVIEW_REQUIRED without
        Retry-After and never re-executes the order command.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReorderConflict:
      description: |
        Source state, unavailable source item, resource reservation or idempotency
        conflict. REORDER_ITEMS_UNAVAILABLE uses the typed item detail schema.
        IDEMPOTENCY_REQUEST_IN_PROGRESS includes Retry-After.
        IDEMPOTENCY_MANUAL_REVIEW_REQUIRED never includes Retry-After and does not
        re-execute the reorder command.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ReorderItemsUnavailableError"
    UnprocessableEntity:
      description: Provider explicitly declined a syntactically valid command
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A required dependency is unavailable; no fallback result was used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderCreationDependencyUnavailable:
      description: |
        A required dependency is unavailable, or the immutable settlement input could
        not be materialized. The Error code is DEPENDENCY_UNAVAILABLE or
        SETTLEMENT_INPUT_UNAVAILABLE. No fee, coupon-cost, point-cost, current-value, or
        partial-snapshot fallback is used; the order and every owner reservation roll back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    DateTime:
      type: string
      format: date-time
    MoneyKrw:
      type: integer
      format: int64
      minimum: 0
      description: Integer Korean won
    SignedMoneyKrw:
      type: integer
      format: int64
      description: Signed integer Korean won
    Currency:
      type: string
      enum: [KRW]
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, details]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        field:
          type: string
        reason:
          type: string
          minLength: 1
    ReorderItemsUnavailableError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, details]
      properties:
        code:
          const: REORDER_ITEMS_UNAVAILABLE
        message:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        details:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReorderItemFailureDetail"
    ReorderItemFailureDetail:
      type: object
      additionalProperties: false
      required: [sourceOrderLineId, lineSequence, menuId, reason]
      properties:
        sourceOrderLineId:
          $ref: "#/components/schemas/Identifier"
        lineSequence:
          type: integer
          minimum: 0
        menuId:
          $ref: "#/components/schemas/Identifier"
        optionId:
          $ref: "#/components/schemas/Identifier"
        reason:
          type: string
          enum:
            - SOURCE_OPTION_SELECTION_UNAVAILABLE
            - MENU_REMOVED
            - MENU_NOT_AVAILABLE
            - OPTION_REMOVED
            - OPTION_NOT_AVAILABLE
            - MENU_CONFIGURATION_NOT_AVAILABLE
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
    NearbyStorePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NearbyStore"
        page:
          $ref: "#/components/schemas/PageInfo"
    NearbyStore:
      type: object
      additionalProperties: false
      required:
        [storeId, name, distanceMeters, open, pickupAvailable]
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        distanceMeters:
          type: integer
          minimum: 0
          description: Floored integer meters from the canonical micrometer query distance. It is a display value, not the cursor tuple.
        open:
          type: boolean
        pickupAvailable:
          type: boolean
    MenuList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
    Menu:
      type: object
      additionalProperties: false
      required: [menuId, name, basePriceKrw, currency, available, options]
      properties:
        menuId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        basePriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        available:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/MenuOption"
    MenuOption:
      type: object
      additionalProperties: false
      required: [optionId, name, additionalPriceKrw, available]
      properties:
        optionId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        additionalPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        available:
          type: boolean
    PickupSlotList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PickupSlot"
    PickupSlot:
      type: object
      additionalProperties: false
      required: [pickupSlotId, startsAt, endsAt, remainingCapacity]
      properties:
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        startsAt:
          $ref: "#/components/schemas/DateTime"
        endsAt:
          $ref: "#/components/schemas/DateTime"
        remainingCapacity:
          type: integer
          minimum: 0
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [storeId, pickupSlotId, lines, pointsToUseKrw]
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderLineRequest"
        couponIssuanceId:
          $ref: "#/components/schemas/Identifier"
        pointsToUseKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CreateOrderLineRequest:
      type: object
      additionalProperties: false
      required: [menuId, optionIds, quantity]
      properties:
        menuId:
          $ref: "#/components/schemas/Identifier"
        optionIds:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
    ReorderOrderRequest:
      type: object
      additionalProperties: false
      required: [pickupSlotId, pointsToUseKrw]
      properties:
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        couponIssuanceId:
          $ref: "#/components/schemas/Identifier"
        pointsToUseKrw:
          $ref: "#/components/schemas/MoneyKrw"
    ReorderOrderResult:
      oneOf:
        - $ref: "#/components/schemas/PendingPaymentReorderOrderCreation"
        - $ref: "#/components/schemas/BenefitOnlyReorderOrderCreation"
    PendingPaymentReorderOrderCreation:
      type: object
      additionalProperties: false
      required: [order, priceComparison]
      properties:
        order:
          $ref: "#/components/schemas/PendingPaymentOrder"
        priceComparison:
          $ref: "#/components/schemas/ReorderPriceComparison"
    BenefitOnlyReorderOrderCreation:
      type: object
      additionalProperties: false
      required: [order, payment, priceComparison]
      properties:
        order:
          $ref: "#/components/schemas/BenefitOnlyPaidOrder"
        payment:
          $ref: "#/components/schemas/BenefitOnlyPayment"
        priceComparison:
          $ref: "#/components/schemas/ReorderPriceComparison"
    ReorderPriceComparison:
      type: object
      additionalProperties: false
      required:
        - hasPriceChanges
        - sourceSubtotalKrw
        - currentSubtotalKrw
        - subtotalDifferenceKrw
        - items
      properties:
        hasPriceChanges:
          type: boolean
        sourceSubtotalKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currentSubtotalKrw:
          $ref: "#/components/schemas/MoneyKrw"
        subtotalDifferenceKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        items:
          type: array
          description: Changed lines only, ordered by source lineSequence
          items:
            $ref: "#/components/schemas/ReorderLinePriceChange"
    ReorderLinePriceChange:
      type: object
      additionalProperties: false
      required:
        - sourceOrderLineId
        - lineSequence
        - menuId
        - quantity
        - sourceUnitPriceKrw
        - currentUnitPriceKrw
        - sourceLineGrossKrw
        - currentLineGrossKrw
        - lineDifferenceKrw
      properties:
        sourceOrderLineId:
          $ref: "#/components/schemas/Identifier"
        lineSequence:
          type: integer
          minimum: 0
        menuId:
          $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
        sourceUnitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currentUnitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        sourceLineGrossKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currentLineGrossKrw:
          $ref: "#/components/schemas/MoneyKrw"
        lineDifferenceKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
    CreateOrderResult:
      oneOf:
        - $ref: "#/components/schemas/PendingPaymentOrderCreation"
        - $ref: "#/components/schemas/BenefitOnlyOrderCreation"
    PendingPaymentOrderCreation:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/PendingPaymentOrder"
    BenefitOnlyOrderCreation:
      type: object
      additionalProperties: false
      required: [order, payment]
      properties:
        order:
          $ref: "#/components/schemas/BenefitOnlyPaidOrder"
        payment:
          $ref: "#/components/schemas/BenefitOnlyPayment"
    PendingPaymentOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [reservationExpiresAt]
          properties:
            state:
              const: PENDING_PAYMENT
            reservationExpiresAt:
              $ref: "#/components/schemas/DateTime"
            payableKrw:
              type: integer
              format: int64
              minimum: 1
    BenefitOnlyPaidOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          not:
            required: [reservationExpiresAt]
          properties:
            state:
              const: PAID
            payableKrw:
              const: 0
    Order:
      type: object
      additionalProperties: false
      required:
        - orderId
        - storeId
        - state
        - lines
        - subtotalKrw
        - couponDiscountKrw
        - pointsAppliedKrw
        - payableKrw
        - currency
        - createdAt
        - updatedAt
      properties:
        orderId:
          $ref: "#/components/schemas/Identifier"
        storeId:
          $ref: "#/components/schemas/Identifier"
        state:
          $ref: "#/components/schemas/OrderState"
        reservationExpiresAt:
          $ref: "#/components/schemas/DateTime"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLine"
        subtotalKrw:
          $ref: "#/components/schemas/MoneyKrw"
        couponDiscountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        payableKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        paymentRecovery:
          $ref: "#/components/schemas/CancellationRefundRecoverySummary"
        paidAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceWarningAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceWarningRequestedAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceDeadlineAt:
          $ref: "#/components/schemas/DateTime"
        acceptedAt:
          $ref: "#/components/schemas/DateTime"
        rejectedAt:
          $ref: "#/components/schemas/DateTime"
        preparingAt:
          $ref: "#/components/schemas/DateTime"
        readyAt:
          $ref: "#/components/schemas/DateTime"
        completedAt:
          $ref: "#/components/schemas/DateTime"
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 500
        cancelledAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
          description: |
            Present only when state is CANCELLED. Required together with
            cancellationCause by the order cancellation model (ADR-029).
        cancellationCause:
          allOf:
            - $ref: "#/components/schemas/CancellationCause"
          description: |
            System-determined cancellation origin. Present only when state is
            CANCELLED. Independent of the customer-declared reason code.
        cancellationReasonCode:
          allOf:
            - $ref: "#/components/schemas/CancellationReasonCode"
          description: |
            Customer-declared reason, present only when cancellationCause is
            CUSTOMER_REQUEST. Customer projection only; the store projection
            (StoreOrder) never carries it. The free-text cancellation detail is
            never exposed in any representation.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    OrderState:
      type: string
      enum:
        - PENDING_PAYMENT
        - PAID
        - ACCEPTED
        - PREPARING
        - READY
        - COMPLETED
        - EXPIRED
        - CANCELLED
        - REJECTED
    OrderLine:
      type: object
      additionalProperties: false
      required:
        - orderLineId
        - menuId
        - menuName
        - optionNames
        - unitPriceKrw
        - quantity
        - couponDiscountKrw
        - pointsAppliedKrw
        - cashPaidKrw
      properties:
        orderLineId:
          $ref: "#/components/schemas/Identifier"
        menuId:
          $ref: "#/components/schemas/Identifier"
        menuName:
          type: string
          minLength: 1
        optionNames:
          type: array
          items:
            type: string
        unitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        quantity:
          type: integer
          minimum: 1
        couponDiscountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        cashPaidKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CancellationRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        detail:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |
            Optional free-text detail supplied by the customer. The server trims it
            before validation. An empty normalized value is treated as absent. A
            present normalized value must contain 1 to 200 characters.
            Control characters are rejected. Stored on the order only. Never
            included in events, audit records, provider requests, application
            logs or any API response.
    CancellationReasonCode:
      type: string
      description: Customer-declared cancellation reason, independent of the system-determined cause
      enum:
        - CHANGED_MIND
        - ORDER_MISTAKE
        - WAIT_TOO_LONG
        - PICKUP_TIME_CONFLICT
        - PAYMENT_ISSUE
        - OTHER
    CancellationCause:
      type: string
      description: |
        System-determined cancellation origin. CUSTOMER_REQUEST is a customer
        cancellation command; PAYMENT_DECLINED is a cancellation caused by an
        explicit Provider approval decline. Only CUSTOMER_REQUEST cancellations
        carry a customer-declared reason code.
      enum:
        - CUSTOMER_REQUEST
        - PAYMENT_DECLINED
    StoreOrder:
      description: |
        Store-facing Order projection. Store members see the cancellation fact
        (state, cancelledAt, cancellationCause) so they can distinguish a
        customer cancellation from a rejection or a declined payment, but they
        never see the customer-declared reason code or customer refund recovery
        progress. The free-text cancellation detail is excluded from every
        representation.
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          not:
            anyOf:
              - required: [cancellationReasonCode]
              - required: [paymentRecovery]
    StoreOrderResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/StoreCompensationSummary"
    StoreCompensationSummary:
      type: object
      additionalProperties: false
      description: |
        Store-facing compensation projection for a terminated order. Store
        members see what terminated the order and whether owner compensation is
        still running, but never the step breakdown, attempt counts, internal
        error codes, case identifier or benefit policy versions. Those are
        operator-only and returned by OperatorCompensationView (ADR-030,
        ADR-033). Order termination does not imply compensation success.
      required: [trigger, state, updatedAt]
      properties:
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    CompensationSummary:
      type: object
      additionalProperties: false
      description: |
        Full owner compensation progress for a terminated order. The same shape
        covers store rejection and customer cancellation; the trigger field
        distinguishes the origin. Step detail, attempt counts, internal error
        codes, the case identifier and the benefit policy versions are
        operator-only, so this schema is returned only inside
        OperatorCompensationView; store members receive the abbreviated
        StoreCompensationSummary. Order termination does not imply compensation
        success.
      required: [caseId, trigger, benefitPolicies, state, steps, updatedAt]
      properties:
        caseId:
          $ref: "#/components/schemas/Identifier"
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        benefitPolicies:
          type: array
          minItems: 2
          maxItems: 2
          description: Immutable COUPON and POINTS policy version references selected with the case
          items:
            $ref: "#/components/schemas/CompensationBenefitPolicyReference"
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        steps:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/CompensationStep"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    OperatorCompensationView:
      type: object
      additionalProperties: false
      description: Platform-operator-only compensation and payment setup integrity view
      required: [compensation]
      properties:
        compensation:
          $ref: "#/components/schemas/CompensationSummary"
        paymentSetupIssue:
          $ref: "#/components/schemas/PaymentSetupIssue"
        setupReprocessingCaseId:
          $ref: "#/components/schemas/Identifier"
    PaymentSetupIssue:
      type: object
      additionalProperties: false
      description: Operator-only integrity issue; never returned in customer or store representations
      required: [state, detectedAt, lastErrorCode]
      anyOf:
        - required: [missingArtifacts]
        - required: [invariantViolations]
      properties:
        state:
          const: SETUP_INCOMPLETE
        missingArtifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CANCELLATION_REFUND, PAYMENT_RECOVERY_SNAPSHOT]
        invariantViolations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [SOURCE_MISMATCH, AMOUNT_TIE_OUT_MISMATCH]
        detectedAt:
          $ref: "#/components/schemas/DateTime"
        lastErrorCode:
          type: string
    CustomerCancellationRefundReconciliationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |
            Operational justification. It is normalized for command idempotency
            but is not copied to the response or Audit summaries.
    CustomerCancellationRefundReconciliation:
      type: object
      additionalProperties: false
      required: [operationId, orderId, cancellationOrderVersion, state, scheduledAt]
      properties:
        operationId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        cancellationOrderVersion:
          type: integer
          format: int64
          minimum: 1
        state:
          const: LOOKUP_SCHEDULED
        scheduledAt:
          $ref: "#/components/schemas/DateTime"
    CompensationBenefitPolicyReference:
      type: object
      additionalProperties: false
      required: [benefitType, policyVersionId]
      properties:
        benefitType:
          type: string
          enum: [COUPON, POINTS]
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
    CompensationStep:
      type: object
      additionalProperties: false
      required: [type, state, attemptCount]
      properties:
        type:
          type: string
          enum: [PAYMENT, PICKUP, STOCK, COUPON, POINTS, CUSTOMER_NOTIFICATION]
        state:
          type: string
          enum:
            [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, NOT_REQUIRED, MANUAL_REVIEW]
        attemptCount:
          type: integer
          minimum: 0
        lastErrorCode:
          type: string
    CreateRepairProposalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RepairProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RepairProposal:
      type: object
      additionalProperties: false
      required:
        [proposalId, caseId, action, state, proposedBy, createdAt, expiresAt, correlationId]
      properties:
        proposalId:
          $ref: "#/components/schemas/Identifier"
        caseId:
          $ref: "#/components/schemas/Identifier"
        action:
          const: RECREATE_MISSING_CANCELLATION_REFUND
        state:
          type: string
          enum: [PENDING_APPROVAL, EXECUTED, REJECTED, EXPIRED, STALE]
        proposedBy:
          $ref: "#/components/schemas/Identifier"
        decidedBy:
          $ref: "#/components/schemas/Identifier"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        decidedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    ExpiredBenefitRestorationPolicy:
      type: object
      additionalProperties: false
      required:
        [policyVersionId, trigger, benefitType, mode, compensationValidityDays, effectiveAt, updatedBy, reason]
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        benefitType:
          type: string
          enum: [COUPON, POINTS]
        mode:
          type: string
          enum: [COMPENSATE_WITH_NEW_ISSUANCE, PRESERVE_ORIGINAL_EXPIRY]
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
        effectiveAt:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
