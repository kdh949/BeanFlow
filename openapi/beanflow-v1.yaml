      operationId: transitionStoreOrderByReference
      summary: (스토어) 주문 처리 단계 변경
      description: |
        스토어 구성원이 공개 주문번호로 주문을 찾아 수락, 거절, 제조 시작, 준비 완료, 픽업 완료 중 현재 상태에서 허용된 작업 하나를 실행하는 API입니다.
        `expectedStatus`는 화면을 본 뒤 다른 요청이 주문 상태를 먼저 바꿨는지 확인하는 값입니다. 같은 Idempotency-Key와 같은 요청은 최초 결과를 반환합니다. 거절은 즉시 확정될 수 있지만 환불·혜택·재고 복구는 별도로 계속되므로 202를 반환할 수 있습니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 해당 매장의 활성 구성원 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 화면에서 본 상태와 현재 상태가 다르거나 `Idempotency-Key`가 충돌한 경우
        - 422: 현재 상태에서 요청한 매장 작업을 수행할 수 없는 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      x-beanflow-contract-status: TARGET
      security:
        - merchantSession: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/OrderReference'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreOrderActionRequest'
      responses:
        '200':
          description: 공개 주문번호 주문 상태 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrderBoardItem'
        '202':
          description: 요청은 반영되었고 후속 확인·복구 작업은 계속 진행 중
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrderBoardItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
