        filedAt:
          $ref: '#/components/schemas/DateTime'
          description: 이의제기가 접수된 시각입니다.
    ExactSearchCriterionType:
      type: string
      enum: [PHONE, EMAIL]
    SupportSearchSubjectType:
      type: string
      enum: [CUSTOMER, STORE, RIDER]
