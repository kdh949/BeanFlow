        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 보상 알림 재시도 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 알림이 재시도 대상이 아니거나 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/SupportCompensationRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 고객 보상 알림 재시도 결과
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCompensationResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /support/profile-changes/{profileChangeId}/courier-provider-reregistration-revisions:
    post:
      tags:
        - Support
      operationId: reviseCourierProviderReregistration
      summary: (고객센터) 외부 배달원 연동 재설정 승인 요청 수정
      description: |
        고객센터가 수정 요청을 받은 외부 배달원 연동 재설정 요청을 다시 제출하는 API입니다.
        비밀번호나 외부 연동 비밀값은 받지 않습니다. 이전 요청 내용은 이력으로 남기고 현재 버전, 새 본인 확인 결과, 증빙 해시를 기준으로 승인 절차를 다시 시작합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 해당 상담 건, 대상 프로필 또는 변경 작업 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 처리 건·승인 요청·대상 프로필 버전이 바뀌었거나 현재 상태에서 요청할 수 없는 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/SupportProfileChangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyProfileChangeRevisionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SupportProfileChangeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /support/post-acceptance-resolutions/{resolutionId}/reconciliations:
    post:
      tags:
        - Support
      operationId: reconcilePostAcceptanceResolution
      summary: (고객센터) 결제 환불 상태 재확인
      description: |
        고객센터가 수동 확인이 필요한 결제 환불 단계의 실제 상태를 외부 결제사에 다시 조회하는 API입니다.
        현재는 `PAYMENT_REFUND` 단계만 지원합니다. 해결안과 주문 버전, Idempotency-Key와 요청 내용을 다시 확인하며, 새로운 환불을 보내거나 포인트·쿠폰·정산·알림 작업을 이 API로 다시 실행하지 않습니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 결제 환불 상태 재확인 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 대상 단계가 수동 확인 대상이 아니거나 버전·`Idempotency-Key`가 충돌한 경우
        - 503: 외부 결제사 상태를 조회할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/PostAcceptanceResolutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcilePostAcceptanceResolutionRequest'
      responses:
        '200':
          description: 결제 환불 결과 재확인 결과
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAcceptanceResolutionResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /support/action-requests/{requestId}/reassignments:
    post:
      tags:
        - Support
      operationId: reassignSupportActionRequest
      summary: (고객센터) 주문 변경 요청 담당자 변경
      description: |
        고객센터가 실행 준비된 주문 변경 요청과 상담 건의 담당자를 함께 변경하는 API입니다.
        현재 요청 내용 버전, 요청 버전, 상담 건 버전이 모두 일치해야 합니다. 새 담당자는 상담 건 수정, 작업 실행, 해당 기능 권한을 모두 보유해야 하며 이 요청의 승인자여서는 안 됩니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 담당자 변경 권한이 없거나 새 담당자가 필요한 권한을 갖지 않은 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 요청·상담 건 버전이 바뀌었거나 새 담당자가 승인자인 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/SupportActionRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignSupportActionRequest'
      responses:
        '200':
          description: 주문 변경 요청 담당자 변경 결과
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportActionRequestResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_CUSTOMER_SESSION
      description: Customer browser session cookie; never readable by JavaScript.
    merchantSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_MERCHANT_SESSION
      description: Merchant browser session cookie; never readable by JavaScript.
  parameters:
    CustomerCsrfToken:
      in: header
      name: X-BEANFLOW-CSRF
      required: true
      description: Token copied from the BEANFLOW_CUSTOMER_XSRF cookie.
      schema:
        type: string
        minLength: 1
    MerchantCsrfToken:
      in: header
      name: X-BEANFLOW-CSRF
      required: true
      description: '`BEANFLOW_MERCHANT_XSRF` 쿠키 값을 복사해 보내는 요청 위조 방지 토큰입니다.'
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        같은 요청이 중복 처리되는 것을 막는 식별값입니다. 같은 사용자와 같은 API에서 같은 키와 같은 내용을 다시 보내면 최초 결과를 반환하고, 같은 키로 다른 내용을 보내면 409를 반환합니다.
      example: 2b6e3e2a-3c8e-4a5c-9c0a-8f1e2d3c4b5a
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StoreId:
      in: path
      name: storeId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    BrandId:
      in: path
      name: brandId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    OrderReference:
      in: path
      name: orderReference
      required: true
      description: |
        사람이 읽을 수 있는 공개 주문번호입니다. `BF-XXXX-XXXX` 형식이며 서버는 대문자로 정리합니다. 주문번호만으로 접근 권한이 생기지는 않습니다. 본인 또는 해당 매장 범위가 아니면 403, 번호가 없으면 404를 반환합니다.
      example: BF-7K4M-Q2XZ
      schema:
        type: string
        pattern: 
          ^[Bb][Ff]-[23456789ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz]{4}$
    MerchantAccountId:
      in: path
      name: merchantAccountId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    QueueType:
      in: path
      name: queueType
      required: true
      schema:
        type: string
        enum: [PAYMENT, NOTIFICATION, SETTLEMENT]
    WorkReference:
      in: path
      name: workReference
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    AuditRecordId:
      in: path
      name: auditRecordId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SourceOrderId:
      in: path
      name: sourceOrderId
      required: true
      description: Terminal Order whose immutable menu and option selections are reused
      schema:
        $ref: "#/components/schemas/Identifier"
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PaymentMethodId:
      in: path
      name: paymentMethodId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PointAccountId:
      in: path
      name: accountId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SettlementItemId:
      in: path
      name: itemId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SettlementBatchId:
      in: path
      name: settlementBatchId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SupportCaseId:
      in: path
      name: caseId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SupportSubjectLinkId:
      in: path
      name: linkId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    VerificationSessionId:
      in: path
      name: sessionId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    VerificationChallengeId:
      in: path
      name: challengeId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DataAccessGrantId:
      in: path
      name: grantId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    BreakGlassRequestId:
      in: path
      name: requestId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Latitude:
      in: query
      name: latitude
      required: true
      description: 검색 기준점의 위도(WGS84).
      example: 37.5665
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Longitude:
      in: query
      name: longitude
      required: true
      description: 검색 기준점의 경도(WGS84).
      example: 126.978
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RadiusMeters:
      in: query
      name: radiusMeters
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: 검색 반경(미터). 최대 10000.
      example: 1500
    Cursor:
      in: query
      name: cursor
      required: false
      description: |
        이전 페이지의 `nextCursor` 값을 그대로 보내는 HMAC-signed(서명된) 페이지 이동 문자열입니다. 같은 API와 같은 매장·계정·필터에서만 사용할 수 있으며 형식이 잘못됐거나 만료되면 400을 반환합니다.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      in: query
      name: limit
      required: false
      description: 한 페이지에 반환할 최대 항목 수입니다. 기본값은 20이며 100을 초과할 수 없습니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DiscoveryLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    CompactLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    AccessReason:
      in: header
      name: X-Access-Reason
      required: true
      description: '운영자가 민감한 정보나 정책을 조회하는 업무 사유입니다. 앞뒤 공백을 제외한 1~200자를 보내야 하며 감사 기록에 남습니다.'
      schema:
        type: string
        pattern: ^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$
    SupportActionRequestId:
      in: path
      name: requestId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SupportOrderTimelineCaseId:
      in: query
      name: caseId
      required: true
      description: SupportCase that currently has the target Order linked as RELATED_ORDER.
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportTimelineLimit:
      in: query
      name: limit
      required: false
      description: 한 페이지에 반환할 최대 이력 수입니다. 기본값은 20이며 100을 초과할 수 없습니다.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OperationsInvestigationId:
      in: path
      name: investigationId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SupportProfileChangeId:
      in: path
      name: profileChangeId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    PostAcceptanceResolutionId:
      in: path
      name: resolutionId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SupportTimelineTypes:
      in: query
      name: types
      required: false
      description: 조회할 이력 종류를 제한하는 필터입니다. 생략하면 이 API가 지원하는 모든 종류를 조회합니다.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 15
        items:
          $ref: '#/components/schemas/SupportTimelineType'
    SupportTimelineCursor:
      in: query
      name: cursor
      required: false
      description: |
        이전 타임라인 페이지의 `nextCursor` 값을 그대로 보내는 문자열입니다. 같은 상담 건와 같은 필터에서만 사용할 수 있고 15분 뒤 만료됩니다. 형식이 잘못됐거나 범위·필터가 다르면 400을 반환합니다.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    SupportTimelineSources:
      in: query
      name: sources
      required: false
      description: 조회할 이력의 출처를 제한하는 필터입니다. 생략하면 주문, 결제, 환불, 포인트, 쿠폰, 정산, 알림 등 이 API가 지원하는 모든 출처를 조회합니다.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 9
        items:
          $ref: '#/components/schemas/SupportTimelineSource'
    SupportCompensationRequestId:
      in: path
      name: compensationRequestId
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    AuthenticationFailed:
      description: Credentials are invalid, the account is absent, locked, or expired; these cases are not distinguished.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthenticationRateLimited:
      description: The persistent per-IP authentication attempt budget is exhausted.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 900
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Request syntax or field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role, ownership, store membership, actor-chain validation, or a missing CSRF token fails with `ACCESS_DENIED`; a presented but stale or invalid CSRF token fails with `CSRF_TOKEN_INVALID`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is not visible in the authenticated actor scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State, capacity, duplicate resource, or idempotency payload conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SearchIndexRebuildConflict:
      description: |
        같은 Idempotency-Key가 이미 다른 정규화 reason에 묶였거나(IDEMPOTENCY_KEY_REUSED), 같은
        command가 아직 실행 중이거나(IDEMPOTENCY_REQUEST_IN_PROGRESS), 자동 재실행이 금지된
        상태입니다(IDEMPOTENCY_MANUAL_REVIEW_REQUIRED).

        실패한 command의 원장 row는 삭제되지 않으므로 실패 뒤에도 그 key는 원래 payload에
        묶여 있습니다. 같은 key에 다른 reason을 보내면 계속 IDEMPOTENCY_KEY_REUSED입니다.
        같은 payload의 재요청은 재시도가 안전한 경우에만 같은 row에서 다시 실행하며, 결과를
        확인하지 못한 command와 재시도 상한을 넘긴 command는 다시 실행하지 않고
        IDEMPOTENCY_MANUAL_REVIEW_REQUIRED로 운영자 확인을 요구합니다.

        Retry-After는 IDEMPOTENCY_REQUEST_IN_PROGRESS에만 있습니다. 나머지 두 코드에는 넣지
        않습니다. 자동 재시도가 결과 불명이나 부분 결과를 성공으로 바꾸면 안 되기 때문입니다.
      headers:
        Retry-After:
          required: false
          description: IDEMPOTENCY_REQUEST_IN_PROGRESS에만 존재하며, 완료 예상 시각이 아니라 재시도 간격입니다.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderCreationConflict:
      description: |
        Order resource conflict, idempotency payload reuse, or an identical
        idempotent request that is still processing or requires manual review.
        PROCESSING returns IDEMPOTENCY_REQUEST_IN_PROGRESS and Retry-After.
        MANUAL_REVIEW returns IDEMPOTENCY_MANUAL_REVIEW_REQUIRED without
        Retry-After and never re-executes the order command.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReorderConflict:
      description: |
        Source state, unavailable source item, resource reservation or idempotency
        conflict. REORDER_ITEMS_UNAVAILABLE uses the typed item detail schema.
        IDEMPOTENCY_REQUEST_IN_PROGRESS includes Retry-After.
        IDEMPOTENCY_MANUAL_REVIEW_REQUIRED never includes Retry-After and does not
        re-execute the reorder command.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ReorderItemsUnavailableError"
    UnprocessableEntity:
      description: A syntactically valid command was explicitly declined by the responsible domain or Provider
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A required dependency is unavailable; no fallback result was used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupportSearchRateLimited:
      description: The persistent per-operator Support exact-search budget is exhausted
      headers:
        Retry-After:
          required: true
          description: Whole seconds until the next five-minute UTC rate window.
          schema:
            type: integer
            minimum: 1
            maximum: 300
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: A persistent verification lockout is active for this Case and Subject binding
      headers:
        Retry-After:
          required: true
          description: Whole seconds until the binding lockout expires.
          schema:
            type: integer
            minimum: 1
            maximum: 1800
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderCreationDependencyUnavailable:
      description: |
        A required dependency is unavailable, or the immutable settlement input could
        not be materialized. The Error code is DEPENDENCY_UNAVAILABLE or
        SETTLEMENT_INPUT_UNAVAILABLE. No fee, coupon-cost, point-cost, current-value, or
        partial-snapshot fallback is used; the order and every owner reservation roll back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupportProfileChangeOk:
      description: Current masked workflow, exact approval binding and independent notification state
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportProfileChangeResource"
    SupportProfileChangeCreated:
      description: Purpose-specific workflow created or its exact idempotent result replayed
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportProfileChangeResource"
  headers:
    NoStore:
      required: true
      description: Sensitive support representation must not be stored by shared or browser caches.
      schema:
        type: string
        const: no-store
  schemas:
    BrandStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
      description: 브랜드 운영 상태입니다. `ARCHIVED`로 보관하면 같은 이름을 새 브랜드에서 다시 사용할 수 있습니다.
      example: ACTIVE
    Brand:
      type: object
      required:
        - brandId
        - name
        - status
        - assignedStoreCount
        - version
      properties:
        brandId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 브랜드 자원을 가리키는 UUID 식별자입니다.
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/BrandStatus'
          description: 리소스의 현재 상태입니다.
        assignedStoreCount:
          type: integer
          minimum: 0
          description: '이 브랜드에 연결된 매장 수입니다. 브랜드 이름을 바꿀 때 함께 갱신해야 하는 매장 수를 판단하는 데 사용합니다.'
        version:
          type: integer
          format: int64
          minimum: 0
          description: 동시에 다른 운영자가 브랜드를 바꾸지 않았는지 확인하는 버전입니다.
      additionalProperties: false
      description: 플랫폼에서 관리하는 카페 브랜드입니다. 이름, 활성·보관 상태, 소속 매장 수와 동시 변경 확인용 버전을 포함합니다.
      example:
        brandId: 15199b3a-1294-5fd2-a127-761b899b74b8
        name: 빈플로우 커피
        status: ACTIVE
        assignedStoreCount: 12
        version: 3
    BrandPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
          description: 현재 페이지에 포함된 리소스 목록입니다.
        page:
          $ref: '#/components/schemas/BrandPageInfo'
          description: 다음 페이지 커서 등 페이지네이션 정보입니다.
      additionalProperties: false
      description: 이름과 브랜드 ID 순으로 조회한 브랜드 목록과 다음 페이지 정보를 담습니다.
      example:
        items:
          - brandId: 15199b3a-1294-5fd2-a127-761b899b74b8
            name: 빈플로우 커피
            status: ACTIVE
            assignedStoreCount: 12
            version: 3
        page:
          nextCursor: null
    BrandPageInfo:
      type: object
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: 다음 페이지가 있을 때 서버가 반환하는 문자열입니다. 다음 요청의 `cursor`에 그대로 사용합니다.
      additionalProperties: false
      description: 브랜드 목록의 다음 페이지를 요청할 때 사용할 선택적 커서입니다.
      example:
        nextCursor: null
    StoreBrand:
      type: object
      required:
        - storeId
        - brandId
        - brandName
      properties:
        storeId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 매장 자원을 가리키는 UUID 식별자입니다.
        brandId:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: 해당 브랜드 자원을 가리키는 UUID 식별자입니다.
        brandName:
          type:
            - string
            - 'null'
          maxLength: 120
      additionalProperties: false
      description: 매장에 현재 연결된 브랜드 정보입니다. 연결된 브랜드가 없으면 브랜드 정보는 `null`입니다.
      example:
        storeId: 5273704d-f924-59e0-8883-827535fb86ad
        brandId: 15199b3a-1294-5fd2-a127-761b899b74b8
        brandName: 빈플로우 커피
    CreateBrandRequest:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        reason:
          $ref: '#/components/schemas/OperationReason'
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
      additionalProperties: false
      description: 새 브랜드를 생성하는 운영자 요청입니다. 브랜드 이름과 감사 사유를 포함합니다.
      example:
        name: 빈플로우 커피
        reason: 신규 프랜차이즈 브랜드 등록
    UpdateBrandRequest:
      type: object
      required:
        - reason
      description: 브랜드 이름 또는 상태를 변경하는 요청입니다. expectedVersion으로 동시 변경을 탐지하고 운영 사유를 감사 기록에 남깁니다.
      example:
        name: 빈플로우 로스터스
        status: ACTIVE
        expectedVersion: 3
        reason: 브랜드 리뉴얼에 따른 공식 명칭 변경
      properties:
        name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 120
        status:
          oneOf:
            - $ref: '#/components/schemas/BrandStatus'
            - type: 'null'
          description: 변경할 브랜드 상태입니다. 생략하면 현재 상태를 유지합니다.
        expectedVersion:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 0
          description: 동시 변경을 탐지할 현재 Brand.version입니다.
        reason:
          $ref: '#/components/schemas/OperationReason'
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
      additionalProperties: false
    AssignStoreBrandRequest:
      type: object
      required:
        - brandId
        - reason
      properties:
        brandId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 브랜드 자원을 가리키는 UUID 식별자입니다.
        reason:
          $ref: '#/components/schemas/OperationReason'
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
      additionalProperties: false
      description: 플랫폼 운영자가 매장에 브랜드를 지정하는 요청입니다. 대상 브랜드와 감사 기록에 남길 운영 사유를 포함합니다.
      example:
        brandId: 15199b3a-1294-5fd2-a127-761b899b74b8
        reason: 신규 가맹 계약에 따라 브랜드를 지정함
    ClearStoreBrandRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/OperationReason'
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
      additionalProperties: false
      description: 매장의 브랜드 지정을 해제하는 운영자 요청입니다. 감사 기록에 남길 사유를 포함합니다.
      example:
        reason: 가맹 계약 종료에 따라 브랜드 지정을 해제함
    SearchIndexRebuildRequest:
      type: object
      required: [reason]
      description: 매장 검색 색인 전체 재생성을 요청합니다. reason은 멱등성 해시의 일부입니다.
      example:
        reason: 브랜드 일괄 변경 후 검색 색인 정합성 복구
      properties:
        reason:
          allOf:
            - $ref: '#/components/schemas/OperationReason'
          description: 멱등성 해시 이전에 trim합니다. 제어 문자와 공백뿐인 값은 거부합니다.
      additionalProperties: false
    SearchIndexRebuildResponse:
      type: object
      required: [indexedStoreCount, skippedStoreCount, failedStoreIds, complete]
      description: |
        한 번의 재색인 pass 결과입니다. 재색인 대상은 첫 chunk 이전 snapshot으로 고정되며
        complete는 그 snapshot 범위에 대한 값입니다.
      example:
        indexedStoreCount: 128
        skippedStoreCount: 2
        failedStoreIds: []
        complete: true
      properties:
        indexedStoreCount:
          type: integer
          minimum: 0
          description: STORE_NAME과 판매 중 MENU_NAME term이 교체된 매장 수입니다.
        skippedStoreCount:
          type: integer
          minimum: 0
          description: 매장별 재색인 transaction이 시작되기 전에 삭제된 매장 수입니다.
        failedStoreIds:
          type: array
          uniqueItems: true
          description: 재색인 transaction이 실패한 매장입니다. 목록이 비어 있지 않으면 complete는 false입니다.
          items:
            $ref: '#/components/schemas/Identifier'
        complete:
          type: boolean
          description: failedStoreIds가 비어 있을 때만 true입니다. false는 저장된 부분 결과이며 전체 갱신 성공이 아닙니다.
      additionalProperties: false
    Region:
      type: object
      required: [code, sido, sigungu, eupmyeondong, ri, fullName]
      description: 법정동 폐쇄 어휘의 한 항목입니다. 매장에 지역을 지정할 때 참조 데이터로 사용됩니다.
      example:
        code: "1168010100"
        sido: 서울특별시
        sigungu: 강남구
        eupmyeondong: 역삼동
        ri: ""
        fullName: 서울특별시 강남구 역삼동
      properties:
        code:
          type: string
          pattern: "^[0-9]{10}$"
          description: 법정동 코드. 폐쇄 어휘의 기본 키다.
        sido:
          type: string
          minLength: 1
          maxLength: 40
        sigungu:
          type: string
          maxLength: 40
          description: |
            계층이 없는 지역은 빈 문자열이다. 세종특별자치시에는 시군구 계층이 아예 없으므로
            없는 계층과 값이 빠진 것을 구분하기 위해 null을 쓰지 않는다.
        eupmyeondong:
          type: string
          maxLength: 40
          description: |
            리 행에서도 상위 읍·면 이름을 그대로 유지한다. 리에 있는 매장이 읍·면 이름과 리
            이름 양쪽으로 검색되게 하기 위함이다.
        ri:
          type: string
          maxLength: 40
        fullName:
          type: string
          minLength: 1
          maxLength: 120
      additionalProperties: false
    RegionPage:
      type: object
      required: [items, page]
      description: 법정동 지역 목록의 signed cursor 페이지입니다.
      example:
        items:
          - code: "1168010100"
            sido: 서울특별시
            sigungu: 강남구
            eupmyeondong: 역삼동
            ri: ""
            fullName: 서울특별시 강남구 역삼동
        page:
          nextCursor: null
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Region"
        page:
          $ref: "#/components/schemas/RegionPageInfo"
      additionalProperties: false
    RegionPageInfo:
      type: object
      required: [nextCursor]
      description: 법정동 지역 목록 페이지의 다음 페이지 커서 정보입니다.
      example:
        nextCursor: null
      properties:
        nextCursor:
          type: [string, "null"]
          maxLength: 2048
      additionalProperties: false
    StoreRegion:
      type: object
      required: [storeId, regionCode, regionFullName]
      description: 매장에 지정된 법정동 지역입니다.
      example:
        storeId: "01J8Z3QK2N5R7X9V6W4T8Y1B0C"
        regionCode: "1168010100"
        regionFullName: 서울특별시 강남구 역삼동
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        regionCode:
          type: string
          pattern: "^[0-9]{10}$"
        regionFullName:
          type: string
          minLength: 1
          maxLength: 120
      additionalProperties: false
    AssignStoreRegionRequest:
      type: object
      required: [regionCode, reason]
      description: 매장에 법정동 지역을 지정하는 요청입니다.
      example:
        regionCode: "1168010100"
        reason: 사업자등록증상 소재지 기준으로 지역 배정
      properties:
        regionCode:
          type: string
          pattern: "^[0-9]{10}$"
        reason:
          $ref: "#/components/schemas/OperationReason"
      additionalProperties: false
    OperationReason:
      type: string
      minLength: 1
      maxLength: 200
      description: 운영 명령이 추가하는 감사 기록에 저장되는 사유입니다.
      example: 운영 정책 변경 승인 티켓 OPS-SAMPLE-001에 따라 처리함
    LoginId:
      type: string
      minLength: 5
      maxLength: 32
      pattern: ^[a-z0-9][a-z0-9._-]{3,30}[a-z0-9]$
      description: 로그인 주체별로 사용하는 소문자 로그인 ID입니다. 서버가 대소문자와 앞뒤 공백을 정리한 값입니다.
      example: merchant01
    Password:
      type: string
      minLength: 15
      maxLength: 128
      description: |
        15~128 유니코드 코드포인트이며 at most 512 UTF-8 bytes(UTF-8 기준 최대 512바이트)여야
        합니다. 앞뒤 공백 제거(trim)나 정규화를 하지 않습니다.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      description: 로그인 ID/비밀번호로 인증을 요청하는 로그인 요청입니다. 고객/점주 로그인 모두 같은 형식을 사용합니다.
      example:
        loginId: merchant01
        password: Str0ngP@ssw0rd!
      properties:
        loginId: { $ref: "#/components/schemas/LoginId" }
        password: { $ref: "#/components/schemas/Password" }
    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [loginId, password, displayName]
      description: 고객 계정 가입 요청입니다. 성공 시 잔액 0원인 포인트 계좌가 함께 생성됩니다.
      example:
        loginId: customer01
        password: Str0ngP@ssw0rd!
        displayName: 김도넛
      properties:
        loginId: { $ref: "#/components/schemas/LoginId" }
        password: { $ref: "#/components/schemas/Password" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    CustomerRegistrationResult:
      type: object
      additionalProperties: false
      required: [loginId]
      description: 고객 계정 가입이 완료되었음을 나타내는 결과입니다.
      example:
        loginId: customer01
      properties:
        loginId: { $ref: "#/components/schemas/LoginId" }
    CustomerActor:
      type: object
      additionalProperties: false
      required: [actorType, customerId, displayName]
      description: 현재 인증된 고객을 나타내는 actor 정보입니다.
      example:
        actorType: CUSTOMER
        customerId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        displayName: 김도넛
      properties:
        actorType: { const: CUSTOMER }
        customerId: { $ref: "#/components/schemas/Identifier" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    MerchantActor:
      type: object
      additionalProperties: false
      required: [actorType, merchantId, displayName, accountState]
      description: |
        현재 인증된 점주를 나타내는 actor 정보입니다. accountState가 INITIAL_PASSWORD면
        아직 초기 비밀번호를 변경하지 않은 상태로, 비밀번호 변경 전까지 다른 API가
        차단됩니다.
      example:
        actorType: MERCHANT
        merchantId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        displayName: 홍길동
        accountState: ACTIVE
      properties:
        actorType: { const: MERCHANT }
        merchantId: { $ref: "#/components/schemas/Identifier" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        accountState: { type: string, enum: [INITIAL_PASSWORD, ACTIVE] }
    OperatorActor:
      type: object
      additionalProperties: false
      required: [actorType, operatorId, roles]
      description: Keycloak 기반으로 인증된 현재 운영자(operator)를 나타내는 actor 정보입니다.
      example:
        actorType: OPERATOR
        operatorId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        roles: [SETTLEMENT_REVIEWER]
      properties:
        actorType: { const: OPERATOR }
        operatorId: { $ref: "#/components/schemas/Identifier" }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    MerchantPasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      description: 현재 비밀번호를 검증한 뒤 새 비밀번호로 교체하는 요청입니다.
      example:
        currentPassword: OldStr0ngP@ss!
        newPassword: NewStr0ngP@ss!
      properties:
        currentPassword: { $ref: "#/components/schemas/Password" }
        newPassword: { $ref: "#/components/schemas/Password" }
    MerchantStoreList:
      type: array
      description: 현재 상인이 활성 멤버십을 가진 매장 전체 목록입니다.
      example:
        - storeId: "01J8Z3QK2N5R7X9V6W4T8Y1B0C"
          storeName: 빈플로우 강남역점
          membershipRole: OWNER
        - storeId: "01J8Z3QK2N5R7X9V6W4T8Y1B0D"
          storeName: 빈플로우 역삼점
          membershipRole: STAFF
      items: { $ref: "#/components/schemas/MerchantStore" }
    MerchantStore:
      type: object
      additionalProperties: false
      required: [storeId, storeName, membershipRole]
      description: 상인이 소속된 하나의 매장과 그 매장에서의 멤버십 역할입니다.
      example:
        storeId: "01J8Z3QK2N5R7X9V6W4T8Y1B0C"
        storeName: 빈플로우 강남역점
        membershipRole: OWNER
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        storeName: { type: string, minLength: 1, maxLength: 200 }
        membershipRole: { type: string, enum: [OWNER, STAFF], description: 해당 매장에서의 멤버십 역할. OWNER는 매장 소유자, STAFF는 소속 직원입니다. }
    OperationsOidcConfiguration:
      type: object
      additionalProperties: false
      required: [issuerUri, authorizationServerUrl, realm, clientId, redirectUri, postLogoutRedirectUri, scopes]
      properties:
        issuerUri: { type: string, format: uri }
        authorizationServerUrl: { type: string, format: uri }
        realm: { type: string, minLength: 1 }
        clientId: { type: string, minLength: 1 }
        redirectUri: { type: string, format: uri }
        postLogoutRedirectUri: { type: string, format: uri }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    CustomerOrderAllowedAction:
      type: string
      enum: [CANCEL, REORDER, VIEW_REFUND]
    CustomerOrderSummary:
      type: object
      additionalProperties: false
      required: [orderReference, pickupNumber, storeName, status, orderedAt, pickupWindowStart, pickupWindowEnd, totalAmountKrw, currency, itemSummary, allowedActions]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        pickupNumber: { type: string, minLength: 1, maxLength: 32 }
        storeName: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/OrderState" }
        orderedAt: { $ref: "#/components/schemas/DateTime" }
        pickupWindowStart: { $ref: "#/components/schemas/DateTime" }
        pickupWindowEnd: { $ref: "#/components/schemas/DateTime" }
        totalAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Coupon discount and point use after the final amount payable by the customer.
        currency: { $ref: "#/components/schemas/Currency" }
        itemSummary: { type: string, minLength: 1, maxLength: 300 }
        allowedActions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CustomerOrderAllowedAction" }
    CustomerOrderPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerOrderSummary" }
        page: { $ref: "#/components/schemas/PageInfo" }
    CouponWalletInapplicableReason:
      type: string
      enum: [STORE_NOT_APPLICABLE]
    CustomerCouponWalletBenefit:
      type: object
      additionalProperties: false
      required: [discountType]
      properties:
        discountType: { type: string, enum: [FIXED_KRW, RATE_BPS] }
        fixedAmountKrw: { $ref: "#/components/schemas/MoneyKrw" }
        rateBps: { type: integer, minimum: 1, maximum: 10000 }
        maximumDiscountKrw: { $ref: "#/components/schemas/MoneyKrw" }
      allOf:
        - if:
            properties: { discountType: { const: FIXED_KRW } }
            required: [discountType]
          then:
            required: [fixedAmountKrw]
        - if:
            properties: { discountType: { const: RATE_BPS } }
            required: [discountType]
          then:
            required: [rateBps, maximumDiscountKrw]
    CustomerCouponWalletItem:
      type: object
      additionalProperties: false
      required: [couponIssuanceId, benefit, minimumOrderKrw, couponExpiresAt, applicable]
      properties:
        couponIssuanceId: { $ref: "#/components/schemas/Identifier" }
        benefit: { $ref: "#/components/schemas/CustomerCouponWalletBenefit" }
        minimumOrderKrw: { $ref: "#/components/schemas/MoneyKrw" }
        couponExpiresAt: { $ref: "#/components/schemas/DateTime" }
        applicable: { type: boolean }
        reasonCode: { $ref: "#/components/schemas/CouponWalletInapplicableReason" }
      allOf:
        - if:
            properties: { applicable: { const: false } }
            required: [applicable]
          then:
            required: [reasonCode]
        - if:
            properties: { applicable: { const: true } }
            required: [applicable]
          then:
            not: { required: [reasonCode] }
    CustomerCouponWalletPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerCouponWalletItem" }
        page: { $ref: "#/components/schemas/PageInfo" }
    CustomerOrderLine:
      type: object
      additionalProperties: false
      required: [lineSequence, menuName, optionNames, quantity, lineTotalKrw]
      properties:
        lineSequence: { type: integer, minimum: 0 }
        menuName: { type: string, minLength: 1, maxLength: 200 }
        optionNames:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1 }
        lineTotalKrw: { $ref: "#/components/schemas/MoneyKrw" }
    CustomerOrderDetail:
      type: object
      additionalProperties: false
      required: [orderReference, storeId, pickupNumber, storeName, status, orderedAt, pickupWindowStart, pickupWindowEnd, totalAmountKrw, currency, lines, allowedActions]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        storeId:
          allOf:
            - $ref: "#/components/schemas/Identifier"
          description: |
            Server-supplied opaque store identifier. It exists so the customer can
            read that store's current pickup slots when reordering; no customer
            screen accepts it as input.
        pickupNumber: { type: string, minLength: 1, maxLength: 32 }
        storeName: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/OrderState" }
        orderedAt: { $ref: "#/components/schemas/DateTime" }
        pickupWindowStart: { $ref: "#/components/schemas/DateTime" }
        pickupWindowEnd: { $ref: "#/components/schemas/DateTime" }
        totalAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Coupon discount and point use after the final amount payable by the customer.
        currency: { $ref: "#/components/schemas/Currency" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CustomerOrderLine" }
        allowedActions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CustomerOrderAllowedAction" }
        cancellationPreview:
          allOf:
            - $ref: "#/components/schemas/CustomerCancellationPreview"
          description: |
            Present only while CANCEL is allowed. This server-calculated projection
            is an estimate, not a refund commitment. The cancellation command
            revalidates the order and returns the committed outcome independently.
        paymentRecovery: { $ref: "#/components/schemas/CancellationRefundRecoverySummary" }
    CustomerCancellationPreview:
      type: object
      additionalProperties: false
      required: [estimate, calculatedAt, orderVersion, cashRefundAmountKrw, restoredPoints, couponRestoration, pendingAccrual]
      properties:
        estimate:
          const: true
          description: Distinguishes this projection from a committed refund outcome
        calculatedAt: { $ref: "#/components/schemas/DateTime" }
        orderVersion:
          type: integer
          format: int64
          minimum: 0
          description: Order version used for this estimate; display-only for the customer client
        cashRefundAmountKrw: { $ref: "#/components/schemas/MoneyKrw" }
        restoredPoints:
          type: integer
          format: int64
          minimum: 0
        couponRestoration:
          type: string
          enum: [NOT_APPLICABLE, WILL_RESTORE, WILL_NOT_RESTORE]
        pendingAccrual:
          type: string
          enum: [NOT_APPLICABLE, WILL_NOT_ACCRUE, WILL_BE_REVERSED]
    CustomerCancellationResult:
      type: object
      additionalProperties: false
      description: 공개 주문 참조번호로 요청한 고객 취소 결과입니다. 내부 주문 ID 대신 공개 참조번호와 취소 상태, 환불 복구 요약, 추적 정보를 제공합니다.
      example:
        orderReference: BF-7K4M-Q2XZ
        orderState: CANCELLED
        reasonCode: CHANGED_MIND
        paymentRecovery:
          state: PROCESSING
          approvedAmountKrw: 9000
          succeededRefundAmountBeforeCancellationKrw: 0
          cancellationRequestedRefundAmountKrw: 9000
          remainingRefundableAmountKrw: 9000
          lastUpdatedAt: '2026-08-15T09:35:30+09:00'
        cancelledAt: '2026-08-15T09:35:00+09:00'
        correlationId: 072b89dc-3e01-5af2-a29a-1921eed64db0
      required:
        - orderReference
        - orderState
        - reasonCode
        - paymentRecovery
        - cancelledAt
        - correlationId
      properties:
        orderReference:
          type: string
          pattern: ^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$
          description: 사람이 읽을 수 있는 BF-XXXX-XXXX 형식의 공개 주문 참조번호입니다.
        orderState:
          const: CANCELLED
          description: 취소된 주문 상태이며 항상 CANCELLED입니다.
        reasonCode:
          $ref: '#/components/schemas/CancellationReasonCode'
          description: API에서 정한 사유 코드입니다.
        paymentRecovery:
          $ref: '#/components/schemas/CancellationRefundRecoverySummary'
          description: 고객에게 노출되는 환불 복구 진행 요약입니다.
        cancelledAt:
          $ref: '#/components/schemas/DateTime'
          description: 주문이 취소된 시각입니다.
        correlationId:
          type: string
          minLength: 1
          maxLength: 160
          description: 서버 로그와 관련 작업을 함께 찾을 때 사용하는 요청 추적 ID입니다.
    CustomerPointSummary:
      type: object
      additionalProperties: false
      required: [availablePointsKrw, recoveryPendingKrw, currency, expiring, expiringHasMore]
      properties:
        availablePointsKrw: { $ref: "#/components/schemas/MoneyKrw" }
        recoveryPendingKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        expiring:
          type: array
          maxItems: 20
          description: 만료 시점(expiresAt)별로 묶은 만료 예정 포인트로, 만료가 가장 이른 시점부터 최대 20개까지 반환합니다.
          items: { $ref: "#/components/schemas/ExpiringPointAmount" }
        expiringHasMore:
          type: boolean
          description: expiring이 20개 시점에서 잘렸는지 여부입니다. true면 이후 시점의 만료 예정 포인트가 이 응답에 포함되지 않았습니다.
    ExpiringPointAmount:
      type: object
      additionalProperties: false
      required: [expiresAt, amountKrw]
      properties:
        expiresAt: { $ref: "#/components/schemas/DateTime" }
        amountKrw: { $ref: "#/components/schemas/MoneyKrw" }
    StoreSearchPage:
      type: object
      additionalProperties: false
      required: [items, page, distanceAvailable]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoreSearchItem" }
        page: { $ref: "#/components/schemas/PageInfo" }
        distanceAvailable:
          type: boolean
          description: True only when a valid latitude/longitude pair was supplied and distance ordering participated.
    StoreSearchItem:
      type: object
      additionalProperties: false
      required: [storeId, name, matchReason, open, pickupAvailable, matchedMenus]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1, maxLength: 200 }
        brandName:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
        regionName:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: The administrative region levels of the store joined from 시도 down to 리.
        matchReason:
          type: array
          minItems: 1
          description: The distinct kinds of searchable attribute that matched, never the score.
          items:
            type: string
            enum:
              [
                STORE_NAME,
                BRAND_NAME,
                REGION_SIDO,
                REGION_SIGUNGU,
                REGION_EUPMYEONDONG,
                REGION_RI,
                MENU_NAME,
              ]
        distanceMeters: { type: integer, minimum: 0 }
        open: { type: boolean }
        pickupAvailable: { type: boolean }
        matchedMenus:
          type: array
          maxItems: 3
          description: Menus of this store that the query matched, most relevant first. Empty when none matched.
          items: { $ref: "#/components/schemas/StoreSearchMenu" }
    StoreSearchMenu:
      type: object
      additionalProperties: false
      required: [menuId, name]
      properties:
        menuId: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1, maxLength: 200 }
    CustomerStore:
      type: object
      additionalProperties: false
      required: [storeId, name, pickupAvailable]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1, maxLength: 200 }
        pickupAvailable: { type: boolean }
        distanceMeters: { type: integer, minimum: 0 }
    CustomerStoreList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerStore" }
    StoreRecommendation:
      type: object
      additionalProperties: false
      required: [store, reason]
      properties:
        store: { $ref: "#/components/schemas/CustomerStore" }
        reason: { type: string, enum: [FAVORITE, RECENT, NEARBY] }
    StoreRecommendationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoreRecommendation" }
    StoreOrderAction:
      type: string
      description: 스토어가 주문에 적용할 수 있는 수락, 거절, 제조 시작, 준비 완료, 픽업 완료 작업입니다.
      example: START_PREPARING
      enum:
        - ACCEPT
        - REJECT
        - START_PREPARING
        - MARK_READY
        - COMPLETE
    StoreOrderBoardItem:
      type: object
      additionalProperties: false
      description: 스토어 주문 현황판에 표시할 주문 한 건입니다. 공개 주문번호, 픽업 번호·시간, 현재 상태, 메뉴 요약과 지금 수행할 수 있는 작업을 포함합니다.
      example:
        orderReference: BF-7K4M-Q2XZ
        pickupNumber: A-12
        pickupBusinessDate: '2026-08-15'
        lane: ACCEPTED
        status: ACCEPTED
        pickupWindowStart: '2026-08-15T10:00:00+09:00'
        pickupWindowEnd: '2026-08-15T10:15:00+09:00'
        itemSummary: 아이스 아메리카노 2잔 · 샷 추가
        acceptanceDeadlineAt: '2026-08-15T09:36:00+09:00'
        acceptancePhase: OPEN
        allowedActions:
          - START_PREPARING
      required:
        - orderReference
        - pickupNumber
        - pickupBusinessDate
        - status
        - pickupWindowStart
        - pickupWindowEnd
        - itemSummary
        - allowedActions
      properties:
        orderReference:
          type: string
          pattern: ^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$
          description: 사람이 읽을 수 있는 BF-XXXX-XXXX 형식의 공개 주문 참조번호입니다.
        pickupNumber:
          type: string
          minLength: 1
          maxLength: 32
          description: 매장 운영 화면과 픽업 호출에 사용하는 번호입니다.
        pickupBusinessDate:
          type: string
          format: date
          description: 매장 영업일 기준 픽업 날짜입니다.
        lane:
          type: string
          enum:
            - PENDING_ACCEPTANCE
            - ACCEPTED
            - PREPARING
            - READY
          description: 주문 보드에서 항목을 배치할 진행 레인입니다.
        status:
          $ref: '#/components/schemas/OrderState'
          description: 현재 주문 상태입니다.
        pickupWindowStart:
          $ref: '#/components/schemas/DateTime'
          description: 고객이 선택한 픽업 가능 구간의 시작 시각입니다.
        pickupWindowEnd:
          $ref: '#/components/schemas/DateTime'
          description: 고객이 선택한 픽업 가능 구간의 종료 시각입니다.
        itemSummary:
          type: string
          minLength: 1
          maxLength: 300
          description: 메뉴와 수량을 매장 화면용으로 축약한 한 줄 요약입니다.
        acceptanceDeadlineAt:
          $ref: '#/components/schemas/DateTime'
          description: 매장이 주문을 수락해야 하는 마감 시각입니다.
        acceptancePhase:
          type: string
          enum:
            - OPEN
            - WARNING
            - TIMEOUT_PENDING
          description: 수락 마감까지의 현재 단계입니다.
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StoreOrderAction'
          description: 현재 상태와 권한에서 서버가 허용하는 매장 작업 목록입니다.
        compensationRecovery:
          $ref: '#/components/schemas/StoreCompensationSummary'
          description: 매장에 허용된 범위로 축약한 환불·혜택·재고 복구 진행 정보입니다.
    StoreOrderBoard:
      type: object
      additionalProperties: false
      required: [groups, overflow]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/StoreOrderBoardDateGroup" }
        overflow:
          type: array
          description: One entry for each lane whose oldest actionable orders are outside the bounded polling snapshot.
          items: { $ref: "#/components/schemas/StoreOrderBoardOverflow" }
    StoreOrderBoardOverflow:
      type: object
      additionalProperties: false
      required: [lane, overflowCount, nextCursor]
      properties:
        lane: { type: string, enum: [PENDING_ACCEPTANCE, ACCEPTED, PREPARING, READY] }
        overflowCount:
          type: integer
          format: int64
          minimum: 1
          description: Exact number of actionable orders after the 50 visible cards in this lane.
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: Opaque signed keyset cursor for the first overflow queue page of this store and lane. Its 15-minute TTL is not extended by a board 304 response.
    StoreOrderBoardOverflowPage:
      type: object
      additionalProperties: false
      required: [lane, items, nextCursor]
      properties:
        lane: { type: string, enum: [PENDING_ACCEPTANCE, ACCEPTED, PREPARING, READY] }
        items:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/StoreOrderBoardItem" }
        nextCursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 2048
          description: Cursor for the following overflow page, or null when this queue has no older item. Its 15-minute TTL is not extended by a board 304 response.
    StoreOrderBoardDateGroup:
      type: object
      additionalProperties: false
      required: [pickupBusinessDate, items]
      properties:
        pickupBusinessDate: { type: string, format: date }
        items:
          type: array
          minItems: 1
          description: Every item has the same pickupBusinessDate as this group.
          items: { $ref: "#/components/schemas/StoreOrderBoardItem" }
    StoreOrderActionRequest:
      type: object
      additionalProperties: false
      description: 공개 주문번호로 주문 상태를 바꿀 때 보내는 요청입니다. 실행할 작업과 화면에서 마지막으로 본 주문 상태를 함께 보내며, 서버의 현재 상태가 달라졌으면 충돌로 
        처리합니다.
      example:
        action: START_PREPARING
        expectedStatus: ACCEPTED
        reason: 제조를 시작합니다.
      required:
        - action
        - expectedStatus
      properties:
        action:
          $ref: '#/components/schemas/StoreOrderAction'
          description: 주문에 적용할 서버 허용 매장 작업입니다.
        expectedStatus:
          type: string
          enum:
            - PAID
            - ACCEPTED
            - PREPARING
            - READY
          description: 운영자가 작업을 선택했을 때 화면에 표시된 주문 상태입니다. 현재 상태가 달라졌으면 ORDER_STATE_CONFLICT를 반환합니다.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\u0000-\u001F\u007F]*$
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    MerchantRefundSelection:
      type: object
      additionalProperties: false
      required: [lineSequence, quantity]
      properties:
        lineSequence: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
    MerchantRefundPreviewRequest:
      type: object
      additionalProperties: false
      description: |
        환불 preview 요청입니다. `lines`를 생략하면 아직 아무 품목도 고르지 않은 상태를 뜻하며, 응답은 환불 가능한 모든 품목과 잔여 수량만 담고 금액 합계는 0입니다. 생략은 전체 환불을 뜻하지 않습니다. 전체 잔여 환불도 모든 품목의 잔여 수량을 명시해야 합니다.
      properties:
        lines:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MerchantRefundSelection" }
    MerchantRefundRequest:
      type: object
      additionalProperties: false
      required: [lines, previewVersion, reason]
      properties:
        lines:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MerchantRefundSelection" }
        previewVersion: { type: string, pattern: '^[0-9a-f]{64}$' }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]*$'
    MerchantRefundPreviewLine:
      type: object
      additionalProperties: false
      required: [lineSequence, menuName, selectedQuantity, remainingQuantity, grossAttributionKrw, couponAttributionKrw, pointsRestorationKrw, cashRefundKrw]
      description: |
        환불 preview의 품목 한 줄입니다. 응답은 환불 가능한 모든 품목을 담으므로 고르지 않은 품목은 `selectedQuantity`가 0이고 금액도 0입니다.
      properties:
        lineSequence: { type: integer, minimum: 0 }
        menuName: { type: string, minLength: 1, maxLength: 200 }
        selectedQuantity: { type: integer, minimum: 0 }
        remainingQuantity: { type: integer, minimum: 0 }
        grossAttributionKrw: { $ref: "#/components/schemas/MoneyKrw" }
        couponAttributionKrw: { $ref: "#/components/schemas/MoneyKrw" }
        pointsRestorationKrw: { $ref: "#/components/schemas/MoneyKrw" }
        cashRefundKrw: { $ref: "#/components/schemas/MoneyKrw" }
    MerchantRefundTotals:
      type: object
      additionalProperties: false
      required: [grossAttributionKrw, couponAttributionKrw, pointsRestorationKrw, cashRefundKrw, currency]
      properties:
        grossAttributionKrw: { $ref: "#/components/schemas/MoneyKrw" }
        couponAttributionKrw: { $ref: "#/components/schemas/MoneyKrw" }
        pointsRestorationKrw: { $ref: "#/components/schemas/MoneyKrw" }
        cashRefundKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
    MerchantRefundPreview:
      type: object
      additionalProperties: false
      required: [orderReference, lines, totals, previewVersion]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MerchantRefundPreviewLine" }
        totals: { $ref: "#/components/schemas/MerchantRefundTotals" }
        previewVersion: { type: string, pattern: '^[0-9a-f]{64}$' }
    MerchantRefundResult:
      type: object
      additionalProperties: false
      required: [orderReference, state, cashRefundRequestedKrw, pointsRestorationRequestedKrw, pointsRestorationState, currency, createdAt, updatedAt, correlationId]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        state: { type: string, enum: [REQUESTED, PROCESSING, RETRY_SCHEDULED, SUCCEEDED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW] }
        cashRefundRequestedKrw: { $ref: "#/components/schemas/MoneyKrw" }
        pointsRestorationRequestedKrw: { $ref: "#/components/schemas/MoneyKrw" }
        pointsRestorationState: { type: string, enum: [NOT_REQUIRED, REQUESTED, PROCESSING, SUCCEEDED, MANUAL_REVIEW] }
        cashRefundedKrw: { $ref: "#/components/schemas/MoneyKrw" }
        pointsRestoredKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        createdAt: { $ref: "#/components/schemas/DateTime" }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
        correlationId: { type: string, minLength: 1, maxLength: 160 }
    MerchantDisputeSummary:
      type: object
      additionalProperties: false
      description: |
        점주가 자신의 이의제기 진행 상태를 확인하는 데 필요한 값만 담습니다. 내부 재처리 case, worker 오류와 접수자 자격증명은 포함하지 않습니다.
      required: [disputeId, settlementItemId, state, expectedAdjustmentKrw, heldAmountKrw, filedAt]
      properties:
        disputeId: { $ref: "#/components/schemas/Identifier" }
        settlementItemId: { $ref: "#/components/schemas/Identifier" }
        state: { type: string, enum: [FILED, UNDER_REVIEW, ACCEPTED, REJECTED, WITHDRAWN] }
        expectedAdjustmentKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
        heldAmountKrw: { $ref: "#/components/schemas/MoneyKrw" }
        filedAt: { $ref: "#/components/schemas/DateTime" }
        decidedAt: { $ref: "#/components/schemas/DateTime" }
    MerchantDisputePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MerchantDisputeSummary" }
        page: { $ref: "#/components/schemas/PageInfo" }
    FailureAttentionState:
      type: string
      enum: [RETRY_SCHEDULED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
    FailureQueueSummaryBucket:
      type: object
      additionalProperties: false
      required: [queueType, attentionState, count]
      properties:
        queueType: { type: string, enum: [PAYMENT, NOTIFICATION, SETTLEMENT] }
        attentionState: { $ref: "#/components/schemas/FailureAttentionState" }
        count: { type: integer, format: int64, minimum: 0 }
        oldestOccurredAt: { $ref: "#/components/schemas/DateTime" }
    FailureQueueSummary:
      type: object
      additionalProperties: false
      required: [buckets, generatedAt]
      properties:
        buckets:
          type: array
          items: { $ref: "#/components/schemas/FailureQueueSummaryBucket" }
        generatedAt: { $ref: "#/components/schemas/DateTime" }
    FailureWorkItem:
      type: object
      additionalProperties: false
      required: [queueType, workReference, sourceState, attentionState, attemptCountAvailable, occurredAt, updatedAt, correlationId, sanitizedSummary, allowedActions]
      properties:
        queueType: { type: string, enum: [PAYMENT, NOTIFICATION, SETTLEMENT] }
        workReference: { type: string, minLength: 1, maxLength: 160 }
        sourceState: { type: string, minLength: 1, maxLength: 100 }
        attentionState: { $ref: "#/components/schemas/FailureAttentionState" }
        attemptCount:
          type: integer
          minimum: 0
          description: Present only when attemptCountAvailable is true; absence is not projected as zero.
        attemptCountAvailable: { type: boolean }
        occurredAt: { $ref: "#/components/schemas/DateTime" }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
        correlationId: { type: string, minLength: 1, maxLength: 160 }
        sanitizedSummary: { type: string, minLength: 1, maxLength: 500 }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    FailureQueuePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FailureWorkItem" }
        page: { $ref: "#/components/schemas/PageInfo" }
    FailureWorkDetail:
      type: object
      additionalProperties: false
      required: [work, sanitizedDetails]
      properties:
        work: { $ref: "#/components/schemas/FailureWorkItem" }
        sanitizedDetails:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }
    FailureSearchTypeResult:
      type: object
      additionalProperties: false
      required: [queueType, items, truncated]
      properties:
        queueType: { type: string, enum: [PAYMENT, NOTIFICATION, SETTLEMENT] }
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/FailureWorkItem" }
        truncated: { type: boolean }
    FailureSearchResult:
      type: object
      additionalProperties: false
      required: [correlationId, results]
      properties:
        correlationId: { type: string, minLength: 1, maxLength: 160 }
        results:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/FailureSearchTypeResult" }
    OperationsSettlementBatch:
      type: object
      additionalProperties: false
      required: [settlementBatchId, storeId, settlementDate, state, currency]
      properties:
        settlementBatchId: { $ref: "#/components/schemas/Identifier" }
        storeId: { $ref: "#/components/schemas/Identifier" }
        settlementDate: { type: string, format: date }
        state: { type: string, enum: [OPEN, CALCULATED, CONFIRMED] }
        grossPaidKrw: { $ref: "#/components/schemas/MoneyKrw" }
        feeKrw: { $ref: "#/components/schemas/MoneyKrw" }
        benefitCostKrw: { $ref: "#/components/schemas/MoneyKrw" }
        adjustmentKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
        netSettlementKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        confirmedAt: { $ref: "#/components/schemas/DateTime" }
    OperationsSettlementBatchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OperationsSettlementBatch" }
        page: { $ref: "#/components/schemas/PageInfo" }
    SettlementReconciliation:
      type: object
      additionalProperties: false
      required: [settlementBatchId, state, storedTotals, itemTotals, effectiveAdjustmentKrw, carryForwardInKrw, carryForwardOutKrw, activeDisputeHoldKrw, currency]
      properties:
        settlementBatchId: { $ref: "#/components/schemas/Identifier" }
        state: { type: string, enum: [CONSISTENT, MISMATCH, INCOMPLETE] }
        storedTotals: { $ref: "#/components/schemas/SettlementTieOutTotals" }
        itemTotals: { $ref: "#/components/schemas/SettlementTieOutTotals" }
        effectiveAdjustmentKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
        carryForwardInKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
        carryForwardOutKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
        activeDisputeHoldKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        incompleteSources:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    SettlementTieOutTotals:
      type: object
      additionalProperties: false
      properties:
        grossPaidKrw: { $ref: "#/components/schemas/MoneyKrw" }
        feeKrw: { $ref: "#/components/schemas/MoneyKrw" }
        benefitCostKrw: { $ref: "#/components/schemas/MoneyKrw" }
        netSettlementKrw: { $ref: "#/components/schemas/SignedMoneyKrw" }
    AuditRecord:
      type: object
      additionalProperties: false
      required: [auditRecordId, actorType, maskedActorReference, action, category, targetType, targetReference, occurredAt, reasonCode, sanitizedBeforeSummary, sanitizedAfterSummary, correlationId]
      properties:
        auditRecordId: { $ref: "#/components/schemas/Identifier" }
        actorType: { type: string, minLength: 1, maxLength: 100 }
        maskedActorReference: { type: string, minLength: 1, maxLength: 200 }
        action: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, minLength: 1, maxLength: 100 }
        targetType: { type: string, minLength: 1, maxLength: 100 }
        targetReference: { type: string, minLength: 1, maxLength: 160 }
        occurredAt: { $ref: "#/components/schemas/DateTime" }
        reasonCode: { type: string, minLength: 1, maxLength: 100 }
        sanitizedBeforeSummary: { type: string, maxLength: 500 }
        sanitizedAfterSummary: { type: string, maxLength: 500 }
        correlationId: { type: string, minLength: 1, maxLength: 160 }
    AuditRecordPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRecord" }
        page: { $ref: "#/components/schemas/PageInfo" }
    ReasonRequest:
      type: object
      additionalProperties: false
      description: 운영 명령의 사유만 전달하는 공통 요청 본문입니다.
      example:
        reason: 본인 확인 후 로그인 잠금 해제를 승인함
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000-\u001F\u007F]*$
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    CreateMerchantAccountRequest:
      type: object
      additionalProperties: false
      description: 점주 계정과 첫 매장 소속을 함께 생성하는 요청입니다. 로그인 ID, 표시 이름, 매장, `OWNER` 또는 `STAFF` 역할, 운영 사유를 포함합니다.
      example:
        loginId: merchant01
        displayName: 성수점 점주
        storeId: 5273704d-f924-59e0-8883-827535fb86ad
        membershipRole: OWNER
        reason: 신규 가맹점 점주 계정 발급
      required:
        - loginId
        - displayName
        - storeId
        - membershipRole
        - reason
      properties:
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 관련 내부 자원을 가리키는 UUID 식별자입니다.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        storeId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 매장 자원을 가리키는 UUID 식별자입니다.
        membershipRole:
          type: string
          enum:
            - OWNER
            - STAFF
          description: 최초 매장 멤버십 역할입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000-\u001F\u007F]*$
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    MerchantMembershipView:
      type: object
      additionalProperties: false
      description: 점주 계정이 특정 매장에서 보유한 OWNER 또는 STAFF 멤버십입니다.
      example:
        storeId: 5273704d-f924-59e0-8883-827535fb86ad
        role: OWNER
      required:
        - storeId
        - role
      properties:
        storeId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 매장 자원을 가리키는 UUID 식별자입니다.
        role:
          type: string
          enum:
            - OWNER
            - STAFF
          description: 해당 매장에서의 OWNER 또는 STAFF 역할입니다.
    MerchantAccountView:
      type: object
      additionalProperties: false
      description: 운영자용 점주 계정 관리 뷰입니다. 계정 상태, 잠금·임시 비밀번호 만료 시각, 매장 멤버십을 제공하지만 비밀번호는 포함하지 않습니다.
      example:
        merchantAccountId: 94f51996-f0ff-5ab8-8d7e-ba8a08ffadc8
        loginId: merchant01
        displayName: 성수점 점주
        accountState: ACTIVE
        memberships:
          - storeId: 5273704d-f924-59e0-8883-827535fb86ad
            role: OWNER
      required:
        - merchantAccountId
        - loginId
        - displayName
        - accountState
        - memberships
      properties:
        merchantAccountId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 점주 계정 자원을 가리키는 UUID 식별자입니다.
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 관련 내부 자원을 가리키는 UUID 식별자입니다.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        accountState:
          type: string
          enum:
            - INITIAL_PASSWORD
            - ACTIVE
            - EXPIRED
          description: 점주 자격증명의 현재 계정 상태입니다.
        lockedUntil:
          $ref: '#/components/schemas/DateTime'
          description: 점주 계정 로그인 잠금이 유지되는 시각입니다.
        temporaryPasswordExpiresAt:
          $ref: '#/components/schemas/DateTime'
          description: 일회 표시 임시 비밀번호가 만료되는 시각입니다.
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MerchantMembershipView'
          description: 점주 계정의 활성 매장 멤버십 목록입니다.
    MerchantTemporaryPasswordResult:
      type: object
      additionalProperties: false
      description: 점주 임시 비밀번호 재설정 결과입니다. 새 자격증명은 최초 성공 응답에서만 일회 표시되며 만료 시각을 함께 제공합니다.
      example:
        merchantAccountId: 94f51996-f0ff-5ab8-8d7e-ba8a08ffadc8
        loginId: merchant01
        accountState: INITIAL_PASSWORD
        membership:
          storeId: 5273704d-f924-59e0-8883-827535fb86ad
          role: OWNER
        temporaryPassword: SAMPLE_TEMP_PASSWORD_2026_000001
        temporaryPasswordExpiresAt: '2026-08-16T09:30:00+09:00'
      required:
        - merchantAccountId
        - accountState
        - temporaryPassword
        - temporaryPasswordExpiresAt
      properties:
        merchantAccountId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 점주 계정 자원을 가리키는 UUID 식별자입니다.
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 관련 내부 자원을 가리키는 UUID 식별자입니다.
        accountState:
          const: INITIAL_PASSWORD
          description: 재설정 직후 상태이며 항상 INITIAL_PASSWORD입니다.
        membership:
          $ref: '#/components/schemas/MerchantMembershipView'
          description: 이번 응답과 관련된 매장 멤버십입니다.
        temporaryPassword:
          type: string
          pattern: ^[A-Za-z0-9_-]{32}$
          description: 최초 성공 응답에서만 한 번 표시하는 32자 임시 비밀번호입니다. 예시는 명백한 샘플 placeholder입니다.
        temporaryPasswordExpiresAt:
          $ref: '#/components/schemas/DateTime'
          description: 일회 표시 임시 비밀번호가 만료되는 시각입니다.
    MerchantAccountCreationResult:
      type: object
      additionalProperties: false
      description: 점주 계정과 최초 멤버십 생성 결과입니다. 최초 성공 응답에서만 일회 표시 임시 비밀번호와 만료 시각을 포함합니다.
      example:
        merchantAccountId: 94f51996-f0ff-5ab8-8d7e-ba8a08ffadc8
        loginId: merchant01
        accountState: INITIAL_PASSWORD
        membership:
          storeId: 5273704d-f924-59e0-8883-827535fb86ad
          role: OWNER
        temporaryPassword: SAMPLE_TEMP_PASSWORD_2026_000001
        temporaryPasswordExpiresAt: '2026-08-16T09:30:00+09:00'
      required:
        - merchantAccountId
        - loginId
        - accountState
        - membership
        - temporaryPassword
        - temporaryPasswordExpiresAt
      properties:
        merchantAccountId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 점주 계정 자원을 가리키는 UUID 식별자입니다.
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 관련 내부 자원을 가리키는 UUID 식별자입니다.
        accountState:
          const: INITIAL_PASSWORD
          description: 최초 비밀번호 변경이 필요한 계정 상태이며 항상 INITIAL_PASSWORD입니다.
        membership:
          $ref: '#/components/schemas/MerchantMembershipView'
          description: 이번 응답과 관련된 매장 멤버십입니다.
        temporaryPassword:
          type: string
          pattern: ^[A-Za-z0-9_-]{32}$
          description: 최초 성공 응답에서만 한 번 표시하는 32자 임시 비밀번호입니다. 예시는 명백한 샘플 placeholder입니다.
        temporaryPasswordExpiresAt:
          $ref: '#/components/schemas/DateTime'
          description: 일회 표시 임시 비밀번호가 만료되는 시각입니다.
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      description: 내부 자원을 가리키는 UUID 문자열 식별자입니다.
      example: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
    DateTime:
      type: string
      format: date-time
      description: 오프셋 또는 UTC 지정자를 포함한 ISO-8601 시각입니다.
      example: '2026-08-15T09:30:00+09:00'
    MoneyKrw:
      type: integer
      format: int64
      minimum: 0
      description: 음수가 아닌 정수 원(KRW) 단위 금액입니다. 소수점 금액은 사용하지 않습니다.
      example: 12500
    SignedMoneyKrw:
      type: integer
      format: int64
      description: '부호 있는 정수 원(KRW) 단위 금액입니다. 음수는 차감·회수·부담을, 양수는 증가·지급·적립을 나타낼 수 있습니다.'
      example: -3000
    Currency:
      type: string
      enum:
        - KRW
      description: 금액에 사용하는 통화 코드입니다. 현재는 원화(KRW)만 지원합니다.
      example: KRW
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, details]
      description: |
        모든 API가 공통으로 사용하는 에러 응답 형식입니다. 내부 예외명, SQL, secret,
        stack trace는 절대 포함하지 않습니다.
      example:
        code: ORDER_STATE_CONFLICT
        message: 이미 처리된 주문입니다.
        correlationId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        details: []
      properties:
        code:
          type: string
          minLength: 1
          description: 기계 판독용 에러 코드. 클라이언트 분기 처리에 사용합니다.
          example: ORDER_STATE_CONFLICT
        message:
          type: string
          minLength: 1
          description: 사람이 읽을 수 있는 에러 메시지(한국어).
          example: 이미 처리된 주문입니다.
        correlationId:
          type: string
          minLength: 1
          description: 서버 로그와 대조할 수 있는 요청 추적 ID.
          example: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        details:
          type: array
          description: 필드 단위 검증 실패 목록. 없으면 빈 배열입니다.
          items:
            $ref: "#/components/schemas/ErrorDetail"
        targetReference:
          type: string
          description: |
            안전한 재시도 계약이 명시적으로 요구할 때만 존재하는, 수렴 대상을 가리키는
            opaque 참조값입니다.
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      description: 요청 바디의 특정 필드 하나에 대한 검증 실패 사유입니다.
      example:
        field: pointsToUseKrw
        reason: 보유 포인트 잔액을 초과했습니다.
      properties:
        field:
          type: string
          description: 검증에 실패한 요청 필드 경로. 필드 단위가 아닌 실패는 생략됩니다.
          example: pointsToUseKrw
        reason:
          type: string
          minLength: 1
          description: 실패 사유(한국어).
          example: 보유 포인트 잔액을 초과했습니다.
    ReorderItemsUnavailableError:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, details]
      properties:
        code:
          const: REORDER_ITEMS_UNAVAILABLE
        message:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        details:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReorderItemFailureDetail"
    ReorderItemFailureDetail:
      type: object
      additionalProperties: false
      required: [sourceOrderLineId, lineSequence, menuId, reason]
      properties:
        sourceOrderLineId:
          $ref: "#/components/schemas/Identifier"
        lineSequence:
          type: integer
          minimum: 0
        menuId:
          $ref: "#/components/schemas/Identifier"
        optionId:
          $ref: "#/components/schemas/Identifier"
        reason:
          type: string
          enum:
            - SOURCE_OPTION_SELECTION_UNAVAILABLE
            - MENU_REMOVED
            - MENU_NOT_AVAILABLE
            - OPTION_REMOVED
            - OPTION_NOT_AVAILABLE
            - MENU_CONFIGURATION_NOT_AVAILABLE
    PageInfo:
      type: object
      additionalProperties: false
      description: 커서 기반 페이지네이션의 다음 페이지 정보를 나타냅니다.
      example:
        nextCursor: v1.sample.cursor.eyJvZmZzZXQiOjIwfQ
      properties:
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: 다음 페이지가 있을 때 서버가 반환하는 문자열입니다. 다음 요청의 `cursor`에 그대로 사용합니다.
    NearbyStorePage:
      type: object
      additionalProperties: false
      required: [items, page]
      description: 인근 매장 검색 결과 페이지입니다. 거리순, 동률 시 매장 ID순으로 정렬됩니다.
      example:
        items:
          - storeId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
            name: 빈플로우 강남점
            distanceMeters: 320
            open: true
            pickupAvailable: true
        page:
          nextCursor: eyJvIjoiZGlzdGFuY2UiLCJ2IjoiMzIwIn0
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NearbyStore"
        page:
          $ref: "#/components/schemas/PageInfo"
    NearbyStore:
      type: object
      additionalProperties: false
      required:
        [storeId, name, distanceMeters, open, pickupAvailable]
      description: 인근 매장 검색 결과에 포함되는 매장 요약 정보입니다.
      example:
        storeId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        name: 빈플로우 강남점
        distanceMeters: 320
        open: true
        pickupAvailable: true
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        distanceMeters:
          type: integer
          minimum: 0
          description: |-
            내부 마이크로미터 단위 거리를 내림한 정수 미터 표시값입니다. This is a display value, not the cursor tuple(커서 정렬에 쓰이는 튜플이 아니라 화면 표시값)입니다.
          example: 320
        open:
          type: boolean
        pickupAvailable:
          type: boolean
    MenuList:
      type: object
      additionalProperties: false
      required: [items]
      description: 매장의 현재 노출 메뉴 전체 목록입니다. 페이지가 아닌 완전한 목록입니다.
      example:
        items:
          - menuId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
            name: 아메리카노
            basePriceKrw: 4500
            currency: KRW
            available: true
            options:
              - optionId: 5c2b3e2a-1c8e-4a5c-9c0a-8f1e2d3c4b6b
                name: 샷 추가
                additionalPriceKrw: 500
                available: true
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
    Menu:
      type: object
      additionalProperties: false
      required: [menuId, name, basePriceKrw, currency, available, options]
      description: 매장이 판매하는 메뉴 하나와 선택 가능한 옵션 목록입니다.
      example:
        menuId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        name: 아메리카노
        basePriceKrw: 4500
        currency: KRW
        available: true
        options:
          - optionId: 5c2b3e2a-1c8e-4a5c-9c0a-8f1e2d3c4b6b
            name: 샷 추가
            additionalPriceKrw: 500
            available: true
      properties:
        menuId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        basePriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        available:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/MenuOption"
    MenuOption:
      type: object
      additionalProperties: false
      required: [optionId, name, additionalPriceKrw, available]
      description: 메뉴에 추가로 붙일 수 있는 옵션입니다(예 - 샷 추가, 사이즈 업).
      example:
        optionId: 5c2b3e2a-1c8e-4a5c-9c0a-8f1e2d3c4b6b
        name: 샷 추가
        additionalPriceKrw: 500
        available: true
      properties:
        optionId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        additionalPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        available:
          type: boolean
    PickupSlotList:
      type: object
      additionalProperties: false
      required: [items]
      description: 매장의 이용 가능한 픽업 슬롯 목록입니다(서버 현재 시각 이후 7일 이내).
      example:
        items:
          - pickupSlotId: 6d3c4e3b-2d9f-4b6d-ad1b-9f2e3d4c5b7c
            startsAt: "2026-08-15T10:00:00+09:00"
            endsAt: "2026-08-15T10:15:00+09:00"
            remainingCapacity: 5
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PickupSlot"
    PickupSlot:
      type: object
      additionalProperties: false
      required: [pickupSlotId, startsAt, endsAt, remainingCapacity]
      description: 특정 시간대에 픽업 가능한 잔여 수용량을 나타내는 슬롯입니다.
      example:
        pickupSlotId: 6d3c4e3b-2d9f-4b6d-ad1b-9f2e3d4c5b7c
        startsAt: "2026-08-15T10:00:00+09:00"
        endsAt: "2026-08-15T10:15:00+09:00"
        remainingCapacity: 5
      properties:
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        startsAt:
          $ref: "#/components/schemas/DateTime"
        endsAt:
          $ref: "#/components/schemas/DateTime"
        remainingCapacity:
          type: integer
          minimum: 0
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [storeId, pickupSlotId, lines, pointsToUseKrw]
      description: |
        신규 주문 생성 요청입니다. 서버 소유 장바구니가 없으므로 주문 항목 전체를 한
        번에 보냅니다. 메뉴 가격, 재고, 픽업 슬롯, 쿠폰, 포인트를 이 요청 하나의
        트랜잭션에서 모두 재검증·예약합니다.
      example:
        storeId: 9f1c2a3b-4d5e-6f70-8192-a3b4c5d6e7f8
        pickupSlotId: 1a2b3c4d-5e6f-7081-92a3-b4c5d6e7f809
        lines:
          - menuId: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
            optionIds: [e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b]
            quantity: 2
        couponIssuanceId: null
        pointsToUseKrw: 1000
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        lines:
          type: array
          minItems: 1
          description: 주문할 메뉴 목록. 최소 1개 이상이어야 합니다.
          items:
            $ref: "#/components/schemas/CreateOrderLineRequest"
        couponIssuanceId:
          $ref: "#/components/schemas/Identifier"
        pointsToUseKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CreateOrderLineRequest:
      type: object
      additionalProperties: false
      required: [menuId, optionIds, quantity]
      description: 주문 한 줄(메뉴 1종 + 옵션 조합 + 수량)입니다.
      example:
        menuId: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
        optionIds: [e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b]
        quantity: 2
      properties:
        menuId:
          $ref: "#/components/schemas/Identifier"
        optionIds:
          type: array
          uniqueItems: true
          description: 선택한 옵션 ID 목록. 정규화된 옵션 조합이 해당 메뉴에 존재해야 합니다.
          items:
            $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
          description: 수량(1 이상).
          example: 2
    ReorderOrderRequest:
      type: object
      additionalProperties: false
      required: [pickupSlotId, pointsToUseKrw]
      description: |
        재주문(reorder) 요청입니다. 메뉴 구성은 원본 주문에서 그대로 복사되므로 여기서는
        새 픽업 슬롯과 쿠폰/포인트 사용 여부만 지정합니다.
      example:
        pickupSlotId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
        couponIssuanceId: null
        pointsToUseKrw: 0
      properties:
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        couponIssuanceId:
          $ref: "#/components/schemas/Identifier"
        pointsToUseKrw:
          $ref: "#/components/schemas/MoneyKrw"
    ReorderOrderResult:
      description: |
        재주문 생성 결과입니다. 결제가 필요하면 PendingPaymentReorderOrderCreation을,
        쿠폰/포인트만으로 결제가 전액 상쇄되면 BenefitOnlyReorderOrderCreation을
        반환합니다.
      oneOf:
        - $ref: "#/components/schemas/PendingPaymentReorderOrderCreation"
        - $ref: "#/components/schemas/BenefitOnlyReorderOrderCreation"
    PendingPaymentReorderOrderCreation:
      type: object
      additionalProperties: false
      required: [order, priceComparison]
      description: 결제가 필요한(PENDING_PAYMENT) 상태로 생성된 재주문 결과입니다.
      example:
        order:
          orderId: 7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
          storeId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
          publicReference: BF-7K2M-9QRT
          pickupNumber: A-12
          pickupBusinessDate: "2026-08-15"
          storeName: 성수 1호점
          pickupWindowStart: "2026-08-15T10:00:00+09:00"
          pickupWindowEnd: "2026-08-15T10:15:00+09:00"
          state: PENDING_PAYMENT
          reservationExpiresAt: "2026-08-15T09:45:00+09:00"
          lines:
            - orderLineId: 9b7a4e2a-8b8e-1a2b-3c4d-5e6f7a8b9c0d
              menuId: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
              menuName: 아메리카노
              optionNames: [ICE]
              unitPriceKrw: 4500
              quantity: 2
              couponDiscountKrw: 0
              pointsAppliedKrw: 0
              cashPaidKrw: 9000
          subtotalKrw: 9000
          couponDiscountKrw: 0
          pointsAppliedKrw: 0
          payableKrw: 9000
          currency: KRW
          createdAt: "2026-08-15T09:30:00+09:00"
          updatedAt: "2026-08-15T09:30:00+09:00"
        priceComparison:
          hasPriceChanges: false
          sourceSubtotalKrw: 9000
          currentSubtotalKrw: 9000
          subtotalDifferenceKrw: 0
          items: []
      properties:
        order:
          $ref: "#/components/schemas/PendingPaymentOrder"
        priceComparison:
          $ref: "#/components/schemas/ReorderPriceComparison"
    BenefitOnlyReorderOrderCreation:
      type: object
      additionalProperties: false
      required: [order, payment, priceComparison]
      description: |
        쿠폰과 포인트만으로 결제가 전액 상쇄되어 별도 카드 결제 없이 바로 확정(PAID)된
        재주문 결과입니다.
      example:
        order:
          orderId: 7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
          storeId: 3fa1c2e0-9b7a-4e2a-8b8e-1a2b3c4d5e6f
          publicReference: BF-7K2M-9QRT
          pickupNumber: A-12
          pickupBusinessDate: "2026-08-15"
          storeName: 성수 1호점
          pickupWindowStart: "2026-08-15T10:00:00+09:00"
          pickupWindowEnd: "2026-08-15T10:15:00+09:00"
          state: PAID
          lines:
            - orderLineId: 9b7a4e2a-8b8e-1a2b-3c4d-5e6f7a8b9c0d
              menuId: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
              menuName: 아메리카노
              optionNames: [ICE]
              unitPriceKrw: 4500
              quantity: 2
              couponDiscountKrw: 0
              pointsAppliedKrw: 9000
              cashPaidKrw: 0
          subtotalKrw: 9000
          couponDiscountKrw: 0
          pointsAppliedKrw: 9000
          payableKrw: 0
          currency: KRW
          paidAt: "2026-08-15T09:30:00+09:00"
          createdAt: "2026-08-15T09:30:00+09:00"
          updatedAt: "2026-08-15T09:30:00+09:00"
        payment:
          paymentId: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
          orderId: 7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
          type: BENEFIT_ONLY
          approvalState: APPROVED
          approvedAmountKrw: 0
          currency: KRW
          updatedAt: "2026-08-15T09:30:00+09:00"
        priceComparison:
          hasPriceChanges: false
          sourceSubtotalKrw: 9000
          currentSubtotalKrw: 9000
          subtotalDifferenceKrw: 0
          items: []
      properties:
        order:
          $ref: "#/components/schemas/BenefitOnlyPaidOrder"
        payment:
          $ref: "#/components/schemas/BenefitOnlyPayment"
        priceComparison:
          $ref: "#/components/schemas/ReorderPriceComparison"
    ReorderPriceComparison:
      type: object
      additionalProperties: false
      required:
        - hasPriceChanges
        - sourceSubtotalKrw
        - currentSubtotalKrw
        - subtotalDifferenceKrw
        - items
      description: |
        원본 주문 시점 가격과 재주문 시점 현재 가격을 비교한 결과입니다. 메뉴/옵션
        가격이 변경됐거나 더 이상 판매하지 않는 항목이 있으면 items에 그 차이가
        나열됩니다.
      example:
        hasPriceChanges: true
        sourceSubtotalKrw: 9000
        currentSubtotalKrw: 9500
        subtotalDifferenceKrw: 500
        items:
          - sourceOrderLineId: 9b7a4e2a-8b8e-1a2b-3c4d-5e6f7a8b9c0d
            lineSequence: 0
            menuId: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
            quantity: 2
            sourceUnitPriceKrw: 4500
            currentUnitPriceKrw: 4750
            sourceLineGrossKrw: 9000
            currentLineGrossKrw: 9500
            lineDifferenceKrw: 500
      properties:
        hasPriceChanges:
          type: boolean
          description: 원본 주문과 현재 가격 사이에 하나라도 차이가 있으면 true입니다.
        sourceSubtotalKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currentSubtotalKrw:
          $ref: "#/components/schemas/MoneyKrw"
        subtotalDifferenceKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        items:
          type: array
          description: 가격이 변경된 라인만 포함하며, 원본 주문의 lineSequence 순서로 정렬됩니다.
          items:
            $ref: "#/components/schemas/ReorderLinePriceChange"
    ReorderLinePriceChange:
      type: object
      additionalProperties: false
      required:
        - sourceOrderLineId
        - lineSequence
        - menuId
        - quantity
        - sourceUnitPriceKrw
        - currentUnitPriceKrw
        - sourceLineGrossKrw
        - currentLineGrossKrw
        - lineDifferenceKrw
      description: 재주문 시점에 가격이 변경된 원본 주문 라인 하나에 대한 상세 비교입니다.
      example:
        sourceOrderLineId: 9b7a4e2a-8b8e-1a2b-3c4d-5e6f7a8b9c0d
        lineSequence: 0
        menuId: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
        quantity: 2
        sourceUnitPriceKrw: 4500
        currentUnitPriceKrw: 4750
        sourceLineGrossKrw: 9000
        currentLineGrossKrw: 9500
        lineDifferenceKrw: 500
      properties:
        sourceOrderLineId:
          $ref: "#/components/schemas/Identifier"
        lineSequence:
          type: integer
          minimum: 0
        menuId:
          $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
        sourceUnitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currentUnitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        sourceLineGrossKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currentLineGrossKrw:
          $ref: "#/components/schemas/MoneyKrw"
        lineDifferenceKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
    CreateOrderResult:
      description: |
        주문 생성 결과입니다. 결제할 금액이 남아 있으면 `PendingPaymentOrderCreation`(주문만
        생성, 별도 결제 승인 필요)을, 쿠폰·포인트만으로 결제가 끝나면
        `BenefitOnlyOrderCreation`(주문과 결제가 함께 확정)을 반환합니다.
      oneOf:
        - $ref: "#/components/schemas/PendingPaymentOrderCreation"
        - $ref: "#/components/schemas/BenefitOnlyOrderCreation"
    PendingPaymentOrderCreation:
      type: object
      additionalProperties: false
      required: [order]
      description: 결제할 금액이 남아 있는 주문 생성 결과입니다. 별도의 결제 승인 API를 이어서 호출해야 합니다.
      properties:
        order:
          $ref: "#/components/schemas/PendingPaymentOrder"
    BenefitOnlyOrderCreation:
      type: object
      additionalProperties: false
      required: [order, payment]
      description: 쿠폰·포인트만으로 결제가 즉시 완료된 주문 생성 결과입니다. 결제 금액은 0원입니다.
      properties:
        order:
          $ref: "#/components/schemas/BenefitOnlyPaidOrder"
        payment:
          $ref: "#/components/schemas/BenefitOnlyPayment"
    PendingPaymentOrder:
      description: 결제 대기 상태(`PENDING_PAYMENT`)로 생성된 주문입니다. 예약이 만료되기 전에 결제를 완료해야 합니다.
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [reservationExpiresAt]
          properties:
            state:
              const: PENDING_PAYMENT
            reservationExpiresAt:
              $ref: "#/components/schemas/DateTime"
              description: 이 시각까지 결제를 완료하지 않으면 예약과 주문이 만료됩니다.
            payableKrw:
              type: integer
              format: int64
              minimum: 1
              description: 결제해야 할 남은 금액(원). 1원 이상입니다.
    BenefitOnlyPaidOrder:
      description: 쿠폰·포인트만으로 결제가 즉시 확정된(`PAID`) 주문입니다. 결제할 현금이 없습니다.
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          not:
            required: [reservationExpiresAt]
          properties:
            state:
              const: PAID
            payableKrw:
              const: 0
              description: 쿠폰·포인트로 전액 결제되어 결제할 현금이 없습니다(항상 0).
    Order:
      type: object
      additionalProperties: false
      description: |-
        고객에게 제공하는 주문 전체 정보입니다. 주문 당시 메뉴·옵션·가격, 결제 금액, 현재 상태와 실제로 발생한 상태 변경 시각을 포함합니다.
      required:
        - orderId
        - storeId
        - publicReference
        - pickupNumber
        - pickupBusinessDate
        - storeName
        - pickupWindowStart
        - pickupWindowEnd
        - state
        - lines
        - subtotalKrw
        - couponDiscountKrw
        - pointsAppliedKrw
        - payableKrw
        - currency
        - createdAt
        - updatedAt
      example:
        orderId: 74131bb9-688f-5370-8042-21015b3cd43a
        storeId: 5273704d-f924-59e0-8883-827535fb86ad
        publicReference: BF-7K4M-Q2XZ
        pickupNumber: A-12
        pickupBusinessDate: '2026-08-15'
        storeName: 빈플로우 성수점
        pickupWindowStart: '2026-08-15T10:00:00+09:00'
        pickupWindowEnd: '2026-08-15T10:15:00+09:00'
        state: ACCEPTED
        lines:
          - orderLineId: 30481d44-61d4-5f68-8f8b-a4d7064f4ddd
            menuId: df0b93c6-ceb2-57d2-9f0f-8949c2db2642
            menuName: 아이스 아메리카노
            optionNames:
              - 샷 추가
            unitPriceKrw: 4500
            quantity: 2
            couponDiscountKrw: 1000
            pointsAppliedKrw: 500
            cashPaidKrw: 7500
        subtotalKrw: 9000
        couponDiscountKrw: 1000
        pointsAppliedKrw: 500
        payableKrw: 7500
        currency: KRW
        paidAt: '2026-08-15T09:31:00+09:00'
        acceptanceDeadlineAt: '2026-08-15T09:36:00+09:00'
        acceptedAt: '2026-08-15T09:33:00+09:00'
        createdAt: '2026-08-15T09:30:00+09:00'
        updatedAt: '2026-08-15T09:33:00+09:00'
      properties:
        orderId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 주문 자원을 가리키는 UUID 식별자입니다.
        storeId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 매장 자원을 가리키는 UUID 식별자입니다.
        publicReference:
          type: string
          pattern: ^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$
          description: 고객·점주 화면에서 사용하는 BF-XXXX-XXXX 형식의 공개 주문 참조번호입니다.
        pickupNumber:
          type: string
          pattern: ^A-[1-9][0-9]*$
          description: 해당 영업일 매장에서 호출하는 A-숫자 형식의 픽업 번호입니다.
        pickupBusinessDate:
          type: string
          format: date
          description: 매장 영업일 기준 픽업 날짜입니다.
        storeName:
          type: string
          minLength: 1
          maxLength: 200
        pickupWindowStart:
          $ref: '#/components/schemas/DateTime'
          description: 고객이 선택한 픽업 가능 구간의 시작 시각입니다.
        pickupWindowEnd:
          $ref: '#/components/schemas/DateTime'
          description: 고객이 선택한 픽업 가능 구간의 종료 시각입니다.
        state:
          $ref: '#/components/schemas/OrderState'
          description: 주문의 현재 상태입니다.
        reservationExpiresAt:
          $ref: '#/components/schemas/DateTime'
          description: 결제 대기 예약이 만료되는 시각입니다.
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
          description: 주문에 포함된 주문 항목 목록입니다.
        subtotalKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 할인과 포인트 적용 전 주문 항목 합계 금액입니다.
        couponDiscountKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 쿠폰으로 할인된 금액입니다.
        pointsAppliedKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 주문 결제에 사용된 포인트 금액입니다.
        payableKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 쿠폰과 포인트 적용 후 현금으로 결제할 금액입니다.
        currency:
          $ref: '#/components/schemas/Currency'
          description: 금액 필드에 적용되는 통화입니다.
        paymentRecovery:
          $ref: '#/components/schemas/CancellationRefundRecoverySummary'
          description: 고객 취소 상태에서 노출되는 환불 복구 요약입니다.
        paidAt:
          $ref: '#/components/schemas/DateTime'
          description: 결제 승인으로 주문이 PAID가 된 시각입니다.
        acceptanceWarningAt:
          $ref: '#/components/schemas/DateTime'
          description: 매장 수락 지연 경고 기준 시각입니다.
        acceptanceWarningRequestedAt:
          $ref: '#/components/schemas/DateTime'
          description: 수락 지연 경고 알림을 요청한 시각입니다.
        acceptanceDeadlineAt:
          $ref: '#/components/schemas/DateTime'
          description: 매장이 주문을 수락해야 하는 마감 시각입니다.
        acceptedAt:
          $ref: '#/components/schemas/DateTime'
          description: 매장이 주문을 수락한 시각입니다.
        rejectedAt:
          $ref: '#/components/schemas/DateTime'
          description: 매장이 주문을 거절한 시각입니다.
        preparingAt:
          $ref: '#/components/schemas/DateTime'
          description: 주문 제조가 시작된 시각입니다.
        readyAt:
          $ref: '#/components/schemas/DateTime'
          description: 주문이 픽업 준비 완료 상태가 된 시각입니다.
        completedAt:
          $ref: '#/components/schemas/DateTime'
          description: 주문 픽업 또는 정산 대상 거래가 완료된 시각입니다.
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 500
          description: 매장이 주문을 거절한 사람이 읽을 수 있는 사유입니다.
        cancelledAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: 'state가 CANCELLED일 때만 존재하며 주문 취소 모델(ADR-029)에 따라 cancellationCause와 함께 요구되는 취소 시각입니다.'
        cancellationCause:
          allOf:
            - $ref: '#/components/schemas/CancellationCause'
          description: 'state가 CANCELLED일 때만 존재하는 시스템 판정 취소 원인입니다. 고객이 선택한 사유 코드와 독립적입니다.'
        cancellationReasonCode:
          allOf:
            - $ref: '#/components/schemas/CancellationReasonCode'
          description: |
            cancellationCause가 CUSTOMER_REQUEST일 때만 고객 조회용 응답에 노출되는 구조화된 취소 사유입니다. 매장 조회용 응답과 자유 입력 상세에는 노출하지 않습니다.
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 생성된 시각입니다.
        updatedAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 마지막으로 변경된 시각입니다.
    OrderState:
      type: string
      description: 주문의 현재 생명주기 상태를 나타내는 열거형입니다.
      example: ACCEPTED
      enum:
        - PENDING_PAYMENT
        - PAID
        - ACCEPTED
        - PREPARING
        - READY
        - COMPLETED
        - EXPIRED
        - CANCELLED
        - REJECTED
    OrderLine:
      type: object
      additionalProperties: false
      description: 주문 당시 메뉴와 옵션, 단가, 수량, 할인·포인트·현금 배분 금액을 저장한 주문 항목입니다.
      example:
        orderLineId: 30481d44-61d4-5f68-8f8b-a4d7064f4ddd
        menuId: df0b93c6-ceb2-57d2-9f0f-8949c2db2642
        menuName: 아이스 아메리카노
        optionNames:
          - 샷 추가
        unitPriceKrw: 4500
        quantity: 2
        couponDiscountKrw: 1000
        pointsAppliedKrw: 500
        cashPaidKrw: 7500
      required:
        - orderLineId
        - menuId
        - menuName
        - optionNames
        - unitPriceKrw
        - quantity
        - couponDiscountKrw
        - pointsAppliedKrw
        - cashPaidKrw
      properties:
        orderLineId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 주문 항목 자원을 가리키는 UUID 식별자입니다.
        menuId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 메뉴 자원을 가리키는 UUID 식별자입니다.
        menuName:
          type: string
          minLength: 1
        optionNames:
          type: array
          items:
            type: string
          description: 주문 시점에 고정된 선택 옵션 이름 목록입니다.
        unitPriceKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 주문 시점에 고정된 메뉴 한 개의 단가입니다.
        quantity:
          type: integer
          minimum: 1
        couponDiscountKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 쿠폰으로 할인된 금액입니다.
        pointsAppliedKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 주문 결제에 사용된 포인트 금액입니다.
        cashPaidKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 해당 주문 항목에 배분된 현금 결제 금액입니다.
    CancellationRequest:
      type: object
      additionalProperties: false
      description: |-
        주문 취소 요청입니다. 취소 사유 코드는 필수입니다. 선택 입력한 상세 사유는 주문 기록에만 저장하고 로그, 이벤트, 외부 결제사 요청, API 응답에는 포함하지 않습니다.
      example:
        reasonCode: CHANGED_MIND
        detail: 픽업 시간에 방문하기 어려워졌습니다.
      required:
        - reasonCode
      properties:
        reasonCode:
          $ref: '#/components/schemas/CancellationReasonCode'
          description: API에서 정한 사유 코드입니다.
        detail:
          type: string
          pattern: ^[^\u0000-\u001F\u007F]*$
          description: |
            고객이 입력하는 선택적 상세 설명입니다. The server trims it before validation
            (서버가 검증 전에 앞뒤 공백을 제거합니다). An empty normalized value is treated as
            absent(trim 결과가 빈 문자열이면 미입력으로 처리), a present normalized value must
            contain 1 to 200 characters(존재하면 1~200자). Control characters are rejected
            (제어문자는 거부됩니다). 주문에만 저장하고 이벤트·감사·외부 결제사 요청·로그·API
            응답에는 넣지 않습니다.
    CancellationReasonCode:
      type: string
      description: 고객이 선택한 주문 취소 사유입니다. 시스템이 기록하는 취소 원인과 별도로 사용됩니다.
      example: CHANGED_MIND
      enum:
        - CHANGED_MIND
        - ORDER_MISTAKE
        - WAIT_TOO_LONG
        - PICKUP_TIME_CONFLICT
        - PAYMENT_ISSUE
        - OTHER
    CancellationCause:
      type: string
      description: |
        주문이 취소된 직접 원인입니다. `CUSTOMER_REQUEST`는 고객 요청, `SUPPORT_REQUEST`는 고객센터 처리, `PAYMENT_DECLINED`는 결제 승인 거절을 뜻합니다.
      example: CUSTOMER_REQUEST
      enum:
        - CUSTOMER_REQUEST
        - PAYMENT_DECLINED
        - SUPPORT_REQUEST
    StoreOrder:
      description: '스토어 화면에 제공하는 주문 정보입니다. 주문 취소 사실과 원인은 보여 주지만 고객이 입력한 취소 상세와 고객 전용 환불 진행 정보는 제외합니다.'
      example:
        orderId: 74131bb9-688f-5370-8042-21015b3cd43a
        storeId: 5273704d-f924-59e0-8883-827535fb86ad
        publicReference: BF-7K4M-Q2XZ
        pickupNumber: A-12
        pickupBusinessDate: '2026-08-15'
        storeName: 빈플로우 성수점
        pickupWindowStart: '2026-08-15T10:00:00+09:00'
        pickupWindowEnd: '2026-08-15T10:15:00+09:00'
        state: CANCELLED
        lines:
          - orderLineId: 30481d44-61d4-5f68-8f8b-a4d7064f4ddd
            menuId: df0b93c6-ceb2-57d2-9f0f-8949c2db2642
            menuName: 아이스 아메리카노
            optionNames:
              - 샷 추가
            unitPriceKrw: 4500
            quantity: 2
            couponDiscountKrw: 1000
            pointsAppliedKrw: 500
            cashPaidKrw: 7500
        subtotalKrw: 9000
        couponDiscountKrw: 1000
        pointsAppliedKrw: 500
        payableKrw: 7500
        currency: KRW
        cancelledAt: '2026-08-15T09:35:00+09:00'
        cancellationCause: CUSTOMER_REQUEST
        createdAt: '2026-08-15T09:30:00+09:00'
        updatedAt: '2026-08-15T09:35:00+09:00'
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          not:
            anyOf:
              - required:
                  - cancellationReasonCode
              - required:
                  - paymentRecovery
    StoreOrderResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/StoreCompensationSummary"
    StoreCompensationSummary:
      type: object
      additionalProperties: false
      description: |-
        주문 거절이나 고객 취소 뒤 환불·재고·쿠폰·포인트 복구가 어디까지 진행됐는지 스토어에 보여 주는 요약입니다. 내부 오류와 재시도 횟수는 포함하지 않습니다.
      example:
        trigger: CUSTOMER_CANCELLATION
        state: SUCCEEDED
        updatedAt: '2026-08-15T09:38:00+09:00'
      required:
        - trigger
        - state
        - updatedAt
      properties:
        trigger:
          type: string
          enum:
            - STORE_REJECTION
            - CUSTOMER_CANCELLATION
          description: 보상을 시작하게 한 주문 종료 원인입니다.
        state:
          type: string
          enum:
            - PROCESSING
            - RETRY_SCHEDULED
            - UNKNOWN
            - SUCCEEDED
            - MANUAL_REVIEW
          description: 매장에 노출되는 보상 처리 상태입니다.
        updatedAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 마지막으로 변경된 시각입니다.
    CompensationSummary:
      type: object
      additionalProperties: false
      description: |
        주문 취소나 거절 뒤 진행되는 전체 후속 처리 상태입니다. 환불, 픽업 예약 해제, 재고 복구, 쿠폰·포인트 반환, 고객 알림의 단계별 상태와 시도 횟수를 운영팀에 제공합니다. 주문이 종료됐다고 모든 후속 처리가 끝난 것은 아닙니다.
      example:
        caseId: f33f27d6-8e6c-5712-8567-154b01cbb087
        trigger: STORE_REJECTION
        benefitPolicies:
          - benefitType: COUPON
            policyVersionId: 21
          - benefitType: POINTS
            policyVersionId: 34
        state: PROCESSING
        steps:
          - type: PAYMENT
            state: SUCCEEDED
            attemptCount: 1
          - type: PICKUP
            state: SUCCEEDED
            attemptCount: 1
          - type: STOCK
            state: SUCCEEDED
            attemptCount: 1
          - type: COUPON
            state: PROCESSING
            attemptCount: 1
          - type: POINTS
            state: NOT_REQUIRED
            attemptCount: 0
          - type: CUSTOMER_NOTIFICATION
            state: RETRY_SCHEDULED
            attemptCount: 2
            lastErrorCode: PROVIDER_TIMEOUT
        updatedAt: '2026-08-15T09:45:00+09:00'
      required:
        - caseId
        - trigger
        - benefitPolicies
        - state
        - steps
        - updatedAt
      properties:
        caseId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 케이스 자원을 가리키는 UUID 식별자입니다.
        trigger:
          type: string
          enum:
            - STORE_REJECTION
            - CUSTOMER_CANCELLATION
          description: 후속 처리 건를 시작한 주문 종료 원인입니다.
        benefitPolicies:
          type: array
          minItems: 2
          maxItems: 2
          description: 케이스 생성 시 선택해 변경되지 않는 COUPON·POINTS 정책 버전 참조 두 개입니다.
          items:
            $ref: '#/components/schemas/CompensationBenefitPolicyReference'
        state:
          type: string
          enum:
            - PROCESSING
            - RETRY_SCHEDULED
            - UNKNOWN
            - SUCCEEDED
            - MANUAL_REVIEW
          description: 전체 후속 처리 건의 현재 상태입니다.
        steps:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/CompensationStep'
          description: PAYMENT, PICKUP, STOCK, COUPON, POINTS, CUSTOMER_NOTIFICATION 여섯 단계의 상세입니다.
        updatedAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 마지막으로 변경된 시각입니다.
    OperatorCompensationView:
      type: object
      additionalProperties: false
      description: Platform-operator-only compensation and payment setup integrity view
      required: [compensation]
      properties:
        compensation:
          $ref: "#/components/schemas/CompensationSummary"
        paymentSetupIssue:
          $ref: "#/components/schemas/PaymentSetupIssue"
        setupReprocessingCaseId:
          $ref: "#/components/schemas/Identifier"
    PaymentSetupIssue:
      type: object
      additionalProperties: false
      description: Operator-only integrity issue; never returned in customer or store representations
      required: [state, detectedAt, lastErrorCode]
      anyOf:
        - required: [missingArtifacts]
        - required: [invariantViolations]
      properties:
        state:
          const: SETUP_INCOMPLETE
        missingArtifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CANCELLATION_REFUND, PAYMENT_RECOVERY_SNAPSHOT]
        invariantViolations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [SOURCE_MISMATCH, AMOUNT_TIE_OUT_MISMATCH]
        detectedAt:
          $ref: "#/components/schemas/DateTime"
        lastErrorCode:
          type: string
    CustomerCancellationRefundReconciliationRequest:
      type: object
      additionalProperties: false
      description: 고객 취소 환불 결과를 외부 결제사에 다시 확인하도록 예약할 때 보내는 요청입니다. 운영 사유만 입력하며 새로운 환불 요청은 보내지 않습니다.
      example:
        reason: 외부 결제사 결과를 확인할 수 없어 기존 결제 식별값으로 결과 조회를 예약함
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\u0000-\u001F\u007F]*$
          description: '변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.'
    CustomerCancellationRefundReconciliation:
      type: object
      additionalProperties: false
      description: 고객 취소 환불 상태 재확인 작업입니다. 대상 주문과 취소 당시 주문 버전, 현재 작업 상태, 예약 시각을 포함하며 이 응답 자체가 환불 성공을 뜻하지는 않습니다.
      example:
        operationId: 3992a89d-db2e-5f8d-88f6-a834d801d378
        orderId: 74131bb9-688f-5370-8042-21015b3cd43a
        cancellationOrderVersion: 8
        state: LOOKUP_SCHEDULED
        scheduledAt: '2026-08-15T11:00:00+09:00'
      required:
        - operationId
        - orderId
        - cancellationOrderVersion
        - state
        - scheduledAt
      properties:
        operationId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 운영 작업 자원을 가리키는 UUID 식별자입니다.
        orderId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 주문 자원을 가리키는 UUID 식별자입니다.
        cancellationOrderVersion:
          type: integer
          format: int64
          minimum: 1
          description: 결과 재확인 예약이 연결된 취소 완료 주문 버전입니다.
        state:
          const: LOOKUP_SCHEDULED
          description: 결과 재확인 작업 상태이며 항상 결과 조회_SCHEDULED입니다.
        scheduledAt:
          $ref: '#/components/schemas/DateTime'
          description: 조회 또는 결과 재확인 작업이 예약된 시각입니다.
    CompensationBenefitPolicyReference:
      type: object
      additionalProperties: false
      description: 주문 보상에 실제로 사용한 쿠폰 또는 포인트 복원 정책의 버전 정보입니다.
      example:
        benefitType: COUPON
        policyVersionId: 21
      required:
        - benefitType
        - policyVersionId
      properties:
        benefitType:
          type: string
          enum:
            - COUPON
            - POINTS
          description: 참조하는 혜택 정책 유형입니다.
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 케이스 생성 시 선택해 고정한 정책 버전 ID입니다.
    CompensationStep:
      type: object
      additionalProperties: false
      description: 주문 취소·거절 뒤 처리해야 하는 환불, 픽업 예약, 재고, 쿠폰, 포인트, 고객 알림 중 한 단계의 상태입니다. 현재 상태, 시도 횟수와 선택적인 최근 오류 
        코드를 포함합니다.
      example:
        type: PAYMENT
        state: SUCCEEDED
        attemptCount: 1
      required:
        - type
        - state
        - attemptCount
      properties:
        type:
          type: string
          enum:
            - PAYMENT
            - PICKUP
            - STOCK
            - COUPON
            - POINTS
            - CUSTOMER_NOTIFICATION
          description: 환불, 픽업 예약, 재고, 쿠폰, 포인트, 고객 알림 중 어떤 복구 단계인지 나타냅니다.
        state:
          type: string
          enum:
            - PROCESSING
            - RETRY_SCHEDULED
            - UNKNOWN
            - SUCCEEDED
            - NOT_REQUIRED
            - MANUAL_REVIEW
          description: 해당 보상 단계의 현재 처리 상태입니다.
        attemptCount:
          type: integer
          minimum: 0
          description: 현재 단계에서 수행한 처리 시도 횟수입니다.
        lastErrorCode:
          type: string
          description: 최근 실패의 내부 오류 코드이며 실패가 없으면 생략됩니다.
    CreateRepairProposalRequest:
      type: object
      additionalProperties: false
      description: 고객 취소 환불 처리 정보가 누락된 건의 복구를 제안하는 요청입니다. 운영 사유만 입력하며 금액과 식별자는 서버에 남아 있는 검증된 기록에서 계산합니다.
      example:
        reason: 주문 취소는 저장됐지만 환불 처리 정보가 누락되어 복구가 필요함
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    RepairProposalDecisionRequest:
      type: object
      additionalProperties: false
      description: 복구 제안을 승인 또는 반려하는 요청입니다. 결정과 운영 사유를 포함합니다.
      example:
        decision: APPROVE
        reason: 남아 있는 주문·결제 기록과 금액 배분을 확인해 승인함
      required:
        - decision
        - reason
      properties:
        decision:
          type: string
          enum:
            - APPROVE
            - REJECT
          description: 복구 제안에 대한 승인 또는 반려 결정입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    RepairProposal:
      type: object
      additionalProperties: false
      description: 누락된 고객 취소 환불 처리 정보를 복구하기 위한 제안입니다. 제안자와 결정자를 분리하며, 현재 상태, 만료 시각, 결정 시각과 추적 ID를 포함합니다.
      example:
        proposalId: bddf20a0-f416-5e9c-8fb7-4c66cbd7ccf0
        caseId: f33f27d6-8e6c-5712-8567-154b01cbb087
        action: RECREATE_MISSING_CANCELLATION_REFUND
        state: PENDING_APPROVAL
        proposedBy: a42e8b90-20ff-5d72-be1f-cf0342d86aa4
        createdAt: '2026-08-15T13:00:00+09:00'
        expiresAt: '2026-08-15T13:30:00+09:00'
        correlationId: a522646e-e48c-5168-a01d-72909c2806a8
      required:
        - proposalId
        - caseId
        - action
        - state
        - proposedBy
        - createdAt
        - expiresAt
        - correlationId
      properties:
        proposalId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 복구 제안 자원을 가리키는 UUID 식별자입니다.
        caseId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 케이스 자원을 가리키는 UUID 식별자입니다.
        action:
          const: RECREATE_MISSING_CANCELLATION_REFUND
          description: 제안이 수행하려는 허용된 복구 작업입니다.
        state:
          type: string
          enum:
            - PENDING_APPROVAL
            - EXECUTED
            - REJECTED
            - EXPIRED
            - STALE
          description: 복구 제안의 승인 생명주기 상태입니다.
        proposedBy:
          $ref: '#/components/schemas/Identifier'
        decidedBy:
          $ref: '#/components/schemas/Identifier'
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 생성된 시각입니다.
        expiresAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스, 요청, 권한 또는 정책 판단이 만료되는 시각입니다.
        decidedAt:
          $ref: '#/components/schemas/DateTime'
          description: 승인·조사 결정이 확정된 시각이며 아직 결정되지 않았으면 null입니다.
        correlationId:
          type: string
          description: 서버 로그와 관련 작업을 함께 찾을 때 사용하는 요청 추적 ID입니다.
    ExpiredBenefitRestorationPolicy:
      type: object
      additionalProperties: false
      description: |
        주문 취소·거절·부분 환불 때 이미 만료된 쿠폰이나 포인트를 다시 제공할지 정하는 정책 버전입니다. 발생 원인, 혜택 종류, 복원 방식, 새 유효기간, 적용 시각과 변경자를 기록합니다.
      example:
        policyVersionId: 18
        trigger: CUSTOMER_CANCELLATION
        benefitType: COUPON
        mode: COMPENSATE_WITH_NEW_ISSUANCE
        compensationValidityDays: 30
        effectiveAt: '2026-08-15T00:00:00+09:00'
        updatedBy: 2adb4fce-d737-5c9a-ada4-d321f1d1c47e
        reason: 취소 시 만료 쿠폰을 30일 유효 신규 쿠폰으로 보상함
      required:
        - policyVersionId
        - trigger
        - benefitType
        - mode
        - compensationValidityDays
        - effectiveAt
        - updatedBy
        - reason
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 생성 후 바뀌지 않는 정책 버전을 가리키는 식별자입니다.
        trigger:
          type: string
          enum:
            - STORE_REJECTION
            - CUSTOMER_CANCELLATION
            - PARTIAL_REFUND
          description: 이 정책을 선택하는 보상 또는 환불 발생 원인입니다.
        benefitType:
          type: string
          enum:
            - COUPON
            - POINTS
          description: 복원 대상 혜택 유형입니다. PARTIAL_REFUND에서는 POINTS만 허용됩니다.
        mode:
          type: string
          enum:
            - COMPENSATE_WITH_NEW_ISSUANCE
            - PRESERVE_ORIGINAL_EXPIRY
          description: 새 보상 발급 또는 원래 만료 유지 중 복원 방식을 선택합니다.
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
          description: 새 보상 발급 방식에서 적용하는 유효일수입니다.
        effectiveAt:
          $ref: '#/components/schemas/DateTime'
          description: 정책 버전이 효력을 갖기 시작한 시각입니다.
        updatedBy:
          $ref: '#/components/schemas/Identifier'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
      allOf:
        - if:
            properties:
              trigger:
                const: PARTIAL_REFUND
            required:
              - trigger
          then:
            properties:
              benefitType:
                const: POINTS
    UpdateExpiredBenefitRestorationPolicyRequest:
      type: object
      additionalProperties: false
      description: 만료 혜택 복원 정책의 새 버전을 만드는 요청입니다. 현재 버전 ID, 복원 방식, 보상 유효일수, 변경 사유를 포함합니다.
      example:
        expectedPolicyVersionId: 18
        mode: COMPENSATE_WITH_NEW_ISSUANCE
        compensationValidityDays: 45
        reason: 고객 보상 쿠폰 유효기간을 45일로 연장함
      required:
        - expectedPolicyVersionId
        - mode
        - compensationValidityDays
        - reason
      properties:
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 화면에서 확인한 현재 정책 버전 ID입니다. 서버의 현재 버전과 다르면 409를 반환합니다.
        mode:
          type: string
          enum:
            - COMPENSATE_WITH_NEW_ISSUANCE
            - PRESERVE_ORIGINAL_EXPIRY
          description: 새 정책 버전의 만료 혜택 복원 방식입니다.
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
          description: 새 발급 보상 혜택의 유효일수입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    OrdinaryPointAccrualPolicyVersion:
      type: object
      additionalProperties: false
      description: 전체 기본 정책 또는 매장별 정책의 한 버전입니다. 매장별 설정을 직접 지정했는지, 전체 기본 정책을 따르는지, 언제부터 적용되는지와 변경 사유를 기록합니다.
      example:
        policyVersionId: 12
        scopeType: GLOBAL
        scopeReference: d6578ecd-7fe4-5493-92e0-bebde2fbcd13
        state: OVERRIDE
        accrualRateBps: 500
        roundingMode: FLOOR
        issuerType: PLATFORM
        issuerReference: platform:beanflow
        expiryRule: SEOUL_CALENDAR_DAYS_FROM_COMPLETION
        validityDays: 365
        effectiveAt: '2026-08-15T00:00:00+09:00'
        actorType: PLATFORM_OPERATOR
        actorReference: ff5babc0-a7e5-5776-a6cc-97f550f8ed7c
        reason: 일반 주문 적립률을 5%로 설정함
      required:
        - policyVersionId
        - scopeType
        - scopeReference
        - state
        - effectiveAt
        - actorType
        - actorReference
        - reason
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 생성 후 바뀌지 않는 정책 버전을 가리키는 식별자입니다.
        scopeType:
          type: string
          enum:
            - GLOBAL
            - STORE
          description: 정책이 적용되는 GLOBAL 또는 STORE 범위입니다.
        scopeReference:
          type: string
          format: uuid
          description: 외부 원문이나 민감정보 대신 사용하는 외부 시스템용 식별값 문자열입니다.
        state:
          type: string
          enum:
            - OVERRIDE
            - INHERIT_GLOBAL
          description: STORE 범위의 명시적 재정의 또는 GLOBAL 상속 상태입니다.
        accrualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: 10000을 100%로 계산하는 비율입니다.
        roundingMode:
          type: string
          enum:
            - FLOOR
            - HALF_UP
          description: 금액 또는 포인트 계산의 반올림 방식입니다.
        issuerType:
          type: string
          enum:
            - PLATFORM
            - BRAND
            - STORE
          description: 발행 또는 비용 책임 주체의 유형입니다.
        issuerReference:
          type: string
          minLength: 1
          maxLength: 240
          description: 포인트 발행 비용을 부담하는 플랫폼, 브랜드 또는 매장을 가리키는 식별값입니다.
        expiryRule:
          type: string
          enum:
            - EXACT_DURATION_FROM_COMPLETION
            - SEOUL_CALENDAR_DAYS_FROM_COMPLETION
          description: 만료 시각을 계산하는 규칙입니다.
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        effectiveAt:
          $ref: '#/components/schemas/DateTime'
          description: 정책 버전이 효력을 갖기 시작한 시각입니다.
        actorType:
          type: string
          enum:
            - PLATFORM_OPERATOR
            - SYSTEM
          description: 이 정책 버전을 만든 변경 주체 유형입니다.
        actorReference:
          type: string
          minLength: 1
          maxLength: 500
          description: 외부 원문이나 민감정보 대신 사용하는 외부 시스템용 식별값 문자열입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    OrdinaryPointAccrualPolicySnapshot:
      type: object
      additionalProperties: false
      description: 주문 완료 시 실제 적용한 포인트 적립 정책을 당시 값으로 저장한 기록입니다. 어떤 범위의 정책을 선택했는지와 계산에 사용한 설정, 정책 내용의 해시값을 포함합니다.
      example:
        policyVersionId: 12
        scopeType: GLOBAL
        scopeReference: d6578ecd-7fe4-5493-92e0-bebde2fbcd13
        accrualRateBps: 500
        roundingMode: FLOOR
        issuerType: PLATFORM
        issuerReference: platform:beanflow
        expiryRule: SEOUL_CALENDAR_DAYS_FROM_COMPLETION
        validityDays: 365
        canonicalPolicyHash: e7b5a3f1d9c7b5a4f2e0d8c6b4a2f1e9d7c5b3a1f0e8d6c4b2a9f7e5d3c1b0a8
      required:
        - policyVersionId
        - scopeType
        - scopeReference
        - accrualRateBps
        - roundingMode
        - issuerType
        - issuerReference
        - expiryRule
        - validityDays
        - canonicalPolicyHash
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 생성 후 바뀌지 않는 정책 버전을 가리키는 식별자입니다.
        scopeType:
          type: string
          enum:
            - GLOBAL
            - STORE
          description: 실제 선택된 정책 범위 유형입니다.
        scopeReference:
          type: string
          format: uuid
          description: 외부 원문이나 민감정보 대신 사용하는 외부 시스템용 식별값 문자열입니다.
        accrualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: 10000을 100%로 계산하는 비율입니다.
        roundingMode:
          type: string
          enum:
            - FLOOR
            - HALF_UP
          description: 금액 또는 포인트 계산의 반올림 방식입니다.
        issuerType:
          type: string
          enum:
            - PLATFORM
            - BRAND
            - STORE
          description: 발행 또는 비용 책임 주체의 유형입니다.
        issuerReference:
          type: string
          minLength: 1
          maxLength: 240
          description: 포인트 발행 비용을 부담하는 플랫폼, 브랜드 또는 매장을 가리키는 식별값입니다.
        expiryRule:
          type: string
          enum:
            - EXACT_DURATION_FROM_COMPLETION
            - SEOUL_CALENDAR_DAYS_FROM_COMPLETION
          description: 만료 시각을 계산하는 규칙입니다.
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        canonicalPolicyHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 주문 완료 시 적용한 정책 내용이 바뀌지 않았는지 확인하는 SHA-256 해시값입니다.
    OrdinaryPointAccrualPolicyPage:
      type: object
      additionalProperties: false
      description: 포인트 적립 정책의 현재 설정 또는 변경 이력과 다음 페이지 정보를 담는 응답입니다.
      example:
        items:
          - policyVersionId: 12
            scopeType: GLOBAL
            scopeReference: d6578ecd-7fe4-5493-92e0-bebde2fbcd13
            state: OVERRIDE
            accrualRateBps: 500
            roundingMode: FLOOR
            issuerType: PLATFORM
            issuerReference: platform:beanflow
            expiryRule: SEOUL_CALENDAR_DAYS_FROM_COMPLETION
            validityDays: 365
            effectiveAt: '2026-08-15T00:00:00+09:00'
            actorType: PLATFORM_OPERATOR
            actorReference: ff5babc0-a7e5-5776-a6cc-97f550f8ed7c
            reason: 일반 주문 적립률을 5%로 설정함
        page:
          nextCursor: null
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrdinaryPointAccrualPolicyVersion'
          description: 현재 페이지에 포함된 리소스 목록입니다.
        page:
          $ref: '#/components/schemas/OrdinaryPointAccrualPolicyPageInfo'
          description: 다음 페이지 커서 등 페이지네이션 정보입니다.
    OrdinaryPointAccrualPolicyPageInfo:
      type: object
      additionalProperties: false
      description: 일반 포인트 적립 정책 목록의 다음 페이지 커서입니다.
      example:
        nextCursor: null
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 2048
          description: 다음 페이지가 있을 때 서버가 반환하는 문자열입니다. 다음 요청의 `cursor`에 그대로 사용합니다.
    StoreOrdinaryPointAccrualPolicy:
      type: object
      additionalProperties: false
      description: 특정 매장의 저장된 정책과 전체 기본 정책을 반영해 계산한 실제 적용 정책을 함께 보여 줍니다. `selectionSource`로 어떤 정책이 선택됐는지 확인할 수
        있습니다.
      example:
        storeId: 5273704d-f924-59e0-8883-827535fb86ad
        explicitHead:
          policyVersionId: 7
          scopeType: STORE
          scopeReference: 5273704d-f924-59e0-8883-827535fb86ad
          state: OVERRIDE
          accrualRateBps: 700
          roundingMode: HALF_UP
          issuerType: STORE
          issuerReference: store:5273704d-f924-59e0-8883-827535fb86ad
          expiryRule: EXACT_DURATION_FROM_COMPLETION
          validityDays: 180
          effectiveAt: '2026-08-15T00:00:00+09:00'
          actorType: PLATFORM_OPERATOR
          actorReference: ff5babc0-a7e5-5776-a6cc-97f550f8ed7c
          reason: 매장별 적립률을 7%로 설정함
        effectivePolicy:
          policyVersionId: 7
          scopeType: STORE
          scopeReference: 5273704d-f924-59e0-8883-827535fb86ad
          accrualRateBps: 700
          roundingMode: HALF_UP
          issuerType: STORE
          issuerReference: store:5273704d-f924-59e0-8883-827535fb86ad
          expiryRule: EXACT_DURATION_FROM_COMPLETION
          validityDays: 180
          canonicalPolicyHash: e7b5a3f1d9c7b5a4f2e0d8c6b4a2f1e9d7c5b3a1f0e8d6c4b2a9f7e5d3c1b0a8
        selectionSource: STORE_OVERRIDE
      required:
        - storeId
        - effectivePolicy
        - selectionSource
      properties:
        storeId:
          type: string
          format: uuid
          description: 해당 매장 자원을 가리키는 UUID 식별자입니다.
        explicitHead:
          $ref: '#/components/schemas/OrdinaryPointAccrualPolicyVersion'
          description: 매장에 별도로 저장된 현재 포인트 적립 정책입니다. 별도 정책이 없으면 이 필드를 생략합니다.
        effectivePolicy:
          $ref: '#/components/schemas/OrdinaryPointAccrualPolicySnapshot'
          description: 전체 기본 정책 상속까지 반영한 최종 적용 정책입니다.
        selectionSource:
          type: string
          enum:
            - STORE_OVERRIDE
            - GLOBAL_INHERITED
            - GLOBAL_NO_OVERRIDE
          description: 최종 적용 정책이 STORE 재정의 또는 GLOBAL 상속 중 어디서 선택됐는지 나타냅니다.
    ChangeGlobalOrdinaryPointAccrualPolicyRequest:
      allOf:
        - $ref: '#/components/schemas/OrdinaryPointAccrualOverrideFields'
        - type: object
          required:
            - expectedPolicyVersionId
      description: |
        모든 매장에 기본으로 적용되는 포인트 적립 정책을 변경하는 요청입니다. `expectedPolicyVersionId`로 현재 정책이 다른 운영자에 의해 먼저 바뀌지 않았는지 확인합니다.
      example:
        state: OVERRIDE
        accrualRateBps: 500
        roundingMode: FLOOR
        issuerType: PLATFORM
        issuerReference: platform:beanflow
        expiryRule: SEOUL_CALENDAR_DAYS_FROM_COMPLETION
        validityDays: 365
        reason: 기본 적립률을 5%로 조정함
        expectedPolicyVersionId: 12
    ChangeStoreOrdinaryPointAccrualOverrideRequest:
      allOf:
        - $ref: '#/components/schemas/OrdinaryPointAccrualOverrideFields'
        - type: object
          properties:
            expectedPolicyVersionId:
              type: integer
              format: int64
              minimum: 1
              description: 화면에서 확인한 현재 정책 버전 ID입니다. 서버의 현재 버전과 다르면 409를 반환합니다.
      description: 특정 매장만 별도 포인트 적립 정책을 사용하도록 변경하는 요청입니다. 첫 설정 이후에는 현재 버전 ID가 정확히 일치해야 합니다.
      example:
        state: OVERRIDE
        accrualRateBps: 700
        roundingMode: HALF_UP
        issuerType: STORE
        issuerReference: store:5273704d-f924-59e0-8883-827535fb86ad
        expiryRule: EXACT_DURATION_FROM_COMPLETION
        validityDays: 180
        reason: 해당 매장의 한시적 적립률을 7%로 설정함
        expectedPolicyVersionId: 7
    OrdinaryPointAccrualOverrideFields:
      type: object
      additionalProperties: false
      description: 포인트 적립률, 반올림 방식, 발행 주체, 만료 방식, 유효일수와 변경 사유를 정의하는 정책 설정입니다.
      example:
        state: OVERRIDE
        accrualRateBps: 500
        roundingMode: FLOOR
        issuerType: PLATFORM
        issuerReference: platform:beanflow
        expiryRule: SEOUL_CALENDAR_DAYS_FROM_COMPLETION
        validityDays: 365
        reason: 일반 주문 적립률을 5%로 설정함
        expectedPolicyVersionId: 12
      required:
        - state
        - accrualRateBps
        - roundingMode
        - issuerType
        - issuerReference
        - expiryRule
        - validityDays
        - reason
      properties:
        state:
          const: OVERRIDE
          description: 명시적 재정의 상태이며 항상 OVERRIDE입니다.
        accrualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: 실결제액에 적용하는 적립률입니다. 10000은 100%입니다.
        roundingMode:
          type: string
          enum:
            - FLOOR
            - HALF_UP
          description: 계산된 포인트의 정수 원 반올림 방식입니다.
        issuerType:
          type: string
          enum:
            - PLATFORM
            - BRAND
            - STORE
          description: 포인트 비용을 부담하는 플랫폼, 브랜드 또는 매장 유형입니다.
        issuerReference:
          type: string
          minLength: 1
          maxLength: 240
          description: 포인트 비용을 부담하는 플랫폼, 브랜드 또는 매장을 가리키는 식별값입니다.
        expiryRule:
          type: string
          enum:
            - EXACT_DURATION_FROM_COMPLETION
            - SEOUL_CALENDAR_DAYS_FROM_COMPLETION
          description: 주문 완료 후 만료일을 계산하는 시간 규칙입니다.
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: 적립 포인트가 유효한 일수입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 화면에서 확인한 현재 정책 버전 ID입니다. 서버의 현재 버전과 다르면 409를 반환합니다.
    ChangeStoreOrdinaryPointAccrualInheritanceRequest:
      type: object
      additionalProperties: false
      description: 특정 매장의 별도 포인트 정책을 해제하고 전체 기본 정책을 따르게 하는 요청입니다. 기존 매장 정책이 있으면 현재 버전 ID를 함께 보냅니다.
      example:
        expectedPolicyVersionId: 7
        state: INHERIT_GLOBAL
        reason: 매장별 재정의를 종료하고 전역 정책을 상속함
      required:
        - state
        - reason
      properties:
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
          description: 화면에서 확인한 현재 정책 버전 ID입니다. 서버의 현재 버전과 다르면 409를 반환합니다.
        state:
          const: INHERIT_GLOBAL
          description: 리소스의 현재 처리 상태입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    Cancellation:
      type: object
      additionalProperties: false
      description: '주문 취소 결과입니다. 취소는 주문 상태에 포함되므로 별도 취소 ID 없이 `orderId`로 식별합니다.'
      example:
        orderId: 74131bb9-688f-5370-8042-21015b3cd43a
        orderState: CANCELLED
        reasonCode: CHANGED_MIND
        paymentRecovery:
          state: SUCCEEDED
          approvedAmountKrw: 9000
          succeededRefundAmountBeforeCancellationKrw: 0
          cancellationRequestedRefundAmountKrw: 9000
          remainingRefundableAmountKrw: 0
          lastUpdatedAt: '2026-08-15T09:36:00+09:00'
        cancelledAt: '2026-08-15T09:35:00+09:00'
        correlationId: 6bd654e4-c246-5998-a665-9cbdd19a4047
      required:
        - orderId
        - orderState
        - reasonCode
        - paymentRecovery
        - cancelledAt
        - correlationId
      properties:
        orderId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 주문 자원을 가리키는 UUID 식별자입니다.
        orderState:
          const: CANCELLED
          description: 취소 결과의 주문 상태이며 항상 CANCELLED입니다.
        reasonCode:
          $ref: '#/components/schemas/CancellationReasonCode'
          description: 고객이 선택한 API에서 정한 취소 사유 코드입니다.
        paymentRecovery:
          $ref: '#/components/schemas/CancellationRefundRecoverySummary'
          description: 이번 고객 취소로 생성된 환불의 고객용 복구 요약입니다.
        cancelledAt:
          $ref: '#/components/schemas/DateTime'
          description: 주문이 취소된 시각입니다.
        correlationId:
          type: string
          description: 서버 로그와 관련 작업을 함께 찾을 때 사용하는 요청 추적 ID입니다.
    PaymentClientConfiguration:
      type: object
      additionalProperties: false
      required: [provider, sdkVersion, clientKey]
      properties:
        provider:
          type: string
          const: TOSS_PAYMENTS
        sdkVersion:
          type: string
          const: V2_STANDARD
        clientKey:
          type: string
          minLength: 1
    OneTimePaymentAmount:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
    OneTimePaymentAttempt:
      type: object
      additionalProperties: false
      required:
        [paymentId, orderId, state, providerOrderId, customerKey, orderName, amount, method, successUrl, failUrl, expiresAt, updatedAt, correlationId]
      properties:
        paymentId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [READY, CONFIRMING, APPROVED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
        providerOrderId:
          type: string
          minLength: 6
          maxLength: 64
        customerKey:
          type: string
          minLength: 1
          maxLength: 64
        orderName:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          $ref: "#/components/schemas/OneTimePaymentAmount"
        method:
          type: string
          const: CARD
        successUrl:
          type: string
          format: uri
        failUrl:
          type: string
          format: uri
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
          minLength: 1
    OneTimePaymentConfirmationRequest:
      type: object
      additionalProperties: false
      required: [paymentKey, orderId, amount]
      properties:
        paymentKey:
          type: string
          minLength: 1
          maxLength: 200
        orderId:
          type: string
          minLength: 6
          maxLength: 64
        amount:
          $ref: "#/components/schemas/MoneyKrw"
    RegisterPaymentMethodRequest:
      type: object
      additionalProperties: false
      required: [authKey, displayAlias]
      description: |
        Provider 결제창 인증을 완료한 뒤 결제수단을 등록하는 요청입니다. 카드번호, CVC,
        유효기간, 생년월일 등 민감정보는 받지 않으며, Provider가 발급한 1회용 authKey와
        고객이 지정하는 표시 별칭만 받습니다.
      example:
        authKey: "(Provider 결제창이 반환한 1회용 opaque 인증 키)"
        displayAlias: 내 신용카드
      properties:
        authKey:
          type: string
          minLength: 1
          maxLength: 300
          description: Provider 결제창이 반환한 1회용 opaque 인증 키입니다.
        displayAlias:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |-
            The server trims this value(서버가 값의 앞뒤 공백을 제거)한 뒤 requires 1 to 80 characters
            (1~80자여야 하며), control characters are rejected(제어 문자는 거부됩니다).
    PaymentMethod:
      type: object
      additionalProperties: false
      required:
        [paymentMethodId, provider, displayAlias, cardBrand, lastFour, isDefault, status, createdAt, updatedAt]
      description: |
        고객이 등록한 결제수단입니다. 내부 토큰, Provider 고객 참조 등 민감정보는 포함하지
        않으며, 카드 뒷자리 4자리(lastFour)까지만 노출합니다.
      example:
        paymentMethodId: "01J8Z3QK2N5R7X9V6W4T8Y1B0E"
        provider: TOSS_PAYMENTS
        displayAlias: 내 신용카드
        cardBrand: KB국민카드
        lastFour: "1234"
        isDefault: true
        status: ACTIVE
        createdAt: "2026-06-01T09:00:00Z"
        updatedAt: "2026-06-01T09:00:00Z"
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
        provider:
          type: string
          const: TOSS_PAYMENTS
        displayAlias:
          type: string
          minLength: 1
          maxLength: 80
        cardBrand:
          type: string
          minLength: 1
          maxLength: 40
        lastFour:
          type: string
          pattern: '^[0-9]{4}$'
        isDefault:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DEACTIVATION_PENDING]
        noticeCode:
          type: string
          const: DEACTIVATION_DELAYED
          description: 자동 비활성화 복구가 중단되어 수동 조사 대상이 된 경우에만 존재합니다.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      allOf:
        - if:
            required: [noticeCode]
          then:
            properties:
              status:
                const: DEACTIVATION_PENDING
    PaymentMethodPage:
      type: object
      additionalProperties: false
      required: [items, page]
      description: 고객의 결제수단 목록을 담은 signed cursor 페이지입니다.
      example:
        items:
          - paymentMethodId: "01J8Z3QK2N5R7X9V6W4T8Y1B0E"
            provider: TOSS_PAYMENTS
            displayAlias: 내 신용카드
            cardBrand: KB국민카드
            lastFour: "1234"
            isDefault: true
            status: ACTIVE
            createdAt: "2026-06-01T09:00:00Z"
            updatedAt: "2026-06-01T09:00:00Z"
        page:
          nextCursor: null
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
        page:
          $ref: "#/components/schemas/PageInfo"
    PaymentMethodRegistration:
      type: object
      additionalProperties: false
      required: [paymentMethodId, state, correlationId, updatedAt]
      description: |
        결제수단 등록 결과가 아직 확정되지 않았을 때 반환되는 진행 중 상태입니다. 이 상태는
        등록 완료된 결제수단이 아니며 결제에 사용할 수 없습니다.
      example:
        paymentMethodId: "01J8Z3QK2N5R7X9V6W4T8Y1B0E"
        state: PROCESSING
        correlationId: "01J8Z3QK2N5R7X9V6W4T8Y1B0F"
        updatedAt: "2026-06-01T09:00:00Z"
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          const: PROCESSING
        noticeCode:
          type: string
          const: REGISTRATION_DELAYED
          description: 자동 처리가 중단되어 오퍼레이터 조사가 필요한 경우에만 존재합니다.
        correlationId:
          type: string
          minLength: 1
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    PaymentMethodDeactivation:
      type: object
      additionalProperties: false
      required: [paymentMethodId, state, correlationId, updatedAt]
      description: |
        결제수단 비활성화가 Provider 측에서 아직 확정되지 않았을 때 반환되는 진행 중
        상태입니다. 이미 신규 결제에는 사용할 수 없는 상태입니다.
      example:
        paymentMethodId: "01J8Z3QK2N5R7X9V6W4T8Y1B0E"
        state: PROCESSING
        correlationId: "01J8Z3QK2N5R7X9V6W4T8Y1B0F"
        updatedAt: "2026-06-01T09:00:00Z"
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          const: PROCESSING
        noticeCode:
          type: string
          const: DEACTIVATION_DELAYED
          description: 96시간 자동 웹훅 수렴 기간이 종료된 뒤에만 존재합니다.
        correlationId:
          type: string
          minLength: 1
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    PaymentConfirmation:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - orderReference
        - type
        - approvalState
        - currency
        - updatedAt
        - correlationId
      properties:
        paymentId:
          $ref: "#/components/schemas/Identifier"
        orderReference:
          type: string
          pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$'
          description: 사람이 읽는 주문 추적용 공개 참조번호입니다.
        type:
          type: string
          enum: [EXTERNAL, BENEFIT_ONLY]
        approvalState:
          $ref: "#/components/schemas/PaymentApprovalState"
        approvedAmountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        recovery:
          $ref: "#/components/schemas/PaymentApprovalRecoverySummary"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    BenefitOnlyPayment:
      allOf:
        - $ref: "#/components/schemas/PaymentConfirmation"
        - type: object
          properties:
            type:
              const: BENEFIT_ONLY
            approvalState:
              const: APPROVED
            approvedAmountKrw:
              const: 0
    PaymentApprovalState:
      type: string
      enum: [READY, APPROVING, APPROVED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
    PaymentApprovalRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Recovery progress for an unknown payment approval result or its bounded
        Provider lookup/late-approval recovery. This schema deliberately contains
        only recovery state and time; cancellation refund notice and allocation
        amounts belong to CancellationRefundRecoverySummary.
      required: [state, lastUpdatedAt]
      properties:
        state:
          type: string
          enum: [REQUESTED, PROCESSING, RECONCILING, SUCCEEDED, MANUAL_REVIEW]
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
    CancellationRefundRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        고객이 주문을 취소한 뒤 현금 환불이 어디까지 진행됐는지 보여 주는 요약입니다.
        고객 화면에는 `NOT_REQUIRED`, `REQUESTED`, `PROCESSING`, `SUCCEEDED`만 사용합니다. 내부 재시도 예정, 결과 불명, 상태 재확인 중은 모두 `PROCESSING`으로 보여 주며, 자동 처리가 오래 지연되거나 수동 확인이 필요하면 `noticeCode: REFUND_DELAYED`를 함께 제공합니다. 서버가 금액을 확인할 수 없을 때는 0원으로 추정하지 않고 관련 금액 필드를 생략합니다.
      example:
        state: SUCCEEDED
        approvedAmountKrw: 9000
        succeededRefundAmountBeforeCancellationKrw: 0
        cancellationRequestedRefundAmountKrw: 9000
        remainingRefundableAmountKrw: 0
        lastUpdatedAt: '2026-08-15T09:36:00+09:00'
      required:
        - state
      properties:
        state:
          type: string
          description: |
            고객에게 보여 주는 이번 취소 환불 상태입니다.
            - `NOT_REQUIRED`: 이번 취소로 새로 환불할 현금이 없습니다. 결제 전 취소, 현금 결제가 없는 취소, 이전 환불로 전액이 이미 반환된 경우가 포함될 수 있습니다.
            - `REQUESTED`: 환불 요청이 저장됐습니다.
            - `PROCESSING`: 외부 결제사 처리, 재시도, 결과 확인 또는 수동 확인이 진행 중입니다.
            - `SUCCEEDED`: 환불 성공이 확인됐습니다.
            내부 실패나 수동 검토 상태는 고객 화면에서 `PROCESSING`으로 표시하고 필요한 경우 `REFUND_DELAYED` 안내 코드를 함께 제공합니다.
          enum:
            - NOT_REQUIRED
            - REQUESTED
            - PROCESSING
            - SUCCEEDED
        noticeCode:
          type: string
          description: |
            `REFUND_DELAYED`는 자동 처리가 오래 지연되거나 담당자 확인이 필요한 경우 고객에게 지연 안내를 보여 주기 위한 코드입니다. 내부 오류·시도 횟수·처리 방식은 노출하지 않습니다.
          enum:
            - REFUND_DELAYED
        approvedAmountKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: '외부 결제사가 승인한 원래 결제 금액입니다. 취소 시점에 확인해 저장한 값이 있을 때만 제공합니다.'
        succeededRefundAmountBeforeCancellationKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: '이번 취소 전에 이미 성공한 환불 금액의 합계입니다. 확인 가능한 저장 기록이 있을 때만 제공합니다.'
        cancellationRequestedRefundAmountKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: '이번 고객 취소로 새로 요청한 현금 환불 금액입니다. 확인 가능한 저장 기록이 있을 때만 제공합니다.'
        remainingRefundableAmountKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: |-
            현재 실제로 더 환불할 수 있는 금액입니다. 승인 금액에서 성공이 확인된 모든 환불액을 뺀 값이며 처리 중인 환불은 성공하기 전까지 차감하지 않습니다.
        lastUpdatedAt:
          $ref: '#/components/schemas/DateTime'
          description: 환불 복구 조회용 응답이 마지막으로 갱신된 시각입니다.
      allOf:
        - if:
            required:
              - noticeCode
          then:
            properties:
              state:
                const: PROCESSING
                description: |
                  고객에게 보여 주는 환불 상태입니다. 내부의 재시도·결과 확인·수동 검토 상태는 필요에 따라 `PROCESSING`으로 합쳐 보여 줍니다. 환불할 금액이 없으면 `NOT_REQUIRED`입니다.
        - if:
            required:
              - approvedAmountKrw
          then:
            required:
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            required:
              - cancellationRequestedRefundAmountKrw
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - remainingRefundableAmountKrw
        - if:
            allOf:
              - required:
                  - state
                properties:
                  state:
                    enum:
                      - REQUESTED
                      - SUCCEEDED
                    description: |
                      고객에게 보여 주는 환불 상태입니다. 내부의 재시도·결과 확인·수동 검토 상태는 필요에 따라 `PROCESSING`으로 합쳐 보여 줍니다. 환불할 금액이 없으면 `NOT_REQUIRED`입니다.
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            allOf:
              - required:
                  - state
                properties:
                  state:
                    const: PROCESSING
                    description: |
                      고객에게 보여 주는 환불 상태입니다. 내부의 재시도·결과 확인·수동 검토 상태는 필요에 따라 `PROCESSING`으로 합쳐 보여 줍니다. 환불할 금액이 없으면 `NOT_REQUIRED`입니다.
              - not:
                  required:
                    - noticeCode
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            properties:
              state:
                const: NOT_REQUIRED
                description: |
                  고객에게 보여 주는 환불 상태입니다. 내부의 재시도·결과 확인·수동 검토 상태는 필요에 따라 `PROCESSING`으로 합쳐 보여 줍니다. 환불할 금액이 없으면 `NOT_REQUIRED`입니다.
            required:
              - state
          then:
            not:
              required:
                - noticeCode
            properties:
              cancellationRequestedRefundAmountKrw:
                const: 0
                description: 이번 주문 취소로 새로 요청한 환불 금액입니다. 확인 가능한 기록이 있을 때만 제공합니다.
    CreateRefundRequest:
      type: object
      additionalProperties: false
      description: 전액 또는 주문 항목별 부분 환불 요청입니다. `lineItems`를 생략하면 아직 환불되지 않은 금액 전체를 환불합니다.
      example:
        lineItems:
          - orderLineId: 30481d44-61d4-5f68-8f8b-a4d7064f4ddd
            quantity: 1
        reason: 음료 한 잔이 누락되어 해당 수량을 환불합니다.
      required:
        - reason
      properties:
        lineItems:
          type: array
          minItems: 1
          description: '생략하면 아직 환불되지 않은 모든 수량을 환불합니다. 수량을 지정하면 각 주문 항목에서 아직 환불되지 않은 수량부터 차례로 처리합니다.'
          items:
            $ref: '#/components/schemas/RefundLineRequest'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
    RefundLineRequest:
      type: object
      additionalProperties: false
      description: 부분 환불할 주문 항목과 수량을 지정하는 요청 항목입니다.
      example:
        orderLineId: 30481d44-61d4-5f68-8f8b-a4d7064f4ddd
        quantity: 1
      required:
        - orderLineId
        - quantity
      properties:
        orderLineId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 주문 항목 자원을 가리키는 UUID 식별자입니다.
        quantity:
          type: integer
          minimum: 1
    Refund:
      type: object
      additionalProperties: false
      description: |
        현금 환불과 사용 포인트 복원 상태를 함께 보여 주는 결과입니다. 두 작업은 별도로 진행될 수 있습니다. 요청 금액은 항상 표시하고 실제 환불·복원 금액은 성공이 확인된 경우에만 표시합니다. 필드가 없다고 0원을 뜻하지 않습니다.
      example:
        refundId: 747692bd-c322-529a-8cc7-e5290aa342b7
        paymentId: c511bb0b-aa37-558e-97e4-6d111bb13cf9
        state: SUCCEEDED
        cashRefundRequestedKrw: 4500
        pointsRestorationRequestedKrw: 500
        pointsRestorationState: SUCCEEDED
        cashRefundedKrw: 4500
        pointsRestoredKrw: 500
        currency: KRW
        createdAt: '2026-08-15T10:20:00+09:00'
        updatedAt: '2026-08-15T10:21:00+09:00'
        correlationId: eccf1270-badb-5dff-b4fb-4cfd6fa3433a
      required:
        - refundId
        - paymentId
        - state
        - cashRefundRequestedKrw
        - pointsRestorationRequestedKrw
        - pointsRestorationState
        - currency
        - createdAt
        - updatedAt
        - correlationId
      properties:
        refundId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 환불 자원을 가리키는 UUID 식별자입니다.
        paymentId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 결제 자원을 가리키는 UUID 식별자입니다.
        state:
          type: string
          enum:
            - REQUESTED
            - PROCESSING
            - RETRY_SCHEDULED
            - SUCCEEDED
            - FAILED
            - UNKNOWN
            - RECONCILING
            - MANUAL_REVIEW
          description: 현금 환불의 현재 처리 상태입니다.
        cashRefundRequestedKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: 이 환불 건가 요청한 생성 후 바뀌지 않는 현금 환불 금액입니다.
        pointsRestorationRequestedKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: 이 환불 건가 요청한 생성 후 바뀌지 않는 포인트 복원 금액입니다.
        pointsRestorationState:
          type: string
          description: |
            사용한 포인트를 돌려주는 작업의 현재 상태입니다. 현금 환불 성공 전에는 `REQUESTED`, 성공 후 처리·재시도 중에는 `PROCESSING`, 자동 처리를 끝내지 못해 담당자 확인이 필요하면 `MANUAL_REVIEW`를 사용합니다.
          enum:
            - NOT_REQUIRED
            - REQUESTED
            - PROCESSING
            - SUCCEEDED
            - MANUAL_REVIEW
        cashRefundedKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: 외부 결제사가 성공으로 확정한 현금 환불 금액입니다.
        pointsRestoredKrw:
          allOf:
            - $ref: '#/components/schemas/MoneyKrw'
          description: 'Loyalty가 성공으로 확정한 포인트 복원 금액입니다.'
        currency:
          $ref: '#/components/schemas/Currency'
          description: 금액 필드에 적용되는 통화입니다.
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 생성된 시각입니다.
        updatedAt:
          $ref: '#/components/schemas/DateTime'
          description: 리소스가 마지막으로 변경된 시각입니다.
        correlationId:
          type: string
          description: 서버 로그와 관련 작업을 함께 찾을 때 사용하는 요청 추적 ID입니다.
      allOf:
        - if:
            properties:
              state:
                const: SUCCEEDED
                description: 현금 환불의 현재 처리 상태입니다.
            required:
              - state
          then:
            required:
              - cashRefundedKrw
          else:
            not:
              required:
                - cashRefundedKrw
        - if:
            properties:
              pointsRestorationState:
                const: SUCCEEDED
            required:
              - pointsRestorationState
          then:
            required:
              - pointsRestoredKrw
          else:
            not:
              required:
                - pointsRestoredKrw
        - if:
            properties:
              pointsRestorationState:
                const: NOT_REQUIRED
            required:
              - pointsRestorationState
          then:
            properties:
              pointsRestorationRequestedKrw:
                const: 0
          else:
            properties:
              pointsRestorationRequestedKrw:
                minimum: 1
        - if:
            properties:
              pointsRestorationState:
                enum:
                  - PROCESSING
                  - SUCCEEDED
                  - MANUAL_REVIEW
            required:
              - pointsRestorationState
          then:
            properties:
              state:
                const: SUCCEEDED
                description: 현금 환불의 현재 처리 상태입니다.
        - if:
            properties:
              pointsRestorationState:
                const: REQUESTED
            required:
              - pointsRestorationState
          then:
            properties:
              state:
                not:
                  const: SUCCEEDED
                description: 현금 환불의 현재 처리 상태입니다.
    StoreOrderTransitionRequest:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState:
          type: string
          enum: [ACCEPTED, PREPARING, READY, COMPLETED, REJECTED]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PointAccount:
      type: object
      additionalProperties: false
      description: 고객 포인트 계정의 운영자용 요약입니다. 즉시 사용 가능한 포인트와 아직 복구 중인 포인트를 원화 단위로 구분합니다.
      example:
        accountId: cbd89645-276d-5c40-9feb-edeaf0c145af
        availablePointsKrw: 12500
        recoveryPendingKrw: 1500
        currency: KRW
      required:
        - accountId
        - availablePointsKrw
        - recoveryPendingKrw
        - currency
      properties:
        accountId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 포인트 계정 자원을 가리키는 UUID 식별자입니다.
        availablePointsKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: 현재 즉시 사용할 수 있는 포인트 잔액입니다.
        recoveryPendingKrw:
          $ref: '#/components/schemas/MoneyKrw'
          description: |-
            Loyalty PointRecoveryPending remaining amounts(회수 대기 잔여 금액)의 합계입니다. 사용
            가능 잔액이 음수라는 뜻이 아닙니다.
        currency:
          $ref: '#/components/schemas/Currency'
          description: 금액 필드에 적용되는 통화입니다.
    PointTransactionPage:
      type: object
      additionalProperties: false
      description: 포인트 거래 내역과 다음 페이지 정보를 담는 응답입니다.
      example:
        items:
          - transactionId: 6d024053-6f94-53c6-8741-17a3bfca6f6a
            type: ACCRUAL
            amountKrw: 500
            occurredAt: '2026-08-15T10:30:00+09:00'
            sourceReference: order:74131bb9-688f-5370-8042-21015b3cd43a
        page:
          nextCursor: v1.sample.cursor.eyJvY2N1cnJlZEF0IjoiMjAyNi0wOC0xNVQxMDozMDowMCswOTowMCJ9
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PointTransaction'
          description: 현재 페이지에 포함된 리소스 목록입니다.
        page:
          $ref: '#/components/schemas/PageInfo'
          description: 다음 페이지 커서 등 페이지네이션 정보입니다.
    PointTransaction:
      type: object
      additionalProperties: false
      description: 포인트 적립, 사용, 만료, 복원, 수동 조정 내역 한 건입니다. 부호 있는 금액, 발생 시각과 원인 식별값을 포함합니다.
      example:
        transactionId: 6d024053-6f94-53c6-8741-17a3bfca6f6a
        type: ADJUSTMENT
        amountKrw: 3000
        occurredAt: '2026-08-15T15:00:00+09:00'
        sourceReference: point-adjustment:sample:001
      required:
        - transactionId
        - type
        - amountKrw
        - occurredAt
        - sourceReference
      properties:
        transactionId:
          $ref: '#/components/schemas/Identifier'
          description: 해당 포인트 거래 자원을 가리키는 UUID 식별자입니다.
        type:
          type: string
          description: |-
            포인트 적립, 사용, 만료, 복원 또는 수동 조정 종류입니다. RECOVERY is an actual debit
            (RECOVERY는 환불 뒤 실제 차감되는 회수 포인트)를, ADJUSTMENT는 운영자가 직접 조정한 내역을
            뜻합니다.
          enum:
            - ACCRUAL
            - USE
            - EXPIRATION
            - RESTORE
            - COMPENSATION
            - RESTORE_SKIPPED_EXPIRED
            - RECOVERY
            - ADJUSTMENT
        amountKrw:
          $ref: '#/components/schemas/SignedMoneyKrw'
          description: |
            고객에게 표시되는 포인트 잔액에 미치는 부호 있는 효과입니다. ACCRUAL, RESTORE, COMPENSATION은
            양수이고 USE, EXPIRATION, RECOVERY are negative(음수)이며 RESTORE_SKIPPED_EXPIRED is zero
            (0)입니다. 항상 0 이상인 금액이 아니며 ADJUSTMENT follows its stored CREDIT or DEBIT balance effect(저장된 CREDIT 또는 DEBIT 효과를 따릅니다).
        occurredAt:
          $ref: '#/components/schemas/DateTime'
          description: 포인트 거래가 발생한 시각입니다.
        sourceReference:
          type: string
          minLength: 1
          description: 이 포인트 거래가 어떤 주문, 환불 또는 수동 조정에서 발생했는지 가리키는 식별값입니다.
    PointIssuer:
      type: object
      additionalProperties: false
      description: 포인트를 발행한 플랫폼, 브랜드 또는 매장의 정보를 적립 당시 값으로 저장한 기록입니다.
      example:
        issuerType: PLATFORM
        issuerReference: platform:beanflow
      required:
        - issuerType
        - issuerReference
      properties:
        issuerType:
          type: string
          enum:
            - PLATFORM
            - BRAND
            - STORE
          description: 포인트 발행 비용 주체 유형입니다.
        issuerReference:
          type: string
          minLength: 1
          maxLength: 200
          pattern: .*\S.*
          description: 포인트 비용을 부담하는 플랫폼, 브랜드 또는 매장을 가리키는 식별값입니다.
    PointAdjustmentRequest:
      type: object
      additionalProperties: false
      description: 운영자가 포인트 계정에 부호 있는 조정을 적용하는 요청입니다. 양수 조정은 발행자와 미래 만료 시각을 요구하고, 음수 조정은 해당 필드를 허용하지 않습니다.
      example:
        amountKrw: 3000
        issuer:
          issuerType: PLATFORM
          issuerReference: platform:beanflow
        expiresAt: '2027-08-15T23:59:59+09:00'
        reason: 고객 문의 조사 결과 누락 적립을 수동 보정함
        evidenceReferences:
          - support-case://sample/POINT-ADJUSTMENT-001
      required:
        - amountKrw
        - reason
        - evidenceReferences
      properties:
        amountKrw:
          allOf:
            - $ref: '#/components/schemas/SignedMoneyKrw'
            - minimum: -9223372036854775807
          not:
            const: 0
          description: 0이 아닌 부호 있는 조정 금액입니다. 양수는 새 PointLot을 만들고 음수는 사용 가능한 포인트 묶음을 소비합니다.
        issuer:
          $ref: '#/components/schemas/PointIssuer'
          description: 포인트를 추가할 때 필요한 발행 주체 정보입니다.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: 양수 조정에서만 필수이며 서버 현재 시각보다 엄격히 미래여야 하는 새 PointLot 만료 시각입니다.
        reason:
          type: string
          minLength: 1
          maxLength: 160
          pattern: .*\S.*
          description: 변경이나 운영 처리가 필요한 이유입니다. 개인정보나 비밀번호·인증키 같은 비밀값을 적지 않습니다.
        evidenceReferences:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: .*\S.*
            description: 공백이 아닌 조정 근거 참조 한 건입니다.
          description: 공백이 아닌 조정 근거 참조 목록입니다. 증거 원문 대신 감사 조사에서 근거를 찾을 수 있는 비민감 참조를 제공합니다.
      allOf:
        - if:
            properties:
              amountKrw:
                exclusiveMinimum: 0
            required:
              - amountKrw
          then:
            required:
              - issuer
              - expiresAt
          else:
            not:
              anyOf:
                - required:
                    - issuer
                - required:
                    - expiresAt
    PointAdjustmentResult:
      type: object
      additionalProperties: false
      description: 포인트 수동 조정 결과입니다. 조정 후 계정 잔액과 이번 작업으로 생성된 포인트 거래 내역을 함께 반환합니다.
      example:
