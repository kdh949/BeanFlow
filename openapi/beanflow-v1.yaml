              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSessionResource"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/verification-sessions/{sessionId}/challenges:
    post:
      tags: [Support]
      operationId: issueSupportVerificationChallenge
      summary: Issue an opaque registered-channel challenge
      description: |
        Persists a challenge intent, calls the configured Identity provider outside the
        database transaction, then records the definitive or UNKNOWN provider outcome.
      parameters:
        - $ref: "#/components/parameters/VerificationSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueVerificationChallengeRequest"
      responses:
        "201":
          description: Opaque challenge metadata; never contains a secret or raw link
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallengeResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/verification-challenges/{challengeId}/verifications:
    post:
      tags: [Support]
      operationId: verifySupportVerificationChallenge
      summary: Verify one opaque challenge proof
      description: |
        The proof is transient write-only input. Invalid proofs consume the Case+Subject
        attempt budget; the fifth invalid proof creates a 30-minute persistent lockout.
        Concurrent or replayed verification cannot call the provider twice.
      parameters:
        - $ref: "#/components/parameters/VerificationChallengeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyVerificationChallengeRequest"
      responses:
        "200":
          description: Verification outcome without proof or provider reference
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResultResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
