      summary: Pre-approve or deny one break-glass request
      description: Approval requires an actor distinct from the requester and activates a two-minute, one-reveal window.
      parameters:
        - $ref: "#/components/parameters/BreakGlassRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
