          description: Explicit head when present and complete effective policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrdinaryPointAccrualPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
