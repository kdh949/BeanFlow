        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_CUSTOMER_SESSION
      description: Customer browser session cookie; never readable by JavaScript.
    merchantSession:
      type: apiKey
      in: cookie
      name: BEANFLOW_MERCHANT_SESSION
      description: Merchant browser session cookie; never readable by JavaScript.
  parameters:
    CustomerCsrfToken:
      in: header
      name: X-BEANFLOW-CSRF
      required: true
      description: Token copied from the BEANFLOW_CUSTOMER_XSRF cookie.
      schema:
        type: string
        minLength: 1
    MerchantCsrfToken:
      in: header
      name: X-BEANFLOW-CSRF
      required: true
      description: Token copied from the BEANFLOW_MERCHANT_XSRF cookie.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Unique within actor ID and API operation
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StoreId:
      in: path
      name: storeId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OrderReference:
      in: path
      name: orderReference
      required: true
      description: Human-readable public order reference; input is case-insensitive and canonicalized to uppercase, and it is not an authorization token.
      schema:
        type: string
        pattern: '^[Bb][Ff]-[23456789ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz]{4}$'
    MerchantAccountId:
      in: path
      name: merchantAccountId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    QueueType:
      in: path
      name: queueType
      required: true
      schema:
        type: string
        enum: [PAYMENT, NOTIFICATION, SETTLEMENT]
    WorkReference:
      in: path
      name: workReference
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    AuditRecordId:
      in: path
      name: auditRecordId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SourceOrderId:
      in: path
      name: sourceOrderId
      required: true
      description: Terminal Order whose immutable menu and option selections are reused
      schema:
        $ref: "#/components/schemas/Identifier"
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PaymentMethodId:
      in: path
      name: paymentMethodId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PointAccountId:
      in: path
      name: accountId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettlementItemId:
      in: path
      name: itemId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettlementBatchId:
      in: path
      name: settlementBatchId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportCaseId:
      in: path
      name: caseId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportSubjectLinkId:
      in: path
      name: linkId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    VerificationSessionId:
      in: path
      name: sessionId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    VerificationChallengeId:
      in: path
      name: challengeId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    DataAccessGrantId:
      in: path
      name: grantId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    BreakGlassRequestId:
      in: path
      name: requestId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Latitude:
      in: query
      name: latitude
      required: true
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Longitude:
      in: query
      name: longitude
      required: true
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RadiusMeters:
      in: query
      name: radiusMeters
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Search radius in meters. Maximum 10000.
    Cursor:
      in: query
      name: cursor
      required: false
      description: |
        Opaque versioned HMAC-signed cursor returned by the previous page. It is
        bound to this endpoint, its filters and stable sort tuple, expires within
        24 hours, and cannot be reused for another scope. Malformed, expired or
        scope-mismatched cursors return 400 INVALID_REQUEST. Maximum length is 2048
        characters.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      in: query
      name: limit
      required: false
      description: Maximum items to return. Defaults to 20 and may not exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DiscoveryLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    CompactLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    AccessReason:
      in: header
      name: X-Access-Reason
      required: true
      description: |
        Purpose for an audited privileged policy read. The server trims the value,
        requires 1 to 200 characters after trimming, and rejects control characters.
      schema:
        type: string
        pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    SupportActionRequestId:
      in: path
      name: requestId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportOrderTimelineCaseId:
      in: query
      name: caseId
      required: true
      description: SupportCase that currently has the target Order linked as RELATED_ORDER.
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportTimelineLimit:
      in: query
      name: limit
      required: false
      description: Maximum globally merged facts. Defaults to 20 and may not exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OperationsInvestigationId:
      in: path
      name: investigationId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportProfileChangeId:
      in: path
      name: profileChangeId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PostAcceptanceResolutionId:
      in: path
      name: resolutionId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SupportTimelineTypes:
      in: query
      name: types
      required: false
      description: Closed fact-type filter. Omission selects every type valid for the endpoint.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 15
        items:
          $ref: "#/components/schemas/SupportTimelineType"
    SupportTimelineCursor:
      in: query
      name: cursor
      required: false
      description: |
        Opaque HMAC-signed cursor bound to the exact endpoint, Case/Order scope and
        canonical source/type filters. It expires after 15 minutes; malformed,
        expired or scope-mismatched values return 400 INVALID_REQUEST.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    SupportTimelineSources:
      in: query
      name: sources
      required: false
      description: Closed source filter. Omission selects every source valid for the endpoint.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 9
        items:
          $ref: "#/components/schemas/SupportTimelineSource"
    SupportCompensationRequestId:
      in: path
      name: compensationRequestId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
  responses:
    AuthenticationFailed:
      description: Credentials are invalid, the account is absent, locked, or expired; these cases are not distinguished.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthenticationRateLimited:
      description: The persistent per-IP authentication attempt budget is exhausted.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 900
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Request syntax or field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role, ownership, store membership, actor-chain, or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is not visible in the authenticated actor scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State, capacity, duplicate resource, or idempotency payload conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderCreationConflict:
      description: |
        Order resource conflict, idempotency payload reuse, or an identical
        idempotent request that is still processing or requires manual review.
        PROCESSING returns IDEMPOTENCY_REQUEST_IN_PROGRESS and Retry-After.
        MANUAL_REVIEW returns IDEMPOTENCY_MANUAL_REVIEW_REQUIRED without
        Retry-After and never re-executes the order command.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReorderConflict:
      description: |
        Source state, unavailable source item, resource reservation or idempotency
        conflict. REORDER_ITEMS_UNAVAILABLE uses the typed item detail schema.
        IDEMPOTENCY_REQUEST_IN_PROGRESS includes Retry-After.
        IDEMPOTENCY_MANUAL_REVIEW_REQUIRED never includes Retry-After and does not
        re-execute the reorder command.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ReorderItemsUnavailableError"
    UnprocessableEntity:
      description: A syntactically valid command was explicitly declined by the responsible domain or Provider
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A required dependency is unavailable; no fallback result was used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupportSearchRateLimited:
      description: The persistent per-operator Support exact-search budget is exhausted
      headers:
        Retry-After:
          required: true
          description: Whole seconds until the next five-minute UTC rate window.
          schema:
            type: integer
            minimum: 1
            maximum: 300
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: A persistent verification lockout is active for this Case and Subject binding
      headers:
        Retry-After:
          required: true
          description: Whole seconds until the binding lockout expires.
          schema:
            type: integer
            minimum: 1
            maximum: 1800
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderCreationDependencyUnavailable:
      description: |
        A required dependency is unavailable, or the immutable settlement input could
        not be materialized. The Error code is DEPENDENCY_UNAVAILABLE or
        SETTLEMENT_INPUT_UNAVAILABLE. No fee, coupon-cost, point-cost, current-value, or
        partial-snapshot fallback is used; the order and every owner reservation roll back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SupportProfileChangeOk:
      description: Current masked workflow, exact approval binding and independent notification state
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportProfileChangeResource"
    SupportProfileChangeCreated:
      description: Purpose-specific workflow created or its exact idempotent result replayed
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportProfileChangeResource"
  headers:
    NoStore:
      required: true
      description: Sensitive support representation must not be stored by shared or browser caches.
      schema:
        type: string
        const: no-store
  schemas:
    LoginId:
      type: string
      minLength: 5
      maxLength: 32
      pattern: '^[a-z0-9][a-z0-9._-]{3,30}[a-z0-9]$'
      description: Canonical lowercase login ID in an actor-specific namespace.
    Password:
      type: string
      minLength: 15
      maxLength: 128
      description: 15..128 Unicode code points and at most 512 UTF-8 bytes; never trimmed or normalized.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginId, password]
      properties:
        loginId: { $ref: "#/components/schemas/LoginId" }
        password: { $ref: "#/components/schemas/Password" }
    CustomerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [loginId, password, displayName]
      properties:
        loginId: { $ref: "#/components/schemas/LoginId" }
        password: { $ref: "#/components/schemas/Password" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    CustomerRegistrationResult:
      type: object
      additionalProperties: false
      required: [loginId]
      properties:
        loginId: { $ref: "#/components/schemas/LoginId" }
    CustomerActor:
      type: object
      additionalProperties: false
      required: [actorType, customerId, displayName]
      properties:
        actorType: { const: CUSTOMER }
        customerId: { $ref: "#/components/schemas/Identifier" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    MerchantActor:
      type: object
      additionalProperties: false
      required: [actorType, merchantId, displayName, accountState]
      properties:
        actorType: { const: MERCHANT }
        merchantId: { $ref: "#/components/schemas/Identifier" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        accountState: { type: string, enum: [INITIAL_PASSWORD, ACTIVE] }
    OperatorActor:
      type: object
      additionalProperties: false
      required: [actorType, operatorId, roles]
      properties:
        actorType: { const: OPERATOR }
        operatorId: { $ref: "#/components/schemas/Identifier" }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
    MerchantPasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { $ref: "#/components/schemas/Password" }
        newPassword: { $ref: "#/components/schemas/Password" }
    MerchantStoreList:
      type: array
      items: { $ref: "#/components/schemas/MerchantStore" }
    MerchantStore:
      type: object
      additionalProperties: false
      required: [storeId, storeName, membershipRole]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        storeName: { type: string, minLength: 1, maxLength: 200 }
        membershipRole: { type: string, enum: [OWNER, STAFF] }
    OperationsOidcConfiguration:
      type: object
      additionalProperties: false
      required: [issuerUri, authorizationServerUrl, realm, clientId, redirectUri, postLogoutRedirectUri, scopes]
      properties:
        issuerUri: { type: string, format: uri }
        authorizationServerUrl: { type: string, format: uri }
        realm: { type: string, minLength: 1 }
        clientId: { type: string, minLength: 1 }
        redirectUri: { type: string, format: uri }
        postLogoutRedirectUri: { type: string, format: uri }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    CustomerOrderAllowedAction:
      type: string
      enum: [CANCEL, REORDER, VIEW_REFUND]
    CustomerOrderSummary:
      type: object
      additionalProperties: false
      required: [orderReference, pickupNumber, storeName, status, orderedAt, pickupWindowStart, pickupWindowEnd, totalAmountKrw, currency, itemSummary, allowedActions]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        pickupNumber: { type: string, minLength: 1, maxLength: 32 }
        storeName: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/OrderState" }
        orderedAt: { $ref: "#/components/schemas/DateTime" }
        pickupWindowStart: { $ref: "#/components/schemas/DateTime" }
        pickupWindowEnd: { $ref: "#/components/schemas/DateTime" }
        totalAmountKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        itemSummary: { type: string, minLength: 1, maxLength: 300 }
        allowedActions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CustomerOrderAllowedAction" }
    CustomerOrderPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerOrderSummary" }
        page: { $ref: "#/components/schemas/PageInfo" }
    CustomerOrderLine:
      type: object
      additionalProperties: false
      required: [lineSequence, menuName, optionNames, quantity, lineTotalKrw]
      properties:
        lineSequence: { type: integer, minimum: 0 }
        menuName: { type: string, minLength: 1, maxLength: 200 }
        optionNames:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1 }
        lineTotalKrw: { $ref: "#/components/schemas/MoneyKrw" }
    CustomerOrderDetail:
      type: object
      additionalProperties: false
      required: [orderReference, pickupNumber, storeName, status, orderedAt, pickupWindowStart, pickupWindowEnd, totalAmountKrw, currency, lines, allowedActions]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        pickupNumber: { type: string, minLength: 1, maxLength: 32 }
        storeName: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/OrderState" }
        orderedAt: { $ref: "#/components/schemas/DateTime" }
        pickupWindowStart: { $ref: "#/components/schemas/DateTime" }
        pickupWindowEnd: { $ref: "#/components/schemas/DateTime" }
        totalAmountKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CustomerOrderLine" }
        allowedActions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/CustomerOrderAllowedAction" }
        cancellationPreview:
          allOf:
            - $ref: "#/components/schemas/CustomerCancellationPreview"
          description: |
            Present only while CANCEL is allowed. This server-calculated projection
            is an estimate, not a refund commitment. The cancellation command
            revalidates the order and returns the committed outcome independently.
        paymentRecovery: { $ref: "#/components/schemas/CancellationRefundRecoverySummary" }
    CustomerCancellationPreview:
      type: object
      additionalProperties: false
      required: [estimate, calculatedAt, orderVersion, cashRefundAmountKrw, restoredPoints, couponRestoration, pendingAccrual]
      properties:
        estimate:
          const: true
          description: Distinguishes this projection from a committed refund outcome
        calculatedAt: { $ref: "#/components/schemas/DateTime" }
        orderVersion:
          type: integer
          format: int64
          minimum: 0
          description: Order version used for this estimate; display-only for the customer client
        cashRefundAmountKrw: { $ref: "#/components/schemas/MoneyKrw" }
        restoredPoints:
          type: integer
          format: int64
          minimum: 0
        couponRestoration:
          type: string
          enum: [NOT_APPLICABLE, WILL_RESTORE, WILL_NOT_RESTORE]
        pendingAccrual:
          type: string
          enum: [NOT_APPLICABLE, WILL_NOT_ACCRUE, WILL_BE_REVERSED]
    CustomerCancellationResult:
      type: object
      additionalProperties: false
      required: [orderReference, orderState, reasonCode, paymentRecovery, cancelledAt, correlationId]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        orderState: { const: CANCELLED }
        reasonCode: { $ref: "#/components/schemas/CancellationReasonCode" }
        paymentRecovery: { $ref: "#/components/schemas/CancellationRefundRecoverySummary" }
        cancelledAt: { $ref: "#/components/schemas/DateTime" }
        correlationId: { type: string, minLength: 1, maxLength: 160 }
    CustomerPointSummary:
      type: object
      additionalProperties: false
      required: [availablePointsKrw, recoveryPendingKrw, currency, expiring]
      properties:
        availablePointsKrw: { $ref: "#/components/schemas/MoneyKrw" }
        recoveryPendingKrw: { $ref: "#/components/schemas/MoneyKrw" }
        currency: { $ref: "#/components/schemas/Currency" }
        expiring:
          type: array
          items: { $ref: "#/components/schemas/ExpiringPointAmount" }
    ExpiringPointAmount:
      type: object
      additionalProperties: false
      required: [expiresAt, amountKrw]
      properties:
        expiresAt: { $ref: "#/components/schemas/DateTime" }
        amountKrw: { $ref: "#/components/schemas/MoneyKrw" }
    StoreSearchPage:
      type: object
      additionalProperties: false
      required: [items, page, distanceAvailable]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoreSearchItem" }
        page: { $ref: "#/components/schemas/PageInfo" }
        distanceAvailable:
          type: boolean
          description: True only when a valid latitude/longitude pair was supplied and distance ordering participated.
    StoreSearchItem:
      type: object
      additionalProperties: false
      required: [storeId, name, matchReason, pickupAvailable, representativeMenus]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1, maxLength: 200 }
        matchReason: { type: string, enum: [STORE_NAME, MENU_NAME, BOTH] }
        distanceMeters: { type: integer, minimum: 0 }
        pickupAvailable: { type: boolean }
        representativeMenus:
          type: array
          maxItems: 3
          items: { type: string, minLength: 1, maxLength: 200 }
    CustomerStore:
      type: object
      additionalProperties: false
      required: [storeId, name, pickupAvailable]
      properties:
        storeId: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1, maxLength: 200 }
        pickupAvailable: { type: boolean }
        distanceMeters: { type: integer, minimum: 0 }
    CustomerStoreList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomerStore" }
    StoreRecommendation:
      type: object
      additionalProperties: false
      required: [store, reason]
      properties:
        store: { $ref: "#/components/schemas/CustomerStore" }
        reason: { type: string, enum: [FAVORITE, RECENT, NEARBY] }
    StoreRecommendationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StoreRecommendation" }
    StoreOrderAction:
      type: string
      enum: [ACCEPT, REJECT, START_PREPARING, MARK_READY, COMPLETE]
    StoreOrderBoardItem:
      type: object
      additionalProperties: false
      required: [orderReference, pickupNumber, pickupBusinessDate, status, pickupWindowStart, pickupWindowEnd, itemSummary, allowedActions]
      properties:
        orderReference: { type: string, pattern: '^BF-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}-[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4}$' }
        pickupNumber: { type: string, minLength: 1, maxLength: 32 }
        pickupBusinessDate: { type: string, format: date }
        lane: { type: string, enum: [PENDING_ACCEPTANCE, ACCEPTED, PREPARING, READY] }
        status: { $ref: "#/components/schemas/OrderState" }
        pickupWindowStart: { $ref: "#/components/schemas/DateTime" }
        pickupWindowEnd: { $ref: "#/components/schemas/DateTime" }
        itemSummary: { type: string, minLength: 1, maxLength: 300 }
        acceptanceDeadlineAt: { $ref: "#/components/schemas/DateTime" }
        acceptancePhase: { type: string, enum: [OPEN, WARNING, TIMEOUT_PENDING] }
        allowedActions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/StoreOrderAction" }
        compensationRecovery:
          $ref: "#/components/schemas/StoreCompensationSummary"
    StoreOrderBoard:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/StoreOrderBoardDateGroup" }
    StoreOrderBoardDateGroup:
      type: object
      additionalProperties: false
      required: [pickupBusinessDate, items]
      properties:
        pickupBusinessDate: { type: string, format: date }
        items:
          type: array
          minItems: 1
          description: Every item has the same pickupBusinessDate as this group.
          items: { $ref: "#/components/schemas/StoreOrderBoardItem" }
    StoreOrderActionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedStatus]
      properties:
        action: { $ref: "#/components/schemas/StoreOrderAction" }
        expectedStatus:
          type: string
          enum: [PAID, ACCEPTED, PREPARING, READY]
          description: Order status rendered when the operator chose the action; a changed current status returns ORDER_STATE_CONFLICT.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]*$'
    MerchantRefundSelection:
      type: object
      additionalProperties: false
      required: [lineSequence, quantity]
      properties:
        lineSequence: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1 }
    MerchantRefundPreviewRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MerchantRefundSelection" }
    MerchantRefundRequest:
      type: object
      additionalProperties: false
      required: [lines, previewVersion, reason]
      properties:
        lines:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MerchantRefundSelection" }
        previewVersion: { type: string, pattern: '^[0-9a-f]{64}$' }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]*$'
    MerchantRefundPreviewLine:
