        criterion:
          type: PHONE
          value: "01000000000"
        subjectTypes: [CUSTOMER]
        reasonCode: CASE_INTAKE
      properties:
        criterion:
          $ref: "#/components/schemas/SupportSearchCriterion"
        subjectTypes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SupportSearchSubjectType"
        reasonCode:
          $ref: "#/components/schemas/SupportSearchReasonCode"
    SupportSubjectSearchCandidate:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, maskedDisplayName, matchedCriterionType, maskedMatchedValue]
      properties:
        subjectType:
          $ref: "#/components/schemas/SupportSearchSubjectType"
        subjectId:
          type: string
          format: uuid
        maskedDisplayName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^.*\*.*$'
        matchedCriterionType:
          $ref: "#/components/schemas/ExactSearchCriterionType"
        maskedMatchedValue:
          type: string
          minLength: 3
          maxLength: 320
          pattern: '^.*\*.*$'
    SupportSubjectSearchResult:
      type: object
      additionalProperties: false
      required: [searchId, items, matchedCount, ambiguous, hasMore]
