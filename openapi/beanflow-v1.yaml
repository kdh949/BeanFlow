      description: 새 SupportCase를 열기 위한 요청. 요청자 유형/참조, 문의 분류, 우선순위와 사유를 담습니다.
      example:
        requesterType: CUSTOMER
        requesterReference: "CUST-00000001"
        category: ORDER_CANCELLATION
        priority: NORMAL
        externalReference: "TICKET-2026-0815-001"
        reason: "고객이 주문 취소 및 환불을 요청함"
      properties:
        requesterType:
          $ref: "#/components/schemas/SupportRequesterType"
        requesterReference:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque requester reference; it is not expanded or validated against an owner table in S20.
        category:
          $ref: "#/components/schemas/SupportInquiryCategory"
        priority:
          $ref: "#/components/schemas/SupportCasePriority"
        externalReference:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Structured operational reason; secrets and high-risk PII are rejected.
      allOf:
        - if:
            properties:
              category:
                const: OTHER
            required: [category]
          then:
            properties:
              reason:
                minLength: 3
    AssignSupportCaseRequest:
      type: object
      additionalProperties: false
      required: [assigneeId, expectedVersion, reason]
      description: SupportCase를 새 담당 운영자에게 재배정하기 위한 요청. 낙관적 잠금을 위해 현재 알고 있는 Case 버전을 함께 보냅니다.
