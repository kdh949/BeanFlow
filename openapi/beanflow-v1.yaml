          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        payableKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        paymentRecovery:
          $ref: "#/components/schemas/CancellationRefundRecoverySummary"
        paidAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceWarningAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceWarningRequestedAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceDeadlineAt:
          $ref: "#/components/schemas/DateTime"
        acceptedAt:
          $ref: "#/components/schemas/DateTime"
        rejectedAt:
          $ref: "#/components/schemas/DateTime"
        preparingAt:
          $ref: "#/components/schemas/DateTime"
        readyAt:
          $ref: "#/components/schemas/DateTime"
        completedAt:
          $ref: "#/components/schemas/DateTime"
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 500
        cancelledAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
          description: |
            Present only when state is CANCELLED. Required together with
            cancellationCause by the order cancellation model (ADR-029).
        cancellationCause:
          allOf:
            - $ref: "#/components/schemas/CancellationCause"
          description: |
            System-determined cancellation origin. Present only when state is
            CANCELLED. Independent of the customer-declared reason code.
        cancellationReasonCode:
          allOf:
            - $ref: "#/components/schemas/CancellationReasonCode"
          description: |
            Customer-declared reason, present only when cancellationCause is
            CUSTOMER_REQUEST. Customer projection only; the store projection
            (StoreOrder) never carries it. The free-text cancellation detail is
            never exposed in any representation.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    OrderState:
      type: string
      enum:
        - PENDING_PAYMENT
        - PAID
        - ACCEPTED
        - PREPARING
        - READY
        - COMPLETED
        - EXPIRED
        - CANCELLED
        - REJECTED
    OrderLine:
      type: object
      additionalProperties: false
      required:
        - orderLineId
        - menuId
        - menuName
        - optionNames
        - unitPriceKrw
        - quantity
        - couponDiscountKrw
        - pointsAppliedKrw
        - cashPaidKrw
      properties:
        orderLineId:
          $ref: "#/components/schemas/Identifier"
        menuId:
          $ref: "#/components/schemas/Identifier"
        menuName:
          type: string
          minLength: 1
        optionNames:
          type: array
          items:
            type: string
        unitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        quantity:
          type: integer
          minimum: 1
        couponDiscountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        cashPaidKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CancellationRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        detail:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |
            Optional free-text detail supplied by the customer. The server trims it
            before validation. An empty normalized value is treated as absent. A
            present normalized value must contain 1 to 200 characters.
            Control characters are rejected. Stored on the order only. Never
            included in events, audit records, provider requests, application
            logs or any API response.
    CancellationReasonCode:
      type: string
      description: Customer-declared cancellation reason, independent of the system-determined cause
      enum:
        - CHANGED_MIND
        - ORDER_MISTAKE
        - WAIT_TOO_LONG
        - PICKUP_TIME_CONFLICT
        - PAYMENT_ISSUE
        - OTHER
    CancellationCause:
      type: string
      description: |
        System-determined cancellation origin. CUSTOMER_REQUEST is a customer
        command, SUPPORT_REQUEST is an approved Support owner command and
        PAYMENT_DECLINED is caused by an explicit Provider approval decline.
        CUSTOMER_REQUEST and SUPPORT_REQUEST carry a structured reason code.
      enum:
        - CUSTOMER_REQUEST
        - PAYMENT_DECLINED
        - SUPPORT_REQUEST
    StoreOrder:
      description: |
        Store-facing Order projection. Store members see the cancellation fact
        (state, cancelledAt, cancellationCause) so they can distinguish a
        customer cancellation from a rejection or a declined payment, but they
        never see the customer-declared reason code or customer refund recovery
        progress. The free-text cancellation detail is excluded from every
        representation.
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          not:
            anyOf:
              - required: [cancellationReasonCode]
              - required: [paymentRecovery]
    StoreOrderResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/StoreCompensationSummary"
    StoreCompensationSummary:
      type: object
      additionalProperties: false
      description: |
        Store-facing compensation projection for a terminated order. Store
        members see what terminated the order and whether owner compensation is
        still running, but never the step breakdown, attempt counts, internal
        error codes, case identifier or benefit policy versions. Those are
        operator-only and returned by OperatorCompensationView (ADR-030,
        ADR-033). Order termination does not imply compensation success.
      required: [trigger, state, updatedAt]
      properties:
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    CompensationSummary:
      type: object
      additionalProperties: false
      description: |
        Full owner compensation progress for a terminated order. The same shape
        covers store rejection and customer cancellation; the trigger field
        distinguishes the origin. Step detail, attempt counts, internal error
        codes, the case identifier and the benefit policy versions are
        operator-only, so this schema is returned only inside
        OperatorCompensationView; store members receive the abbreviated
        StoreCompensationSummary. Order termination does not imply compensation
        success.
      required: [caseId, trigger, benefitPolicies, state, steps, updatedAt]
      properties:
        caseId:
          $ref: "#/components/schemas/Identifier"
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        benefitPolicies:
          type: array
          minItems: 2
          maxItems: 2
          description: Immutable COUPON and POINTS policy version references selected with the case
          items:
            $ref: "#/components/schemas/CompensationBenefitPolicyReference"
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        steps:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/CompensationStep"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    OperatorCompensationView:
      type: object
      additionalProperties: false
      description: Platform-operator-only compensation and payment setup integrity view
      required: [compensation]
      properties:
        compensation:
          $ref: "#/components/schemas/CompensationSummary"
        paymentSetupIssue:
          $ref: "#/components/schemas/PaymentSetupIssue"
        setupReprocessingCaseId:
          $ref: "#/components/schemas/Identifier"
    PaymentSetupIssue:
      type: object
      additionalProperties: false
      description: Operator-only integrity issue; never returned in customer or store representations
      required: [state, detectedAt, lastErrorCode]
      anyOf:
        - required: [missingArtifacts]
        - required: [invariantViolations]
      properties:
        state:
          const: SETUP_INCOMPLETE
        missingArtifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CANCELLATION_REFUND, PAYMENT_RECOVERY_SNAPSHOT]
        invariantViolations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [SOURCE_MISMATCH, AMOUNT_TIE_OUT_MISMATCH]
        detectedAt:
          $ref: "#/components/schemas/DateTime"
        lastErrorCode:
          type: string
    CustomerCancellationRefundReconciliationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |
            Operational justification. It is normalized for command idempotency
            but is not copied to the response or Audit summaries.
    CustomerCancellationRefundReconciliation:
      type: object
      additionalProperties: false
      required: [operationId, orderId, cancellationOrderVersion, state, scheduledAt]
      properties:
        operationId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        cancellationOrderVersion:
          type: integer
          format: int64
          minimum: 1
        state:
          const: LOOKUP_SCHEDULED
        scheduledAt:
          $ref: "#/components/schemas/DateTime"
    CompensationBenefitPolicyReference:
      type: object
      additionalProperties: false
      required: [benefitType, policyVersionId]
      properties:
        benefitType:
          type: string
          enum: [COUPON, POINTS]
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
    CompensationStep:
      type: object
      additionalProperties: false
      required: [type, state, attemptCount]
      properties:
        type:
          type: string
          enum: [PAYMENT, PICKUP, STOCK, COUPON, POINTS, CUSTOMER_NOTIFICATION]
        state:
          type: string
          enum:
            [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, NOT_REQUIRED, MANUAL_REVIEW]
        attemptCount:
          type: integer
          minimum: 0
        lastErrorCode:
          type: string
    CreateRepairProposalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RepairProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RepairProposal:
      type: object
      additionalProperties: false
      required:
        [proposalId, caseId, action, state, proposedBy, createdAt, expiresAt, correlationId]
      properties:
        proposalId:
          $ref: "#/components/schemas/Identifier"
        caseId:
          $ref: "#/components/schemas/Identifier"
        action:
          const: RECREATE_MISSING_CANCELLATION_REFUND
        state:
          type: string
          enum: [PENDING_APPROVAL, EXECUTED, REJECTED, EXPIRED, STALE]
        proposedBy:
          $ref: "#/components/schemas/Identifier"
        decidedBy:
          $ref: "#/components/schemas/Identifier"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        decidedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    ExpiredBenefitRestorationPolicy:
      type: object
      additionalProperties: false
      required:
        [policyVersionId, trigger, benefitType, mode, compensationValidityDays, effectiveAt, updatedBy, reason]
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        benefitType:
          type: string
          enum: [COUPON, POINTS]
        mode:
          type: string
          enum: [COMPENSATE_WITH_NEW_ISSUANCE, PRESERVE_ORIGINAL_EXPIRY]
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
        effectiveAt:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/Identifier"
        reason:
          type: string
          minLength: 1
          maxLength: 500
      allOf:
        - if:
            properties:
              trigger:
                const: PARTIAL_REFUND
            required: [trigger]
          then:
            properties:
              benefitType:
                const: POINTS
    UpdateExpiredBenefitRestorationPolicyRequest:
      type: object
      additionalProperties: false
      required: [expectedPolicyVersionId, mode, compensationValidityDays, reason]
      properties:
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
        mode:
          type: string
          enum: [COMPENSATE_WITH_NEW_ISSUANCE, PRESERVE_ORIGINAL_EXPIRY]
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\u0000-\u001F\u007F]*[^\s\u0000-\u001F\u007F][^\u0000-\u001F\u007F]*$'
    OrdinaryPointAccrualPolicyVersion:
      type: object
      additionalProperties: false
      required: [policyVersionId, scopeType, scopeReference, state, effectiveAt, actorType, actorReference, reason]
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
        scopeType:
          type: string
          enum: [GLOBAL, STORE]
        scopeReference:
          type: string
          format: uuid
        state:
          type: string
          enum: [OVERRIDE, INHERIT_GLOBAL]
        accrualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        roundingMode:
          type: string
          enum: [FLOOR, HALF_UP]
        issuerType:
          type: string
          enum: [PLATFORM, BRAND, STORE]
        issuerReference:
          type: string
          minLength: 1
          maxLength: 240
        expiryRule:
          type: string
          enum: [EXACT_DURATION_FROM_COMPLETION, SEOUL_CALENDAR_DAYS_FROM_COMPLETION]
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        effectiveAt:
          $ref: "#/components/schemas/DateTime"
        actorType:
          type: string
          enum: [PLATFORM_OPERATOR, SYSTEM]
        actorReference:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 500
    OrdinaryPointAccrualPolicySnapshot:
      type: object
      additionalProperties: false
      required:
        [policyVersionId, scopeType, scopeReference, accrualRateBps, roundingMode, issuerType,
         issuerReference, expiryRule, validityDays, canonicalPolicyHash]
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
        scopeType:
          type: string
          enum: [GLOBAL, STORE]
        scopeReference:
          type: string
          format: uuid
        accrualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        roundingMode:
          type: string
          enum: [FLOOR, HALF_UP]
        issuerType:
          type: string
          enum: [PLATFORM, BRAND, STORE]
        issuerReference:
          type: string
          minLength: 1
          maxLength: 240
        expiryRule:
          type: string
          enum: [EXACT_DURATION_FROM_COMPLETION, SEOUL_CALENDAR_DAYS_FROM_COMPLETION]
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        canonicalPolicyHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    OrdinaryPointAccrualPolicyPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrdinaryPointAccrualPolicyVersion"
        page:
          $ref: "#/components/schemas/OrdinaryPointAccrualPolicyPageInfo"
    OrdinaryPointAccrualPolicyPageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 2048
    StoreOrdinaryPointAccrualPolicy:
      type: object
      additionalProperties: false
      required: [storeId, effectivePolicy, selectionSource]
      properties:
        storeId:
          type: string
          format: uuid
        explicitHead:
          $ref: "#/components/schemas/OrdinaryPointAccrualPolicyVersion"
        effectivePolicy:
          $ref: "#/components/schemas/OrdinaryPointAccrualPolicySnapshot"
        selectionSource:
          type: string
          enum: [STORE_OVERRIDE, GLOBAL_INHERITED, GLOBAL_NO_OVERRIDE]
    ChangeGlobalOrdinaryPointAccrualPolicyRequest:
      allOf:
        - $ref: "#/components/schemas/OrdinaryPointAccrualOverrideFields"
        - type: object
          required: [expectedPolicyVersionId]
    ChangeStoreOrdinaryPointAccrualOverrideRequest:
      allOf:
        - $ref: "#/components/schemas/OrdinaryPointAccrualOverrideFields"
        - type: object
          properties:
            expectedPolicyVersionId:
              type: integer
              format: int64
              minimum: 1
    OrdinaryPointAccrualOverrideFields:
      type: object
      additionalProperties: false
      required: [state, accrualRateBps, roundingMode, issuerType, issuerReference, expiryRule, validityDays, reason]
      properties:
        state:
          const: OVERRIDE
        accrualRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        roundingMode:
          type: string
          enum: [FLOOR, HALF_UP]
        issuerType:
          type: string
          enum: [PLATFORM, BRAND, STORE]
        issuerReference:
          type: string
          minLength: 1
          maxLength: 240
        expiryRule:
          type: string
          enum: [EXACT_DURATION_FROM_COMPLETION, SEOUL_CALENDAR_DAYS_FROM_COMPLETION]
        validityDays:
          type: integer
          minimum: 1
          maximum: 3650
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
    ChangeStoreOrdinaryPointAccrualInheritanceRequest:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
        state:
          const: INHERIT_GLOBAL
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Cancellation:
      type: object
      additionalProperties: false
      description: |
        Cancellation result for an order. The order is identified by orderId; no
        separate cancellation identifier exists because cancellation is not a
        separate aggregate and an order can be cancelled at most once.
      required:
        [orderId, orderState, reasonCode, paymentRecovery, cancelledAt, correlationId]
      properties:
        orderId:
          $ref: "#/components/schemas/Identifier"
        orderState:
          const: CANCELLED
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        paymentRecovery:
          $ref: "#/components/schemas/CancellationRefundRecoverySummary"
        cancelledAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    PaymentClientConfiguration:
      type: object
      additionalProperties: false
      required: [provider, sdkVersion, clientKey]
      properties:
        provider:
          type: string
          const: TOSS_PAYMENTS
        sdkVersion:
          type: string
          const: V2_STANDARD
        clientKey:
          type: string
          minLength: 1
    OneTimePaymentAmount:
      type: object
      additionalProperties: false
      required: [value, currency]
      properties:
        value:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
    OneTimePaymentAttempt:
      type: object
      additionalProperties: false
      required:
        [paymentId, orderId, state, providerOrderId, customerKey, orderName, amount, method, successUrl, failUrl, expiresAt, updatedAt, correlationId]
      properties:
        paymentId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [READY, CONFIRMING, APPROVED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
        providerOrderId:
          type: string
          minLength: 6
          maxLength: 64
        customerKey:
          type: string
          minLength: 1
          maxLength: 64
        orderName:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          $ref: "#/components/schemas/OneTimePaymentAmount"
        method:
          type: string
          const: CARD
        successUrl:
          type: string
          format: uri
        failUrl:
          type: string
          format: uri
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
          minLength: 1
    OneTimePaymentConfirmationRequest:
      type: object
      additionalProperties: false
      required: [paymentKey, orderId, amount]
      properties:
        paymentKey:
          type: string
          minLength: 1
          maxLength: 200
        orderId:
          type: string
          minLength: 6
          maxLength: 64
        amount:
          $ref: "#/components/schemas/MoneyKrw"
    RegisterPaymentMethodRequest:
      type: object
      additionalProperties: false
      required: [authKey, displayAlias]
      properties:
        authKey:
          type: string
          minLength: 1
          maxLength: 300
          description: One-time opaque authorization key returned by the Provider payment window
        displayAlias:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: The server trims this value, then requires 1 to 80 characters; control characters are rejected
    PaymentMethod:
      type: object
      additionalProperties: false
      required:
        [paymentMethodId, provider, displayAlias, cardBrand, lastFour, isDefault, status, createdAt, updatedAt]
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
        provider:
          type: string
          const: TOSS_PAYMENTS
        displayAlias:
          type: string
          minLength: 1
          maxLength: 80
        cardBrand:
          type: string
          minLength: 1
          maxLength: 40
        lastFour:
          type: string
          pattern: '^[0-9]{4}$'
        isDefault:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DEACTIVATION_PENDING]
        noticeCode:
          type: string
          const: DEACTIVATION_DELAYED
          description: Present only when automatic deactivation recovery has stopped for manual investigation
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
      allOf:
        - if:
            required: [noticeCode]
          then:
            properties:
              status:
                const: DEACTIVATION_PENDING
    PaymentMethodPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
        page:
          $ref: "#/components/schemas/PageInfo"
    PaymentMethodRegistration:
      type: object
      additionalProperties: false
      required: [paymentMethodId, state, correlationId, updatedAt]
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          const: PROCESSING
        noticeCode:
          type: string
          const: REGISTRATION_DELAYED
          description: Present when automatic resolution has stopped and operator investigation is required
        correlationId:
          type: string
          minLength: 1
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    PaymentMethodDeactivation:
      type: object
      additionalProperties: false
      required: [paymentMethodId, state, correlationId, updatedAt]
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          const: PROCESSING
        noticeCode:
          type: string
          const: DEACTIVATION_DELAYED
          description: Present after the 96-hour automatic webhook convergence window has ended
        correlationId:
          type: string
          minLength: 1
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    PaymentConfirmation:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - orderId
        - type
        - approvalState
        - currency
        - updatedAt
        - correlationId
      properties:
        paymentId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        type:
          type: string
          enum: [EXTERNAL, BENEFIT_ONLY]
        approvalState:
          $ref: "#/components/schemas/PaymentApprovalState"
        approvedAmountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        recovery:
          $ref: "#/components/schemas/PaymentApprovalRecoverySummary"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    BenefitOnlyPayment:
      allOf:
        - $ref: "#/components/schemas/PaymentConfirmation"
        - type: object
          properties:
            type:
              const: BENEFIT_ONLY
            approvalState:
              const: APPROVED
            approvedAmountKrw:
              const: 0
    PaymentApprovalState:
      type: string
      enum: [READY, APPROVING, APPROVED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
    PaymentApprovalRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Recovery progress for an unknown payment approval result or its bounded
        Provider lookup/late-approval recovery. This schema deliberately contains
        only recovery state and time; cancellation refund notice and allocation
        amounts belong to CancellationRefundRecoverySummary.
      required: [state, lastUpdatedAt]
      properties:
        state:
          type: string
          enum: [REQUESTED, PROCESSING, RECONCILING, SUCCEEDED, MANUAL_REVIEW]
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
    CancellationRefundRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Customer-facing recovery projection for the Refund created by a customer
        cancellation. Internal Refund states are projected to the public state
        and optional notice below; verified cancellation allocation amounts are
        included only when their durable sources are complete.
      required:
        - state
      properties:
        state:
          type: string
          description: |
            Customer-facing projection of the Refund created for this cancellation
            only. Internal PROCESSING, RETRY_SCHEDULED, UNKNOWN and RECONCILING are
            exposed as PROCESSING. Internal FAILED and MANUAL_REVIEW are also exposed
            as PROCESSING with noticeCode REFUND_DELAYED. Other Refunds and the
            compensation PAYMENT step are not combined. NOT_REQUIRED is used
            exactly when the cancellation requested refund amount is zero. That
            covers a BENEFIT_ONLY cancellation, where all four amounts are zero;
            a PENDING_PAYMENT cancellation, which has no approval and no durable
            snapshot to verify and therefore omits all four amounts rather than
            reporting them as zero; and a PAID cancellation whose approved
            amount was already fully returned by an earlier refund, where
            approvedAmountKrw and succeededRefundAmountBeforeCancellationKrw
            stay positive.
            Internal setup damage is exposed as PROCESSING with REFUND_DELAYED;
            SETUP_INCOMPLETE and missing artifact details are operator-only.
          enum:
            - NOT_REQUIRED
            - REQUESTED
            - PROCESSING
            - SUCCEEDED
        noticeCode:
          type: string
          description: |
            Present as REFUND_DELAYED after automatic processing is exhausted or
            when required cancellation refund setup is incomplete. Clients show
            an information icon and localized delay/apology copy. Retry mode,
            attempt count, failure code, setup artifact details and manual-review
            status are never exposed to customers.
          enum: [REFUND_DELAYED]
        approvedAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Immutable Provider-approved amount snapshotted by the cancellation
            transaction. Present for a complete setup and omitted rather than
            inferred when the durable snapshot is unavailable.
        succeededRefundAmountBeforeCancellationKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Sum of SUCCEEDED Refund amounts committed before the cancellation
            transaction. Present for a complete setup and omitted when the durable
            snapshot is unavailable.
        cancellationRequestedRefundAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Refund amount requested by this customer cancellation. Present for a
            complete setup and omitted when the durable snapshot is unavailable.
        remainingRefundableAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Current actual refundable balance at representation time: approved
            amount minus all SUCCEEDED Refund amounts. REQUESTED, PROCESSING,
            RETRY_SCHEDULED, UNKNOWN, RECONCILING, FAILED and MANUAL_REVIEW Refunds
            do not reduce this value until they succeed.
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
      allOf:
        # A delay notice is only ever attached to the PROCESSING projection.
        - if:
            required: [noticeCode]
          then:
            properties:
              state:
                const: PROCESSING
        # The four allocation amounts are all-or-nothing. They are omitted, never
        # inferred, when the durable cancellation snapshot cannot verify them
        # (setup damage, or a PENDING_PAYMENT cancellation that has no snapshot).
        - if:
            required: [approvedAmountKrw]
          then:
            required:
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            required: [cancellationRequestedRefundAmountKrw]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - remainingRefundableAmountKrw
        # A verified setup always reports the amounts. Only the delayed
        # projection may omit them.
        - if:
            allOf:
              - required: [state]
                properties:
                  state:
                    enum: [REQUESTED, SUCCEEDED]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            allOf:
              - required: [state]
                properties:
                  state:
                    const: PROCESSING
              - not:
                  required: [noticeCode]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        # NOT_REQUIRED means only that this cancellation requested no cash. The
        # approved amount and the refunds that succeeded before the cancellation
        # may be positive, for example when an earlier refund already returned
        # the full approved amount. BENEFIT_ONLY is the special case where all
        # four amounts are zero.
        - if:
            properties:
              state:
                const: NOT_REQUIRED
            required: [state]
          then:
            not:
              required: [noticeCode]
            properties:
              cancellationRequestedRefundAmountKrw:
                const: 0
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        lineItems:
          type: array
          minItems: 1
          description: |
            Omit to request a full refund of every remaining refundable unit. Each
            successful request consumes the lowest unrefunded conceptual unit positions.
          items:
            $ref: "#/components/schemas/RefundLineRequest"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RefundLineRequest:
      type: object
      additionalProperties: false
      required: [orderLineId, quantity]
      properties:
        orderLineId:
          $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
    Refund:
      type: object
      additionalProperties: false
      description: |
        Requested amounts are immutable snapshots present in every state.
        state describes the Payment-owned cash refund. pointsRestorationState
        independently describes Loyalty restoration. Each confirmed amount exists
        only when its owner state is SUCCEEDED. Absence never means zero.
      required:
        - refundId
        - paymentId
        - state
        - cashRefundRequestedKrw
        - pointsRestorationRequestedKrw
        - pointsRestorationState
        - currency
        - createdAt
        - updatedAt
        - correlationId
      properties:
        refundId:
          $ref: "#/components/schemas/Identifier"
        paymentId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum:
            [REQUESTED, PROCESSING, RETRY_SCHEDULED, SUCCEEDED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
        cashRefundRequestedKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Immutable cash refund amount requested for this Refund
        pointsRestorationRequestedKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Immutable points restoration amount requested for this Refund
        pointsRestorationState:
          type: string
          description: |
            Public state of the asynchronous Loyalty restoration. REQUESTED is
            used before cash refund success. PROCESSING includes durable
            publication pending and bounded retry after cash refund success.
            MANUAL_REVIEW means automatic convergence stopped; it is not success.
          enum: [NOT_REQUIRED, REQUESTED, PROCESSING, SUCCEEDED, MANUAL_REVIEW]
        cashRefundedKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Confirmed cash refund amount; present only in SUCCEEDED
        pointsRestoredKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Confirmed Loyalty restoration amount; present only when
            pointsRestorationState is SUCCEEDED
        currency:
          $ref: "#/components/schemas/Currency"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
      allOf:
        - if:
            properties:
              state:
                const: SUCCEEDED
            required: [state]
          then:
            required: [cashRefundedKrw]
          else:
            not:
              required: [cashRefundedKrw]
        - if:
            properties:
              pointsRestorationState:
                const: SUCCEEDED
            required: [pointsRestorationState]
          then:
            required: [pointsRestoredKrw]
          else:
            not:
              required: [pointsRestoredKrw]
        - if:
            properties:
              pointsRestorationState:
                const: NOT_REQUIRED
            required: [pointsRestorationState]
          then:
            properties:
              pointsRestorationRequestedKrw:
                const: 0
          else:
            properties:
              pointsRestorationRequestedKrw:
                minimum: 1
        - if:
            properties:
              pointsRestorationState:
                enum: [PROCESSING, SUCCEEDED, MANUAL_REVIEW]
            required: [pointsRestorationState]
          then:
            properties:
              state:
                const: SUCCEEDED
        - if:
            properties:
              pointsRestorationState:
                const: REQUESTED
            required: [pointsRestorationState]
          then:
            properties:
              state:
                not:
                  const: SUCCEEDED
    StoreOrderTransitionRequest:
      type: object
