          maxLength: 500
    UpdateExpiredBenefitRestorationPolicyRequest:
      type: object
      additionalProperties: false
      required: [expectedPolicyVersionId, mode, compensationValidityDays, reason]
      properties:
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
        mode:
          type: string
          enum: [COMPENSATE_WITH_NEW_ISSUANCE, PRESERVE_ORIGINAL_EXPIRY]
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Cancellation:
      type: object
      additionalProperties: false
      description: |
        Cancellation result for an order. The order is identified by orderId; no
        separate cancellation identifier exists because cancellation is not a
        separate aggregate and an order can be cancelled at most once.
      required:
        [orderId, orderState, reasonCode, paymentRecovery, cancelledAt, correlationId]
      properties:
        orderId:
          $ref: "#/components/schemas/Identifier"
        orderState:
          const: CANCELLED
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        paymentRecovery:
          $ref: "#/components/schemas/CancellationRefundRecoverySummary"
        cancelledAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    PaymentConfirmationRequest:
      type: object
      additionalProperties: false
      required: [paymentMethodId]
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
    PaymentConfirmation:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - orderId
        - type
        - approvalState
        - currency
        - updatedAt
        - correlationId
      properties:
        paymentId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        type:
          type: string
          enum: [EXTERNAL, BENEFIT_ONLY]
        approvalState:
          $ref: "#/components/schemas/PaymentApprovalState"
        approvedAmountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        recovery:
          $ref: "#/components/schemas/PaymentApprovalRecoverySummary"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    BenefitOnlyPayment:
      allOf:
        - $ref: "#/components/schemas/PaymentConfirmation"
        - type: object
          properties:
            type:
              const: BENEFIT_ONLY
            approvalState:
              const: APPROVED
            approvedAmountKrw:
              const: 0
    PaymentApprovalState:
      type: string
      enum: [APPROVED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
    PaymentApprovalRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Recovery progress for an unknown payment approval result or its bounded
        Provider lookup/late-approval recovery. This schema deliberately contains
        only recovery state and time; cancellation refund notice and allocation
        amounts belong to CancellationRefundRecoverySummary.
      required: [state, lastUpdatedAt]
      properties:
        state:
          type: string
          enum: [REQUESTED, PROCESSING, RECONCILING, SUCCEEDED, MANUAL_REVIEW]
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
    CancellationRefundRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Customer-facing recovery projection for the Refund created by a customer
        cancellation. Internal Refund states are projected to the public state
        and optional notice below; verified cancellation allocation amounts are
        included only when their durable sources are complete.
      required:
        - state
      oneOf:
        - required:
            - approvedAmountKrw
            - succeededRefundAmountBeforeCancellationKrw
            - cancellationRequestedRefundAmountKrw
            - remainingRefundableAmountKrw
        - required: [state, noticeCode]
          properties:
            state:
              const: PROCESSING
            noticeCode:
              const: REFUND_DELAYED
          not:
            anyOf:
              - required: [approvedAmountKrw]
              - required: [succeededRefundAmountBeforeCancellationKrw]
              - required: [cancellationRequestedRefundAmountKrw]
              - required: [remainingRefundableAmountKrw]
      properties:
        state:
          type: string
          description: |
            Customer-facing projection of the Refund created for this cancellation
            only. Internal PROCESSING, RETRY_SCHEDULED, UNKNOWN and RECONCILING are
            exposed as PROCESSING. Internal FAILED and MANUAL_REVIEW are also exposed
            as PROCESSING with noticeCode REFUND_DELAYED. Other Refunds and the
            compensation PAYMENT step are not combined. NOT_REQUIRED is used only
            when the cancellation requested refund amount is zero, including a
            BENEFIT_ONLY cancellation with no Refund or Provider call.
            Internal setup damage is exposed as PROCESSING with REFUND_DELAYED;
            SETUP_INCOMPLETE and missing artifact details are operator-only.
          enum:
            - NOT_REQUIRED
            - REQUESTED
            - PROCESSING
            - SUCCEEDED
        noticeCode:
          type: string
          description: |
            Present as REFUND_DELAYED after automatic processing is exhausted or
            when required cancellation refund setup is incomplete. Clients show
            an information icon and localized delay/apology copy. Retry mode,
            attempt count, failure code, setup artifact details and manual-review
            status are never exposed to customers.
          enum: [REFUND_DELAYED]
        approvedAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Immutable Provider-approved amount snapshotted by the cancellation
            transaction. Present for a complete setup and omitted rather than
            inferred when the durable snapshot is unavailable.
        succeededRefundAmountBeforeCancellationKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Sum of SUCCEEDED Refund amounts committed before the cancellation
            transaction. Present for a complete setup and omitted when the durable
            snapshot is unavailable.
        cancellationRequestedRefundAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Refund amount requested by this customer cancellation. Present for a
            complete setup and omitted when the durable snapshot is unavailable.
        remainingRefundableAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Current actual refundable balance at representation time: approved
            amount minus all SUCCEEDED Refund amounts. REQUESTED, PROCESSING,
            RETRY_SCHEDULED, UNKNOWN, RECONCILING, FAILED and MANUAL_REVIEW Refunds
            do not reduce this value until they succeed.
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
      allOf:
        - if:
            required: [noticeCode]
          then:
            properties:
              state:
                const: PROCESSING
        - if:
            properties:
              state:
                const: NOT_REQUIRED
            required: [state]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
            not:
              required: [noticeCode]
            properties:
              approvedAmountKrw:
                const: 0
              succeededRefundAmountBeforeCancellationKrw:
                const: 0
              cancellationRequestedRefundAmountKrw:
                const: 0
              remainingRefundableAmountKrw:
                const: 0
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        lineItems:
          type: array
          minItems: 1
          description: Omit to request a full refund of the remaining refundable amount
          items:
            $ref: "#/components/schemas/RefundLineRequest"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RefundLineRequest:
      type: object
      additionalProperties: false
      required: [orderLineId, quantity]
      properties:
        orderLineId:
          $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
    Refund:
