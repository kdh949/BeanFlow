          type: string
          minLength: 1
          maxLength: 320
          description: Raw phone or email used transiently for this body-only exact search.
    SearchSupportSubjectsRequest:
      type: object
      additionalProperties: false
      required: [criterion, subjectTypes, reasonCode]
