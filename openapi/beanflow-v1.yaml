      properties:
        accountId:
          $ref: "#/components/schemas/Identifier"
        availablePointsKrw:
          $ref: "#/components/schemas/MoneyKrw"
        recoveryPendingKrw:
          $ref: "#/components/schemas/MoneyKrw"
          description: Sum of Loyalty PointRecoveryPending remaining amounts. It is not a negative available balance.
        currency:
          $ref: "#/components/schemas/Currency"
