        매장 전용 설정과 공통 정책 상속으로 전환한 기록을 모두 확인할 수 있습니다.

        주요 오류:
        - 400: 조회 사유나 페이지 커서가 올바르지 않은 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 매장별 적립 정책 이력 조회 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
