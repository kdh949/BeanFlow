openapi: 3.1.0
info:
  title: BeanFlow API
  version: 0.2.0
  x-beanflow-contract-status: target
  x-beanflow-contract-date: 2026-08-01
  description: |
    Pre-release target contract for BeanFlow discovery, ordering, payment,
    pickup, loyalty, settlement, and dispute workflows. An operation in this
    file is not evidence that it is deployed. The machine-readable contract for
    currently implemented public controller mappings is beanflow-v1-deployed.yaml.

    All monetary values are integer KRW. All timestamps are ISO-8601 date-time
    values with an offset or UTC designator. A 202 response means processing or
    reconciliation is still in progress and must not be interpreted as success.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Discovery
  - name: Ordering
  - name: Payment
  - name: Store Orders
  - name: Operations
  - name: Loyalty
  - name: Settlement
  - name: Dispute
paths:
  /stores/nearby:
    get:
      tags: [Discovery]
      operationId: searchNearbyStores
      summary: Search nearby pickup-capable stores
      description: |
        Precise customer coordinates are used only for this request and are not
        persisted or written to application logs or traces. radiusMeters is 1..10000.
        Results use a canonical micrometer distance tuple and return its floored
        integer-meter display value.
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/RadiusMeters"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Nearby stores ordered by distance and store ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyStorePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/menus:
    get:
      tags: [Discovery]
      operationId: listStoreMenus
      summary: List currently visible menus for a store
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Visible menus and options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/pickup-slots:
    get:
      tags: [Discovery]
      operationId: listStorePickupSlots
      summary: List available pickup slots
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Pickup slots with current remaining capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupSlotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders:
    post:
      tags: [Ordering]
      operationId: createOrder
      summary: Create an order and reserve required resources
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: |
            Order creation committed. External-payment orders have a required
            five-minute reservation deadline. Zero-payable orders include an
            approved BENEFIT_ONLY payment and no active reservation deadline.
            An idempotent replay returns the originally stored 201 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OrderCreationConflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}:
    get:
      tags: [Ordering]
      operationId: getOrder
      summary: Get an order and materialize a due reservation expiry
      description: |
        If a PENDING_PAYMENT order has reached reservationExpiresAt, the server
        atomically expires the order and releases all reserved resources before
        returning EXPIRED. If that transaction fails, the request returns 503
        instead of a stale successful representation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order visible to the authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelOrder
      summary: Cancel an order in a customer-allowed state
      description: |
        PENDING_PAYMENT and PAID orders not yet ACCEPTED may be cancelled by the
        owning customer. Order cancellation and payment refund recovery are
        represented separately. Cancellation is not a separate aggregate, so the
        order itself is the cancellation resource and no new resource is created.

        Idempotency scope is actor ID, operation, and Idempotency-Key. The hashed
        payload covers orderId, reasonCode, and the normalized detail, so reusing
        one key across different orders returns 409 IDEMPOTENCY_KEY_REUSED and
        never replays another order's result. A repeated request with the same key
        and payload returns the originally stored 200 or 202 body unchanged; its
        paymentRecovery is a snapshot taken at cancellation time, so current
        progress must be read from GET /orders/{orderId}. This operation never
        returns IDEMPOTENCY_REQUEST_IN_PROGRESS because concurrent requests are
        serialized by the order row lock. A rolled back request stores no record,
        so retrying the same key re-executes and the order state guard returns
        409 ORDER_STATE_CONFLICT for an already cancelled order.

        If an earlier Refund is REQUESTED, PROCESSING, RETRY_SCHEDULED, UNKNOWN,
        RECONCILING, or MANUAL_REVIEW, cancellation returns 409
        PAYMENT_REFUND_UNRESOLVED before
        changing the order. Retry the same key after that Refund reaches SUCCEEDED
        or definitive FAILED. Payment lock timeouts and database failures return
        503 instead of this business conflict.

        If a PAID order has reached acceptanceDeadlineAt, this command does not
        perform customer cancellation. It durably requests deduplicated store
        timeout work and returns 409 ORDER_STATE_CONFLICT. Failure to persist that
        work returns 503. The order may remain PAID briefly until the timeout
        worker commits REJECTED.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationRequest"
      responses:
        "200":
          description: |
            Cancellation completed synchronously. Used for PENDING_PAYMENT orders
            where reservation release is committed in the same transaction and no
            external refund exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cancellation"
        "202":
          description: |
            Cancellation is recorded but compensation is still in progress. Used
            for PAID orders. Does not mean the refund or resource restoration
            succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cancellation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}/payment-confirmations:
    post:
      tags: [Payment]
      operationId: confirmOrderPayment
      summary: Request or confirm payment for an order
      description: |
        The same Idempotency-Key and payload never create a second Provider
        approval. If the Provider result is unknown, the response is 202 and
        reconciliation continues. If the five-minute order lease expires first,
        a later approval never revives the order and triggers void or refund
        recovery.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirmationRequest"
      responses:
        "200":
          description: External payment approval or late-approval recovery is confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "202":
          description: Payment result or late-approval recovery is unresolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}/refunds:
    post:
      tags: [Payment]
      operationId: createPaymentRefund
      summary: Create a full or item-based partial refund
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: |
            Refund resource creation and the synchronous result are confirmed.
            Requested amount snapshots and pointsRestorationState are always
            present. Each confirmed amount follows its owner-specific state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "202":
          description: |
            Refund result is unknown or reconciliation is in progress. Requested
            amount snapshots and pointsRestorationState are present. A confirmed
            points amount may exist only if its asynchronous Loyalty work already
            succeeded; HTTP 202 alone does not determine either confirmed amount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}:
    get:
      tags: [Store Orders]
      operationId: getStoreOrder
      summary: Get an order and its abbreviated compensation status
      description: |
        Returns the store projection of the order plus a compensation summary
        limited to trigger, case state and updatedAt. Step detail, attempt
        counts, internal error codes, the case identifier and benefit policy
        versions are operator-only and available from
        GET /operations/orders/{orderId}/compensation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Store order visible to an authorized active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}/status:
    patch:
      tags: [Store Orders]
      operationId: transitionStoreOrderStatus
      summary: Transition an order from the store operational view
      description: |
        store-orders is a store-facing view of the Ordering-owned Order, not a
        separate Aggregate. Cancellation after ACCEPTED is not an allowed target.

        Idempotency scope is actor ID, operation, and Idempotency-Key. The hashed
        payload covers orderId, targetState, and the normalized reason, so reusing
        one key across different orders returns 409 IDEMPOTENCY_KEY_REUSED and
        never replays another order's result.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderTransitionRequest"
      responses:
        "200":
          description: Synchronous ACCEPTED, PREPARING, READY, or COMPLETED transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "202":
          description: |
            REJECTED is committed and compensation is still tracked separately.
            This response does not mean refund or resource restoration succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/orders/{orderId}/compensation:
    get:
      tags: [Operations]
      operationId: getOrderCompensation
      summary: Read owner compensation progress for a rejected or cancelled order
      description: |
        Platform operator view of the order compensation case. Step level state,
        attempt counts and internal error codes are operator-only and are never
        returned to customers or store members.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Compensation case for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCompensationView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/reprocessing-cases/{caseId}/repair-proposals:
    post:
      tags: [Operations]
      operationId: proposeCustomerCancellationSetupRepair
      summary: Propose the safe recreation of a missing customer-cancellation Refund
      description: |
        Creates a 30-minute repair proposal after validating that the durable
        recovery snapshot is complete and only the Refund row is missing. Requires
        an active PLATFORM_OPERATOR. Financial values and provider keys are
        server-derived and cannot be supplied by the caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: caseId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepairProposalRequest"
      responses:
        "201":
          description: Pending proposal or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/reprocessing-repair-proposals/{proposalId}/decisions:
    post:
      tags: [Operations]
      operationId: decideCustomerCancellationSetupRepair
      summary: Approve or reject a missing-Refund repair proposal
      description: |
        Requires a different active PLATFORM_OPERATOR from the proposer. Approval
        revalidates every safety guard under Order and Payment locks. A successful
        approval recreates the Refund for same-key LOOKUP; it never calls the
        provider inside the HTTP transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: proposalId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairProposalDecisionRequest"
      responses:
        "200":
          description: Terminal proposal or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration:
    get:
      tags: [Operations]
      operationId: listExpiredBenefitRestorationPolicies
      summary: List the five current trigger and benefit policy heads
      description: |
        Requires an active PLATFORM_OPERATOR with the explicit
        EXPIRED_BENEFIT_POLICY_READ grant and a non-blank X-Access-Reason.
        The server records the read access before returning the current heads.
      parameters:
        - $ref: "#/components/parameters/AccessReason"
      responses:
        "200":
          description: Current policy heads ordered by trigger and benefit type
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration/{trigger}/{benefitType}:
    patch:
      tags: [Operations]
      operationId: updateExpiredBenefitRestorationPolicy
      summary: Create a new version for one trigger and benefit policy
      description: Requires an active PLATFORM_OPERATOR with the explicit EXPIRED_BENEFIT_POLICY_WRITE grant.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: trigger
          in: path
          required: true
          schema:
            type: string
            enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        - name: benefitType
          in: path
          required: true
          schema:
            type: string
            enum: [COUPON, POINTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpiredBenefitRestorationPolicyRequest"
      responses:
        "200":
          description: New policy head or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          description: |
            The policy key does not exist. PARTIAL_REFUND is valid only with
            POINTS; PARTIAL_REFUND/COUPON never creates a head.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /point-accounts/{accountId}:
    get:
      tags: [Loyalty]
      operationId: getPointAccount
      summary: Get a point account summary
      description: |
        The customer who owns the account may read without a reason. A PLATFORM_OPERATOR
        support read requires an active POINT_ACCOUNT_READ grant and X-Access-Reason;
        the server records the target access audit before returning 200.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/OptionalAccessReason"
      responses:
        "200":
          description: Point account visible to its owner or an authorized operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /point-accounts/{accountId}/transactions:
    get:
      tags: [Loyalty]
      operationId: listPointTransactions
      summary: List point ledger transactions
      description: |
        The customer who owns the account may read without a reason. A PLATFORM_OPERATOR
        support read requires an active POINT_ACCOUNT_READ grant and X-Access-Reason.
        Results use the stable (occurredAt DESC, transactionId DESC) tuple; the cursor is
        bound to this account and endpoint.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/OptionalAccessReason"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Point transactions in stable ledger order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/point-accounts/{accountId}/adjustments:
    post:
      tags: [Operations, Loyalty]
      operationId: createAuditedPointAdjustment
      summary: Apply an audited signed point adjustment
      description: |
        Requires an active PLATFORM_OPERATOR with an explicit POINT_ADJUSTMENT
        grant, a non-blank reason, and evidence references. The command is
        idempotent by actor, operation, Idempotency-Key, account ID and canonical
        request payload. Positive adjustments require a caller-selected issuer
        snapshot and future expiry; negative adjustments may consume only available
        point lots. No provider is called and no partial debit, negative balance,
        or recovery pending fallback is allowed.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointAdjustmentRequest"
      responses:
        "201":
          description: Applied adjustment or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAdjustmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/settlements:
    get:
      tags: [Settlement]
      operationId: listStoreSettlements
      summary: List settlement batches for an owned store
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Settlement batches ordered by settlement date and ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementBatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/settlements/{settlementBatchId}/items:
    get:
      tags: [Settlement]
      operationId: listStoreSettlementItems
      summary: List settlement items in an owned store batch
      description: |
        Returns the item identifiers and immutable amount snapshots needed to
        inspect a settlement batch and file an item dispute. Items are ordered by
        completedAt and settlementItemId ascending. The cursor is scoped to this
        store and batch and cannot be reused for another batch.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/SettlementBatchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Settlement items in stable ledger order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /settlement-items/{itemId}/disputes:
    post:
      tags: [Dispute]
      operationId: createSettlementDispute
      summary: File a dispute for a confirmed settlement item
      parameters:
        - $ref: "#/components/parameters/SettlementItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisputeRequest"
      responses:
        "201":
          description: Dispute filed and its expected adjustment amount held internally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Unique within actor ID and API operation
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StoreId:
      in: path
      name: storeId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    PointAccountId:
      in: path
      name: accountId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettlementItemId:
      in: path
      name: itemId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SettlementBatchId:
      in: path
      name: settlementBatchId
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    Latitude:
      in: query
      name: latitude
      required: true
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Longitude:
      in: query
      name: longitude
      required: true
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RadiusMeters:
      in: query
      name: radiusMeters
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
      description: Search radius in meters. Maximum 10000.
    Cursor:
      in: query
      name: cursor
      required: false
      description: |
        Opaque versioned HMAC-signed cursor returned by the previous page. It is
        bound to this endpoint, its filters and stable sort tuple, expires within
        24 hours, and cannot be reused for another scope. Malformed, expired or
        scope-mismatched cursors return 400 INVALID_REQUEST. Maximum length is 2048
        characters.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Limit:
      in: query
      name: limit
      required: false
      description: Maximum items to return. Defaults to 20 and may not exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccessReason:
      in: header
      name: X-Access-Reason
      required: true
      description: |
        Purpose for an audited privileged policy read. The server trims the value,
        requires 1 to 200 characters after trimming, and rejects control characters.
      schema:
        type: string
    OptionalAccessReason:
      in: header
      name: X-Access-Reason
      required: false
      description: |
        Required when a PLATFORM_OPERATOR uses a point-account support read; not
        required for the customer who owns the account. The server trims the value,
        requires 1 to 200 characters after trimming, and rejects control characters.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request syntax or field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Role, ownership, or store membership check failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource is not visible in the authenticated actor scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State, capacity, duplicate resource, or idempotency payload conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrderCreationConflict:
      description: |
        Order resource conflict, idempotency payload reuse, or an identical
        idempotent request that is still processing. The latter returns code
        IDEMPOTENCY_REQUEST_IN_PROGRESS and a Retry-After header.
      headers:
        Retry-After:
          required: false
          description: |
            Delay before retrying the same Idempotency-Key. Present for
            IDEMPOTENCY_REQUEST_IN_PROGRESS.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Provider explicitly declined a syntactically valid command
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DependencyUnavailable:
      description: A required dependency is unavailable; no fallback result was used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
    DateTime:
      type: string
      format: date-time
    MoneyKrw:
      type: integer
      format: int64
      minimum: 0
      description: Integer Korean won
    SignedMoneyKrw:
      type: integer
      format: int64
      description: Signed integer Korean won
    Currency:
      type: string
      enum: [KRW]
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, details]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        correlationId:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        field:
          type: string
        reason:
          type: string
          minLength: 1
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
    NearbyStorePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NearbyStore"
        page:
          $ref: "#/components/schemas/PageInfo"
    NearbyStore:
      type: object
      additionalProperties: false
      required:
        [storeId, name, distanceMeters, open, pickupAvailable]
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        distanceMeters:
          type: integer
          minimum: 0
          description: Floored integer meters from the canonical micrometer query distance. It is a display value, not the cursor tuple.
        open:
          type: boolean
        pickupAvailable:
          type: boolean
    MenuList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
    Menu:
      type: object
      additionalProperties: false
      required: [menuId, name, basePriceKrw, currency, available, options]
      properties:
        menuId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        basePriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        available:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/MenuOption"
    MenuOption:
      type: object
      additionalProperties: false
      required: [optionId, name, additionalPriceKrw, available]
      properties:
        optionId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          minLength: 1
        additionalPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        available:
          type: boolean
    PickupSlotList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PickupSlot"
    PickupSlot:
      type: object
      additionalProperties: false
      required: [pickupSlotId, startsAt, endsAt, remainingCapacity]
      properties:
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        startsAt:
          $ref: "#/components/schemas/DateTime"
        endsAt:
          $ref: "#/components/schemas/DateTime"
        remainingCapacity:
          type: integer
          minimum: 0
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [storeId, pickupSlotId, lines, pointsToUseKrw]
      properties:
        storeId:
          $ref: "#/components/schemas/Identifier"
        pickupSlotId:
          $ref: "#/components/schemas/Identifier"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderLineRequest"
        couponIssuanceId:
          $ref: "#/components/schemas/Identifier"
        pointsToUseKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CreateOrderLineRequest:
      type: object
      additionalProperties: false
      required: [menuId, optionIds, quantity]
      properties:
        menuId:
          $ref: "#/components/schemas/Identifier"
        optionIds:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
    CreateOrderResult:
      oneOf:
        - $ref: "#/components/schemas/PendingPaymentOrderCreation"
        - $ref: "#/components/schemas/BenefitOnlyOrderCreation"
    PendingPaymentOrderCreation:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/PendingPaymentOrder"
    BenefitOnlyOrderCreation:
      type: object
      additionalProperties: false
      required: [order, payment]
      properties:
        order:
          $ref: "#/components/schemas/BenefitOnlyPaidOrder"
        payment:
          $ref: "#/components/schemas/BenefitOnlyPayment"
    PendingPaymentOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [reservationExpiresAt]
          properties:
            state:
              const: PENDING_PAYMENT
            reservationExpiresAt:
              $ref: "#/components/schemas/DateTime"
            payableKrw:
              type: integer
              format: int64
              minimum: 1
    BenefitOnlyPaidOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          not:
            required: [reservationExpiresAt]
          properties:
            state:
              const: PAID
            payableKrw:
              const: 0
    Order:
      type: object
      additionalProperties: false
      required:
        - orderId
        - storeId
        - state
        - lines
        - subtotalKrw
        - couponDiscountKrw
        - pointsAppliedKrw
        - payableKrw
        - currency
        - createdAt
        - updatedAt
      properties:
        orderId:
          $ref: "#/components/schemas/Identifier"
        storeId:
          $ref: "#/components/schemas/Identifier"
        state:
          $ref: "#/components/schemas/OrderState"
        reservationExpiresAt:
          $ref: "#/components/schemas/DateTime"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLine"
        subtotalKrw:
          $ref: "#/components/schemas/MoneyKrw"
        couponDiscountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        payableKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        paymentRecovery:
          $ref: "#/components/schemas/CancellationRefundRecoverySummary"
        paidAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceWarningAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceWarningRequestedAt:
          $ref: "#/components/schemas/DateTime"
        acceptanceDeadlineAt:
          $ref: "#/components/schemas/DateTime"
        acceptedAt:
          $ref: "#/components/schemas/DateTime"
        rejectedAt:
          $ref: "#/components/schemas/DateTime"
        preparingAt:
          $ref: "#/components/schemas/DateTime"
        readyAt:
          $ref: "#/components/schemas/DateTime"
        completedAt:
          $ref: "#/components/schemas/DateTime"
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 500
        cancelledAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
          description: |
            Present only when state is CANCELLED. Required together with
            cancellationCause by the order cancellation model (ADR-029).
        cancellationCause:
          allOf:
            - $ref: "#/components/schemas/CancellationCause"
          description: |
            System-determined cancellation origin. Present only when state is
            CANCELLED. Independent of the customer-declared reason code.
        cancellationReasonCode:
          allOf:
            - $ref: "#/components/schemas/CancellationReasonCode"
          description: |
            Customer-declared reason, present only when cancellationCause is
            CUSTOMER_REQUEST. Customer projection only; the store projection
            (StoreOrder) never carries it. The free-text cancellation detail is
            never exposed in any representation.
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    OrderState:
      type: string
      enum:
        - PENDING_PAYMENT
        - PAID
        - ACCEPTED
        - PREPARING
        - READY
        - COMPLETED
        - EXPIRED
        - CANCELLED
        - REJECTED
    OrderLine:
      type: object
      additionalProperties: false
      required:
        - orderLineId
        - menuId
        - menuName
        - optionNames
        - unitPriceKrw
        - quantity
        - couponDiscountKrw
        - pointsAppliedKrw
        - cashPaidKrw
      properties:
        orderLineId:
          $ref: "#/components/schemas/Identifier"
        menuId:
          $ref: "#/components/schemas/Identifier"
        menuName:
          type: string
          minLength: 1
        optionNames:
          type: array
          items:
            type: string
        unitPriceKrw:
          $ref: "#/components/schemas/MoneyKrw"
        quantity:
          type: integer
          minimum: 1
        couponDiscountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        cashPaidKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CancellationRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        detail:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |
            Optional free-text detail supplied by the customer. The server trims it
            before validation. An empty normalized value is treated as absent. A
            present normalized value must contain 1 to 200 characters.
            Control characters are rejected. Stored on the order only. Never
            included in events, audit records, provider requests, application
            logs or any API response.
    CancellationReasonCode:
      type: string
      description: Customer-declared cancellation reason, independent of the system-determined cause
      enum:
        - CHANGED_MIND
        - ORDER_MISTAKE
        - WAIT_TOO_LONG
        - PICKUP_TIME_CONFLICT
        - PAYMENT_ISSUE
        - OTHER
    CancellationCause:
      type: string
      description: |
        System-determined cancellation origin. CUSTOMER_REQUEST is a customer
        cancellation command; PAYMENT_DECLINED is a cancellation caused by an
        explicit Provider approval decline. Only CUSTOMER_REQUEST cancellations
        carry a customer-declared reason code.
      enum:
        - CUSTOMER_REQUEST
        - PAYMENT_DECLINED
    StoreOrder:
      description: |
        Store-facing Order projection. Store members see the cancellation fact
        (state, cancelledAt, cancellationCause) so they can distinguish a
        customer cancellation from a rejection or a declined payment, but they
        never see the customer-declared reason code or customer refund recovery
        progress. The free-text cancellation detail is excluded from every
        representation.
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          not:
            anyOf:
              - required: [cancellationReasonCode]
              - required: [paymentRecovery]
    StoreOrderResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/StoreCompensationSummary"
    StoreCompensationSummary:
      type: object
      additionalProperties: false
      description: |
        Store-facing compensation projection for a terminated order. Store
        members see what terminated the order and whether owner compensation is
        still running, but never the step breakdown, attempt counts, internal
        error codes, case identifier or benefit policy versions. Those are
        operator-only and returned by OperatorCompensationView (ADR-030,
        ADR-033). Order termination does not imply compensation success.
      required: [trigger, state, updatedAt]
      properties:
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    CompensationSummary:
      type: object
      additionalProperties: false
      description: |
        Full owner compensation progress for a terminated order. The same shape
        covers store rejection and customer cancellation; the trigger field
        distinguishes the origin. Step detail, attempt counts, internal error
        codes, the case identifier and the benefit policy versions are
        operator-only, so this schema is returned only inside
        OperatorCompensationView; store members receive the abbreviated
        StoreCompensationSummary. Order termination does not imply compensation
        success.
      required: [caseId, trigger, benefitPolicies, state, steps, updatedAt]
      properties:
        caseId:
          $ref: "#/components/schemas/Identifier"
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        benefitPolicies:
          type: array
          minItems: 2
          maxItems: 2
          description: Immutable COUPON and POINTS policy version references selected with the case
          items:
            $ref: "#/components/schemas/CompensationBenefitPolicyReference"
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        steps:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/CompensationStep"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    OperatorCompensationView:
      type: object
      additionalProperties: false
      description: Platform-operator-only compensation and payment setup integrity view
      required: [compensation]
      properties:
        compensation:
          $ref: "#/components/schemas/CompensationSummary"
        paymentSetupIssue:
          $ref: "#/components/schemas/PaymentSetupIssue"
        setupReprocessingCaseId:
          $ref: "#/components/schemas/Identifier"
    PaymentSetupIssue:
      type: object
      additionalProperties: false
      description: Operator-only integrity issue; never returned in customer or store representations
      required: [state, detectedAt, lastErrorCode]
      anyOf:
        - required: [missingArtifacts]
        - required: [invariantViolations]
      properties:
        state:
          const: SETUP_INCOMPLETE
        missingArtifacts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CANCELLATION_REFUND, PAYMENT_RECOVERY_SNAPSHOT]
        invariantViolations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [SOURCE_MISMATCH, AMOUNT_TIE_OUT_MISMATCH]
        detectedAt:
          $ref: "#/components/schemas/DateTime"
        lastErrorCode:
          type: string
    CompensationBenefitPolicyReference:
      type: object
      additionalProperties: false
      required: [benefitType, policyVersionId]
      properties:
        benefitType:
          type: string
          enum: [COUPON, POINTS]
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
    CompensationStep:
      type: object
      additionalProperties: false
      required: [type, state, attemptCount]
      properties:
        type:
          type: string
          enum: [PAYMENT, PICKUP, STOCK, COUPON, POINTS, CUSTOMER_NOTIFICATION]
        state:
          type: string
          enum:
            [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, NOT_REQUIRED, MANUAL_REVIEW]
        attemptCount:
          type: integer
          minimum: 0
        lastErrorCode:
          type: string
    CreateRepairProposalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RepairProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RepairProposal:
      type: object
      additionalProperties: false
      required:
        [proposalId, caseId, action, state, proposedBy, createdAt, expiresAt, correlationId]
      properties:
        proposalId:
          $ref: "#/components/schemas/Identifier"
        caseId:
          $ref: "#/components/schemas/Identifier"
        action:
          const: RECREATE_MISSING_CANCELLATION_REFUND
        state:
          type: string
          enum: [PENDING_APPROVAL, EXECUTED, REJECTED, EXPIRED, STALE]
        proposedBy:
          $ref: "#/components/schemas/Identifier"
        decidedBy:
          $ref: "#/components/schemas/Identifier"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        expiresAt:
          $ref: "#/components/schemas/DateTime"
        decidedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    ExpiredBenefitRestorationPolicy:
      type: object
      additionalProperties: false
      required:
        [policyVersionId, trigger, benefitType, mode, compensationValidityDays, effectiveAt, updatedBy, reason]
      properties:
        policyVersionId:
          type: integer
          format: int64
          minimum: 1
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        benefitType:
          type: string
          enum: [COUPON, POINTS]
        mode:
          type: string
          enum: [COMPENSATE_WITH_NEW_ISSUANCE, PRESERVE_ORIGINAL_EXPIRY]
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
        effectiveAt:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/Identifier"
        reason:
          type: string
          minLength: 1
          maxLength: 500
      allOf:
        - if:
            properties:
              trigger:
                const: PARTIAL_REFUND
            required: [trigger]
          then:
            properties:
              benefitType:
                const: POINTS
    UpdateExpiredBenefitRestorationPolicyRequest:
      type: object
      additionalProperties: false
      required: [expectedPolicyVersionId, mode, compensationValidityDays, reason]
      properties:
        expectedPolicyVersionId:
          type: integer
          format: int64
          minimum: 1
        mode:
          type: string
          enum: [COMPENSATE_WITH_NEW_ISSUANCE, PRESERVE_ORIGINAL_EXPIRY]
        compensationValidityDays:
          type: integer
          minimum: 1
          maximum: 365
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Cancellation:
      type: object
      additionalProperties: false
      description: |
        Cancellation result for an order. The order is identified by orderId; no
        separate cancellation identifier exists because cancellation is not a
        separate aggregate and an order can be cancelled at most once.
      required:
        [orderId, orderState, reasonCode, paymentRecovery, cancelledAt, correlationId]
      properties:
        orderId:
          $ref: "#/components/schemas/Identifier"
        orderState:
          const: CANCELLED
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        paymentRecovery:
          $ref: "#/components/schemas/CancellationRefundRecoverySummary"
        cancelledAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    PaymentConfirmationRequest:
      type: object
      additionalProperties: false
      required: [paymentMethodId]
      properties:
        paymentMethodId:
          $ref: "#/components/schemas/Identifier"
    PaymentConfirmation:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - orderId
        - type
        - approvalState
        - currency
        - updatedAt
        - correlationId
      properties:
        paymentId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        type:
          type: string
          enum: [EXTERNAL, BENEFIT_ONLY]
        approvalState:
          $ref: "#/components/schemas/PaymentApprovalState"
        approvedAmountKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        recovery:
          $ref: "#/components/schemas/PaymentApprovalRecoverySummary"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    BenefitOnlyPayment:
      allOf:
        - $ref: "#/components/schemas/PaymentConfirmation"
        - type: object
          properties:
            type:
              const: BENEFIT_ONLY
            approvalState:
              const: APPROVED
            approvedAmountKrw:
              const: 0
    PaymentApprovalState:
      type: string
      enum: [APPROVED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
    PaymentApprovalRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Recovery progress for an unknown payment approval result or its bounded
        Provider lookup/late-approval recovery. This schema deliberately contains
        only recovery state and time; cancellation refund notice and allocation
        amounts belong to CancellationRefundRecoverySummary.
      required: [state, lastUpdatedAt]
      properties:
        state:
          type: string
          enum: [REQUESTED, PROCESSING, RECONCILING, SUCCEEDED, MANUAL_REVIEW]
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
    CancellationRefundRecoverySummary:
      type: object
      additionalProperties: false
      description: |
        Customer-facing recovery projection for the Refund created by a customer
        cancellation. Internal Refund states are projected to the public state
        and optional notice below; verified cancellation allocation amounts are
        included only when their durable sources are complete.
      required:
        - state
      properties:
        state:
          type: string
          description: |
            Customer-facing projection of the Refund created for this cancellation
            only. Internal PROCESSING, RETRY_SCHEDULED, UNKNOWN and RECONCILING are
            exposed as PROCESSING. Internal FAILED and MANUAL_REVIEW are also exposed
            as PROCESSING with noticeCode REFUND_DELAYED. Other Refunds and the
            compensation PAYMENT step are not combined. NOT_REQUIRED is used
            exactly when the cancellation requested refund amount is zero. That
            covers a BENEFIT_ONLY cancellation, where all four amounts are zero;
            a PENDING_PAYMENT cancellation, which has no approval and no durable
            snapshot to verify and therefore omits all four amounts rather than
            reporting them as zero; and a PAID cancellation whose approved
            amount was already fully returned by an earlier refund, where
            approvedAmountKrw and succeededRefundAmountBeforeCancellationKrw
            stay positive.
            Internal setup damage is exposed as PROCESSING with REFUND_DELAYED;
            SETUP_INCOMPLETE and missing artifact details are operator-only.
          enum:
            - NOT_REQUIRED
            - REQUESTED
            - PROCESSING
            - SUCCEEDED
        noticeCode:
          type: string
          description: |
            Present as REFUND_DELAYED after automatic processing is exhausted or
            when required cancellation refund setup is incomplete. Clients show
            an information icon and localized delay/apology copy. Retry mode,
            attempt count, failure code, setup artifact details and manual-review
            status are never exposed to customers.
          enum: [REFUND_DELAYED]
        approvedAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Immutable Provider-approved amount snapshotted by the cancellation
            transaction. Present for a complete setup and omitted rather than
            inferred when the durable snapshot is unavailable.
        succeededRefundAmountBeforeCancellationKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Sum of SUCCEEDED Refund amounts committed before the cancellation
            transaction. Present for a complete setup and omitted when the durable
            snapshot is unavailable.
        cancellationRequestedRefundAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Refund amount requested by this customer cancellation. Present for a
            complete setup and omitted when the durable snapshot is unavailable.
        remainingRefundableAmountKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Current actual refundable balance at representation time: approved
            amount minus all SUCCEEDED Refund amounts. REQUESTED, PROCESSING,
            RETRY_SCHEDULED, UNKNOWN, RECONCILING, FAILED and MANUAL_REVIEW Refunds
            do not reduce this value until they succeed.
        lastUpdatedAt:
          $ref: "#/components/schemas/DateTime"
      allOf:
        # A delay notice is only ever attached to the PROCESSING projection.
        - if:
            required: [noticeCode]
          then:
            properties:
              state:
                const: PROCESSING
        # The four allocation amounts are all-or-nothing. They are omitted, never
        # inferred, when the durable cancellation snapshot cannot verify them
        # (setup damage, or a PENDING_PAYMENT cancellation that has no snapshot).
        - if:
            required: [approvedAmountKrw]
          then:
            required:
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            required: [cancellationRequestedRefundAmountKrw]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - remainingRefundableAmountKrw
        # A verified setup always reports the amounts. Only the delayed
        # projection may omit them.
        - if:
            allOf:
              - required: [state]
                properties:
                  state:
                    enum: [REQUESTED, SUCCEEDED]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        - if:
            allOf:
              - required: [state]
                properties:
                  state:
                    const: PROCESSING
              - not:
                  required: [noticeCode]
          then:
            required:
              - approvedAmountKrw
              - succeededRefundAmountBeforeCancellationKrw
              - cancellationRequestedRefundAmountKrw
              - remainingRefundableAmountKrw
        # NOT_REQUIRED means only that this cancellation requested no cash. The
        # approved amount and the refunds that succeeded before the cancellation
        # may be positive, for example when an earlier refund already returned
        # the full approved amount. BENEFIT_ONLY is the special case where all
        # four amounts are zero.
        - if:
            properties:
              state:
                const: NOT_REQUIRED
            required: [state]
          then:
            not:
              required: [noticeCode]
            properties:
              cancellationRequestedRefundAmountKrw:
                const: 0
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        lineItems:
          type: array
          minItems: 1
          description: Omit to request a full refund of the remaining refundable amount
          items:
            $ref: "#/components/schemas/RefundLineRequest"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    RefundLineRequest:
      type: object
      additionalProperties: false
      required: [orderLineId, quantity]
      properties:
        orderLineId:
          $ref: "#/components/schemas/Identifier"
        quantity:
          type: integer
          minimum: 1
    Refund:
      type: object
      additionalProperties: false
      description: |
        Requested amounts are immutable snapshots present in every state.
        state describes the Payment-owned cash refund. pointsRestorationState
        independently describes Loyalty restoration. Each confirmed amount exists
        only when its owner state is SUCCEEDED. Absence never means zero.
      required:
        - refundId
        - paymentId
        - state
        - cashRefundRequestedKrw
        - pointsRestorationRequestedKrw
        - pointsRestorationState
        - currency
        - createdAt
        - updatedAt
        - correlationId
      properties:
        refundId:
          $ref: "#/components/schemas/Identifier"
        paymentId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum:
            [REQUESTED, PROCESSING, RETRY_SCHEDULED, SUCCEEDED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
        cashRefundRequestedKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Immutable cash refund amount requested for this Refund
        pointsRestorationRequestedKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Immutable points restoration amount requested for this Refund
        pointsRestorationState:
          type: string
          description: |
            Public state of the asynchronous Loyalty restoration. REQUESTED is
            used before cash refund success. PROCESSING includes durable
            publication pending and bounded retry after cash refund success.
            MANUAL_REVIEW means automatic convergence stopped; it is not success.
          enum: [NOT_REQUIRED, REQUESTED, PROCESSING, SUCCEEDED, MANUAL_REVIEW]
        cashRefundedKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: Confirmed cash refund amount; present only in SUCCEEDED
        pointsRestoredKrw:
          allOf:
            - $ref: "#/components/schemas/MoneyKrw"
          description: |
            Confirmed Loyalty restoration amount; present only when
            pointsRestorationState is SUCCEEDED
        currency:
          $ref: "#/components/schemas/Currency"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
      allOf:
        - if:
            properties:
              state:
                const: SUCCEEDED
            required: [state]
          then:
            required: [cashRefundedKrw]
          else:
            not:
              required: [cashRefundedKrw]
        - if:
            properties:
              pointsRestorationState:
                const: SUCCEEDED
            required: [pointsRestorationState]
          then:
            required: [pointsRestoredKrw]
          else:
            not:
              required: [pointsRestoredKrw]
        - if:
            properties:
              pointsRestorationState:
                const: NOT_REQUIRED
            required: [pointsRestorationState]
          then:
            properties:
              pointsRestorationRequestedKrw:
                const: 0
          else:
            properties:
              pointsRestorationRequestedKrw:
                minimum: 1
        - if:
            properties:
              pointsRestorationState:
                enum: [PROCESSING, SUCCEEDED, MANUAL_REVIEW]
            required: [pointsRestorationState]
          then:
            properties:
              state:
                const: SUCCEEDED
        - if:
            properties:
              pointsRestorationState:
                const: REQUESTED
            required: [pointsRestorationState]
          then:
            properties:
              state:
                not:
                  const: SUCCEEDED
    StoreOrderTransitionRequest:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState:
          type: string
          enum: [ACCEPTED, PREPARING, READY, COMPLETED, REJECTED]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PointAccount:
      type: object
      additionalProperties: false
      required:
        [accountId, availablePointsKrw, recoveryPendingKrw, currency, updatedAt]
      properties:
        accountId:
          $ref: "#/components/schemas/Identifier"
        availablePointsKrw:
          $ref: "#/components/schemas/MoneyKrw"
        recoveryPendingKrw:
          $ref: "#/components/schemas/MoneyKrw"
          description: Sum of Loyalty PointRecoveryPending remaining amounts. It is not a negative available balance.
        currency:
          $ref: "#/components/schemas/Currency"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    PointTransactionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PointTransaction"
        page:
          $ref: "#/components/schemas/PageInfo"
    PointTransaction:
      type: object
      additionalProperties: false
      required:
        [transactionId, type, amountKrw, occurredAt, sourceReference]
      properties:
        transactionId:
          $ref: "#/components/schemas/Identifier"
        type:
          type: string
          description: >-
            Ledger fact type. RECOVERY is an actual debit of available points for a
            refund; it is distinct from PointRecoveryPending, which records an
            amount not yet recoverable. ADJUSTMENT is an audited manual Loyalty
            correction, not a refund or settlement adjustment.
          enum:
            [ACCRUAL, USE, EXPIRATION, RESTORE, COMPENSATION, RESTORE_SKIPPED_EXPIRED, RECOVERY, ADJUSTMENT]
        amountKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
          description: >-
            Signed effect on the visible point balance: ACCRUAL, RESTORE and
            COMPENSATION are positive; USE, EXPIRATION and RECOVERY are negative;
            RESTORE_SKIPPED_EXPIRED is zero. This is not the non-negative storage
            magnitude. ADJUSTMENT follows its stored CREDIT or DEBIT balance effect.
        occurredAt:
          $ref: "#/components/schemas/DateTime"
        sourceReference:
          type: string
          minLength: 1
          description: Opaque immutable ledger source. A multi-lot ADJUSTMENT uses a distinct child source per affected lot.
    PointIssuer:
      type: object
      additionalProperties: false
      required: [issuerType, issuerReference]
      properties:
        issuerType:
          type: string
          enum: [PLATFORM, BRAND, STORE]
        issuerReference:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
          description: Non-blank immutable cost-owner reference selected for a positive adjustment
    PointAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [amountKrw, reason, evidenceReferences]
      properties:
        amountKrw:
          allOf:
            - $ref: "#/components/schemas/SignedMoneyKrw"
          not:
            const: 0
          description: Nonzero signed correction. Positive creates a new PointLot; negative consumes available lots.
        issuer:
          $ref: "#/components/schemas/PointIssuer"
        expiresAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
          description: Required only for a positive adjustment and must be strictly after server time.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
          description: Non-blank operator reason for the correction
        evidenceReferences:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: '.*\S.*'
            description: Non-blank reference to correction evidence
      allOf:
        - if:
            properties:
              amountKrw:
                exclusiveMinimum: 0
            required: [amountKrw]
          then:
            required: [issuer, expiresAt]
          else:
            not:
              anyOf:
                - required: [issuer]
                - required: [expiresAt]
    PointAdjustmentResult:
      type: object
      additionalProperties: false
      required: [account, transactions]
      properties:
        account:
          $ref: "#/components/schemas/PointAccount"
        transactions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PointTransaction"
    SettlementBatchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBatch"
        page:
          $ref: "#/components/schemas/PageInfo"
    SettlementBatch:
      type: object
      additionalProperties: false
      required:
        - settlementBatchId
        - storeId
        - settlementDate
        - state
        - grossPaidKrw
        - feeKrw
        - benefitCostKrw
        - adjustmentKrw
        - netSettlementKrw
        - currency
      properties:
        settlementBatchId:
          $ref: "#/components/schemas/Identifier"
        storeId:
          $ref: "#/components/schemas/Identifier"
        settlementDate:
          type: string
          format: date
          description: Completion date in Asia/Seoul
        state:
          type: string
          enum: [OPEN, CALCULATED, CONFIRMED]
        grossPaidKrw:
          $ref: "#/components/schemas/MoneyKrw"
        feeKrw:
          $ref: "#/components/schemas/MoneyKrw"
        benefitCostKrw:
          $ref: "#/components/schemas/MoneyKrw"
        adjustmentKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        netSettlementKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        confirmedAt:
          $ref: "#/components/schemas/DateTime"
    SettlementItemPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettlementItem"
        page:
          $ref: "#/components/schemas/PageInfo"
    SettlementItem:
      type: object
      additionalProperties: false
      required:
        - settlementItemId
        - settlementBatchId
        - orderId
        - completedAt
        - grossPaidKrw
        - feeKrw
        - benefitCostKrw
        - netSettlementKrw
        - currency
      properties:
        settlementItemId:
          $ref: "#/components/schemas/Identifier"
        settlementBatchId:
          $ref: "#/components/schemas/Identifier"
        orderId:
          $ref: "#/components/schemas/Identifier"
        completedAt:
          $ref: "#/components/schemas/DateTime"
        grossPaidKrw:
          $ref: "#/components/schemas/MoneyKrw"
        feeKrw:
          $ref: "#/components/schemas/MoneyKrw"
        benefitCostKrw:
          $ref: "#/components/schemas/MoneyKrw"
        netSettlementKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
    CreateDisputeRequest:
      type: object
      additionalProperties: false
      required: [expectedAdjustmentKrw, reason, evidenceReferences]
      properties:
        expectedAdjustmentKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        evidenceReferences:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 500
        previousDisputeId:
          $ref: "#/components/schemas/Identifier"
    SettlementDispute:
      type: object
      additionalProperties: false
      required:
        - disputeId
        - settlementItemId
        - state
        - heldAmountKrw
        - currency
        - filedAt
      properties:
        disputeId:
          $ref: "#/components/schemas/Identifier"
        settlementItemId:
          $ref: "#/components/schemas/Identifier"
        previousDisputeId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum: [FILED, UNDER_REVIEW, ACCEPTED, REJECTED, WITHDRAWN]
        heldAmountKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        filedAt:
          $ref: "#/components/schemas/DateTime"
