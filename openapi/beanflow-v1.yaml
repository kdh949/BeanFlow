openapi: 3.1.0
info:
  title: BeanFlow API
  version: 0.2.0
  x-beanflow-contract-status: target
  x-beanflow-contract-date: 2026-08-14
  description: |
    Pre-release target contract for BeanFlow discovery, ordering, payment,
    pickup, loyalty, settlement, and dispute workflows. An operation in this
    file is not evidence that it is deployed. The machine-readable contract for
    currently implemented public controller mappings is beanflow-v1-runtime.yaml.

    All monetary values are integer KRW. All timestamps are ISO-8601 date-time
    values with an offset or UTC designator. A 202 response means processing or
    reconciliation is still in progress and must not be interpreted as success.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Discovery
  - name: Ordering
  - name: Payment
  - name: Payment Methods
  - name: Store Orders
  - name: Merchant
  - name: Operations
  - name: Loyalty
  - name: Settlement
  - name: Dispute
  - name: Support
paths:
  /auth/customer/csrf:
    get:
      tags: [Identity]
      operationId: issueCustomerCsrfToken
      summary: Issue the customer-chain CSRF cookie
      x-beanflow-contract-status: TARGET
      security: []
      responses:
        "204":
          description: BEANFLOW_CUSTOMER_XSRF cookie issued; the response has no body
          headers:
            Set-Cookie:
              schema: { type: string }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/customer/registrations:
    post:
      tags: [Identity]
      operationId: registerCustomerAccount
      summary: Register a customer account and its zero-balance point account
      x-beanflow-contract-status: TARGET
      security: []
      parameters:
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistrationRequest" }
      responses:
        "201":
          description: CustomerAccount and PointAccount committed atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRegistrationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/customer/sessions:
    post:
      tags: [Identity]
      operationId: createCustomerSession
      summary: Authenticate a customer and rotate the browser session
      x-beanflow-contract-status: TARGET
      security: []
      parameters:
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Customer session created
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerActor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/customer/sessions/current:
    delete:
      tags: [Identity]
      operationId: deleteCurrentCustomerSession
      summary: Delete the current customer session
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "204": { description: Current customer session deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/csrf:
    get:
      tags: [Identity]
      operationId: issueMerchantCsrfToken
      summary: Issue the merchant-chain CSRF cookie
      x-beanflow-contract-status: TARGET
      security: []
      responses:
        "204":
          description: BEANFLOW_MERCHANT_XSRF cookie issued; the response has no body
          headers:
            Set-Cookie: { schema: { type: string } }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/sessions:
    post:
      tags: [Identity]
      operationId: createMerchantSession
      summary: Authenticate a merchant and rotate the browser session
      x-beanflow-contract-status: TARGET
      security: []
      parameters:
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Merchant session created; INITIAL_PASSWORD is still gated
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantActor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/password-changes:
    post:
      tags: [Identity]
      operationId: changeMerchantPassword
      summary: Replace the merchant password and rotate the session
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantPasswordChangeRequest" }
      responses:
        "204":
          description: Password changed, credential version increased, and new session issued
          headers:
            Set-Cookie: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/sessions/current:
    delete:
      tags: [Identity]
      operationId: deleteCurrentMerchantSession
      summary: Delete the current merchant session
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MerchantCsrfToken"
      responses:
        "204": { description: Current merchant session deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/operations/config:
    get:
      tags: [Identity]
      operationId: getOperationsOidcConfiguration
      summary: Get public Keycloak Authorization Code and PKCE configuration
      x-beanflow-contract-status: TARGET
      security: []
      responses:
        "200":
          description: Validated public OIDC client configuration without secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsOidcConfiguration" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentCustomer
      summary: Get the current customer actor
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Current customer actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerActor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /merchant/me:
    get:
      tags: [Identity]
      operationId: getCurrentMerchant
      summary: Get the current merchant actor, including INITIAL_PASSWORD state
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      responses:
        "200":
          description: Current merchant actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantActor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /merchant/me/stores:
    get:
      tags: [Merchant]
      operationId: listCurrentMerchantStores
      summary: List stores with current active membership
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      responses:
        "200":
          description: Complete current membership list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantStoreList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /operations/me:
    get:
      tags: [Identity]
      operationId: getCurrentOperator
      summary: Get the current Keycloak-backed operator actor
      x-beanflow-contract-status: TARGET
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current operator actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorActor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders:
    get:
      tags: [Ordering]
      operationId: listCurrentCustomerOrders
      summary: List orders owned by the current customer
      description: Defaults to the latest 30 Asia/Seoul calendar days; historical ranges have no product cap.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - in: query
          name: status
          required: false
          description: Omit for all orders in the date range; ACTIVE and PAST are server-owned classifications.
          schema: { type: string, enum: [ACTIVE, PAST] }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Stable page ordered by createdAt and internal tie-breaker descending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrderPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders/{orderReference}:
    get:
      tags: [Ordering]
      operationId: getCurrentCustomerOrder
      summary: Get an owned order by public order reference
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderReference"
      responses:
        "200":
          description: Customer-facing order without internal order UUID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders/{orderReference}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelCurrentCustomerOrder
      summary: Cancel an owned order by public order reference
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderReference"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancellationRequest" }
      responses:
        "200":
          description: PENDING_PAYMENT cancellation committed synchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCancellationResult" }
        "202":
          description: PAID cancellation committed; refund and compensation remain independent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCancellationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders/{orderReference}/reorders:
    post:
      tags: [Ordering]
      operationId: reorderCurrentCustomerOrder
      summary: Create a current-condition order from an owned terminal order
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderReference"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderOrderRequest" }
      responses:
        "201":
          description: New order and price comparison committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderOrderResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReorderConflict" }
        "503": { $ref: "#/components/responses/OrderCreationDependencyUnavailable" }
  /me/points:
    get:
      tags: [Loyalty]
      operationId: getCurrentCustomerPoints
      summary: Get current customer point balance and expirations
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Actor-scoped point balance without PointAccount ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPointSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/point-transactions:
    get:
      tags: [Loyalty]
      operationId: listCurrentCustomerPointTransactions
      summary: List current customer point ledger transactions
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Actor-scoped signed point ledger page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointTransactionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /stores/search:
    get:
      tags: [Discovery]
      operationId: searchStores
      summary: Search stores by name or representative menu text
      description: |
        The query is trimmed and internal whitespace is collapsed before validation
        and cursor binding. Latitude and longitude must be supplied together or both
        omitted; radiusMeters without both coordinates returns 400. Coordinates are
        request-only and never persisted or written to logs. pickupAvailable is a
        point-in-time projection and does not reserve a slot.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 50 }
        - in: query
          name: latitude
          required: false
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          required: false
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - in: query
          name: radiusMeters
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - in: query
          name: pickupAvailable
          required: false
          schema: { type: boolean }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/DiscoveryLimit"
      responses:
        "200":
          description: Signed-cursor page bound to the normalized query and optional location filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/favorite-stores:
    get:
      tags: [Discovery]
      operationId: listCurrentCustomerFavoriteStores
      summary: List the current customer's favorite stores
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Complete favorite-store list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerStoreList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/favorite-stores/{storeId}:
    put:
      tags: [Discovery]
      operationId: addCurrentCustomerFavoriteStore
      summary: Add a store to current customer favorites idempotently
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "204": { description: Store is a favorite }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [Discovery]
      operationId: deleteCurrentCustomerFavoriteStore
      summary: Remove a store from current customer favorites idempotently
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "204": { description: Store is not a favorite }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/recent-stores:
    get:
      tags: [Discovery]
      operationId: listCurrentCustomerRecentStores
      summary: List distinct stores from the customer's recent eligible orders
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CompactLimit"
      responses:
        "200":
          description: Recent stores ordered by latest qualifying order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerStoreList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/store-recommendations:
    get:
      tags: [Discovery]
      operationId: listCurrentCustomerStoreRecommendations
      summary: Recommend stores from favorite, recent, and nearby baseline signals
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - in: query
          name: latitude
          required: false
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          required: false
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - in: query
          name: radiusMeters
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - $ref: "#/components/parameters/CompactLimit"
      responses:
        "200":
          description: Deterministic baseline recommendations without personalization claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreRecommendationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /stores/nearby:
    get:
      tags: [Discovery]
      operationId: searchNearbyStores
      summary: Search nearby pickup-capable stores
      security: [{ customerSession: [] }]
      description: |
        Precise customer coordinates are used only for this request and are not
        persisted or written to application logs or traces. radiusMeters is 1..10000.
        Results use a canonical micrometer distance tuple and return its floored
        integer-meter display value.
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/RadiusMeters"
        - in: query
          name: pickupAvailable
          required: false
          schema: { type: boolean }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/DiscoveryLimit"
      responses:
        "200":
          description: Nearby stores ordered by distance and store ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyStorePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/menus:
    get:
      tags: [Discovery]
      operationId: listStoreMenus
      summary: List currently visible menus for a store
      security: [{ customerSession: [] }]
      description: |
        Returns the current owner catalogue, including unavailable menus and options. A 200 response
        is a complete list, not a page or a partial result. More than 1,000 menus or 5,000 options
        yields 503 rather than silently truncating the catalogue.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Visible menus and options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/pickup-slots:
    get:
      tags: [Discovery]
      operationId: listStorePickupSlots
      summary: List available pickup slots
      security: [{ customerSession: [] }]
      description: |
        Returns only slots with startsAt > server time and startsAt less than seven days ahead.
        An existing store that is not currently accepting pickup orders returns a 200 empty list;
        unknown stores still return 404. A window containing 1,001 matching slots yields 503 rather
        than a partial list.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Pickup slots with current remaining capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupSlotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders:
    post:
      tags: [Ordering]
      operationId: createOrder
      summary: Create an order and reserve required resources
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: |
            Order creation committed. External-payment orders have a required
            five-minute reservation deadline. Zero-payable orders include an
            approved BENEFIT_ONLY payment and no active reservation deadline.
            An idempotent replay returns the originally stored 201 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OrderCreationConflict"
        "503":
          $ref: "#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{sourceOrderId}/reorders:
    post:
      tags: [Ordering]
      operationId: reorderOrder
      summary: Create a new order from a terminal source order
      security: [{ customerSession: [] }]
      description: |
        The owning customer may use a COMPLETED, CANCELLED, REJECTED or EXPIRED
        source order. The server copies only menu IDs, normalized option IDs and
        quantities, then revalidates current Merchant prices and availability and
        uses the existing atomic reservation workflow. It never copies historical
        benefits, payment, pickup slot or settlement snapshots. Any unavailable
        source item fails the whole request; no partial order is created.

        Idempotency scope is actor ID, REORDER_ORDER_V1 and Idempotency-Key. The
        canonical payload contains sourceOrderId, pickupSlotId, couponIssuanceId
        including null, and pointsToUseKrw. Same-key/same-payload terminal retries
        replay the first status and body. A different source or request returns
        IDEMPOTENCY_KEY_REUSED without exposing the first order response.
        PROCESSING returns IDEMPOTENCY_REQUEST_IN_PROGRESS with Retry-After.
        MANUAL_REVIEW means automatic processing stopped and returns
        IDEMPOTENCY_MANUAL_REVIEW_REQUIRED without Retry-After; the owner work is
        not executed again.
      parameters:
        - $ref: "#/components/parameters/SourceOrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderOrderRequest"
      responses:
        "201":
          description: |
            The new Order, every required reservation and immutable snapshot, the
            price comparison and the first idempotent response are committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReorderConflict"
        "503":
          $ref: "#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{orderId}:
    get:
      tags: [Ordering]
      operationId: getOrder
      summary: Get an order and materialize a due reservation expiry
      security: [{ customerSession: [] }]
      description: |
        If a PENDING_PAYMENT order has reached reservationExpiresAt, the server
        atomically expires the order and releases all reserved resources before
        returning EXPIRED. If that transaction fails, the request returns 503
        instead of a stale successful representation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order visible to the authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelOrder
      summary: Cancel an order in a customer-allowed state
      security: [{ customerSession: [] }]
      description: |
        PENDING_PAYMENT and PAID orders not yet ACCEPTED may be cancelled by the
        owning customer. Order cancellation and payment refund recovery are
        represented separately. Cancellation is not a separate aggregate, so the
        order itself is the cancellation resource and no new resource is created.

        Idempotency scope is actor ID, operation, and Idempotency-Key. The hashed
        payload covers orderId, reasonCode, and the normalized detail, so reusing
        one key across different orders returns 409 IDEMPOTENCY_KEY_REUSED and
        never replays another order's result. A repeated request with the same key
        and payload returns the originally stored 200 or 202 body unchanged; its
        paymentRecovery is a snapshot taken at cancellation time, so current
        progress must be read from GET /orders/{orderId}. This operation never
        returns IDEMPOTENCY_REQUEST_IN_PROGRESS because concurrent requests are
        serialized by the order row lock. A rolled back request stores no record,
        so retrying the same key re-executes and the order state guard returns
        409 ORDER_STATE_CONFLICT for an already cancelled order.

        If an earlier Refund is REQUESTED, PROCESSING, RETRY_SCHEDULED, UNKNOWN,
        RECONCILING, or MANUAL_REVIEW, cancellation returns 409
        PAYMENT_REFUND_UNRESOLVED before
        changing the order. Retry the same key after that Refund reaches SUCCEEDED
        or definitive FAILED. Payment lock timeouts and database failures return
        503 instead of this business conflict.

        If a PAID order has reached acceptanceDeadlineAt, this command does not
        perform customer cancellation. It durably requests deduplicated store
        timeout work and returns 409 ORDER_STATE_CONFLICT. Failure to persist that
        work returns 503. The order may remain PAID briefly until the timeout
        worker commits REJECTED.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationRequest"
      responses:
        "200":
          description: |
            Cancellation completed synchronously. Used for PENDING_PAYMENT orders
            where reservation release is committed in the same transaction and no
            external refund exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cancellation"
        "202":
          description: |
            Cancellation is recorded but compensation is still in progress. Used
            for PAID orders. Does not mean the refund or resource restoration
            succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cancellation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-config:
    get:
      tags: [Payment]
      operationId: getPaymentClientConfiguration
      summary: Get public Toss V2 Standard payment-window configuration
      security: []
      responses:
        "200":
          description: Public client configuration for the active payment Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentClientConfiguration"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}/payment-attempts:
    post:
      tags: [Payment]
      operationId: prepareOneTimeOrderPayment
      summary: Prepare a server-owned one-time Toss payment-window attempt
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER only. The server derives orderId, amount, orderName, currency,
        customerKey and callback URLs from the owned Order snapshot. No
        PaymentMethod or browser-supplied price is accepted. Same-key replay
        returns the same immutable attempt.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "200":
          description: New or idempotently replayed one-time payment attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimePaymentAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}:
    get:
      tags: [Payment]
      operationId: getOneTimePayment
      summary: Get the owner-visible one-time payment and recovery state
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Approved payment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "202":
          description: Provider outcome remains unknown or under reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}/confirmations:
    post:
      tags: [Payment]
      operationId: confirmOneTimePayment
      summary: Validate a Toss success callback and confirm the prepared payment server-to-server
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER only. paymentKey, orderId and amount must exactly match the
        server-owned attempt. The first valid callback claims the attempt before
        the Provider call. Exact replays return current state without a second
        confirmation; altered replays return PAYMENT_CALLBACK_MISMATCH. A 202
        response is unresolved and must be recovered by status lookup.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimePaymentConfirmationRequest"
      responses:
        "200":
          description: Provider approval and Order transition committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "202":
          description: Provider outcome remains unknown and recovery is durable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-methods:
    get:
      tags: [Payment Methods]
      operationId: listPaymentMethods
      summary: List the authenticated customer's usable payment methods
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER only. Returns the caller's ACTIVE and deactivation-pending
        methods; terminal DEACTIVATED tombstones are excluded. Internal token,
        provider customer reference, expiry, attempt and failure fields are never
        returned. Results are ordered by isDefault DESC, createdAt DESC and
        paymentMethodId DESC. The signed cursor is bound to the authenticated
        customer. A default or lifecycle change between pages is not a snapshot;
        clients refresh the first page for the latest preference.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Owned payment methods visible in the customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    post:
      tags: [Payment Methods]
      operationId: registerPaymentMethod
      summary: Register a provider-window-authorized payment method
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER only. The request accepts a one-time authKey returned by the
        Provider payment window and a customer display alias. It never accepts
        PAN, CVC, expiry, birth date or card password. Provider is fixed to
        TOSS_PAYMENTS and cannot be selected by the caller.

        Idempotency scope is actor ID, REGISTER_PAYMENT_METHOD_V1 and
        Idempotency-Key. The canonical payload contains fixed provider, SHA-256
        of authKey without storing the raw key, and normalized displayAlias.
        Same-key/same-payload retries return the first terminal response or the
        current 202 representation without a new Provider call. Reusing the key
        for another payload or the same authKey under another key returns 409.
        An unknown Provider result is never retried with the one-time authKey.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPaymentMethodRequest"
      responses:
        "200":
          description: Provider issuance resolved to the exact existing active binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "201":
          description: Provider issuance and local PaymentMethod commit are confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "202":
          description: |
            Registration outcome is unresolved or under manual investigation.
            This is not a registered payment method and does not permit payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-methods/{paymentMethodId}:
    delete:
      tags: [Payment Methods]
      operationId: deactivatePaymentMethod
      summary: Deactivate an owned payment method and detach its Provider token
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER only. Tx D1 first marks the owned method unavailable for new
        payments, clears its default flag and stores durable work. The Provider
        DELETE runs once outside that transaction. Only confirmed Provider success
        and Tx D2 return 204. Timeout, response loss, parse failure or result-store
        failure returns 202 and never triggers an automatic second DELETE. A
        verified BILLING_DELETED notification may converge the method; otherwise
        the operation is retained for manual review after 96 hours.

        Idempotency scope is actor ID, DEACTIVATE_PAYMENT_METHOD_V1 and
        Idempotency-Key. Same-key/same-target replay returns the original 204 or
        current 202 representation without another Provider call. Using that key
        for another target returns 409.
      parameters:
        - $ref: "#/components/parameters/PaymentMethodId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "202":
          description: Provider detachment is unresolved; the method already rejects new payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodDeactivation"
        "204":
          description: Provider detachment and local terminal deactivation are confirmed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-methods/{paymentMethodId}/default:
    put:
      tags: [Payment Methods]
      operationId: setDefaultPaymentMethod
      summary: Set an owned active payment method as the display default
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER only. This command has no request body. It atomically clears the
        previous default and marks this ACTIVE method as default under a
        customer-scoped lock. The preference is never used to infer an omitted
        paymentMethodId during payment confirmation.

        Same actor, operation, Idempotency-Key and target replays the original 200
        without changing a newer preference. Reusing the key for another target
        returns IDEMPOTENCY_KEY_REUSED.
      parameters:
        - $ref: "#/components/parameters/PaymentMethodId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "200":
          description: Default preference committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}/refunds:
    post:
      tags: [Payment]
      operationId: createPaymentRefund
      summary: Create a merchant full or item-based partial refund
      security: [{ merchantSession: [] }]
      description: |
        This is a Merchant Session transaction adjustment, not a customer self-service
        or operator command. STORE_OWNER and STORE_STAFF require active membership in
        the Order store. Omitted lineItems consumes all remaining units. Explicit
        quantities consume the lowest unrefunded conceptual unit positions. Within each
        line, coupon then points are allocated deterministically and cash is the residual;
        coupon attribution never restores the coupon.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: |
            Refund resource creation and the synchronous result are confirmed.
            Requested amount snapshots and pointsRestorationState are always
            present. Each confirmed amount follows its owner-specific state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "202":
          description: |
            Refund result is unknown or reconciliation is in progress. Requested
            amount snapshots and pointsRestorationState are present. A confirmed
            points amount may exist only if its asynchronous Loyalty work already
            succeeded; HTTP 202 alone does not determine either confirmed amount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/payments/{paymentId}/refunds:
    post:
      tags: [Operations, Payment]
      operationId: createOperationsPaymentRefund
      summary: Create a platform-operator full or item-based partial refund
      security: [{ bearerAuth: [] }]
      description: |
        PLATFORM_OPERATOR only. This endpoint is the actor-exclusive Operations form
        of the legacy UUID refund contract. It uses the same preparation, idempotency,
        Provider key and Refund ledger as the Merchant endpoint; changing URI never
        creates another side effect for the same actor, key and canonical payload.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund resource creation and the synchronous result are confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "202":
          description: Refund result is unknown or reconciliation is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}:
    get:
      tags: [Store Orders]
      operationId: getStoreOrder
      summary: Get an order and its abbreviated compensation status
      description: |
        Returns the store projection of the order plus a compensation summary
        limited to trigger, case state and updatedAt. Step detail, attempt
        counts, internal error codes, the case identifier and benefit policy
        versions are operator-only and available from
        GET /operations/orders/{orderId}/compensation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Store order visible to an authorized active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}/status:
    patch:
      tags: [Store Orders]
      operationId: transitionStoreOrderStatus
      summary: Transition an order from the store operational view
      description: |
        store-orders is a store-facing view of the Ordering-owned Order, not a
        separate Aggregate. Cancellation after ACCEPTED is not an allowed target.

        Idempotency scope is actor ID, operation, and Idempotency-Key. The hashed
        payload covers orderId, targetState, and the normalized reason, so reusing
        one key across different orders returns 409 IDEMPOTENCY_KEY_REUSED and
        never replays another order's result.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderTransitionRequest"
      responses:
        "200":
          description: Synchronous ACCEPTED, PREPARING, READY, or COMPLETED transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "202":
          description: |
            REJECTED is committed and compensation is still tracked separately.
            This response does not mean refund or resource restoration succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/orders/{orderId}/compensation:
    get:
      tags: [Operations]
      operationId: getOrderCompensation
      summary: Read owner compensation progress for a rejected or cancelled order
      description: |
        Platform operator view of the order compensation case. Step level state,
        attempt counts and internal error codes are operator-only and are never
        returned to customers or store members. Requires an active
        ORDER_COMPENSATION_READ grant and an audited X-Access-Reason.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AccessReason"
      responses:
        "200":
          description: Compensation case for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCompensationView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/orders/{orderId}/customer-cancellation-refund-reconciliations:
    post:
      tags: [Operations]
      operationId: scheduleCustomerCancellationRefundReconciliation
      summary: Schedule one operator-authorized LOOKUP for a terminal customer-cancellation Refund
      description: |
        Requires PLATFORM_OPERATOR and an active
        CUSTOMER_CANCELLATION_REFUND_RECONCILE grant. The transaction validates
        the immutable cancellation setup and schedules exactly one LOOKUP using
        the existing Provider idempotency key. It never accepts financial or
        Provider identifiers, records a manual success, or sends a new REQUEST.
        A 202 response means LOOKUP_SCHEDULED, not refund success.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCancellationRefundReconciliationRequest"
      responses:
        "202":
          description: LOOKUP scheduled or replayed from the first identical command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCancellationRefundReconciliation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/reprocessing-cases/{caseId}/repair-proposals:
    post:
      tags: [Operations]
      operationId: proposeCustomerCancellationSetupRepair
      summary: Propose the safe recreation of a missing customer-cancellation Refund
      description: |
        Creates a 30-minute repair proposal after validating that the durable
        recovery snapshot is complete and only the Refund row is missing. Requires
        an active PLATFORM_OPERATOR with the explicit
        PAYMENT_CANCELLATION_SETUP_REPAIR grant. Financial values and provider keys are
        server-derived and cannot be supplied by the caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: caseId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepairProposalRequest"
      responses:
        "201":
          description: Pending proposal or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
