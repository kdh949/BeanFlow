      description: SupportCase에 고객과의 상담 이력을 비식별 요약 형태로 기록하기 위한 요청. 원문 대화 내용은 담지 않습니다.
      example:
        channel: PHONE
        direction: INBOUND
        occurredAt: "2026-08-15T09:12:00Z"
