        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 실행 담당자·권한·승인 조건을 충족하지 못한 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 해결안·요청·주문 버전이나 담당 시스템 상태가 바뀐 경우
        - 503: 필수 담당 시스템을 호출하거나 결과를 저장할 수 없는 경우
