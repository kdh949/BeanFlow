      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PointTransaction"
        page:
          $ref: "#/components/schemas/PageInfo"
    PointTransaction:
      type: object
      additionalProperties: false
      required:
        [transactionId, type, amountKrw, occurredAt, sourceReference]
      properties:
        transactionId:
          $ref: "#/components/schemas/Identifier"
        type:
          type: string
          description: >-
            Ledger fact type. RECOVERY is an actual debit of available points for a
            refund; it is distinct from PointRecoveryPending, which records an
            amount not yet recoverable. ADJUSTMENT is an audited manual Loyalty
            correction, not a refund or settlement adjustment.
          enum:
            [ACCRUAL, USE, EXPIRATION, RESTORE, COMPENSATION, RESTORE_SKIPPED_EXPIRED, RECOVERY, ADJUSTMENT]
        amountKrw:
          $ref: "#/components/schemas/SignedMoneyKrw"
          description: >-
            Signed effect on the visible point balance: ACCRUAL, RESTORE and
            COMPENSATION are positive; USE, EXPIRATION and RECOVERY are negative;
            RESTORE_SKIPPED_EXPIRED is zero. This is not the non-negative storage
            magnitude. ADJUSTMENT follows its stored CREDIT or DEBIT balance effect.
        occurredAt:
          $ref: "#/components/schemas/DateTime"
        sourceReference:
          type: string
          minLength: 1
          description: Opaque immutable ledger source. A multi-lot ADJUSTMENT uses a distinct child source per affected lot.
    PointIssuer:
      type: object
      additionalProperties: false
      required: [issuerType, issuerReference]
      properties:
        issuerType:
          type: string
          enum: [PLATFORM, BRAND, STORE]
        issuerReference:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
          description: Non-blank immutable cost-owner reference selected for a positive adjustment
    PointAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [amountKrw, reason, evidenceReferences]
      properties:
        amountKrw:
          allOf:
            - $ref: "#/components/schemas/SignedMoneyKrw"
            - minimum: -9223372036854775807
          not:
            const: 0
          description: Nonzero signed correction. Positive creates a new PointLot; negative consumes available lots.
        issuer:
          $ref: "#/components/schemas/PointIssuer"
        expiresAt:
          allOf:
            - $ref: "#/components/schemas/DateTime"
          description: Required only for a positive adjustment and must be strictly after server time.
        reason:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '.*\S.*'
          description: Non-blank operator reason for the correction
        evidenceReferences:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: '.*\S.*'
            description: Non-blank reference to correction evidence
      allOf:
        - if:
            properties:
              amountKrw:
                exclusiveMinimum: 0
            required: [amountKrw]
          then:
            required: [issuer, expiresAt]
          else:
            not:
              anyOf:
                - required: [issuer]
                - required: [expiresAt]
    PointAdjustmentResult:
      type: object
      additionalProperties: false
      required: [account, transactions]
      properties:
        account:
          $ref: "#/components/schemas/PointAccount"
        transactions:
