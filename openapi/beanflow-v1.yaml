      summary: Request a field-scoped personal-data grant
      description: |
        Binds the Grant to the Case, subject link, subject, requester and verification
        purpose. BASIC display fields activate for 10 minutes and three reveals;
        SENSITIVE fields require ENHANCED verification and a distinct approver before
        a five-minute, one-reveal Grant can activate.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDataAccessGrantRequest"
      responses:
        "201":
          description: Grant state after verification qualification
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAccessGrantResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/data-access-grants/{grantId}/approvals:
    post:
      tags: [Support]
      operationId: decideSupportDataAccessGrant
      summary: Decide a SENSITIVE DataAccessGrant
      description: The approver must differ from the requester and the exact Grant version must still be current.
      parameters:
        - $ref: "#/components/parameters/DataAccessGrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideDataAccessGrantRequest"
      responses:
        "200":
          description: Approved active or denied Grant
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAccessGrantResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/data-access-grants/{grantId}/reveals:
    post:
      tags: [Support]
      operationId: revealSupportPersonalData
      summary: Reveal exactly the fields allowed by an active Grant
      description: |
        Audit record and reveal-attempt reservation commit before owner decryption.
        The owner Context decrypts outside the Support transaction. Audit or owner failure
        never returns raw data, and a committed attempt consumes budget even if decryption fails.
        A successful body is not persisted and same-key replay requires manual review.
      parameters:
        - $ref: "#/components/parameters/DataAccessGrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealGrantedPersonalDataRequest"
      responses:
        "200":
          description: Ephemeral field-keyed values; clients must not cache or persist this response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedPersonalDataResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/break-glass-requests:
    post:
      tags: [Support]
      operationId: requestSupportBreakGlass
      summary: Request emergency access to one personal-data field
      description: |
        BREAK_GLASS is separate from normal verification and Grant paths. It is limited
        to one emergency-purpose field and emits a durable PII-free security notification.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestBreakGlassRequest"
      responses:
