        - paymentId
        - state
        - cashRefundedKrw
        - pointsRestoredKrw
        - currency
        - createdAt
        - updatedAt
        - correlationId
      properties:
        refundId:
          $ref: "#/components/schemas/Identifier"
        paymentId:
          $ref: "#/components/schemas/Identifier"
        state:
          type: string
          enum:
            [REQUESTED, PROCESSING, RETRY_SCHEDULED, SUCCEEDED, FAILED, UNKNOWN, RECONCILING, MANUAL_REVIEW]
        cashRefundedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        pointsRestoredKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          type: string
    StoreOrderTransitionRequest:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState:
          type: string
          enum: [ACCEPTED, PREPARING, READY, COMPLETED, REJECTED]
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PointAccount:
      type: object
      additionalProperties: false
      required:
        [accountId, availablePointsKrw, recoveryPendingKrw, currency, updatedAt]
      properties:
        accountId:
          $ref: "#/components/schemas/Identifier"
        availablePointsKrw:
          $ref: "#/components/schemas/MoneyKrw"
        recoveryPendingKrw:
          $ref: "#/components/schemas/MoneyKrw"
        currency:
          $ref: "#/components/schemas/Currency"
        updatedAt:
          $ref: "#/components/schemas/DateTime"
    PointTransactionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PointTransaction"
        page:
          $ref: "#/components/schemas/PageInfo"
    PointTransaction:
      type: object
