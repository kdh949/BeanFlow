      operationId: listStoreSettlementItems
      summary: List settlement items in an owned store batch
      security: [{ merchantSession: [] }]
      description: |
        Returns the item identifiers and immutable amount snapshots needed to
        inspect a settlement batch and file an item dispute. Items are ordered by
        completedAt and settlementItemId ascending. The cursor is scoped to this
        store and batch and cannot be reused for another batch.
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/SettlementBatchId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Settlement items in stable ledger order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /settlement-items/{itemId}/disputes:
    post:
      tags: [Dispute]
      operationId: createSettlementDispute
      summary: File a dispute for a confirmed settlement item
      security: [{ merchantSession: [] }]
      description: |
        Requires the STORE_OWNER role and an active OWNER membership for the
        item's store. Filing is allowed during [D+1 00:00, D+15 00:00) in
        Asia/Seoul, where D is the batch confirmation date. The same actor,
        operation, Idempotency-Key, and canonical payload replay the original
        201 response. An active dispute, a refile without a new evidence
        reference, or a second refile is a stable conflict.
      parameters:
        - $ref: "#/components/parameters/SettlementItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisputeRequest"
      responses:
        "201":
          description: Dispute filed and its expected adjustment amount held internally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /support/searches:
    post:
      tags: [Support]
      operationId: searchSupportSubjects
      summary: Exact-search protected Support profiles
      description: |
        The supported contract accepts one phone or email criterion only in the JSON body and
        rejects every query parameter. A client-supplied query may reach upstream infrastructure
        before rejection, so ingress and container access logs for this route must omit or redact
        query strings. BeanFlow does not put the raw or normalized criterion in its response, Audit
        payload, application log, metric, cursor, or Support storage. Owner Contexts perform
        versioned blind-index lookup and return masked projections.
        Results are ordered by CUSTOMER, STORE, RIDER then subject ID, limited to 20, and expose a
        match count capped at 21. A genuine no-match returns an audited empty 200 only after every
        required dependency succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchSupportSubjectsRequest"
      responses:
        "200":
          description: Masked exact-match candidates and bounded ambiguity metadata
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSubjectSearchResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/SupportSearchRateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases:
    post:
      tags: [Support]
      operationId: createSupportCase
      summary: Create an assigned SupportCase
      description: |
        Creates an OPEN Case assigned to the authenticated operator. The Case, initial assignment/state
        histories, retention snapshot, Audit record, and stored idempotent response commit atomically.
        Free text is rejected when it contains secrets or high-risk PII. No owner Context record is updated.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportCaseRequest"
      responses:
        "201":
          description: Case created, or the original response replayed for the same command
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCase"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    get:
      tags: [Support]
      operationId: listSupportCases
      summary: List SupportCases using a filter-bound cursor
      description: |
        Ordered by openedAt descending then Case ID descending. The signed cursor is bound to state and
        assigneeId, expires after 15 minutes, and never loads interactions or notes as an entity collection.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SupportCaseState"
        - name: assigneeId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Case summary page
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCasePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}:
