  /operations/policies/ordinary-point-accrual/stores/{storeId}:
    get:
      tags: [Operations]
      operationId: getStoreOrdinaryPointAccrualPolicy
      summary: Get an explicit STORE head and its effective resolved policy
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/AccessReason"
      responses:
