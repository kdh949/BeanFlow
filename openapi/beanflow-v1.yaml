  /support/cases/{caseId}/verification-sessions:
    post:
      tags: [Support]
      operationId: createSupportVerificationSession
      summary: Start purpose-bound step-up verification
      description: |
        Starts a 15-minute BASIC or ENHANCED session bound to the assigned active Case,
        one active subject link, the authenticated operator, a purpose, and a closed
        action scope. Omitted scope means PERSONAL_DATA_REVEAL; SUPPORT_ACTION is valid
        only with CASE_RESOLUTION. No OTP, raw link, answer, or proof is stored.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationSessionRequest"
      responses:
        "201":
          description: Verification session started or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSessionResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
