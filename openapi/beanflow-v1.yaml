  /operations/point-accounts/{accountId}/adjustments:
    post:
      tags: [Operations, Loyalty]
      operationId: createAuditedPointAdjustment
      summary: Apply an audited signed point adjustment
      description: |
        Requires an active PLATFORM_OPERATOR with an explicit POINT_ADJUSTMENT
        grant, a non-blank reason, and evidence references. The command is
        idempotent by actor, operation, Idempotency-Key, account ID and canonical
        request payload. Positive adjustments require a caller-selected issuer
        snapshot and future expiry; negative adjustments may consume only available
        point lots. No provider is called and no partial debit, negative balance,
        or recovery pending fallback is allowed.
      parameters:
        - $ref: "#/components/parameters/PointAccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointAdjustmentRequest"
      responses:
        "201":
          description: Applied adjustment or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAdjustmentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/orders:
    get:
      tags: [Store Orders]
      operationId: listStoreOrderBoard
      summary: 매장 주문 보드의 bounded 스냅샷 조회
      description: |
        레인(lane)별로 개수가 제한된 실행 가능 주문 보드 스냅샷을 반환합니다. 아직
        접수되지 않았지만 결제가 완료되어 향후 접수 대상인 주문도 포함됩니다.
        각 레인에서 스냅샷에 담기지 않은 더 오래된 주문은 overflow 큐로 안내되며,
        If-None-Match로 조건부 조회를 하면 변경이 없을 때 304를 받아 폴링 비용을
        줄일 수 있습니다.
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: lane
          required: false
          schema:
            type: string
            enum: [PENDING_ACCEPTANCE, ACCEPTED, PREPARING, READY]
      responses:
        "200":
          description: 약한(weak) 의미론적 ETag와 명시적 overflow 큐 커서를 포함한 레인별 bounded 보드 스냅샷
          headers:
            ETag:
              description: 보드 내용에 대해서만 유효한 약한(weak) validator입니다. 304 응답은 overflow 커서의 TTL을 연장하지 않습니다.
              schema: { type: string, example: 'W/"sha256"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreOrderBoard" }
        "304": { description: 전달한 If-None-Match 값 기준으로 보드 내용에 변경이 없습니다. overflow 커서를 갱신하지 않습니다. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /stores/{storeId}/orders/overflow:
    get:
      tags: [Store Orders]
      operationId: listStoreOrderOverflowQueue
      summary: 보드 레인 하나의 이후 overflow 페이지 조회
      description: |
        signed cursor는 bounded 보드 스냅샷이나 이전 overflow 페이지에서만 발급됩니다.
        이 store와 lane에만 결속되며 15분 후 만료되고, 커서 자체만으로는 접근 권한이
        부여되지 않습니다. 이 큐는 3초 주기 조건부 폴링 루프의 일부가 아니라 사용자가
        직접 요청할 때만 호출됩니다. 이 커서로 400 INVALID_REQUEST를 받으면 클라이언트는
        로컬 큐를 버리고 무조건적(unconditional) 보드 스냅샷을 다시 받아야 하며, 304를
        커서 갱신으로 취급하거나 이 요청을 자동으로 재시도하지 않습니다.
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - in: query
          name: lane
          required: true
          schema:
            type: string
            enum: [PENDING_ACCEPTANCE, ACCEPTED, PREPARING, READY]
        - in: query
          name: cursor
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "200":
          description: 다음 bounded overflow 큐 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreOrderBoardOverflowPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
