          $ref: "#/components/schemas/MoneyKrw"
        pointsAppliedKrw:
          $ref: "#/components/schemas/MoneyKrw"
        cashPaidKrw:
          $ref: "#/components/schemas/MoneyKrw"
    CancellationRequest:
      type: object
      additionalProperties: false
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/CancellationReasonCode"
        detail:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]*$'
          description: |
            Optional free-text detail supplied by the customer. The server trims
            it before validation; an empty normalized value is treated as absent
            and a present normalized value must contain 1 to 200 characters.
            Control characters are rejected. Stored on the order only. Never
            included in events, audit records, provider requests, application
            logs or any API response.
    CancellationReasonCode:
      type: string
      description: Customer-declared cancellation reason, independent of the system-determined cause
      enum:
        - CHANGED_MIND
        - ORDER_MISTAKE
        - WAIT_TOO_LONG
        - PICKUP_TIME_CONFLICT
        - PAYMENT_ISSUE
        - OTHER
