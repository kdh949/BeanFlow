        `POINT_ACCOUNT_READ` 권한과 `X-Access-Reason`이 필요합니다. 최신 발생 시각과 거래 ID 순으로 정렬하며, 다음 페이지 커서는 같은 API와 같은 포인트 계정에서만 사용할 수 있습니다.

