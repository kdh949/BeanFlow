openapi: 3.1.0
info:
  title: BeanFlow API
  version: 0.2.0
  x-beanflow-contract-status: target
  x-beanflow-contract-date: 2026-08-14
  description: |
    Pre-release target contract for BeanFlow discovery, ordering, payment,
    pickup, loyalty, settlement, and dispute workflows. An operation in this
    file is not evidence that it is deployed. The machine-readable contract for
    currently implemented public controller mappings is beanflow-v1-runtime.yaml.

    All monetary values are integer KRW. All timestamps are ISO-8601 date-time
    values with an offset or UTC designator. A 202 response means processing or
    reconciliation is still in progress and must not be interpreted as success.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Discovery
  - name: Ordering
  - name: Promotion
  - name: Payment
  - name: Payment Methods
  - name: Store Orders
  - name: Merchant
  - name: Operations
  - name: Loyalty
  - name: Settlement
  - name: Dispute
  - name: Support
paths:
  /auth/customer/csrf:
    get:
      tags: [Identity]
      operationId: issueCustomerCsrfToken
      summary: 고객용 CSRF 쿠키를 발급합니다
      description: |
        고객 인증 체인 전용 CSRF 쿠키(BEANFLOW_CUSTOMER_XSRF)를 발급합니다. 회원가입,
        로그인, 세션 삭제 등 상태를 변경하는 고객 API를 호출하기 전에 먼저 이 엔드포인트를
        호출해 쿠키를 받고, 쿠키 값을 `X-BEANFLOW-CSRF` 헤더에 담아 함께 보내야 합니다.
      x-beanflow-contract-status: TARGET
      security: []
      responses:
        "204":
          description: BEANFLOW_CUSTOMER_XSRF 쿠키가 발급됨; 응답 본문 없음
          headers:
            Set-Cookie:
              schema: { type: string }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/customer/registrations:
    post:
      tags: [Identity]
      operationId: registerCustomerAccount
      summary: 고객 계정을 가입하고 0원 포인트 계좌를 함께 생성합니다
      description: |
        loginId, password, displayName으로 고객 계정을 만들고 잔액 0원인 포인트 계좌를
        같은 트랜잭션에서 원자적으로 생성합니다. `/auth/customer/csrf`로 발급받은 쿠키
        값을 `X-BEANFLOW-CSRF` 헤더에 담아 보내야 하며, loginId가 이미 사용 중이면
        409, 요청값이 형식에 맞지 않으면 400을 반환합니다.
      x-beanflow-contract-status: TARGET
      security: []
      parameters:
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerRegistrationRequest" }
      responses:
        "201":
          description: CustomerAccount와 PointAccount가 원자적으로 커밋됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerRegistrationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/customer/sessions:
    post:
      tags: [Identity]
      operationId: createCustomerSession
      summary: 고객 로그인 후 브라우저 세션을 새로 발급합니다
      description: |
        loginId/password로 고객을 인증하고 세션 쿠키를 새로 발급(rotate)합니다.
        `X-BEANFLOW-CSRF` 헤더가 필요하며, 인증에 실패하면 401, 반복 실패로 rate limit에
        걸리면 429를 반환합니다.
      x-beanflow-contract-status: TARGET
      security: []
      parameters:
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 고객 세션 생성됨
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerActor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/customer/sessions/current:
    delete:
      tags: [Identity]
      operationId: deleteCurrentCustomerSession
      summary: 현재 고객 세션을 삭제합니다(로그아웃)
      description: |
        현재 요청에 담긴 고객 세션 쿠키를 무효화합니다. 로그인되어 있지 않으면 401을
        반환합니다.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "204": { description: 현재 고객 세션 삭제됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/csrf:
    get:
      tags: [Identity]
      operationId: issueMerchantCsrfToken
      summary: 점주용 CSRF 쿠키를 발급합니다
      description: |
        점주(merchant) 인증 체인 전용 CSRF 쿠키(BEANFLOW_MERCHANT_XSRF)를 발급합니다.
        로그인, 비밀번호 변경, 세션 삭제 등 상태를 변경하는 점주 API를 호출하기 전에
        먼저 이 엔드포인트를 호출해 쿠키를 받고, 쿠키 값을 `X-BEANFLOW-CSRF` 헤더에
        담아 함께 보내야 합니다.
      x-beanflow-contract-status: TARGET
      security: []
      responses:
        "204":
          description: BEANFLOW_MERCHANT_XSRF 쿠키가 발급됨; 응답 본문 없음
          headers:
            Set-Cookie: { schema: { type: string } }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/sessions:
    post:
      tags: [Identity]
      operationId: createMerchantSession
      summary: 점주 로그인 후 브라우저 세션을 새로 발급합니다
      description: |
        loginId/password로 점주를 인증하고 세션 쿠키를 새로 발급(rotate)합니다.
        `X-BEANFLOW-CSRF` 헤더가 필요하며, 계정 상태가 INITIAL_PASSWORD이면 로그인은
        성공하지만 초기 비밀번호 변경 전까지 다른 API는 계속 차단됩니다. 인증에
        실패하면 401, 반복 실패로 rate limit에 걸리면 429를 반환합니다.
      x-beanflow-contract-status: TARGET
      security: []
      parameters:
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 점주 세션 생성됨; INITIAL_PASSWORD 상태는 여전히 게이팅됨
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantActor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/AuthenticationRateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/password-changes:
    post:
      tags: [Identity]
      operationId: changeMerchantPassword
      summary: 점주 비밀번호를 변경하고 세션을 새로 발급합니다
      description: |
        현재 비밀번호를 검증한 뒤 새 비밀번호로 교체하고 credential version을 올려
        기존 세션을 모두 무효화한 다음 새 세션을 발급합니다. INITIAL_PASSWORD 상태인
        계정은 이 API로 비밀번호를 바꿔야 다른 API 사용이 풀립니다. 현재 비밀번호가
        틀리면 401, 새 비밀번호가 정책(길이 등)에 맞지 않으면 400을 반환합니다.
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantPasswordChangeRequest" }
      responses:
        "204":
          description: 비밀번호가 변경되고 credential version이 증가했으며 새 세션이 발급됨
          headers:
            Set-Cookie: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/merchant/sessions/current:
    delete:
      tags: [Identity]
      operationId: deleteCurrentMerchantSession
      summary: 현재 점주 세션을 삭제합니다(로그아웃)
      description: |
        현재 요청에 담긴 점주 세션 쿠키를 무효화합니다. 로그인되어 있지 않으면 401을
        반환합니다.
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/MerchantCsrfToken"
      responses:
        "204": { description: 현재 점주 세션 삭제됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /auth/operations/config:
    get:
      tags: [Identity]
      operationId: getOperationsOidcConfiguration
      summary: Get public Keycloak Authorization Code and PKCE configuration
      x-beanflow-contract-status: TARGET
      security: []
      responses:
        "200":
          description: Validated public OIDC client configuration without secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsOidcConfiguration" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentCustomer
      summary: 현재 로그인한 고객 정보를 조회합니다
      description: |
        현재 세션 쿠키가 가리키는 고객 actor를 반환합니다. 세션이 없거나 만료되었으면
        401을 반환합니다. Bearer 또는 Merchant 전용 credential처럼 다른 인증 chain의
        credential을 보내면 재해석하거나 fallback하지 않고 `403 ACCESS_DENIED`를 반환합니다.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: 현재 고객 actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerActor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /merchant/me:
    get:
      tags: [Identity]
      operationId: getCurrentMerchant
      summary: 현재 로그인한 점주 정보를 조회합니다(INITIAL_PASSWORD 상태 포함)
      description: |
        현재 세션 쿠키가 가리키는 점주 actor를 반환합니다. accountState가
        INITIAL_PASSWORD면 비밀번호를 아직 변경하지 않은 상태이므로 클라이언트는
        비밀번호 변경 화면으로 유도해야 합니다. 세션이 없거나 만료되었으면 401을
        반환합니다.
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      responses:
        "200":
          description: 현재 점주 actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantActor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /merchant/me/stores:
    get:
      tags: [Merchant]
      operationId: listCurrentMerchantStores
      summary: 현재 상인이 소속된 매장 목록 조회
      description: |
        현재 Merchant Session 액터가 활성 멤버십을 가진 매장 전체를 반환한다. 페이징이 없는
        완전한 목록이며, OWNER/STAFF 역할 구분은 각 항목의 membershipRole에 담긴다.
      x-beanflow-contract-status: TARGET
      security: [{ merchantSession: [] }]
      responses:
        "200":
          description: Complete current membership list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantStoreList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /operations/me:
    get:
      tags: [Identity]
      operationId: getCurrentOperator
      summary: 현재 로그인한 운영자(operator) 정보를 조회합니다
      description: |
        Keycloak에서 발급한 bearer 토큰으로 인증된 현재 운영자 actor와 부여된 역할
        목록을 반환합니다. 토큰이 없거나 유효하지 않으면 401, 권한이 부족하면 403을
        반환합니다.
      x-beanflow-contract-status: TARGET
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 현재 운영자 actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorActor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders:
    get:
      tags: [Ordering]
      operationId: listCurrentCustomerOrders
      summary: 현재 고객이 소유한 주문 목록 조회
      description: |
        기본적으로 최근 30일(Asia/Seoul 달력 기준)의 주문만 반환합니다. `from`/`to`로
        과거 기간을 직접 지정하면 해당 범위에는 건수 상한이 없습니다.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - in: query
          name: status
          required: false
          description: 생략하면 기간 내 모든 주문을 반환합니다. ACTIVE/PAST는 서버가 부여하는 분류입니다.
          schema: { type: string, enum: [ACTIVE, PAST] }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: createdAt과 내부 tie-breaker 기준 내림차순으로 정렬된, 안정적인 페이지 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrderPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/coupons:
    get:
      tags: [Promotion]
      operationId: listCurrentCustomerCoupons
      summary: 현재 고객의 활성 쿠폰 지갑 조회
      description: |
        현재 Customer actor가 소유한 AVAILABLE 또는 RESTORED 쿠폰 중 발급 만료 전인 항목을
        만료 시각과 발급 ID 오름차순으로 반환합니다. 일반 발급은 현재 active Campaign만
        포함하지만, 보상 발급은 immutable terms snapshot을 사용하므로 Campaign이 비활성이어도
        포함됩니다. `applicable`은 요청 매장 범위만 안내하며 주문 금액과 실제 사용 가능 여부는
        주문 생성 트랜잭션이 다시 검증합니다.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - in: query
          name: storeId
          required: true
          description: 적용 가능성을 계산할 현재 매장 식별자입니다.
          schema: { $ref: "#/components/schemas/Identifier" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: customer/store 범위 signed cursor에 묶인 쿠폰 페이지
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCouponWalletPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: |
            Coupon read dependency가 일시적으로 unavailable하면 `DEPENDENCY_UNAVAILABLE`, compensation
            coupon의 issuance-owned immutable terms snapshot이 없거나 손상됐으면
            `COUPON_TERMS_INTEGRITY_FAILURE`를 반환합니다. 빈 목록이나 live Campaign fallback은 없습니다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me/orders/{orderReference}:
    get:
      tags: [Ordering]
      operationId: getCurrentCustomerOrder
      summary: 공개 주문 참조번호로 본인 소유 주문 조회
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderReference"
      responses:
        "200":
          description: 내부 주문 UUID를 노출하지 않는 고객용 주문 표현
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerOrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders/{orderReference}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelCurrentCustomerOrder
      summary: Cancel an owned order by public order reference
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderReference"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancellationRequest" }
      responses:
        "200":
          description: PENDING_PAYMENT cancellation committed synchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCancellationResult" }
        "202":
          description: PAID cancellation committed; refund and compensation remain independent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCancellationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/orders/{orderReference}/reorders:
    post:
      tags: [Ordering]
      operationId: reorderCurrentCustomerOrder
      summary: Create a current-condition order from an owned terminal order
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderReference"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderOrderRequest" }
      responses:
        "201":
          description: New order and price comparison committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReorderOrderResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ReorderConflict" }
        "503": { $ref: "#/components/responses/OrderCreationDependencyUnavailable" }
  /me/points:
    get:
      tags: [Loyalty]
      operationId: getCurrentCustomerPoints
      summary: Get current customer point balance and expirations
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Actor-scoped point balance without PointAccount ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPointSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/point-transactions:
    get:
      tags: [Loyalty]
      operationId: listCurrentCustomerPointTransactions
      summary: List current customer point ledger transactions
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Actor-scoped signed point ledger page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PointTransactionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /stores/search:
    get:
      tags: [Discovery]
      operationId: searchStores
      summary: Search stores by store, brand, region or available menu name
      description: |
        The query is trimmed, NFKC-normalized, lowercased and split on whitespace into
        at most five tokens before validation and cursor binding. Every token must match
        at least one searchable attribute of the store; a token is matched by substring
        first and only falls back to trigram similarity when no substring matched it.
        `%`, `_` and `\` are literal characters, not wildcards.

        Latitude and longitude must be supplied together or both omitted; radiusMeters
        without both coordinates returns 400, and sort=distance without coordinates
        returns 400. Coordinates are request-only and never persisted or written to logs.
        openOnly requires only that the store accepts orders with pickup enabled;
        pickupAvailable additionally requires a reservable slot and is a point-in-time
        projection that does not reserve one. Both default to unset, and a closed store
        is then still returned with its status in the flags. The relevance score itself
        is not part of the response.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - in: query
          name: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 50 }
        - in: query
          name: sort
          required: false
          schema: { type: string, enum: [relevance, distance], default: relevance }
        - in: query
          name: latitude
          required: false
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          required: false
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - in: query
          name: radiusMeters
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000 }
        - in: query
          name: openOnly
          required: false
          schema: { type: boolean }
        - in: query
          name: pickupAvailable
          required: false
          schema: { type: boolean }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/DiscoveryLimit"
      responses:
        "200":
          description: Signed-cursor page bound to the normalized query and optional location filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSearchPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/favorite-stores:
    get:
      tags: [Discovery]
      operationId: listCurrentCustomerFavoriteStores
      summary: List the current customer's favorite stores
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      responses:
        "200":
          description: Complete favorite-store list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerStoreList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/favorite-stores/{storeId}:
    put:
      tags: [Discovery]
      operationId: addCurrentCustomerFavoriteStore
      summary: Add a store to current customer favorites idempotently
      description: |
        A customer may hold at most 200 favorite stores. Adding a store that is already a favorite
        stays a 204 regardless of the count; only a request that would create the 201st favorite
        returns 409 FAVORITE_STORE_LIMIT_EXCEEDED. The count is evaluated while the customer's
        favorites are serialized, so simultaneous adds cannot settle above the cap.
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "204": { description: Store is a favorite }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      tags: [Discovery]
      operationId: deleteCurrentCustomerFavoriteStore
      summary: Remove a store from current customer favorites idempotently
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/StoreId"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "204": { description: Store is not a favorite }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/recent-stores:
    get:
      tags: [Discovery]
      operationId: listCurrentCustomerRecentStores
      summary: List distinct stores from the customer's recent eligible orders
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/CompactLimit"
      responses:
        "200":
          description: Recent stores ordered by latest qualifying order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerStoreList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /me/store-recommendations:
    get:
      tags: [Discovery]
      operationId: listCurrentCustomerStoreRecommendations
      summary: Recommend stores from favorite, recent, and nearby baseline signals
      x-beanflow-contract-status: TARGET
      security: [{ customerSession: [] }]
      description: |
        latitude and longitude must be supplied together or both omitted. When the pair is
        supplied and radiusMeters is omitted, nearby uses a 3000 meter radius. Coordinates are
        request-only and are not persisted or written to logs.
      parameters:
        - in: query
          name: latitude
          required: false
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - in: query
          name: longitude
          required: false
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - in: query
          name: radiusMeters
          required: false
          schema: { type: integer, minimum: 1, maximum: 10000, default: 3000 }
        - $ref: "#/components/parameters/CompactLimit"
      responses:
        "200":
          description: Deterministic baseline recommendations without personalization claims
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreRecommendationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /stores/nearby:
    get:
      tags: [Discovery]
      operationId: searchNearbyStores
      summary: 픽업 가능한 인근 매장을 검색합니다
      security: [{ customerSession: [] }]
      description: |
        위도/경도와 반경(미터)으로 인근 매장을 거리순으로 검색합니다. 정확한 고객
        좌표는 이 요청에만 사용되며 저장되거나 애플리케이션 로그·트레이스에 기록되지
        않습니다. radiusMeters는 1..10000 범위입니다. 결과는 내부적으로 canonical micrometer distance tuple(정규 마이크로미터 단위 거리 튜플)을 사용하며, 응답에는
        그것을 내림한 정수 미터 표시값을 반환합니다. 요청값이 범위를 벗어나면 400을 반환합니다.

        이 endpoint는 픽업 주문을 받고 있는 매장만 반환합니다. pickupAvailable은 거기서
        reservable slot inside the seven-day window(7일 창 안의 예약 가능한 슬롯)가 있는
        매장으로 더 좁히며, same meaning as on GET /stores/search(GET /stores/search와 동일한
        의미)입니다. 특정 시점의 사영이며 슬롯을 예약하지 않습니다. 이 필터는 공간 질의 뒤에
        적용되므로 한 page가 limit보다 짧아도 nextCursor가 함께 나올 수 있고, 그 cursor는
        마지막 반환 row가 아니라 last examined candidate(마지막으로 검사한 candidate)에
        앵커됩니다.
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/RadiusMeters"
        - in: query
          name: pickupAvailable
          required: false
          description: true로 지정하면 7일 창 안에 예약 가능한 슬롯이 남아 있는 매장만 반환합니다. 픽업 설정만으로는 충족되지 않습니다.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/DiscoveryLimit"
      responses:
        "200":
          description: 거리순, 동률 시 매장 ID순으로 정렬된 인근 매장 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyStorePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}:
    get:
      tags: [Discovery]
      operationId: getStore
      summary: Read the display identity of one store
      security: [{ customerSession: [] }]
      description: |
        Returns the store's current name and pickup availability so that a client which reached the
        store by URL, deep link or reload can name the store from the server instead of a value it
        carried in navigation state. `distanceMeters` is absent here because this read takes no
        coordinate. A store the customer must not see is reported the same as one that does not
        exist.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Store display identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerStore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/menus:
    get:
      tags: [Discovery]
      operationId: listStoreMenus
      summary: 매장의 현재 노출 메뉴 목록을 조회합니다
      security: [{ customerSession: [] }]
      description: |
        해당 매장 사장님이 등록한 현재 카탈로그 전체를 반환합니다. 판매 중지된
        메뉴/옵션도 포함됩니다. 200 응답은 페이지가 아닌 완전한 목록입니다. 메뉴가
        1,000개, 옵션이 5,000개를 넘으면 카탈로그를 조용히 잘라내는 대신 503을
        반환합니다. 존재하지 않는 매장이면 404를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 노출 중인 메뉴와 옵션 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /stores/{storeId}/pickup-slots:
    get:
      tags: [Discovery]
      operationId: listStorePickupSlots
      summary: 이용 가능한 픽업 슬롯 목록을 조회합니다
      security: [{ customerSession: [] }]
      description: |
        startsAt이 서버 현재 시각보다 미래이면서 7일 이내인 슬롯만 반환합니다. 매장은
        존재하지만 현재 픽업 주문을 받지 않는 경우 200과 빈 목록을 반환하며, 존재하지
        않는 매장이면 여전히 404를 반환합니다. 조건에 맞는 슬롯이 1,001개를 넘는 창구간은
        부분 목록 대신 503을 반환합니다.
      parameters:
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: 현재 잔여 수용량을 포함한 픽업 슬롯 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupSlotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders:
    post:
      tags: [Ordering]
      operationId: createOrder
      summary: Create an order and reserve required resources
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: |
            Order creation committed. External-payment orders have a required
            five-minute reservation deadline. Zero-payable orders include an
            approved BENEFIT_ONLY payment and no active reservation deadline.
            An idempotent replay returns the originally stored 201 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OrderCreationConflict"
        "503":
          $ref: "#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{sourceOrderId}/reorders:
    post:
      tags: [Ordering]
      operationId: reorderOrder
      summary: 종료된 주문을 원본으로 새 주문 생성(재주문)
      security: [{ customerSession: [] }]
      description: |
        소유 고객은 COMPLETED, CANCELLED, REJECTED, EXPIRED 상태의 원본(source)
        주문으로만 재주문할 수 있습니다. 서버는 메뉴 ID, 정규화된 옵션 ID, 수량만
        복사한 뒤 현재 시점의 Merchant 가격과 재고를 다시 검증하고, 기존과 동일한
        원자적 예약(reservation) 흐름을 사용합니다. 과거의 혜택, 결제, 픽업 슬롯,
        정산 스냅샷은 절대 복사하지 않습니다. 원본 항목 중 하나라도 더 이상 이용할
        수 없으면 요청 전체가 실패하며, 부분 주문은 생성되지 않습니다.

        멱등성(idempotency) 범위는 actor ID, REORDER_ORDER_V1, Idempotency-Key로
        결정됩니다. 정규 payload는 sourceOrderId, pickupSlotId, couponIssuanceId
        (null 포함), pointsToUseKrw로 구성됩니다. 동일 key/동일 payload로 종료
        상태를 재요청하면 최초 응답의 상태 코드와 본문을 그대로 재생합니다. 원본이나
        요청 내용이 다르면 최초 주문 응답을 노출하지 않고 IDEMPOTENCY_KEY_REUSED를
        반환합니다. PROCESSING 상태이면 Retry-After와 함께
        IDEMPOTENCY_REQUEST_IN_PROGRESS를 반환합니다. MANUAL_REVIEW는 자동 처리가
        중단됐다는 뜻이며 Retry-After 없이 IDEMPOTENCY_MANUAL_REVIEW_REQUIRED를
        반환하고, 소유자 작업은 다시 실행되지 않습니다.
      parameters:
        - $ref: "#/components/parameters/SourceOrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderOrderRequest"
      responses:
        "201":
          description: |
            새 Order, 필요한 모든 예약(reservation)과 불변 스냅샷, 가격 비교
            결과, 최초 멱등 응답이 모두 커밋됐습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReorderConflict"
        "503":
          $ref: "#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{orderId}:
    get:
      tags: [Ordering]
      operationId: getOrder
      summary: Get an order and materialize a due reservation expiry
      security: [{ customerSession: [] }]
      description: |
        If a PENDING_PAYMENT order has reached reservationExpiresAt, the server
        atomically expires the order and releases all reserved resources before
        returning EXPIRED. If that transaction fails, the request returns 503
        instead of a stale successful representation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order visible to the authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}/cancellations:
    post:
      tags: [Ordering]
      operationId: cancelOrder
      summary: Cancel an order in a customer-allowed state
      security: [{ customerSession: [] }]
      description: |
        PENDING_PAYMENT and PAID orders not yet ACCEPTED may be cancelled by the
        owning customer. Order cancellation and payment refund recovery are
        represented separately. Cancellation is not a separate aggregate, so the
        order itself is the cancellation resource and no new resource is created.

        Idempotency scope is actor ID, operation, and Idempotency-Key. The hashed
        payload covers orderId, reasonCode, and the normalized detail, so reusing
        one key across different orders returns 409 IDEMPOTENCY_KEY_REUSED and
        never replays another order's result. A repeated request with the same key
        and payload returns the originally stored 200 or 202 body unchanged; its
        paymentRecovery is a snapshot taken at cancellation time, so current
        progress must be read from GET /orders/{orderId}. This operation never
        returns IDEMPOTENCY_REQUEST_IN_PROGRESS because concurrent requests are
        serialized by the order row lock. A rolled back request stores no record,
        so retrying the same key re-executes and the order state guard returns
        409 ORDER_STATE_CONFLICT for an already cancelled order.

        If an earlier Refund is REQUESTED, PROCESSING, RETRY_SCHEDULED, UNKNOWN,
        RECONCILING, or MANUAL_REVIEW, cancellation returns 409
        PAYMENT_REFUND_UNRESOLVED before
        changing the order. Retry the same key after that Refund reaches SUCCEEDED
        or definitive FAILED. Payment lock timeouts and database failures return
        503 instead of this business conflict.

        If a PAID order has reached acceptanceDeadlineAt, this command does not
        perform customer cancellation. It durably requests deduplicated store
        timeout work and returns 409 ORDER_STATE_CONFLICT. Failure to persist that
        work returns 503. The order may remain PAID briefly until the timeout
        worker commits REJECTED.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationRequest"
      responses:
        "200":
          description: |
            Cancellation completed synchronously. Used for PENDING_PAYMENT orders
            where reservation release is committed in the same transaction and no
            external refund exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cancellation"
        "202":
          description: |
            Cancellation is recorded but compensation is still in progress. Used
            for PAID orders. Does not mean the refund or resource restoration
            succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cancellation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-config:
    get:
      tags: [Payment]
      operationId: getPaymentClientConfiguration
      summary: 공개 Toss V2 Standard 결제창 설정 조회
      description: |
        인증이 필요 없는 공개 API입니다. 클라이언트가 Toss Payments 결제창을 초기화하는
        데 필요한 provider, SDK 버전, client key를 반환합니다. 비밀 키나 서버 전용
        설정은 포함하지 않습니다.
      security: []
      responses:
        "200":
          description: 현재 활성화된 결제 Provider의 공개 클라이언트 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentClientConfiguration"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /orders/{orderId}/payment-attempts:
    post:
      tags: [Payment]
      operationId: prepareOneTimeOrderPayment
      summary: 서버 소유의 1회성 Toss 결제창 시도(attempt) 준비
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER 전용입니다. 서버는 orderId, amount, orderName, currency, customerKey,
        콜백 URL을 모두 소유 중인 Order 스냅샷에서 직접 계산합니다. PaymentMethod나
        브라우저가 전달한 금액은 절대 받아들이지 않습니다. 동일 Idempotency-Key로
        재요청하면 동일한 불변 attempt를 그대로 반환합니다.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "200":
          description: 새로 생성됐거나 멱등하게 재생된 1회성 결제 attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimePaymentAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}:
    get:
      tags: [Payment]
      operationId: getOneTimePayment
      summary: 소유 고객에게 공개되는 1회성 결제 상태와 복구 진행 상황 조회
      security: [{ customerSession: [] }]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Provider 승인이 확정된 결제 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "202":
          description: Provider 결과가 아직 확정되지 않았거나 정합성 재확인(reconciliation)이 진행 중
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}/confirmations:
    post:
      tags: [Payment]
      operationId: confirmOneTimePayment
      summary: Toss 성공 콜백을 검증하고 서버-투-서버로 결제 승인 확정
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER 전용입니다. paymentKey, orderId, amount는 서버가 소유한 attempt와
        정확히 일치해야 합니다. 최초로 유효성을 통과한 콜백이 Provider 승인 호출 전에
        해당 attempt를 선점합니다. 동일한 값으로 재요청하면 다시 승인을 시도하지 않고
        현재 상태를 그대로 반환하며, 값이 달라진 재요청은 PAYMENT_CALLBACK_MISMATCH를
        반환합니다. 202 응답은 아직 결과가 확정되지 않은 상태이며, 상태 조회 API로
        복구해야 합니다.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimePaymentConfirmationRequest"
      responses:
        "200":
          description: Provider 승인과 Order 상태 전이가 함께 커밋됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "202":
          description: Provider 결과가 아직 확정되지 않았으며, 복구 처리가 durable하게 진행됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-methods:
    get:
      tags: [Payment Methods]
      operationId: listPaymentMethods
      summary: 인증된 고객이 사용 가능한 결제수단 목록 조회
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER 전용이다. 호출자의 ACTIVE 및 비활성화 대기(DEACTIVATION_PENDING) 결제수단을
        반환하며, 종결 상태인 DEACTIVATED 항목은 제외된다. 내부 토큰, Provider 고객 참조,
        만료일, 시도/실패 필드는 절대 반환되지 않는다. 결과는 isDefault DESC, createdAt DESC,
        paymentMethodId DESC 순으로 정렬된다. signed cursor는 인증된 고객에게 바인딩된다.
        페이지 사이에 기본값이나 상태가 바뀌어도 스냅샷이 아니므로, 클라이언트는 최신 선호를
        확인하려면 첫 페이지를 다시 조회해야 한다.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 고객에게 노출되는 본인 소유 결제수단 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    post:
      tags: [Payment Methods]
      operationId: registerPaymentMethod
      summary: Provider 결제창 인증을 거친 결제수단 등록
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER 전용이다. 요청은 Provider 결제창이 반환한 1회용 authKey와 고객이 지정한
        표시 별칭만 받는다. 카드번호(PAN), CVC, 유효기간, 생년월일, 카드 비밀번호는 절대
        받지 않는다. Provider는 TOSS_PAYMENTS로 고정되며 호출자가 선택할 수 없다.

        멱등성 범위는 액터 ID, REGISTER_PAYMENT_METHOD_V1, Idempotency-Key다. 정규화된
        페이로드는 고정 provider, 원본을 저장하지 않는 authKey의 SHA-256 해시, 정규화된
        displayAlias로 구성된다. 같은 키/같은 페이로드로 재시도하면 새 Provider 호출 없이
        최초의 종결 응답 또는 현재의 202 표현을 반환한다. 같은 키로 다른 페이로드를 보내거나
        같은 authKey를 다른 키로 보내면 409가 반환된다. 결과가 불확실한 Provider 응답은
        1회용 authKey로 재시도되지 않는다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPaymentMethodRequest"
      responses:
        "200":
          description: Provider 발급 결과가 기존에 존재하는 활성 결제수단과 정확히 일치하여 재사용됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "201":
          description: Provider 발급과 로컬 PaymentMethod 커밋이 모두 확정됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "202":
          description: |
            등록 결과가 아직 확정되지 않았거나 수동 조사 대상이다.
            이 상태는 등록 완료된 결제수단이 아니며 결제에 사용할 수 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodRegistration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-methods/{paymentMethodId}:
    delete:
      tags: [Payment Methods]
      operationId: deactivatePaymentMethod
      summary: 소유한 결제수단 비활성화 및 Provider 토큰 해제
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER 전용이다. Tx D1이 먼저 해당 결제수단을 신규 결제 불가 상태로 표시하고
        기본 결제수단 플래그를 해제한 뒤 후속 작업을 durable하게 저장한다. Provider DELETE는
        이 트랜잭션 밖에서 단 한 번 실행된다. Provider 성공이 확인되고 Tx D2가 커밋된
        경우에만 204를 반환한다. 타임아웃, 응답 유실, 파싱 실패, 결과 저장 실패는 202를
        반환하며 자동으로 두 번째 DELETE를 재시도하지 않는다. 검증된 BILLING_DELETED
        알림이 오면 해당 결제수단이 수렴될 수 있고, 그렇지 않으면 96시간 후 수동 검토
        대상으로 남는다.

        멱등성 범위는 액터 ID, DEACTIVATE_PAYMENT_METHOD_V1, Idempotency-Key다. 같은
        키/같은 대상으로 재요청하면 새 Provider 호출 없이 원래의 204 또는 현재의 202
        표현을 반환한다. 같은 키를 다른 대상에 사용하면 409가 반환된다.
      parameters:
        - $ref: "#/components/parameters/PaymentMethodId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "202":
          description: Provider 측 해제가 아직 확정되지 않음. 다만 해당 결제수단은 이미 신규 결제에 사용할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodDeactivation"
        "204":
          description: Provider 해제와 로컬 종결 비활성화가 모두 확정됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payment-methods/{paymentMethodId}/default:
    put:
      tags: [Payment Methods]
      operationId: setDefaultPaymentMethod
      summary: 소유한 활성 결제수단을 기본 결제수단으로 지정
      security: [{ customerSession: [] }]
      description: |
        CUSTOMER 전용이다. 이 명령은 요청 본문이 없다. 고객 범위 락 하에서 이전 기본
        결제수단을 원자적으로 해제하고 이 ACTIVE 결제수단을 기본으로 지정한다. 이 선호값은
        결제 확인 시 생략된 paymentMethodId를 추론하는 데 절대 사용되지 않는다.

        같은 액터, 오퍼레이션, Idempotency-Key, 대상으로 재요청하면 더 최신 선호값을
        바꾸지 않고 원래의 200을 그대로 재현한다. 같은 키를 다른 대상에 재사용하면
        IDEMPOTENCY_KEY_REUSED가 반환된다.
      parameters:
        - $ref: "#/components/parameters/PaymentMethodId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CustomerCsrfToken"
      responses:
        "200":
          description: 기본 결제수단 지정이 커밋됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /payments/{paymentId}/refunds:
    post:
      tags: [Payment]
      operationId: createPaymentRefund
      summary: Create a merchant full or item-based partial refund
      security: [{ merchantSession: [] }]
      description: |
        This is a Merchant Session transaction adjustment, not a customer self-service
        or operator command. STORE_OWNER and STORE_STAFF require active membership in
        the Order store. Omitted lineItems consumes all remaining units. Explicit
        quantities consume the lowest unrefunded conceptual unit positions. Within each
        line, coupon then points are allocated deterministically and cash is the residual;
        coupon attribution never restores the coupon.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/MerchantCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: |
            Refund resource creation and the synchronous result are confirmed.
            Requested amount snapshots and pointsRestorationState are always
            present. Each confirmed amount follows its owner-specific state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "202":
          description: |
            Refund result is unknown or reconciliation is in progress. Requested
            amount snapshots and pointsRestorationState are present. A confirmed
            points amount may exist only if its asynchronous Loyalty work already
            succeeded; HTTP 202 alone does not determine either confirmed amount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/payments/{paymentId}/refunds:
    post:
      tags:
        - Operations
        - Payment
      operationId: createOperationsPaymentRefund
      summary: (운영팀) 결제 환불 접수
      security:
        - bearerAuth: []
      description: |
        운영팀이 결제의 전액 환불이나 주문 항목 단위 부분 환불을 접수하는 API입니다.
        점주용 환불 API와 같은 환불 기록과 외부 결제사 요청 식별값을 사용합니다. 같은 운영자, 같은 Idempotency-Key, 같은 요청 내용이라면 어느 환불 경로로 요청해도 환불이 중복으로 만들어지지 않습니다. 현금 환불이 확인되면 201, 결과 확인이나 재처리가 남으면 202를 반환합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 운영팀 환불 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 환불 가능 금액·현재 상태·`Idempotency-Key`가 충돌한 경우
        - 422: 환불 항목이나 수량이 업무 규칙에 맞지 않는 경우
        - 503: 결제사 또는 필수 저장소를 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: 결제 전액·부분 환불 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '202':
          description: 요청은 반영되었고 후속 확인·복구 작업은 계속 진행 중
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /store-orders/{orderId}:
    get:
      tags: [Store Orders]
      operationId: getStoreOrder
      summary: Get an order and its abbreviated compensation status
      description: |
        Returns the store projection of the order plus a compensation summary
        limited to trigger, case state and updatedAt. Step detail, attempt
        counts, internal error codes, the case identifier and benefit policy
        versions are operator-only and available from
        GET /operations/orders/{orderId}/compensation.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Store order visible to an authorized active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}/status:
    patch:
      tags: [Store Orders]
      operationId: transitionStoreOrderStatus
      summary: Transition an order from the store operational view
      description: |
        store-orders is a store-facing view of the Ordering-owned Order, not a
        separate Aggregate. Cancellation after ACCEPTED is not an allowed target.

        Idempotency scope is actor ID, operation, and Idempotency-Key. The hashed
        payload covers orderId, targetState, and the normalized reason, so reusing
        one key across different orders returns 409 IDEMPOTENCY_KEY_REUSED and
        never replays another order's result.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderTransitionRequest"
      responses:
        "200":
          description: Synchronous ACCEPTED, PREPARING, READY, or COMPLETED transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "202":
          description: |
            REJECTED is committed and compensation is still tracked separately.
            This response does not mean refund or resource restoration succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/orders/{orderId}/compensation:
    get:
      tags: [Operations]
      operationId: getOrderCompensation
      summary: Read owner compensation progress for a rejected or cancelled order
      description: |
        Platform operator view of the order compensation case. Step level state,
        attempt counts and internal error codes are operator-only and are never
        returned to customers or store members. Requires an active
        ORDER_COMPENSATION_READ grant and an audited X-Access-Reason.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AccessReason"
      responses:
        "200":
          description: Compensation case for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCompensationView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/orders/{orderId}/customer-cancellation-refund-reconciliations:
    post:
      tags: [Operations]
      operationId: scheduleCustomerCancellationRefundReconciliation
      summary: Schedule one operator-authorized LOOKUP for a terminal customer-cancellation Refund
      description: |
        Requires PLATFORM_OPERATOR and an active
        CUSTOMER_CANCELLATION_REFUND_RECONCILE grant. The transaction validates
        the immutable cancellation setup and schedules exactly one LOOKUP using
        the existing Provider idempotency key. It never accepts financial or
        Provider identifiers, records a manual success, or sends a new REQUEST.
        A 202 response means LOOKUP_SCHEDULED, not refund success.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCancellationRefundReconciliationRequest"
      responses:
        "202":
          description: LOOKUP scheduled or replayed from the first identical command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCancellationRefundReconciliation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/reprocessing-cases/{caseId}/repair-proposals:
    post:
      tags: [Operations]
      operationId: proposeCustomerCancellationSetupRepair
      summary: Propose the safe recreation of a missing customer-cancellation Refund
      description: |
        Creates a 30-minute repair proposal after validating that the durable
        recovery snapshot is complete and only the Refund row is missing. Requires
        an active PLATFORM_OPERATOR with the explicit
        PAYMENT_CANCELLATION_SETUP_REPAIR grant. Financial values and provider keys are
        server-derived and cannot be supplied by the caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: caseId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepairProposalRequest"
      responses:
        "201":
          description: Pending proposal or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/reprocessing-repair-proposals/{proposalId}/decisions:
    post:
      tags: [Operations]
      operationId: decideCustomerCancellationSetupRepair
      summary: Approve or reject a missing-Refund repair proposal
      description: |
        Requires a different active PLATFORM_OPERATOR with the explicit
        PAYMENT_CANCELLATION_SETUP_REPAIR grant from the proposer. Approval
        revalidates every safety guard under Order and Payment locks. A successful
        approval recreates the Refund for same-key LOOKUP; it never calls the
        provider inside the HTTP transaction.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: proposalId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairProposalDecisionRequest"
      responses:
        "200":
          description: Terminal proposal or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration:
    get:
      tags: [Operations]
      operationId: listExpiredBenefitRestorationPolicies
      summary: List the five current trigger and benefit policy heads
      description: |
        Requires an active PLATFORM_OPERATOR with the explicit
        EXPIRED_BENEFIT_POLICY_READ grant and a non-blank X-Access-Reason.
        The server records the read access before returning the current heads.
      parameters:
        - $ref: "#/components/parameters/AccessReason"
      responses:
        "200":
          description: Current policy heads ordered by trigger and benefit type
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration/{trigger}/{benefitType}:
    patch:
      tags: [Operations]
      operationId: updateExpiredBenefitRestorationPolicy
      summary: Create a new version for one trigger and benefit policy
      description: Requires an active PLATFORM_OPERATOR with the explicit EXPIRED_BENEFIT_POLICY_WRITE grant.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: trigger
          in: path
          required: true
          schema:
            type: string
            enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        - name: benefitType
          in: path
          required: true
          schema:
            type: string
            enum: [COUPON, POINTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpiredBenefitRestorationPolicyRequest"
      responses:
        "200":
          description: New policy head or the replayed first response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          description: |
            The policy key does not exist. PARTIAL_REFUND is valid only with
            POINTS; PARTIAL_REFUND/COUPON never creates a head.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /operations/policies/ordinary-point-accrual/global:
    get:
      tags:
        - Operations
      operationId: getGlobalOrdinaryPointAccrualPolicy
      summary: (운영팀) 공통 포인트 적립 정책 조회
      description: |
        운영팀이 모든 매장의 기본값으로 사용하는 공통 포인트 적립 정책을 조회하는 API입니다.
        전용 조회 권한과 조회 감사 기록이 필요하며, 현재 적용 중인 완전한 정책 버전을 반환합니다.

        주요 오류:
        - 400: 조회 사유가 비어 있거나 헤더 형식이 올바르지 않은 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 공통 적립 정책 조회 권한이 없는 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/AccessReason'
      responses:
        '200':
          description: 기본 포인트 적립 정책 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdinaryPointAccrualPolicyVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    patch:
      tags:
        - Operations
      operationId: changeGlobalOrdinaryPointAccrualPolicy
      summary: (운영팀) 공통 포인트 적립 정책 변경
      description: |
        운영팀이 공통 포인트 적립 정책의 새 버전을 추가하고 바로 적용하는 API입니다.
        적립률, 반올림 방식, 발행 주체, 만료 규칙 등을 한 버전으로 저장합니다. 같은 Idempotency-Key와 같은 요청을 다시 보내면 최초 결과를 반환합니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 공통 적립 정책 변경 권한이 없는 경우
        - 409: 현재 정책 버전이 바뀌었거나 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeGlobalOrdinaryPointAccrualPolicyRequest'
      responses:
        '200':
          description: 기본 포인트 적립 정책 변경 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdinaryPointAccrualPolicyVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /operations/policies/ordinary-point-accrual/global/versions:
    get:
      tags:
