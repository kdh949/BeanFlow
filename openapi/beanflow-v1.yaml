      description: |
        스토어 소유자가 확정된 정산 항목의 금액에 이의제기를 접수하는 API입니다.
        해당 매장의 활성 OWNER 권한이 필요합니다. 정산 확정일을 D라고 할 때 서울 시간 기준 D+1 00:00부터 D+15 00:00 전까지 접수할 수 있습니다. 같은 Idempotency-Key와 같은 요청은 최초 201 결과를 반환합니다. 진행 중인 이의제기가 있으면 새로 접수할 수 없으며, 다시 접수할 때는 새 증빙이 필요하고 재접수는 한 번만 허용됩니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 해당 매장의 활성 OWNER 권한이 없는 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 접수 기간이 지났거나 진행 중인 이의제기가 있거나 재접수 규칙을 위반한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/SettlementItemId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeRequest'
      responses:
        '201':
          description: 정산 이의제기 접수 생성 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /support/searches:
    post:
      tags: [Support]
      operationId: searchSupportSubjects
      summary: 전화번호/이메일로 Support 대상을 정확히 검색
      description: |
        전화번호 또는 이메일 중 하나의 검증 조건만 JSON 본문으로 받으며, 쿼리 파라미터는 모두 거부합니다.
        클라이언트가 보낸 쿼리 문자열이 거부 전에 업스트림 인프라까지 도달할 수 있으므로, 이 라우트의
        인그레스/컨테이너 접근 로그는 쿼리 문자열을 반드시 생략하거나 마스킹해야 합니다. BeanFlow는
        원본 또는 정규화된 검증 조건 값을 응답, Audit 페이로드, 애플리케이션 로그, 메트릭, 커서, Support
        저장소 어디에도 남기지 않습니다. 각 오너 Context가 버전 관리되는 blind-index 조회를 수행하고
        마스킹된 결과만 반환합니다.
        결과는 CUSTOMER, STORE, RIDER 순서 후 subject ID 순으로 정렬되며 최대 20건까지 노출하고,
        매칭 건수는 21로 상한됩니다(21은 "21건 이상"을 의미). 실제로 매칭이 없는 경우는 필요한 모든
        의존성이 성공한 뒤에만 감사 기록이 남는 빈 200 응답으로 반환됩니다.
        429는 검증 조건(actorId+criterion)당 5분간 30회로 제한되는 영속적 레이트 가드를 초과했을 때 발생합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchSupportSubjectsRequest"
      responses:
        "200":
          description: Masked exact-match candidates and bounded ambiguity metadata
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSubjectSearchResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/SupportSearchRateLimited" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases:
    post:
      tags: [Support]
      operationId: createSupportCase
      summary: 담당자가 배정된 SupportCase 생성
      description: |
        인증된 운영자에게 배정된 OPEN 상태의 Case를 생성합니다. Case, 최초 배정/상태 이력, 보존 스냅샷,
        Audit 기록, 저장된 멱등 응답이 하나의 트랜잭션으로 원자적으로 커밋됩니다. 비밀정보나 고위험
        PII가 포함된 자유 텍스트는 거부됩니다. 이 호출로 오너 Context 레코드가 갱신되지는 않습니다.
        실패 시 400(유효성 오류 또는 금지된 텍스트), 409(같은 Idempotency-Key로 다른 payload 재사용)를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportCaseRequest"
      responses:
        "201":
          description: Case created, or the original response replayed for the same command
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCase"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    get:
      tags: [Support]
      operationId: listSupportCases
      summary: 필터에 고정된 커서로 SupportCase 목록 조회
      description: |
        openedAt 내림차순, 동률 시 Case ID 내림차순으로 정렬됩니다. 서명된 커서는 조회 시점의 state,
        assigneeId 필터에 고정되며 15분 뒤 만료되고, interactions나 notes는 엔티티 컬렉션으로 함께
        로드하지 않습니다. 만료되었거나 필터가 바뀐 커서로 재요청하면 400을 반환합니다.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SupportCaseState"
        - name: assigneeId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Case summary page
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCasePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}:
    get:
      tags: [Support]
      operationId: getSupportCase
      summary: SupportCase와 활성 식별자 연결 조회
      description: Case의 현재 상태, 배정, 우선순위, 활성 subject 연결 목록과 버전을 반환합니다. Case가 없거나 조회 권한이 없으면 각각 404, 403을 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
      responses:
        "200":
          description: Current Case representation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCase"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/assignments:
    post:
      tags: [Support]
      operationId: assignSupportCase
      summary: SupportCase 담당자 배정 이력 추가
      description: Case를 새 담당 운영자에게 재배정하고 배정 이력을 추가합니다. expected Case version이 현재 버전과 다르면 409, 대상 운영자가 존재하지 않거나 비활성이면 400을 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSupportCaseRequest"
      responses:
        "200":
          description: Assignment appended, or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseAssignment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/status-transitions:
    post:
      tags: [Support]
      operationId: transitionSupportCase
      summary: 배정된 활성 SupportCase의 상태 전이
      description: |
        OPEN→IN_PROGRESS, IN_PROGRESS→WAITING|RESOLVED, WAITING→IN_PROGRESS, RESOLVED→CLOSED만
        유효한 전이입니다. CLOSED는 종결 상태로 더 이상 전이할 수 없습니다. 허용되지 않는 전이나
        만료된 expected version이면 각각 400, 409를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionSupportCaseRequest"
      responses:
        "200":
          description: State transition appended, or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseTransition"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/interactions:
    post:
      tags: [Support]
      operationId: appendSupportInteraction
      summary: 비식별화된 Support 상담 이력 추가
      description: Case에 상담 채널/방향/발생 시각과 비식별 요약만 기록합니다. 원문 상담 내용은 저장하지 않습니다. Case가 없거나 현재 배정 담당자가 아니면 각각 404, 403을 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendSupportInteractionRequest"
      responses:
        "200":
          description: Interaction appended, or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportInteraction"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/notes:
    post:
      tags: [Support]
      operationId: appendSupportNote
      summary: 비밀정보가 필터링된 Support 메모 추가
      description: Case에 내부 메모를 추가합니다. 비밀정보나 고위험 PII가 포함된 텍스트는 저장을 거부합니다. 응답에는 메모 원문 대신 비식별 요약만 포함됩니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendSupportNoteRequest"
      responses:
        "200":
          description: Note appended without returning its content
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportNote"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/subject-links:
    post:
      tags: [Support]
      operationId: linkSupportSubject
      summary: 활성 SupportCase에 불투명 식별자 연결 추가
      description: 고객, 매장, 주문 등 타입이 정해진 opaque 식별자를 Case에 연결합니다. 이미 동일한 관계로 연결된 경우 409, Case가 종결 상태면 400을 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkSupportSubjectRequest"
      responses:
        "200":
          description: Subject link appended, or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSubjectLink"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/subject-links/{linkId}:
    delete:
      tags: [Support]
      operationId: unlinkSupportSubject
      summary: 활성 Support subject 연결 해제
      description: 지정한 링크를 닫아 더 이상 Case와 연결되지 않도록 합니다. 이미 해제된 링크이거나 expected Case version이 다르면 각각 404, 409를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/SupportSubjectLinkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlinkSupportSubjectRequest"
      responses:
        "200":
          description: Link closed, or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSubjectUnlink"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/verification-sessions:
    post:
      tags: [Support]
      operationId: createSupportVerificationSession
      summary: 목적 결합 단계적 본인확인 세션 시작
      description: |
        담당 Case, 활성 subject link 하나, 인증된 운영자, purpose와 닫힌 action scope에 묶인
        15분짜리 BASIC 또는 ENHANCED 본인확인 세션을 시작합니다. scope를 생략하면
        PERSONAL_DATA_REVEAL로 간주되며, SUPPORT_ACTION은 CASE_RESOLUTION purpose에서만
        허용됩니다. OTP, raw link, 답변, proof는 저장하지 않습니다.
        현재 할당된 담당자가 아니거나 subject link가 비활성이면 403, Case나 subject link를
        찾을 수 없으면 404, 같은 Case+Subject에 대해 lockout 기간(30분) 내 재요청이면 409를
        반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationSessionRequest"
      responses:
        "201":
          description: Verification session started or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSessionResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/verification-sessions/{sessionId}:
    get:
      tags: [Support]
      operationId: getSupportVerificationSession
      summary: 현재 목적 결합 본인확인 상태 조회
      description: |
        path로 지정한 세션의 현재 상태와 opaque challenge 메타데이터를 반환합니다. proof나
        provider reference는 포함하지 않습니다. 세션을 생성한 운영자와 동일한 actor만
        조회할 수 있으며, 다른 운영자가 조회하면 403, 세션을 찾을 수 없으면 404를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/VerificationSessionId"
      responses:
        "200":
          description: Current session and opaque challenge metadata
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSessionResource"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/verification-sessions/{sessionId}/challenges:
    post:
      tags: [Support]
      operationId: issueSupportVerificationChallenge
      summary: 등록된 채널로 opaque challenge 발급
      description: |
        challenge intent를 저장한 뒤 DB transaction 밖에서 설정된 Identity provider를 호출하고,
        확정 결과 또는 UNKNOWN 결과를 기록합니다. secret이나 raw link는 응답에 절대 포함하지
        않습니다. 세션이 만료·잠김 상태이면 409, provider 호출이 실패하거나 지연되면 503을
        반환할 수 있습니다.
      parameters:
        - $ref: "#/components/parameters/VerificationSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueVerificationChallengeRequest"
      responses:
        "201":
          description: Opaque challenge metadata; never contains a secret or raw link
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallengeResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/verification-challenges/{challengeId}/verifications:
    post:
      tags: [Support]
      operationId: verifySupportVerificationChallenge
      summary: opaque challenge proof 한 건 검증
      description: |
        proof는 일시적인 write-only 입력이며 저장하지 않습니다. 잘못된 proof는 Case+Subject
        단위 시도 횟수를 소진시키며, 5번째 실패 시 30분 lockout이 걸립니다. 동시 요청이나
        재검증 요청이 provider를 두 번 호출하지 않도록 idempotent하게 처리합니다.
        challenge가 이미 terminal 상태이거나 세션이 잠겼으면 409, 시도 횟수를 초과하면
        429를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/VerificationChallengeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyVerificationChallengeRequest"
      responses:
        "200":
          description: Verification outcome without proof or provider reference
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResultResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/verification-sessions/{sessionId}/revocations:
    post:
      tags: [Support]
      operationId: revokeSupportVerificationSession
      summary: 본인확인 세션 폐기
      description: |
        path로 지정한 세션을 즉시 폐기 상태로 전환합니다. raw 사유 텍스트는 받지 않습니다.
        세션을 생성한 운영자와 동일한 actor만 폐기할 수 있으며, 이미 종료(만료·폐기)된
        세션이면 409, 존재하지 않으면 404를 반환합니다. 같은 Idempotency-Key로 재요청하면
        이전 응답을 그대로 재생합니다.
      parameters:
        - $ref: "#/components/parameters/VerificationSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked session or the original response replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSessionResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/data-access-grants:
    post:
      tags: [Support]
      operationId: requestSupportDataAccessGrant
      summary: 필드 범위가 제한된 개인정보 열람 승인(Grant) 요청
      description: |
        Grant를 Case, subject link, subject, 요청자와 verification purpose에 묶어 생성합니다.
        BASIC 등급 필드(표시 이름 등)는 10분/3회 reveal 예산으로 즉시 활성화되고, SENSITIVE
        등급 필드(전화·이메일·provider reference)는 ENHANCED 본인확인과 요청자와 다른
        승인자의 승인을 거쳐야 5분/1회 reveal 예산으로 활성화됩니다.
        verification session이 요구 등급에 미달하거나 필드 조합이 잘못되면 400, 담당
        Case가 아니면 403, Case나 세션을 찾을 수 없으면 404를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestDataAccessGrantRequest"
      responses:
        "201":
          description: Grant state after verification qualification
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAccessGrantResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/data-access-grants/{grantId}/approvals:
    post:
      tags: [Support]
      operationId: decideSupportDataAccessGrant
      summary: SENSITIVE DataAccessGrant 승인/거부 결정
      description: |
        승인자는 요청자와 달라야 하며 전달한 expectedVersion이 현재 Grant version과 정확히
        일치해야 합니다. 승인 권한이 없으면 403, Grant를 찾을 수 없으면 404, 버전이
        어긋나거나 이미 결정된 Grant면 409를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/DataAccessGrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideDataAccessGrantRequest"
      responses:
        "200":
          description: Approved active or denied Grant
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataAccessGrantResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/data-access-grants/{grantId}/reveals:
    post:
      tags: [Support]
      operationId: revealSupportPersonalData
      summary: 활성 Grant가 허용한 필드만 정확히 열람
      description: |
        owner 측 복호화 전에 Audit 기록과 reveal 시도 예약을 먼저 commit합니다. owner
        Context는 Support transaction 밖에서 복호화를 수행하며, Audit이나 owner 처리가
        실패하면 raw 데이터를 절대 반환하지 않습니다. commit된 시도는 복호화 성공 여부와
        무관하게 reveal 예산을 소비합니다. 성공 응답은 저장되지 않으며, 같은
        Idempotency-Key로 재요청하면 수동 검토가 필요합니다.
        요청 필드가 Grant 범위를 벗어나면 400, Grant가 만료·소진·거부 상태면 409를
        반환합니다.
      parameters:
        - $ref: "#/components/parameters/DataAccessGrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealGrantedPersonalDataRequest"
      responses:
        "200":
          description: Ephemeral field-keyed values; clients must not cache or persist this response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedPersonalDataResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/cases/{caseId}/break-glass-requests:
    post:
      tags: [Support]
      operationId: requestSupportBreakGlass
      summary: 개인정보 필드 1건에 대한 비상 접근(break-glass) 요청
      description: |
        BREAK_GLASS는 일반 본인확인·Grant 경로와 별도인 Aggregate입니다. 비상 목적의 필드
        1건으로 범위가 제한되며, PII가 포함되지 않은 보안 알림을 durable하게 발송합니다.
        승인되면 2분 유효기간과 1회 reveal 예산을 가진 요청이 생성됩니다.
        Case가 활성 담당 상태가 아니면 403, Case나 subject link를 찾을 수 없으면 404를
        반환합니다.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestBreakGlassRequest"
      responses:
        "201":
          description: Pending distinct pre-approval
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/break-glass-requests/{requestId}/approvals:
    post:
      tags: [Support]
      operationId: decideSupportBreakGlass
      summary: break-glass 요청 1건 사전 승인/거부
      description: |
        승인은 요청자와 다른 actor만 수행할 수 있으며, 승인 시 2분/1회 reveal 창이
        활성화됩니다. 승인 권한이 없으면 403, 요청을 찾을 수 없으면 404, expectedVersion이
        어긋나거나 이미 결정된 요청이면 409를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/BreakGlassRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideBreakGlassRequest"
      responses:
        "200":
          description: Current break-glass request state
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/break-glass-requests/{requestId}/reveals:
    post:
      tags: [Support]
      operationId: revealSupportBreakGlassData
      summary: 사전 승인된 비상 필드 1건을 단 한 번 열람
      description: |
        일반 reveal과 동일한 "Audit 먼저, owner 복호화 나중" 경계를 사용하며, durable 보안
        알림을 발송하고 단 1회의 시도를 소비한 뒤 필수 사후 검토(post-review) 상태로
        전환됩니다.
        요청자 본인이 아니면 403, 승인 창(2분)이 지났거나 이미 사용된 요청이면 409를
        반환합니다.
      parameters:
        - $ref: "#/components/parameters/BreakGlassRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealBreakGlassRequest"
      responses:
        "200":
          description: One ephemeral pre-approved field value
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassRevealResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /support/break-glass-requests/{requestId}/reviews:
    post:
      tags: [Support]
      operationId: reviewSupportBreakGlass
      summary: 필수 사후 검토 완료
      description: |
        검토자는 요청자와 사전 승인자 모두와 달라야 하며 정확한 expectedVersion이
        필요합니다. 검토 권한이 없으면 403, 요청을 찾을 수 없으면 404, 아직 reveal되지
        않았거나 이미 검토된 요청이면 409를 반환합니다.
      parameters:
        - $ref: "#/components/parameters/BreakGlassRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewBreakGlassRequest"
      responses:
        "200":
          description: Reviewed or escalated break-glass request
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassResource"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
