  /operations/policies/ordinary-point-accrual/stores:
    get:
      tags:
        - Operations
      operationId: listStoreOrdinaryPointAccrualPolicyHeads
      summary: (운영팀) 매장별 포인트 적립 정책 목록 조회
      description: |
        운영팀이 매장별로 따로 저장된 현재 포인트 적립 설정을 조회하는 API입니다.
        매장 자체 정책(OVERRIDE)과 공통 정책 상속(INHERIT_GLOBAL)을 구분해 보여 줍니다. 선택한 상태만 필터링할 수 있으며 공통 정책만 사용하는 매장은 별도 매장 설정이 없을 수 있습니다.

        주요 오류:
        - 400: 조회 사유, 상태 필터 또는 페이지 커서가 올바르지 않은 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 매장별 적립 정책 조회 권한이 없는 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - OVERRIDE
              - INHERIT_GLOBAL
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 매장별 포인트 정책 목록 조회 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdinaryPointAccrualPolicyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /operations/policies/ordinary-point-accrual/stores/{storeId}:
    get:
      tags:
