        스토어 구성원이 고객센터의 주문 변경을 승인하거나 제한된 변경 권한을 부여하는 API입니다.
        `CONFIRMATION`은 특정 요청 한 건과 주문 버전에만 사용할 수 있습니다. `DELEGATION`은 매장과 작업 종류에 묶이며, 주문 취소는 10분 동안 1회, 픽업 시간 변경은 30분 동안 최대 3회 성공 처리할 수 있습니다. `now >= expiresAt`이면 만료되어 더 이상 사용할 수 없으며, 검증 실패, 롤백, `RESOLUTION_REQUIRED`는 사용 횟수에 포함하지 않습니다.

        주요 오류:
        - 400: 요청 값, 경로·쿼리·헤더 형식 또는 본문 검증에 실패한 경우
        - 401: 로그인 정보가 없거나 유효하지 않은 경우
        - 403: 해당 매장의 활성 구성원 권한이 없거나 비용 책임에 동의하지 않은 경우
        - 404: 대상 자원을 찾을 수 없는 경우
        - 409: 요청 내용·주문 버전·만료·사용 한도 또는 `Idempotency-Key`가 충돌한 경우
        - 503: 필수 저장소나 외부 시스템을 사용할 수 없는 경우
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportOrderChangeAuthorizationRequest'
      responses:
        '201':
          description: 고객센터 주문 변경 승인 생성 결과
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
