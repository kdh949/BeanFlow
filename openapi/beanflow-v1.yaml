        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ChangeStoreOrdinaryPointAccrualOverrideRequest"
                - $ref: "#/components/schemas/ChangeStoreOrdinaryPointAccrualInheritanceRequest"
              discriminator:
                propertyName: state
      responses:
        "200":
          description: Newly activated or replayed STORE version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdinaryPointAccrualPolicyVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
