openapi: 3.1.0
info:
  title: BeanFlow API — Deployed Contract
  version: 0.2.0
  x-beanflow-contract-status: deployed
  x-beanflow-contract-date: 2026-08-03
  description: |
    Current public controller contract represented by this repository source.
    It contains only implemented mappings. Components shared with the target
    contract are referenced explicitly; deployed-only legacy shapes are local.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Ordering
  - name: Payment
  - name: Store Orders
  - name: Operations
paths:
  /orders:
    post:
      tags: [Ordering]
      operationId: createOrder
      summary: Create an order and reserve required resources
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order creation committed
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/CreateOrderResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/OrderCreationConflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/OrderCreationDependencyUnavailable"
  /orders/{orderId}:
    get:
      tags: [Ordering]
      operationId: getOrder
      summary: Get an order and materialize a due reservation expiry
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
      responses:
        "200":
          description: Order visible to the authenticated owner
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Order"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /orders/{orderId}/payment-confirmations:
    post:
      tags: [Payment]
      operationId: confirmOrderPayment
      summary: Request or confirm payment for an order
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/PaymentConfirmationRequest"
      responses:
        "200":
          description: External payment approval or late-approval recovery is confirmed
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/PaymentConfirmation"
        "202":
          description: Payment result or late-approval recovery is unresolved
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/PaymentConfirmation"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "422":
          $ref: "./beanflow-v1.yaml#/components/responses/UnprocessableEntity"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /payments/{paymentId}/refunds:
    post:
      tags: [Payment]
      operationId: createPaymentRefund
      summary: Create a store or platform full/item partial refund
      description: |
        STORE_OWNER and STORE_STAFF require active membership in the Order store;
        PLATFORM_OPERATOR is platform-scoped. Omitted lineItems consumes every
        remaining unit. Explicit quantities consume the lowest unrefunded conceptual
        unit positions. Coupon values are attribution only and are never restored.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/PaymentId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Synchronous cash result confirmed; Loyalty may still be processing
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Refund"
        "202":
          description: Provider result unknown or retry/reconciliation remains durable
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/Refund"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}:
    get:
      tags: [Store Orders]
      operationId: getStoreOrder
      summary: Get an order and its abbreviated compensation status
      description: |
        Returns the store projection plus trigger, case state and updatedAt only.
        Step detail, attempts, internal errors, case identifier and policy versions
        are available only through the audited platform-operator endpoint.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
      responses:
        "200":
          description: Store order visible to an authorized active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployedStoreOrderResult"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /store-orders/{orderId}/status:
    patch:
      tags: [Store Orders]
      operationId: transitionStoreOrderStatus
      summary: Transition an order from the store operational view
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployedStoreOrderTransitionRequest"
      responses:
        "200":
          description: Synchronous store transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployedStoreOrderTransitionResult"
        "202":
          description: REJECTED committed while order compensation continues separately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployedStoreOrderTransitionResult"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/orders/{orderId}/compensation:
    get:
      tags: [Operations]
      operationId: getOrderCompensation
      summary: Read owner compensation progress for a rejected order
      description: |
        Requires an active PLATFORM_OPERATOR with ORDER_COMPENSATION_READ and a
        non-blank X-Access-Reason. The access is audited before the response returns.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/OrderId"
        - $ref: "./beanflow-v1.yaml#/components/parameters/AccessReason"
      responses:
        "200":
          description: Compensation case for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployedOperatorCompensationView"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration:
    get:
      tags: [Operations]
      operationId: listExpiredBenefitRestorationPolicies
      summary: List the five current trigger and benefit policy heads
      description: |
        Requires an active PLATFORM_OPERATOR with the explicit
        EXPIRED_BENEFIT_POLICY_READ grant and a non-blank X-Access-Reason.
        The server records the read access before returning the current heads.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/AccessReason"
      responses:
        "200":
          description: Current policy heads ordered by trigger and benefit type
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: "./beanflow-v1.yaml#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
  /operations/policies/expired-benefit-restoration/{trigger}/{benefitType}:
    patch:
      tags: [Operations]
      operationId: updateExpiredBenefitRestorationPolicy
      summary: Create a new version for one trigger and benefit policy
      description: Requires an active PLATFORM_OPERATOR with the explicit EXPIRED_BENEFIT_POLICY_WRITE grant.
      parameters:
        - $ref: "./beanflow-v1.yaml#/components/parameters/IdempotencyKey"
        - name: trigger
          in: path
          required: true
          schema:
            type: string
            enum: [STORE_REJECTION, CUSTOMER_CANCELLATION, PARTIAL_REFUND]
        - name: benefitType
          in: path
          required: true
          schema:
            type: string
            enum: [COUPON, POINTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./beanflow-v1.yaml#/components/schemas/UpdateExpiredBenefitRestorationPolicyRequest"
      responses:
        "200":
          description: New policy head or the replayed first response
          content:
            application/json:
              schema:
                $ref: "./beanflow-v1.yaml#/components/schemas/ExpiredBenefitRestorationPolicy"
        "400":
          $ref: "./beanflow-v1.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./beanflow-v1.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "./beanflow-v1.yaml#/components/responses/Forbidden"
        "404":
          $ref: "./beanflow-v1.yaml#/components/responses/NotFound"
        "409":
          $ref: "./beanflow-v1.yaml#/components/responses/Conflict"
        "503":
          $ref: "./beanflow-v1.yaml#/components/responses/DependencyUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DeployedStoreOrderTransitionRequest:
      type: object
      additionalProperties: false
      required: [targetState]
      properties:
        targetState:
          type: string
          enum: [ACCEPTED, PREPARING, READY, COMPLETED, REJECTED]
        reason:
          oneOf:
            - type: string
              maxLength: 500
            - type: "null"
    DeployedStoreOrderResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "./beanflow-v1.yaml#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/DeployedStoreCompensationSummary"
    DeployedStoreOrderTransitionResult:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: "./beanflow-v1.yaml#/components/schemas/StoreOrder"
        compensationRecovery:
          $ref: "#/components/schemas/DeployedStoreCompensationSummary"
    DeployedStoreCompensationSummary:
      type: object
      additionalProperties: false
      required: [trigger, state, updatedAt]
      properties:
        trigger:
          type: string
          enum: [STORE_REJECTION, CUSTOMER_CANCELLATION]
        state:
          type: string
          enum: [PROCESSING, RETRY_SCHEDULED, UNKNOWN, SUCCEEDED, MANUAL_REVIEW]
        updatedAt:
          type: string
          format: date-time
    DeployedOperatorCompensationView:
      type: object
      additionalProperties: false
      required: [compensation]
      properties:
        compensation:
          $ref: "./beanflow-v1.yaml#/components/schemas/CompensationSummary"
