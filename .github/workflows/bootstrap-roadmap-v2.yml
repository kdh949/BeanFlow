name: Bootstrap BeanFlow roadmap safely

on:
  push:
    branches:
      - automation/bootstrap-roadmap-v2-20260729

permissions:
  contents: write
  issues: write

concurrency:
  group: beanflow-roadmap-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resume or verify roadmap bootstrap with API pacing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const currentBranch = context.ref.replace('refs/heads/', '');
            const sourceBranch = 'automation/bootstrap-roadmap-20260729';
            const expectedMarkerIssues = 125;

            async function cleanupBranches() {
              for (const branch of [sourceBranch, currentBranch]) {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                  console.log(`Deleted temporary branch ${branch}`);
                } catch (error) {
                  if (error.status !== 404 && error.status !== 422) {
                    console.warn(`Could not delete ${branch}: ${error.message}`);
                  }
                }
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const markerCount = issues.filter((issue) => !issue.pull_request && issue.body && issue.body.includes('beanflow-roadmap-key:')).length;
            console.log(`Existing roadmap marker issues: ${markerCount}/${expectedMarkerIssues}`);

            if (markerCount >= expectedMarkerIssues) {
              console.log('Roadmap is already complete; only cleaning temporary branches.');
              await cleanupBranches();
              return;
            }

            const work = '/tmp/beanflow-roadmap-bootstrap';
            const target = path.join(work, '.github', 'roadmap');
            fs.mkdirSync(target, { recursive: true });
            for (const file of ['bootstrap.cjs', 'r1.cjs', 'r2.cjs', 'r3-r5.cjs', 'extensions.cjs']) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: `.github/roadmap/${file}`,
                ref: sourceBranch,
              });
              if (Array.isArray(response.data) || !response.data.content) {
                throw new Error(`Expected file content for ${file}`);
              }
              fs.writeFileSync(path.join(target, file), Buffer.from(response.data.content, 'base64'));
            }

            for (const file of ['r1.cjs', 'r2.cjs', 'r3-r5.cjs', 'extensions.cjs']) {
              const definitions = require(path.join(target, file));
              if (!Array.isArray(definitions)) throw new Error(`${file} must export an array`);
              for (const epic of definitions) {
                if (!epic.key || !epic.title || !epic.milestone || !Array.isArray(epic.tasks) || epic.tasks.length === 0) {
                  throw new Error(`Invalid epic in ${file}: ${JSON.stringify(epic)}`);
                }
              }
            }

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const mutatingIssueMethods = [
              'create',
              'update',
              'createComment',
              'createLabel',
              'updateLabel',
              'createMilestone',
              'updateMilestone',
            ];
            for (const method of mutatingIssueMethods) {
              const original = github.rest.issues[method].bind(github.rest.issues);
              github.rest.issues[method] = async (...args) => {
                await sleep(1100);
                return original(...args);
              };
            }
            const originalGraphql = github.graphql.bind(github);
            github.graphql = async (...args) => {
              await sleep(1100);
              return originalGraphql(...args);
            };

            process.chdir(work);
            const run = require(path.join(target, 'bootstrap.cjs'));
            await run({ github, context, core });

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${sourceBranch}` });
              console.log(`Deleted source bootstrap branch ${sourceBranch}`);
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) {
                console.warn(`Could not delete source branch: ${error.message}`);
              }
            }
