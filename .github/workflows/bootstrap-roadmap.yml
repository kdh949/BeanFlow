name: Bootstrap BeanFlow roadmap

on:
  push:
    branches:
      - automation/bootstrap-roadmap-20260729

permissions:
  contents: write
  issues: write

concurrency:
  group: beanflow-roadmap-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4

      - name: Validate roadmap definitions
        run: |
          node -e "for (const f of ['r1','r2','r3-r5','extensions']) { const defs = require('./.github/roadmap/' + f + '.cjs'); if (!Array.isArray(defs)) throw new Error(f + ' must export an array'); for (const e of defs) { if (!e.key || !e.title || !e.milestone || !Array.isArray(e.tasks) || e.tasks.length === 0) throw new Error('invalid epic in ' + f); } }"

      - name: Create labels, milestones, epics and sub-issues
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('${{ github.workspace }}/.github/roadmap/bootstrap.cjs');
            await run({ github, context, core });
