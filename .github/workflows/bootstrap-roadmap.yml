name: Bootstrap GitHub roadmap

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-roadmap.yml
      - scripts/bootstrap-github-roadmap.mjs
      - scripts/github-roadmap/**
  workflow_dispatch:
    inputs:
      mode:
        description: plan은 정의만 검증하고, apply는 GitHub 이슈·라벨·마일스톤을 생성/갱신합니다.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate roadmap definition
        run: node --test scripts/github-roadmap/roadmap.test.mjs

      - name: Render roadmap plan
        run: >-
          node scripts/bootstrap-github-roadmap.mjs
          --mode plan
          --repo "${{ github.repository }}"

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apply'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update labels, milestones, issues and sub-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/bootstrap-github-roadmap.mjs
          --mode apply
          --repo "${{ github.repository }}"
