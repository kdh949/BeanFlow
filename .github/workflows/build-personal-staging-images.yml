name: Build personal staging images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-staging-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: kdh949

jobs:
  validate:
    name: Validate deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment contracts
        run: |
          bash scripts/deploy/test-deployment-contract.sh
          python3 -m unittest discover -s scripts/deploy -p 'test_*.py'
          bash -n scripts/deploy/deploy-staging-doppler.sh
          bash scripts/deploy/test-external-keycloak-nginx.sh

  build:
    name: Build ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile
            image: beanflow-api
          - service: web
            dockerfile: frontend/Dockerfile
            image: beanflow-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Java for packaged runtime verification
        if: matrix.service == 'api'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=personal-staging-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=personal-staging-${{ matrix.service }}

      - name: Verify packaged API startup and dependency failures
        if: matrix.service == 'api'
        timeout-minutes: 15
        run: bash scripts/deploy/test-backend-entrypoint.sh "$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.image }}:${{ github.sha }}"

      - name: Push verified immutable image
        run: docker push "$REGISTRY/$IMAGE_NAMESPACE/${{ matrix.image }}:${{ github.sha }}"
