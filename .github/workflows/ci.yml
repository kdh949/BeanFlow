name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.changes.outputs.scope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              scope="$(scripts/ci/classify-changes.sh "$base_sha" "$head_sha")"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$EVENT_HEAD_SHA"
              scope="full"
              ;;
            workflow_dispatch)
              head_sha="$EVENT_HEAD_SHA"
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || printf '%s' "$head_sha")"
              scope="full"
              ;;
            *)
              echo "Unsupported event '$EVENT_NAME'." >&2
              exit 1
              ;;
          esac

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null ||
            ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "The compare range is unavailable." >&2
            exit 1
          fi

          git diff --name-status --find-renames --find-copies-harder "$base_sha" "$head_sha" \
            > .ci-artifacts/changed-files.txt
          changed_path_count="$(git diff --name-only "$base_sha" "$head_sha" | awk 'END { print NR + 0 }')"

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "changed_path_count=$changed_path_count" >> "$GITHUB_OUTPUT"

          {
            echo "### CI validation scope"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Scope: \`$scope\`"
            echo "- Compare: \`$base_sha..$head_sha\`"
            echo "- Changed paths: \`$changed_path_count\`"
            echo "- Frontend validation: \`$([[ "$scope" == "frontend" || "$scope" == "full" ]] && echo yes || echo no)\`"
            echo "- Backend validation: \`$([[ "$scope" == "backend" || "$scope" == "full" ]] && echo yes || echo no)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify CI scripts
        run: scripts/ci/run-and-capture.sh .ci-artifacts/ci-script-tests.log bash scripts/ci/test-ci-scripts.sh

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-docs.txt

      - name: Install documentation validation dependencies
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/python-dependencies.log
          python -m pip install --requirement scripts/ci/requirements-docs.txt

      - name: Verify documentation and OpenAPI
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/document-verification.log
          bash scripts/verify-docs.sh

      - name: Check whitespace errors
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/diff-check.log
          git diff --check
          ${{ steps.changes.outputs.base_sha }}
          ${{ steps.changes.outputs.head_sha }}

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}-preflight
          path: |
            build/reports/
            build/test-results/
            .ci-artifacts/
            ${{ runner.temp }}/docker-info.txt
            ${{ runner.temp }}/docker-containers.txt
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: frontend
    needs: preflight
    if: needs.preflight.outputs.scope == 'frontend' || needs.preflight.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Storybook browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify frontend design adherence
        working-directory: frontend
        run: npm run check:design

      - name: Verify frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run Storybook interaction and accessibility tests
        working-directory: frontend
        run: npm run test:storybook:ci

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Verify Storybook Docs isolation
        working-directory: frontend
        run: npm run test:storybook:docs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}-frontend
          path: |
            frontend/coverage/
            frontend/storybook-static/
          if-no-files-found: ignore
          retention-days: 7

  backend_build:
    name: backend-build
    needs: preflight
    if: needs.preflight.outputs.scope == 'backend' || needs.preflight.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build without tests
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/gradle-build.log
          ./gradlew build -x test --stacktrace --console=plain

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}-backend-build
          path: |
            build/reports/
            .ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: test (${{ matrix.shard }}/3)
    needs: preflight
    if: needs.preflight.outputs.scope == 'backend' || needs.preflight.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify CI test shard assignment
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/gradle-test-shard-assignment.log
          ./gradlew verifyCiTestShards --stacktrace --console=plain

      - name: Run test shard
        env:
          BEANFLOW_CI_TEST_PROGRESS: "true"
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/gradle-test-shard.log
          ./gradlew test -PciTestShardIndex=${{ matrix.shard }} -PciTestShardCount=3 --stacktrace --console=plain

      - name: Summarize Gradle test timing
        if: always()
        run: >-
          python3 scripts/ci/summarize-test-results.py
          --results-dir build/test-results/test
          --output .ci-artifacts/gradle-test-timings.tsv
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            build/test-results/test/
            .ci-artifacts/gradle-test-shard.log
            .ci-artifacts/gradle-test-timings.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture Docker diagnostics
        if: failure()
        run: |
          docker info > "${RUNNER_TEMP}/docker-info.txt" 2>&1 || true
          docker ps -a > "${RUNNER_TEMP}/docker-containers.txt" 2>&1 || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}-test-${{ matrix.shard }}
          path: |
            build/reports/
            build/test-results/
            .ci-artifacts/
            ${{ runner.temp }}/docker-info.txt
            ${{ runner.temp }}/docker-containers.txt
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: [preflight, frontend, backend_build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify required CI results
        env:
          CI_SCOPE: ${{ needs.preflight.outputs.scope }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_BUILD_RESULT: ${{ needs.backend_build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          scripts/ci/verify-required-gate.sh \
            "$CI_SCOPE" \
            "$PREFLIGHT_RESULT" \
            "$FRONTEND_RESULT" \
            "$BACKEND_BUILD_RESULT" \
            "$TEST_RESULT"

          {
            echo "### Required CI gate"
            echo "- Scope: \`$CI_SCOPE\`"
            echo "- preflight: \`$PREFLIGHT_RESULT\`"
            echo "- frontend: \`$FRONTEND_RESULT\`"
            echo "- backend-build: \`$BACKEND_BUILD_RESULT\`"
            echo "- test: \`$TEST_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
