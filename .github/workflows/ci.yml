name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          mkdir -p .ci-artifacts
          ./gradlew clean build --stacktrace --console=plain 2>&1 | tee .ci-artifacts/gradle-build.log

      - name: Verify documentation
        run: bash scripts/verify-docs.sh 2>&1 | tee .ci-artifacts/document-verification.log

      - name: Check whitespace errors
        run: git diff --check 2>&1 | tee .ci-artifacts/diff-check.log

      - name: Capture Docker diagnostics
        if: failure()
        run: |
          docker info > "${RUNNER_TEMP}/docker-info.txt" 2>&1 || true
          docker ps -a > "${RUNNER_TEMP}/docker-containers.txt" 2>&1 || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            .ci-artifacts/
            ${{ runner.temp }}/docker-info.txt
            ${{ runner.temp }}/docker-containers.txt
          if-no-files-found: ignore
          retention-days: 7
