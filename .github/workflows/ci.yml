name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.changes.outputs.scope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              scope="$(scripts/ci/classify-changes.sh "$base_sha" "$head_sha")"
              ;;
            push)
              base_sha="$PUSH_BASE_SHA"
              head_sha="$EVENT_HEAD_SHA"
              scope="full"
              ;;
            workflow_dispatch)
              head_sha="$EVENT_HEAD_SHA"
              base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || printf '%s' "$head_sha")"
              scope="full"
              ;;
            *)
              echo "Unsupported event '$EVENT_NAME'." >&2
              exit 1
              ;;
          esac

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null ||
            ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "The compare range is unavailable." >&2
            exit 1
          fi

          git diff --name-status --find-renames --find-copies-harder "$base_sha" "$head_sha" \
            > .ci-artifacts/changed-files.txt
          changed_path_count="$(git diff --name-only "$base_sha" "$head_sha" | awk 'END { print NR + 0 }')"

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "changed_path_count=$changed_path_count" >> "$GITHUB_OUTPUT"

          {
            echo "### CI validation scope"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Scope: \`$scope\`"
            echo "- Compare: \`$base_sha..$head_sha\`"
            echo "- Changed paths: \`$changed_path_count\`"
            echo "- Gradle full build: \`$([[ "$scope" == "full" ]] && echo yes || echo no)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify CI scripts
        run: scripts/ci/run-and-capture.sh .ci-artifacts/ci-script-tests.log bash scripts/ci/test-ci-scripts.sh

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-docs.txt

      - name: Install documentation validation dependencies
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/python-dependencies.log
          python -m pip install --requirement scripts/ci/requirements-docs.txt

      - name: Verify documentation and OpenAPI
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/document-verification.log
          bash scripts/verify-docs.sh

      - name: Check whitespace errors
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/diff-check.log
          git diff --check
          ${{ steps.changes.outputs.base_sha }}
          ${{ steps.changes.outputs.head_sha }}

      - name: Set up Node.js 24
        if: steps.changes.outputs.scope == 'full'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm ci

      - name: Install Storybook browser
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify frontend design adherence
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm run check:design

      - name: Verify frontend typecheck
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm run test:unit

      - name: Run Storybook interaction and accessibility tests
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm run test:storybook:ci

      - name: Build Storybook
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm run build-storybook

      - name: Verify Storybook Docs isolation
        if: steps.changes.outputs.scope == 'full'
        working-directory: frontend
        run: npm run test:storybook:docs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            .ci-artifacts/
            ${{ runner.temp }}/docker-info.txt
            ${{ runner.temp }}/docker-containers.txt
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    needs: preflight
    if: needs.preflight.outputs.scope == 'full'
    runs-on: ubuntu-latest
    # A 20-minute cap cancels the full hosted Testcontainers suite before it reports a result.
    # Keep the serial suite bounded while retaining all required integration coverage.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          BEANFLOW_CI_TEST_PROGRESS: "true"
        run: >-
          scripts/ci/run-and-capture.sh .ci-artifacts/gradle-build.log
          ./gradlew build --stacktrace --console=plain

      - name: Capture Docker diagnostics
        if: failure()
        run: |
          docker info > "${RUNNER_TEMP}/docker-info.txt" 2>&1 || true
          docker ps -a > "${RUNNER_TEMP}/docker-containers.txt" 2>&1 || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence-${{ github.run_id }}
          path: |
            build/reports/
            build/test-results/
            .ci-artifacts/
            ${{ runner.temp }}/docker-info.txt
            ${{ runner.temp }}/docker-containers.txt
          if-no-files-found: ignore
          retention-days: 7
