# Optional merge fragment. Add this job only while compose profile container-metrics is enabled
# on a dedicated disposable performance host.
scrape_configs:
  - job_name: beanflow-cadvisor
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["BEANFLOW_PERF_VPN_HOST:18080"]
        labels:
          environment: perf
