apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: $BEANFLOW_PROMETHEUS_URL
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
          name: trace_id

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: $BEANFLOW_LOKI_URL
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: 'trace[_]?id'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: $BEANFLOW_PYROSCOPE_URL

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: $BEANFLOW_TEMPO_URL
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -30s
        spanEndTimeShift: 30s
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
      tracesToProfiles:
        datasourceUid: pyroscope
        tags:
          - key: service.name
            value: service_name
        profileTypeId: process_cpu:wall:nanoseconds:wall:nanoseconds
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      streamingEnabled:
        search: true
        metrics: true
