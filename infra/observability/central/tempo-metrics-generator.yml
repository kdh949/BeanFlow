# Merge these blocks into the existing Tempo 2.10 configuration.
# Prometheus must be started with --web.enable-remote-write-receiver.
metrics_generator:
  processor:
    service_graphs:
      # beanflow.provider is a closed enum and gives uninstrumented Toss/AIStor/Vault
      # CLIENT spans stable virtual-node names. Keep the Tempo defaults after it.
      peer_attributes: [beanflow.provider, peer.service, db.name, db.system]
  registry:
    external_labels:
      source: tempo
      environment: perf
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
