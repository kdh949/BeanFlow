# Merge these blocks into the existing Loki 3.7 configuration.
# BeanFlow Alloy must use http://LOKI_HOST:3100/otlp as its OTLP HTTP endpoint.
limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment.name
