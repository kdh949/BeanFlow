beanflow_pg_wait:
  query: |
    SELECT
      datname AS database,
      COALESCE(wait_event_type, 'none') AS wait_event_type,
      COALESCE(wait_event, 'none') AS wait_event,
      count(*)::double precision AS sessions
    FROM pg_stat_activity
    WHERE datname = current_database()
      AND pid <> pg_backend_pid()
      AND wait_event_type IS NOT NULL
      AND wait_event_type <> 'Client'
    GROUP BY datname, wait_event_type, wait_event
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by the exporter connection
    - wait_event_type:
        usage: LABEL
        description: Bounded PostgreSQL wait event type
    - wait_event:
        usage: LABEL
        description: Bounded PostgreSQL wait event name
    - sessions:
        usage: GAUGE
        description: Sessions currently grouped by wait event

beanflow_pg_ungranted:
  query: |
    SELECT
      current_database() AS database,
      (
        SELECT count(*)
        FROM pg_stat_activity waiter
        JOIN pg_locks waiting_lock ON waiting_lock.pid = waiter.pid
        WHERE waiter.datname = current_database()
          AND NOT waiting_lock.granted
      )::double precision AS locks
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by waiter activity
    - locks:
        usage: GAUGE
        description: Ungranted locks including transaction ID locks in the selected database

beanflow_pg_blocked:
  query: |
    SELECT
      current_database() AS database,
      count(*) FILTER (WHERE cardinality(pg_blocking_pids(pid)) > 0)::double precision AS sessions
    FROM pg_stat_activity
    WHERE datname = current_database()
      AND pid <> pg_backend_pid()
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by the exporter connection
    - sessions:
        usage: GAUGE
        description: Sessions with at least one confirmed blocker

beanflow_pg_lock_wait:
  query: |
    SELECT
      current_database() AS database,
      COALESCE(
        max(EXTRACT(EPOCH FROM (clock_timestamp() - query_start)))
          FILTER (WHERE wait_event_type = 'Lock'),
        0
      )::double precision AS max_seconds
    FROM pg_stat_activity
    WHERE datname = current_database()
      AND pid <> pg_backend_pid()
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by the exporter connection
    - max_seconds:
        usage: GAUGE
        description: Oldest current PostgreSQL lock wait in seconds

beanflow_pg_transaction:
  query: |
    SELECT
      current_database() AS database,
      COALESCE(
        max(EXTRACT(EPOCH FROM (clock_timestamp() - xact_start))) FILTER (WHERE xact_start IS NOT NULL),
        0
      )::double precision AS max_age_seconds,
      count(*) FILTER (WHERE state = 'idle in transaction')::double precision AS idle_in_transaction_sessions
    FROM pg_stat_activity
    WHERE datname = current_database()
      AND pid <> pg_backend_pid()
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by the exporter connection
    - max_age_seconds:
        usage: GAUGE
        description: Oldest open transaction age in seconds
    - idle_in_transaction_sessions:
        usage: GAUGE
        description: Sessions currently idle in transaction

beanflow_pg_database_identity:
  query: |
    SELECT current_database() AS database, 1::double precision AS info
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by the exporter connection
    - info:
        usage: GAUGE
        description: Database binding identity marker

beanflow_worker_backlog:
  query: |
    WITH owners(owner) AS (
      VALUES
        ('event_publication'),
        ('payment_reconciliation'),
        ('reservation_expiry'),
        ('acceptance_timeout'),
        ('rejection_refund'),
        ('partial_refund_provider'),
        ('partial_refund_restoration'),
        ('refund_point_recovery'),
        ('notification')
    ), backlog_categories(state, claimability) AS (
      VALUES
        ('due', 'due'),
        ('future', 'future'),
        ('in_progress', 'in_progress'),
        ('unknown', 'due'),
        ('unknown', 'future'),
        ('unknown', 'not_claimable'),
        ('manual_review', 'not_claimable'),
        ('unimplemented_target', 'not_claimable')
    ), event_rows AS (
      SELECT
        publication.*,
        COALESCE(publication.last_resubmission_date, publication.publication_date) +
          CASE publication.completion_attempts
            WHEN 0 THEN interval '10 seconds'
            WHEN 1 THEN interval '10 seconds'
            WHEN 2 THEN interval '30 seconds'
            WHEN 3 THEN interval '2 minutes'
            WHEN 4 THEN interval '5 minutes'
            WHEN 5 THEN interval '15 minutes'
            ELSE interval '0 seconds'
          END AS eligible_at,
        EXISTS (
          SELECT 1 FROM operations_reprocessing_case recovery
          WHERE recovery.case_type = 'EVENT_PUBLICATION'
            AND recovery.owner_reference = 'event-publication:' || publication.id::text
        ) AS has_reprocessing_case
      FROM event_publication publication
      WHERE publication.completion_date IS NULL
    ), raw_facts AS (
      SELECT
        'event_publication'::text AS owner,
        CASE
          WHEN listener_id LIKE 'beanflow.analytics.%' THEN 'unimplemented_target'
          WHEN has_reprocessing_case THEN 'manual_review'
          WHEN status IN ('PROCESSING', 'RESUBMITTED') THEN 'in_progress'
          WHEN status NOT IN ('FAILED') THEN 'unknown'
          WHEN completion_attempts <= 5 AND eligible_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END AS state,
        CASE
          WHEN listener_id LIKE 'beanflow.analytics.%' OR has_reprocessing_case THEN 'not_claimable'
          WHEN status IN ('PROCESSING', 'RESUBMITTED') THEN 'in_progress'
          WHEN status = 'FAILED' OR status IS NULL THEN
            CASE WHEN completion_attempts <= 5 AND eligible_at > clock_timestamp() THEN 'future' ELSE 'due' END
          ELSE 'not_claimable'
        END AS claimability,
        CASE
          WHEN completion_attempts <= 5 THEN eligible_at
          ELSE COALESCE(last_resubmission_date, publication_date)
        END AS due_at
      FROM event_rows
      UNION ALL
      SELECT
        'payment_reconciliation',
        CASE
          WHEN status = 'MANUAL_REVIEW' THEN 'manual_review'
          WHEN status = 'PROCESSING' AND next_attempt_at <= clock_timestamp() AND claim_until <= clock_timestamp() THEN 'due'
          WHEN status = 'PROCESSING' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE
          WHEN status = 'MANUAL_REVIEW' THEN 'not_claimable'
          WHEN status = 'PROCESSING' AND next_attempt_at <= clock_timestamp() AND claim_until <= clock_timestamp() THEN 'due'
          WHEN status = 'PROCESSING' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE WHEN status = 'PROCESSING' THEN claim_until ELSE next_attempt_at END
      FROM payment_reconciliation
      WHERE status IN ('SCHEDULED', 'PROCESSING', 'RETRY_SCHEDULED', 'MANUAL_REVIEW')
      UNION ALL
      SELECT
        'reservation_expiry',
        CASE WHEN reservation_expires_at > clock_timestamp() THEN 'future' ELSE 'due' END,
        CASE WHEN reservation_expires_at > clock_timestamp() THEN 'future' ELSE 'due' END,
        reservation_expires_at
      FROM ordering_order
      WHERE state = 'PENDING_PAYMENT' AND reservation_expires_at IS NOT NULL
      UNION ALL
      SELECT
        'acceptance_timeout',
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'manual_review'
          WHEN state = 'CLAIMED' AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state = 'CLAIMED' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'not_claimable'
          WHEN state = 'CLAIMED' AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state = 'CLAIMED' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE WHEN state = 'CLAIMED' THEN claim_until ELSE next_attempt_at END
      FROM ordering_acceptance_timeout_work
      WHERE state <> 'COMPLETED'
      UNION ALL
      SELECT
        CASE WHEN reason = 'PARTIAL_REFUND' THEN 'partial_refund_provider' ELSE 'rejection_refund' END,
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'manual_review'
          WHEN state = 'UNKNOWN' THEN 'unknown'
          WHEN state IN ('PROCESSING', 'RECONCILING') AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state IN ('PROCESSING', 'RECONCILING') THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'not_claimable'
          WHEN state IN ('PROCESSING', 'RECONCILING') AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state IN ('PROCESSING', 'RECONCILING') THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE WHEN state IN ('PROCESSING', 'RECONCILING') THEN claim_until ELSE next_attempt_at END
      FROM payment_refund
      WHERE state NOT IN ('SUCCEEDED', 'FAILED')
      UNION ALL
      SELECT
        'partial_refund_restoration',
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'manual_review'
          WHEN state = 'PROCESSING' AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state = 'PROCESSING' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'not_claimable'
          WHEN state = 'PROCESSING' AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state = 'PROCESSING' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE WHEN state = 'PROCESSING' THEN claim_until ELSE next_attempt_at END
      FROM payment_refund_restoration_work
      WHERE state <> 'SUCCEEDED'
      UNION ALL
      SELECT
        'refund_point_recovery',
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'manual_review'
          WHEN state IN ('ELIGIBILITY_PROCESSING', 'PROCESSING') AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state IN ('ELIGIBILITY_PROCESSING', 'PROCESSING') THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'not_claimable'
          WHEN state IN ('ELIGIBILITY_PROCESSING', 'PROCESSING') AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state IN ('ELIGIBILITY_PROCESSING', 'PROCESSING') THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE WHEN state IN ('ELIGIBILITY_PROCESSING', 'PROCESSING') THEN claim_until ELSE next_attempt_at END
      FROM payment_refund_point_recovery_work
      WHERE state NOT IN ('SUCCEEDED', 'EXCLUDED_BEFORE_ACCRUAL', 'NOT_REQUIRED', 'NOT_APPLICABLE')
      UNION ALL
      SELECT
        'notification',
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'manual_review'
          WHEN state = 'PROCESSING' AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state = 'PROCESSING' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE
          WHEN state = 'MANUAL_REVIEW' THEN 'not_claimable'
          WHEN state = 'PROCESSING' AND claim_until <= clock_timestamp() THEN 'due'
          WHEN state = 'PROCESSING' THEN 'in_progress'
          WHEN next_attempt_at > clock_timestamp() THEN 'future'
          ELSE 'due'
        END,
        CASE WHEN state = 'PROCESSING' THEN claim_until ELSE next_attempt_at END
      FROM notification_delivery
      WHERE state NOT IN ('SUCCEEDED', 'SKIPPED')
    ), facts AS (
      SELECT
        owner,
        state,
        claimability,
        count(*)::double precision AS items,
        min(due_at) FILTER (WHERE claimability = 'due') AS oldest_due_at
      FROM raw_facts
      GROUP BY owner, state, claimability
    )
    SELECT
      current_database() AS database,
      owners.owner,
      backlog_categories.state,
      backlog_categories.claimability,
      COALESCE(facts.items, 0)::double precision AS items,
      COALESCE(EXTRACT(EPOCH FROM (clock_timestamp() - facts.oldest_due_at)), 0)::double precision AS oldest_due_age_seconds
    FROM owners
    CROSS JOIN backlog_categories
    LEFT JOIN facts ON facts.owner = owners.owner
      AND facts.state = backlog_categories.state
      AND facts.claimability = backlog_categories.claimability
  metrics:
    - database:
        usage: LABEL
        description: PostgreSQL database selected by the exporter connection
    - owner:
        usage: LABEL
        description: Closed asynchronous owner vocabulary
    - state:
        usage: LABEL
        description: Closed backlog state vocabulary
    - claimability:
        usage: LABEL
        description: Closed worker claimability vocabulary derived from repository due and lease rules
    - items:
        usage: GAUGE
        description: Full owner and state backlog count, not a worker batch size
    - oldest_due_age_seconds:
        usage: GAUGE
        description: Oldest claimable due item age, zero only when that owner state and claimability has no due item
