# Explicit local-demo runtime definition.
#
# This file is only for the local demo. It never describes a production deployment and it contains
# no real credential: the database password below is a throwaway local value and every other secret
# (JWK private key, JWTs, cursor HMAC key) is generated at run time into an untracked directory.
#
# The image is PostgreSQL 17 with PostGIS 3.5 because the discovery migration requires the PostGIS
# extension. It publishes a linux/amd64 manifest only, so an arm64 host runs it under emulation.
services:
  beanflow-demo-postgres:
    image: postgis/postgis:17-3.5
    container_name: ${DEMO_CONTAINER:?set by scripts/demo/lib/common.sh}
    environment:
      POSTGRES_DB: beanflow_demo
      POSTGRES_USER: beanflow_demo
      POSTGRES_PASSWORD: beanflow_demo_local_only
    ports:
      - "${DEMO_DB_PORT:?set by scripts/demo/lib/common.sh}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beanflow_demo -d beanflow_demo"]
      interval: 2s
      timeout: 5s
      retries: 40
    # No named volume on purpose: `stop.sh` must be able to remove all demo state, and a demo must
    # never accumulate data that outlives the environment it was created for.
    tmpfs:
      - /var/lib/postgresql/data
