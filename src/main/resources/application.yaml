spring:
  application:
    name: beanflow
  datasource:
    url: ${BEANFLOW_DB_URL}
    username: ${BEANFLOW_DB_USERNAME}
    password: ${BEANFLOW_DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
beanflow:
  idempotency:
    retry-after-seconds: 2
    stuck-threshold: PT5M
    metrics-delay-ms: 30000
    metrics-initial-delay-ms: 30000
  reservation-expiry:
    chunk-size: 100
    fixed-delay-ms: 30000
    initial-delay-ms: 60000
  store-acceptance:
    chunk-size: 100
    fixed-delay-ms: 1000
    initial-delay-ms: 60000
  acceptance-timeout-work:
    chunk-size: 100
    fixed-delay-ms: 1000
    initial-delay-ms: 60000
    retention-fixed-delay-ms: 3600000
    retention-initial-delay-ms: 300000
  event-publication:
    batch-size: 100
    fixed-delay-ms: 10000
    initial-delay-ms: 30000
  audit-retention:
    chunk-size: 100
    fixed-delay-ms: 3600000
    initial-delay-ms: 300000
  ordering-idempotency-retention:
    chunk-size: 100
    fixed-delay-ms: 3600000
    initial-delay-ms: 300000
  payment:
    metrics:
      unknown-age-delay-ms: 30000
      unknown-age-initial-delay-ms: 30000
    reconciliation:
      chunk-size: 50
      claim-lease: PT1M
      fixed-delay-ms: 5000
      initial-delay-ms: 15000
  notification:
    chunk-size: 50
    claim-lease: PT1M
    fixed-delay-ms: 5000
    initial-delay-ms: 15000
  security:
    jwk-set-uri: ${BEANFLOW_JWK_SET_URI}
