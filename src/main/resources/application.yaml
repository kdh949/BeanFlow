logging:
  level:
    # Spring logs every bound statement parameter at TRACE, which would expose request-only
    # coordinates and protected-profile blind indexes. The level is pinned here and the startup
    # guard rejects an effective TRACE/ALL override.
    org.springframework.jdbc.core.StatementCreatorUtils: DEBUG
    # Spring Security/MVC DEBUG renders complete query URIs and request DTOs. Exact-search values
    # are body-only, but both categories stay at INFO and the startup guard rejects overrides.
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.web.servlet: INFO
spring:
  application:
    name: beanflow
  profiles:
    group:
      toss-sandbox-runtime:
        - local
        - toss-sandbox
  datasource:
    url: ${BEANFLOW_DB_URL}
    username: ${BEANFLOW_DB_USERNAME}
    password: ${BEANFLOW_DB_PASSWORD}
  flyway:
    enabled: true
  session:
    jdbc:
      # Flyway V52 owns the official PostgreSQL Spring Session schema.
      initialize-schema: never
      # BeanFlow wraps cleanup to expose explicit success/failure metrics.
      cleanup-cron: "-"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
beanflow:
  authentication:
    attempt-hmac-key-base64-url: ${BEANFLOW_AUTH_ATTEMPT_HMAC_KEY_BASE64_URL}
    trusted-proxy-cidrs: ${BEANFLOW_AUTH_TRUSTED_PROXY_CIDRS:}
  session:
    cleanup-cron: "0 * * * * *"
  idempotency:
    retry-after-seconds: 2
    stuck-threshold: PT5M
    metrics-delay-ms: 30000
    metrics-initial-delay-ms: 30000
  reservation-expiry:
    chunk-size: 100
    fixed-delay-ms: 30000
    initial-delay-ms: 60000
  store-acceptance:
    chunk-size: 100
    fixed-delay-ms: 1000
    initial-delay-ms: 60000
  acceptance-timeout-work:
    chunk-size: 100
    fixed-delay-ms: 1000
    initial-delay-ms: 60000
    retention-fixed-delay-ms: 3600000
    retention-initial-delay-ms: 300000
  event-publication:
    batch-size: 100
    fixed-delay-ms: 10000
    initial-delay-ms: 30000
  audit-retention:
    chunk-size: 100
    fixed-delay-ms: 3600000
    initial-delay-ms: 300000
  support-search-rate-retention:
    chunk-size: 100
    fixed-delay-ms: 300000
    initial-delay-ms: 300000
  search-index-coverage:
    fixed-delay-ms: 60000
    initial-delay-ms: 60000
  search-index-rebuild:
    chunk-size: 100
  ordering-idempotency-retention:
    chunk-size: 100
    fixed-delay-ms: 3600000
    initial-delay-ms: 300000
  payment:
    metrics:
      unknown-age-delay-ms: 30000
      unknown-age-initial-delay-ms: 30000
    reconciliation:
      chunk-size: 50
      claim-lease: PT1M
      fixed-delay-ms: 5000
      initial-delay-ms: 15000
  notification:
    chunk-size: 50
    claim-lease: PT1M
    fixed-delay-ms: 5000
    initial-delay-ms: 15000
  security:
    jwk-set-uri: ${BEANFLOW_JWK_SET_URI}
